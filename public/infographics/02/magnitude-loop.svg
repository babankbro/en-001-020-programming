<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1024" width="800" height="1024" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="การหาขนาดเวกเตอร์ด้วยพีทาโกรัสและการวนซ้ำแบบตัวสะสมใน lenv ของ (1, 2, 3, 4) จนได้รากที่สองของ 30">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>การหาขนาดเวกเตอร์ด้วยพีทาโกรัสและการวนซ้ำแบบตัวสะสมใน lenv ของ (1, 2, 3, 4) จนได้รากที่สองของ 30</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ขนาดของเวกเตอร์ด้วยการวนซ้ำ: lenv((1, 2, 3, 4))</text>
<text x="400" y="66" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: lenv วนบวกกำลังสองทีละตัวอย่างไร จนได้ √30 ≈ 5.477</text>
<text x="24" y="98" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีในภาพ:</text>
<rect x="94" y="85" width="18" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="120" y="98" font-size="15" fill="#0f172a" text-anchor="start">ค่าจากเวกเตอร์ v[i]</text>
<rect x="288.4" y="85" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="314.4" y="98" font-size="15" fill="#0f172a" text-anchor="start">ตัวสะสม sumofPower2</text>
<rect x="482.8" y="85" width="18" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="508.8" y="98" font-size="15" fill="#0f172a" text-anchor="start">คำตอบ</text>
<circle cx="37" cy="134" r="13" fill="#0f172a"/>
<text x="37" y="139.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="58" y="140" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">ที่มา: ทฤษฎีบทพีทาโกรัส (2 มิติ)</text>
<rect x="24" y="154" width="340" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="60" y1="380" x2="60" y2="168.4" stroke="#e2e8f0" stroke-width="1"/>
<line x1="60" y1="380" x2="271.6" y2="380" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="400" font-size="15" fill="#475569" text-anchor="middle">0</text>
<line x1="106" y1="380" x2="106" y2="168.4" stroke="#e2e8f0" stroke-width="1"/>
<line x1="60" y1="334" x2="271.6" y2="334" stroke="#e2e8f0" stroke-width="1"/>
<text x="106" y="400" font-size="15" fill="#475569" text-anchor="middle">1</text>
<line x1="152" y1="380" x2="152" y2="168.4" stroke="#e2e8f0" stroke-width="1"/>
<line x1="60" y1="288" x2="271.6" y2="288" stroke="#e2e8f0" stroke-width="1"/>
<text x="152" y="400" font-size="15" fill="#475569" text-anchor="middle">2</text>
<line x1="198" y1="380" x2="198" y2="168.4" stroke="#e2e8f0" stroke-width="1"/>
<line x1="60" y1="242" x2="271.6" y2="242" stroke="#e2e8f0" stroke-width="1"/>
<text x="198" y="400" font-size="15" fill="#475569" text-anchor="middle">3</text>
<line x1="244" y1="380" x2="244" y2="168.4" stroke="#e2e8f0" stroke-width="1"/>
<line x1="60" y1="196" x2="271.6" y2="196" stroke="#e2e8f0" stroke-width="1"/>
<text x="244" y="400" font-size="15" fill="#475569" text-anchor="middle">4</text>
<line x1="60" y1="380" x2="198" y2="380" stroke="#2563eb" stroke-width="3"/>
<line x1="198" y1="380" x2="198" y2="196" stroke="#2563eb" stroke-width="3"/>
<rect x="186" y="368" width="12" height="12" rx="0" fill="none" stroke="#475569" stroke-width="1.2"/>
<line x1="60" y1="380" x2="198" y2="196" stroke="#059669" stroke-width="4" marker-end="url(#arrG)"/>
<text x="129" y="372" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">3</text>
<text x="208" y="288" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">4</text>
<text x="111" y="274" font-size="16" fill="#059669" text-anchor="end" font-weight="bold">|v| = 5</text>
<text x="214" y="186" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">v = (3, 4)</text>
<text x="214" y="214" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">√(3² + 4²)</text>
<text x="214" y="238" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">= √(9 + 16)</text>
<text x="214" y="262" font-size="15" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">= √25 = 5.0</text>
<rect x="380" y="154" width="396" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="396" y="180" font-size="15" fill="#475569" text-anchor="start">กี่มิติก็ได้: ยกกำลังสองทุกตัว บวก แล้วถอดราก</text>
<text x="396" y="214" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def lenv(v):</text>
<text x="432" y="248" font-size="15" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">sumofPower2 = 0</text>
<text x="432" y="282" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for i in range(len(v)):</text>
<text x="468" y="316" font-size="15" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">sumofPower2 += v[i]*v[i]</text>
<text x="432" y="350" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">return math.sqrt(sumofPower2)</text>
<text x="396" y="392" font-size="15" fill="#0f172a" text-anchor="start">|v| = √(v₁² + v₂² + … + vₙ²) = √(v·v)</text>
<text x="396" y="412" font-size="15" fill="#d97706" text-anchor="start">บรรทัด return ย่อหน้าระดับเดียวกับ for</text>
<circle cx="37" cy="458" r="13" fill="#0f172a"/>
<text x="37" y="463.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="58" y="464" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">len(v) = 4 → range(4) ให้ i = 0, 1, 2, 3</text>
<rect x="120" y="480" width="110" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="175" y="502" font-size="15" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">i = 0</text>
<text x="175" y="524" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">v[0] = 1</text>
<rect x="270" y="480" width="110" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="325" y="502" font-size="15" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">i = 1</text>
<text x="325" y="524" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">v[1] = 2</text>
<rect x="420" y="480" width="110" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="475" y="502" font-size="15" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">i = 2</text>
<text x="475" y="524" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">v[2] = 3</text>
<rect x="570" y="480" width="110" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="625" y="502" font-size="15" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">i = 3</text>
<text x="625" y="524" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">v[3] = 4</text>
<circle cx="37" cy="566" r="13" fill="#0f172a"/>
<text x="37" y="571.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="58" y="572" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">แต่ละรอบบวก v[i]² เข้าตัวสะสม (แท่งยาว 20 px ต่อ 1 หน่วย)</text>
<text x="108" y="630" font-size="15" fill="#475569" text-anchor="end">0</text>
<rect x="120" y="610" width="20" height="28" rx="0" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
<text x="130" y="604" font-size="15" fill="#064e3b" text-anchor="middle" font-weight="bold">+1</text>
<line x1="140" y1="638" x2="140" y2="652" stroke="#059669" stroke-width="1.2"/>
<text x="140" y="668" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">1</text>
<rect x="140" y="610" width="80" height="28" rx="0" fill="#86efac" stroke="#059669" stroke-width="1.2"/>
<text x="180" y="630" font-size="15" fill="#064e3b" text-anchor="middle" font-weight="bold">+4</text>
<line x1="220" y1="638" x2="220" y2="652" stroke="#059669" stroke-width="1.2"/>
<text x="220" y="668" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">5</text>
<rect x="220" y="610" width="180" height="28" rx="0" fill="#4ade80" stroke="#059669" stroke-width="1.2"/>
<text x="310" y="630" font-size="15" fill="#064e3b" text-anchor="middle" font-weight="bold">+9</text>
<line x1="400" y1="638" x2="400" y2="652" stroke="#059669" stroke-width="1.2"/>
<text x="400" y="668" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">14</text>
<rect x="400" y="610" width="320" height="28" rx="0" fill="#22c55e" stroke="#059669" stroke-width="1.2"/>
<text x="560" y="630" font-size="15" fill="#064e3b" text-anchor="middle" font-weight="bold">+16</text>
<line x1="720" y1="638" x2="720" y2="652" stroke="#059669" stroke-width="1.2"/>
<text x="720" y="668" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">30</text>
<rect x="40" y="682" width="720" height="32" rx="6" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="60" y="704" font-size="15" fill="#475569" text-anchor="middle" font-weight="bold">รอบ</text>
<text x="160" y="704" font-size="15" fill="#475569" text-anchor="middle" font-weight="bold">i</text>
<text x="240" y="704" font-size="15" fill="#475569" text-anchor="middle" font-weight="bold">v[i]</text>
<text x="350" y="704" font-size="15" fill="#475569" text-anchor="middle" font-weight="bold">v[i]*v[i]</text>
<text x="560" y="704" font-size="15" fill="#475569" text-anchor="middle" font-weight="bold">sumofPower2 หลังบวก</text>
<text x="60" y="734" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<text x="160" y="734" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text>
<text x="240" y="734" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<text x="350" y="734" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<text x="560" y="734" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0 + 1 = 1</text>
<text x="60" y="762" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text>
<text x="160" y="762" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<text x="240" y="762" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text>
<text x="350" y="762" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text>
<text x="560" y="762" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1 + 4 = 5</text>
<text x="60" y="790" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<text x="160" y="790" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text>
<text x="240" y="790" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<text x="350" y="790" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">9</text>
<text x="560" y="790" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5 + 9 = 14</text>
<text x="60" y="818" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text>
<text x="160" y="818" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<text x="240" y="818" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text>
<text x="350" y="818" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">16</text>
<text x="560" y="818" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">14 + 16 = 30</text>
<circle cx="37" cy="870" r="13" fill="#0f172a"/>
<text x="37" y="875.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="58" y="876" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">จบลูปแล้วจึงถอดรากที่สอง</text>
<rect x="300" y="852" width="476" height="40" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
<text x="316" y="878" font-size="16" fill="#b45309" text-anchor="start" font-weight="bold">คำตอบ</text>
<text x="760" y="878" font-size="16" fill="#0f172a" text-anchor="end" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">√30 ≈ 5.477 (round 2 ตำแหน่ง = 5.48)</text>
<rect x="24" y="908" width="368" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<circle cx="48" cy="932" r="13" fill="#dc2626"/>
<text x="48" y="938" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">✗</text>
<text x="70" y="938" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">ผิด: ย่อหน้า return เข้าไปในลูป</text>
<text x="42" y="966" font-size="15" fill="#0f172a" text-anchor="start">คืนค่าตั้งแต่รอบแรก</text>
<text x="42" y="992" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">√(1) = 1.0</text>
<rect x="408" y="908" width="368" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<circle cx="432" cy="932" r="13" fill="#059669"/>
<text x="432" y="938" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
<text x="454" y="938" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">ถูก: return หลังจบลูป</text>
<text x="426" y="966" font-size="15" fill="#0f172a" text-anchor="start">บวกครบ 4 รอบก่อน</text>
<text x="426" y="992" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">√(1+4+9+16) = √30 ≈ 5.477</text>
</svg>