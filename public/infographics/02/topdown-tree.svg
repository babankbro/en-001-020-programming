<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="แผนภาพการเรียกฟังก์ชัน tree และภาพต้นไม้ที่ได้">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>แผนภาพการเรียกฟังก์ชัน tree และภาพต้นไม้ที่ได้</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="middle">Top-Down Design: tree() แตกเป็นฟังก์ชันย่อยจนถึง linespace()</text>
<rect x="165" y="80" width="150" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="240" y="108" font-size="16" fill="#7c3aed" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">tree()</text>
<line x1="240" y1="124" x2="110" y2="174" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
<rect x="48" y="174" width="124" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="110" y="200" font-size="16" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">top_leaf()</text>
<text x="110" y="220" font-size="13.5" fill="#475569" text-anchor="middle">ใบบน 3 แถว</text>
<line x1="110" y1="226" x2="181.5" y2="279" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>
<line x1="240" y1="124" x2="240" y2="174" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
<rect x="178" y="174" width="124" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="240" y="200" font-size="16" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">bottom_leaf()</text>
<text x="240" y="220" font-size="13.5" fill="#475569" text-anchor="middle">ใบล่าง 3 แถว</text>
<line x1="240" y1="226" x2="240" y2="279" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
<line x1="240" y1="124" x2="370" y2="174" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
<rect x="308" y="174" width="124" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="370" y="200" font-size="16" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">clone()</text>
<text x="370" y="220" font-size="13.5" fill="#475569" text-anchor="middle">ลำต้น 2 แถว</text>
<line x1="370" y1="226" x2="298.5" y2="279" stroke="#d97706" stroke-width="2" marker-end="url(#arrO)"/>
<rect x="145" y="280" width="190" height="44" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<text x="240" y="308" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">linespace(s, n)</text>
<text x="240" y="344" font-size="14" fill="#475569" text-anchor="middle">พิมพ์ช่องว่าง s ตัว แล้ว # n ตัว แล้วขึ้นบรรทัด</text>
<rect x="24" y="372" width="432" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="400" font-size="15" fill="#0f172a" font-weight="bold">แต่ละฟังก์ชันวนเรียก linespace อย่างไร</text>
<rect x="38" y="414" width="132" height="30" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="104" y="434" font-size="14" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">top_leaf()</text>
<text x="182" y="434" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">i = 0,1,2 → linespace(3−i, 2i+1)</text>
<rect x="38" y="454" width="132" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="104" y="474" font-size="14" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">bottom_leaf()</text>
<text x="182" y="474" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">i = 0,1,2 → linespace(2−i, 2i+3)</text>
<rect x="38" y="494" width="132" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="104" y="514" font-size="14" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">clone()</text>
<text x="182" y="514" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2 ครั้ง → linespace(3, 1)</text>
<text x="240" y="548" font-size="14" fill="#7c3aed" font-weight="bold" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">tree() = top_leaf() + bottom_leaf() + clone()</text>
