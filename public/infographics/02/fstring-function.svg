<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="การเรียก greeting ด้วย Sarayut และ 40 ส่งอาร์กิวเมนต์เข้าพารามิเตอร์ แล้วเติมช่องปีกกาใน f-string พร้อมชี้จุดบั๊ก">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>การเรียก greeting ด้วย Sarayut และ 40 ส่งอาร์กิวเมนต์เข้าพารามิเตอร์ แล้วเติมช่องปีกกาใน f-string พร้อมชี้จุดบั๊ก</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">f-string ในฟังก์ชัน: อาร์กิวเมนต์ → พารามิเตอร์ → ช่อง { }</text>
<text x="400" y="66" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: ค่าในแต่ละช่อง { } มาจากไหน และทำไม 40 จึงไม่ถูกพิมพ์</text>
<rect x="40" y="84" width="720" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="110" font-size="16" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def greeting(name, age):</text>
<text x="98.4" y="138" font-size="16" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(f"Hello, {name}, I'm {name} years old ")</text>
<text x="60" y="166" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">greeting("Sarayut", 40)</text>
<text x="744" y="110" font-size="15" fill="#475569" text-anchor="end">นิยามฟังก์ชัน</text>
<text x="744" y="166" font-size="15" fill="#2563eb" text-anchor="end">เรียกใช้</text>
<text x="40" y="208" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีในภาพ:</text>
<rect x="110" y="195" width="18" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="136" y="208" font-size="15" fill="#0f172a" text-anchor="start">name</text>
<rect x="190.4" y="195" width="18" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="216.4" y="208" font-size="15" fill="#0f172a" text-anchor="start">age</text>
<rect x="263.2" y="195" width="18" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="289.2" y="208" font-size="15" fill="#0f172a" text-anchor="start">จุดที่เป็นบั๊ก</text>
<rect x="419.6" y="195" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="445.6" y="208" font-size="15" fill="#0f172a" text-anchor="start">ช่องว่าง</text>
<circle cx="37" cy="244" r="13" fill="#0f172a"/>
<text x="37" y="249.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="58" y="250" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">อาร์กิวเมนต์จับคู่กับพารามิเตอร์ตามลำดับตำแหน่ง</text>
<text x="130" y="286" font-size="15" fill="#475569" text-anchor="end">ตัวที่ 1</text>
<text x="450" y="286" font-size="15" fill="#475569" text-anchor="end">ตัวที่ 2</text>
<rect x="173.8" y="264" width="112.4" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="230" y="287" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"Sarayut"</text>
<rect x="477.4" y="264" width="45.2" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="500" y="287" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">40</text>
<line x1="230" y1="300" x2="230" y2="330" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
<line x1="500" y1="300" x2="500" y2="330" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrO)"/>
<rect x="140.2" y="334" width="179.6" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="230" y="357" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">name = "Sarayut"</text>
<rect x="448.6" y="334" width="102.8" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="500" y="357" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">age = 40</text>
<rect x="574" y="326" width="202" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="675" y="346" font-size="15" fill="#dc2626" text-anchor="middle">age รับค่าแล้ว แต่</text>
<text x="675" y="366" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">ไม่มีช่อง { } ใดใช้!</text>
<line x1="552" y1="351" x2="572" y2="351" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="37" cy="406" r="13" fill="#0f172a"/>
<text x="37" y="411.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="58" y="412" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">เติมช่อง { }</text>
<text x="100" y="486" font-size="16" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">f"Hello, </text>
<rect x="196.4" y="463" width="83.2" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="238" y="486" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">{name}</text>
<text x="285.6" y="486" font-size="16" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">, I'm </text>
<rect x="353.2" y="463" width="83.2" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="394.8" y="486" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">{name}</text>
<text x="442.4" y="486" font-size="16" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"> years old "</text>
<text x="70" y="486" font-size="15" fill="#475569" text-anchor="end">แม่แบบ</text>
<line x1="230" y1="370" x2="238" y2="460" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
<line x1="270" y1="370" x2="394.8" y2="460" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrR)"/>
<text x="560" y="416" font-size="15" fill="#475569" text-anchor="start">ไล่ตามชื่อที่เขียนจริงในปีกกา:</text>
<text x="560" y="438" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">ช่อง 1 = {name} ✓</text>
<text x="560" y="458" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">ช่อง 2 = {name} ✗ ควรเป็น {age}</text>
<circle cx="37" cy="528" r="13" fill="#0f172a"/>
<text x="37" y="533.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="58" y="534" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">ผลลัพธ์ที่พิมพ์</text>
<text x="440" y="534" font-size="15" fill="#dc2626" text-anchor="start">name ซ้ำ 2 ครั้ง · 40 ไม่ปรากฏ · ไม่มี error</text>
<rect x="56" y="552" width="688" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
<text x="120" y="580" font-size="17" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#0f172a" font-weight="bold">Hello, </tspan><tspan fill="#2563eb" font-weight="bold">Sarayut</tspan><tspan fill="#0f172a" font-weight="bold">, I'm </tspan><tspan fill="#dc2626" font-weight="bold">Sarayut</tspan><tspan fill="#0f172a" font-weight="bold"> years old</tspan><tspan fill="#7c3aed" font-weight="bold">␣</tspan></text>
<line x1="238" y1="499" x2="216.6" y2="550" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrB)"/>
<line x1="394.8" y1="499" x2="336.2" y2="550" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
<text x="400" y="620" font-size="15" fill="#7c3aed" text-anchor="middle">␣ = ช่องว่าง 1 ตัวท้ายบรรทัด (มาจากช่องว่างก่อน " ปิด)</text>
<circle cx="37" cy="662" r="13" fill="#0f172a"/>
<text x="37" y="667.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="58" y="668" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">ในปีกกาใส่นิพจน์ได้: คำนวณก่อน แล้วจึงแปลงเป็นข้อความ</text>
<text x="56" y="702" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">hi("Somsri", 19)  →  name = "Somsri", age = 19</text>
<text x="56" y="730" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">f"Hi {name}, next year you are {age + 1}"</text>
<text x="470" y="730" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">{age + 1} = 19 + 1 = 20</text>
<rect x="56" y="746" width="688" height="40" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
<text x="72" y="772" font-size="16" fill="#b45309" text-anchor="start" font-weight="bold">ผลลัพธ์</text>
<text x="728" y="772" font-size="17" fill="#0f172a" text-anchor="end" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Hi Somsri, next year you are 20</text>
<rect x="24" y="808" width="368" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<circle cx="48" cy="832" r="13" fill="#dc2626"/>
<text x="48" y="838" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">✗</text>
<text x="70" y="838" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">ผิด: เดาจากความหมายประโยค</text>
<text x="42" y="866" font-size="15" fill="#0f172a" text-anchor="start">"I'm ... years old" น่าจะเป็นอายุ</text>
<text x="42" y="892" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ ตอบ I'm 40 years old</text>
<rect x="408" y="808" width="368" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<circle cx="432" cy="832" r="13" fill="#059669"/>
<text x="432" y="838" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
<text x="454" y="838" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">ถูก: อ่านชื่อในปีกกาตามจริง</text>
<text x="426" y="866" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">{name} → Sarayut</text>
<text x="426" y="892" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">แก้เป็น {age} → I'm 40 years old</text>
</svg>