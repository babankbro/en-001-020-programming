<text x="400" y="38" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="middle">การวนซ้ำซ้อน: block(row, col) และ triangle(n)</text>
<rect x="24" y="58" width="752" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44" y="86" font-size="17" fill="#0f172a" font-weight="bold">A) block(2, 10) = เรียก line(10) จำนวน 2 ครั้ง</text>
<rect x="40" y="100" width="270" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="124" font-size="14" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def line(n):</text>
<text x="85" y="145" font-size="14" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for i in range(n):</text>
<text x="118" y="166" font-size="14" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print("#", end="")</text>
<text x="85" y="187" font-size="14" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print()</text>
<text x="52" y="229" font-size="14" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def block(row, col):</text>
<text x="85" y="250" font-size="14" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for i in range(row):</text>
<text x="118" y="271" font-size="14" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">line(col)</text>
<text x="410" y="126" font-size="14" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">0</text>
<text x="446" y="126" font-size="14" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">1</text>
