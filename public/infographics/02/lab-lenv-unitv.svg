<text x="709.0" y="243" font-size="14" fill="#d97706" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">5</text>
<rect x="406" y="256" width="46" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="429.0" y="275" font-size="14" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2</text>
