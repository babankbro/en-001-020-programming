<text x="584.0" y="179" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">v[i]*v[i]</text>
<rect x="646" y="160" width="126" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="709.0" y="179" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">sumofPower2</text>
