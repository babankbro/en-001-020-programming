<text x="197.6" y="97" font-size="15" fill="#0f172a" text-anchor="start">v[i]*v[i]</text>
<rect x="282.6" y="84" width="18" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="308.6" y="97" font-size="15" fill="#0f172a" text-anchor="start">ผลรวม/คำตอบ</text>
<rect x="416.4" y="84" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="442.4" y="97" font-size="15" fill="#0f172a" text-anchor="start">เวกเตอร์หนึ่งหน่วย</text>
<circle cx="38" cy="136" r="13" fill="#d97706"/>
<text x="38" y="141" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="60" y="142" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">lenv((1, 2, 3, 4)): ยกกำลังสองทีละตัว → รวม → ถอดรากที่สอง</text>
<rect x="60" y="160" width="330" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="72" y="186" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def lenv(v):</text>
<text x="72" y="208" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    sumofPower2 = 0</text>
<text x="72" y="230" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    for i in range(len(v)):</text>
<text x="72" y="252" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">        sumofPower2 += v[i]*v[i]</text>
<text x="72" y="274" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    return math.sqrt(sumofPower2)</text>
<rect x="406" y="160" width="46" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="429.0" y="179" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">i</text>
<rect x="456" y="160" width="66" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
