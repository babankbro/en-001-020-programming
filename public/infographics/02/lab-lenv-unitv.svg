<line x1="110" y1="716" x2="260" y2="516" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
<text x="268" y="520" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">v = (3, 4)</text>
<text x="199.0" y="620" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">L = 5</text>
<line x1="110" y1="716" x2="140.0" y2="676.0" stroke="#059669" stroke-width="4" marker-end="url(#arrG)"/>
<text x="150.0" y="690.0" font-size="14" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(0.6, 0.8)</text>
<text x="220.0" y="758" font-size="13" fill="#475569" text-anchor="middle">สเกล: 1 หน่วย = 50 พิกเซล</text>
<rect x="400" y="476" width="376" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="412" y="495" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">L = lenv((3, 4))</text>
<text x="412" y="515" font-size="14.5" fill="#2563eb" text-anchor="start" font-weight="bold">= √(3·3 + 4·4) = √25 = 5.0</text>
<rect x="400" y="530" width="376" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="412" y="549" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">3 / L</text>
<text x="412" y="569" font-size="14.5" fill="#2563eb" text-anchor="start" font-weight="bold">= 3 / 5 = 0.6</text>
<rect x="400" y="584" width="376" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="412" y="603" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">4 / L</text>
<text x="412" y="623" font-size="14.5" fill="#2563eb" text-anchor="start" font-weight="bold">= 4 / 5 = 0.8</text>
<rect x="400" y="638" width="376" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="412" y="657" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">print(unitv((3, 4)))</text>
<text x="412" y="677" font-size="14.5" fill="#059669" text-anchor="start" font-weight="bold">→ [0.6, 0.8]</text>
<rect x="400" y="692" width="376" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="412" y="711" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">print(lenv(unitv((3, 4))))</text>
<text x="412" y="731" font-size="14.5" fill="#059669" text-anchor="start" font-weight="bold">→ 1.0  (ยาว 1 หน่วยพอดี)</text>
<text x="400" y="790" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">ทิศเดิม แต่ความยาวเหลือ 1 → ใช้เป็น &quot;ทิศทาง&quot; ในเกมบทที่ 6–8</text>
