<text x="175.0" y="353" font-size="14" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">รวม</text>
<text x="175.0" y="376" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">1 + 4 + 9 + 16 = 30</text>
<line x1="291" y1="359" x2="302" y2="359" stroke="#475569" stroke-width="2" marker-end="url(#arrS)"/>
