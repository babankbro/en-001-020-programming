<text x="418.0" y="353" font-size="14" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">math.sqrt(30)</text>
<text x="418.0" y="376" font-size="13.5" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">5.477225575051661</text>
<line x1="534" y1="359" x2="545" y2="359" stroke="#475569" stroke-width="2" marker-end="url(#arrS)"/>
<rect x="546" y="330" width="230" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="661.0" y="353" font-size="14" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">round(lena, 2)</text>
<text x="661.0" y="376" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">5.48</text>
<text x="60" y="414" font-size="15" fill="#475569" text-anchor="start">output 3 บรรทัด: 21 (จาก dotv) · 5.477225575051661 · 5.48</text>
