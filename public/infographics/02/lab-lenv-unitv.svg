<text x="38" y="457" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="60" y="458" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ข้อ 7: unitv((3, 4)) — หารทุกสมาชิกด้วยความยาว L</text>
