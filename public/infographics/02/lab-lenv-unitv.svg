<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 984" width="800" height="984" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="ตารางไล่ค่า lenv ของ (1,2,3,4) ได้ sqrt 30 = 5.477 ปัดเป็น 5.48 และ unitv ของ (3,4) ได้ [0.6, 0.8] วาดตามสเกล">
