<rect x="456" y="288" width="66" height="28" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="489.0" y="307" font-size="14" fill="#2563eb" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">4</text>
