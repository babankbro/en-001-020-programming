<text x="38" y="831" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="60" y="832" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">คำถาม 2.1: เวกเตอร์ศูนย์</text>
<rect x="60" y="848" width="350" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="76" y="874" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">✗ unitv((0, 0))</text>
<text x="76" y="902" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">L = lenv((0, 0)) = 0</text>
<text x="76" y="924" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">v[i] / L = 0 / 0</text>
<text x="76" y="946" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">→ ZeroDivisionError</text>
<rect x="426" y="848" width="350" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="442" y="874" font-size="16" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">✓ ตรวจก่อนหาร</text>
<text x="442" y="902" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">L = lenv(v)</text>
<text x="442" y="924" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">if L == 0: return v</text>
<text x="442" y="946" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">(เหมือน if direction.length() &gt; 0:)</text>
</svg>
