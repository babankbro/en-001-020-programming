<text x="160" y="734" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">1</text>
<text x="100" y="671" font-size="13" fill="#475569" text-anchor="end" font-family="Consolas, 'Courier New', monospace">1</text>
<text x="210" y="734" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2</text>
<text x="100" y="621" font-size="13" fill="#475569" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2</text>
