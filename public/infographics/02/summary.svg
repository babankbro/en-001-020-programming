<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 622" width="800" height="622" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="แผนที่แนวคิด 5 หัวข้อของบทที่ 2">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>แผนที่แนวคิด 5 หัวข้อของบทที่ 2</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="middle">แผนที่แนวคิด บทที่ 2 พื้นฐานไพทอนและเวกเตอร์</text>
<line x1="400" y1="318" x2="142" y2="232" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="400" y1="318" x2="400" y2="232" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="400" y1="318" x2="658" y2="232" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="400" y1="318" x2="240" y2="404" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="400" y1="318" x2="560" y2="404" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
<ellipse cx="400" cy="318" rx="170" ry="40" fill="#0f172a"/>
<text x="400" y="314" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">บท 02 พื้นฐานไพทอนและเวกเตอร์</text>
<text x="400" y="338" font-size="14" fill="#cbd5e1" text-anchor="middle">Jupyter Notebook · ฟังก์ชัน · การวนซ้ำ</text>
<rect x="24" y="64" width="236" height="168" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="24" y="64" width="236" height="34" rx="10" fill="#2563eb"/>
<rect x="24" y="84" width="236" height="14" rx="0" fill="#2563eb"/>
<text x="36" y="87" font-size="15" fill="#ffffff" font-weight="bold">1. โปรแกรมแรก &amp; f-string</text>
<text x="38" y="124" font-size="14" fill="#0f172a">• print(a, b) คั่นด้วยช่องว่าง</text>
<text x="38" y="150" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">f"{x}" ต้องมี f + {}</text>
<text x="38" y="176" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">{x:.2f} → ทศนิยม 2</text>
<text x="38" y="202" font-size="14" fill="#0f172a">• ไม่มี f → พิมพ์ {x} ตรง ๆ</text>
<rect x="282" y="64" width="236" height="168" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<rect x="282" y="64" width="236" height="34" rx="10" fill="#059669"/>
<rect x="282" y="84" width="236" height="14" rx="0" fill="#059669"/>
<text x="294" y="87" font-size="15" fill="#ffffff" font-weight="bold">2. ค่าเฉลี่ย &amp; ตัวดำเนินการ</text>
<text x="296" y="124" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">avg = total / n</text>
<text x="296" y="150" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">/ ได้ float  // ปัดลง</text>
<text x="296" y="176" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10 % 4 = 2  2**10 = 1024</text>
<text x="296" y="202" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-7 // 2 = -4</text>
<rect x="540" y="64" width="236" height="168" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="540" y="64" width="236" height="34" rx="10" fill="#7c3aed"/>
<rect x="540" y="84" width="236" height="14" rx="0" fill="#7c3aed"/>
<text x="552" y="87" font-size="15" fill="#ffffff" font-weight="bold">3. ผลคูณจุด (Dot Product)</text>
<text x="554" y="124" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a·b = Σ aᵢbᵢ → สเกลาร์</text>
<text x="554" y="150" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(1,2,3)·(1,0,1) = 4</text>
<text x="554" y="176" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a·b = 0 → ตั้งฉาก</text>
<text x="554" y="202" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a·b &gt; 0 → มุม &lt; 90°</text>
<rect x="90" y="404" width="300" height="168" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<rect x="90" y="404" width="300" height="34" rx="10" fill="#d97706"/>
<rect x="90" y="424" width="300" height="14" rx="0" fill="#d97706"/>
<text x="102" y="427" font-size="15" fill="#ffffff" font-weight="bold">4. ขนาดเวกเตอร์ &amp; ลูปทุกมิติ</text>
<text x="104" y="464" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">|v| = √(v·v)</text>
<text x="104" y="490" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">lenv((1,2,3,4)) = √30 ≈ 5.477</text>
<text x="104" y="516" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for i in range(len(v))</text>
<text x="104" y="542" font-size="14" fill="#0f172a">• dotv3 กับ 4 มิติ → ได้ 5 (ผิด) แทน 21</text>
<rect x="410" y="404" width="300" height="168" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<rect x="410" y="404" width="300" height="34" rx="10" fill="#dc2626"/>
<rect x="410" y="424" width="300" height="14" rx="0" fill="#dc2626"/>
<text x="422" y="427" font-size="15" fill="#ffffff" font-weight="bold">5. Top-Down &amp; วาดรูปด้วย #</text>
<text x="424" y="464" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">line(n) → block → triangle</text>
<text x="424" y="490" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">block(2, 10) → # 20 ตัว</text>
<text x="424" y="516" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">triangle(n) → n(n+1)/2 ตัว</text>
<text x="424" y="542" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">tree() → ใบบน/ใบล่าง/ลำต้น</text>
<text x="400" y="604" font-size="14" fill="#475569" text-anchor="middle">ต่อยอดกัน: f-string แสดงผล → ตัวดำเนินการคำนวณ → dotv → lenv = √dotv(v, v) → ลูปเดียวกันวาดรูป #</text>
</svg>
