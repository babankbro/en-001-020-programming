<line x1="290.0" y1="236.0" x2="290.0" y2="436.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="50.0" y1="256.0" x2="290.0" y2="256.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="50.0" y1="296.0" x2="290.0" y2="296.0" stroke="#e2e8f0" stroke-width="1"/>
