<text x="290.0" y="452.0" font-size="14" fill="#475569" text-anchor="middle">201</text>
<line x1="250.0" y1="296.0" x2="90.0" y2="376.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>
<circle cx="250.0" cy="296.0" r="7.0" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="90.0" cy="376.0" r="8.0" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="250.0" y="282.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">เดิม (200, 50)</text>
<text x="90.0" y="400.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">ใหม่ (196, 52)</text>
<text x="205.0" y="474.0" font-size="14" fill="#475569" text-anchor="middle">เลื่อนด้วย (vx, vy) เดิม = (−4, 2) ก่อนจะเปลี่ยนความเร็ว</text>
<rect x="400.0" y="198.0" width="380.0" height="286.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="416.0" y="222.0" font-size="15" fill="#0f172a" font-weight="bold">(ข) ชนพื้นด้วย vy = 6, BOUNCE_DAMPING = 0.9</text>
<line x1="430.0" y1="400.0" x2="760.0" y2="400.0" stroke="#dc2626" stroke-width="3"/>
<text x="760.0" y="422.0" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold">พื้น</text>
<line x1="460.0" y1="302.0" x2="460.0" y2="392.0" stroke="#d97706" stroke-width="5" marker-end="url(#ar-orange)"/>
<text x="474.0" y="347.0" font-size="15" fill="#d97706" font-weight="bold">ก่อนชน vy = +6 (ลง)</text>
<line x1="720.0" y1="392.0" x2="720.0" y2="311.0" stroke="#059669" stroke-width="5" marker-end="url(#ar-green)"/>
<text x="712.0" y="305.0" font-size="15" fill="#059669" text-anchor="end" font-weight="bold">หลังชน vy = −5.4 (ขึ้น)</text>
<text x="416.0" y="446.0" font-size="15" fill="#0f172a" font-weight="bold">vy = −vy × 0.9 = −6 × 0.9 = −5.4</text>
<text x="416.0" y="470.0" font-size="14" fill="#475569">ความยาวลูกศรตามสเกล: เหลือ 90% และกลับทิศขึ้น</text>
