<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="24.0" y="38.0" font-size="21" fill="#0f172a" font-weight="bold">move() 1 ครั้ง และการสะท้อนพื้น (แนวข้อสอบชุดที่ 2)</text>
<text x="24.0" y="64.0" font-size="15" fill="#475569">x = 200, y = 50, vx = −4, vy = 2 · GRAVITY = 0.1, DAMPING_COEFFICIENT = 0.999</text>
<rect x="20.0" y="82.0" width="178.0" height="100.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="109.0" y="106.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">① ตำแหน่งก่อน</text>
<text x="30.0" y="136.0" font-size="15" fill="#0f172a">x = 200 + (−4) = 196</text>
<text x="30.0" y="160.0" font-size="15" fill="#0f172a" font-weight="bold">y = 50 + (2) = 52</text>
<rect x="206.0" y="82.0" width="172.0" height="100.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="292.0" y="106.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">② บวกความโน้มถ่วง</text>
<text x="216.0" y="136.0" font-size="15" fill="#0f172a">vy = 2 + 0.1</text>
<text x="216.0" y="160.0" font-size="15" fill="#0f172a">   = 2.1</text>
<rect x="386.0" y="82.0" width="220.0" height="100.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="496.0" y="106.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="bold">③ หน่วงด้วย 0.999</text>
<text x="396.0" y="136.0" font-size="14" fill="#0f172a">vx = −4 × 0.999 = −3.996</text>
<text x="396.0" y="160.0" font-size="14" fill="#0f172a" font-weight="bold">vy = 2.1 × 0.999 = 2.0979</text>
<rect x="614.0" y="82.0" width="166.0" height="100.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="697.0" y="106.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">④ ตรวจชนขอบ</text>
<text x="624.0" y="136.0" font-size="15" fill="#0f172a">ไม่ชนขอบ</text>
<text x="624.0" y="160.0" font-size="15" fill="#0f172a">ค่าคงเดิม</text>
<rect x="20.0" y="198.0" width="370.0" height="286.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36.0" y="222.0" font-size="14" fill="#0f172a" font-weight="bold">ขยายพิกัดจอ: 1 ช่อง = 1 พิกเซล (y ชี้ลง)</text>
