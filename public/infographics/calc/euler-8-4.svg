<line x1="50.0" y1="416.0" x2="290.0" y2="416.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="50.0" y="452.0" font-size="14" fill="#475569" text-anchor="middle">195</text>
<text x="90.0" y="452.0" font-size="14" fill="#475569" text-anchor="middle">196</text>
<text x="130.0" y="452.0" font-size="14" fill="#475569" text-anchor="middle">197</text>
<text x="170.0" y="452.0" font-size="14" fill="#475569" text-anchor="middle">198</text>
