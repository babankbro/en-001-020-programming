<text x="90.0" y="400.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">ใหม่ (96, 202)</text>
<text x="205.0" y="474.0" font-size="14" fill="#475569" text-anchor="middle">เลื่อนด้วย (vx, vy) เดิม = (−4, 2) ก่อนจะเปลี่ยนความเร็ว</text>
<rect x="400.0" y="198.0" width="380.0" height="286.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="416.0" y="222.0" font-size="15" fill="#dc2626" font-weight="bold">✗ ข้อผิดพลาดที่พบบ่อย: บวก g ก่อนเลื่อน</text>
<text x="416.0" y="252.0" font-size="15" fill="#dc2626">y = 200 + (2 + 0.1) = 202.1  ✗</text>
<text x="416.0" y="290.0" font-size="15" fill="#059669" font-weight="bold">✓ ลำดับในโค้ด ball.py</text>
<text x="416.0" y="320.0" font-size="15" fill="#059669">y = 200 + 2 = 202 ก่อน</text>
<text x="416.0" y="346.0" font-size="15" fill="#059669">แล้ว vy จึงกลายเป็น 2.1 → 2.0979</text>
<text x="416.0" y="386.0" font-size="15" fill="#475569">ความเร็วใหม่จะมีผลกับตำแหน่ง</text>
<text x="416.0" y="410.0" font-size="15" fill="#475569">ในการเรียก move() ครั้งถัดไป</text>
