<text x="446.0" y="120.0" font-size="16" fill="#0f172a" font-weight="bold">x' = x·cos θ − y·sin θ</text>
<text x="446.0" y="144.0" font-size="16" fill="#0f172a" font-weight="bold">y' = x·sin θ + y·cos θ</text>
<text x="446.0" y="180.0" font-size="15" fill="#059669" font-weight="bold">θ = 30°: cos = 0.866, sin = 0.5</text>
<text x="446.0" y="206.0" font-size="15" fill="#0f172a">x' = 0(0.866) − 6(0.5) = −3</text>
<text x="446.0" y="230.0" font-size="15" fill="#0f172a">y' = 0(0.5) + 6(0.866) = 5.196</text>
<text x="446.0" y="266.0" font-size="15" fill="#7c3aed" font-weight="bold">θ = 90°: cos = 0, sin = 1</text>
<text x="446.0" y="292.0" font-size="15" fill="#0f172a">x' = 0(0) − 6(1) = −6</text>
<text x="446.0" y="316.0" font-size="15" fill="#0f172a">y' = 0(1) + 6(0) = 0</text>
<text x="446.0" y="352.0" font-size="15" fill="#475569">ระยะจากจุดกำเนิดคงเดิม = 6</text>
<text x="446.0" y="374.0" font-size="15" fill="#475569">(ทุกจุดอยู่บนวงกลมเส้นประ)</text>
