<text x="24.0" y="38.0" font-size="21" fill="#0f172a" font-weight="bold">หาความกว้างคอลัมน์ col_widths (แนวข้อสอบชุดที่ 3)</text>
<text x="24.0" y="64.0" font-size="15" fill="#475569">แปลงทุกค่าเป็นสตริง → นับตัวอักษร → เลือกค่ามากที่สุดในแต่ละคอลัมน์</text>
