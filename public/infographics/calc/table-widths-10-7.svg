<text x="345.0" y="276.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">max = 4</text>
<rect x="470.0" y="96.0" width="310.0" height="190.0" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="484.0" y="124.0" font-size="15" fill="#0f172a">num_cols = len(table[0]) = 2</text>
<text x="484.0" y="152.0" font-size="16" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">col_widths = [5, 4]</text>
<text x="484.0" y="188.0" font-size="15" fill="#0f172a">line_length = sum(col_widths)</text>
<text x="484.0" y="212.0" font-size="15" fill="#0f172a">              + num_cols × 3</text>
<text x="484.0" y="240.0" font-size="16" fill="#7c3aed" font-weight="bold">= 9 + 2 × 3 = 15</text>
<text x="484.0" y="268.0" font-size="14" fill="#475569">(ตัวเลขต้อง str() ก่อน len() เช่น str(9))</text>
<text x="28.0" y="338.0" font-size="15" fill="#0f172a" font-weight="bold">line_length = 15 ช่องตัวอักษร (1 ช่อง = 1 ตัวอักษร)</text>
