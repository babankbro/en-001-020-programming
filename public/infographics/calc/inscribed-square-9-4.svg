<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="24.0" y="38.0" font-size="21" fill="#0f172a" font-weight="bold">สี่เหลี่ยมจัตุรัสแนบในวงกลม first_gam.py (แนวข้อสอบชุดที่ 2)</text>
<text x="24.0" y="64.0" font-size="15" fill="#475569">จอ 1000 × 800 · ย่อภาพ 1 : 2.5 ตามสเกลจริง · พิกัดจอ (y ชี้ลง)</text>
<rect x="30.0" y="90.0" width="400.0" height="320.0" rx="0" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<circle cx="230.0" cy="250.0" r="160.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="117.2" y="137.2" width="226.3" height="226.3" rx="0" fill="#fffbeb" fill-opacity="0.85" stroke="#d97706" stroke-width="2"/>
<line x1="117.2" y1="137.2" x2="343.5" y2="363.5" stroke="#dc2626" stroke-width="3"/>
<line x1="230.0" y1="250.0" x2="230.0" y2="90.0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
<text x="236.0" y="170.0" font-size="14" fill="#2563eb" font-weight="bold">r = 400</text>
<circle cx="230.0" cy="250.0" r="4.0" fill="#0f172a" stroke="#0f172a" stroke-width="0"/>
<text x="238.0" y="268.0" font-size="14" fill="#0f172a" font-weight="bold">(500, 400)</text>
<circle cx="117.2" cy="137.2" r="5.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
<text x="109.2" y="129.2" font-size="14" fill="#7c3aed" text-anchor="end" font-weight="bold">(218.0, 118.0)</text>
<text x="230.3" y="381.5" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">a ≈ 565.69</text>
<text x="257.5" y="250.3" font-size="14" fill="#dc2626" font-weight="bold">2r</text>
<text x="430.0" y="428.0" font-size="14" fill="#475569" text-anchor="end">1000 × 800</text>
<rect x="470.0" y="90.0" width="310.0" height="360.0" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="484.0" y="118.0" font-size="16" fill="#2563eb" font-weight="bold">① จุดศูนย์กลางและรัศมี</text>
<text x="484.0" y="148.0" font-size="15" fill="#0f172a">(1000//2, 800//2) = (500, 400)</text>
<text x="484.0" y="178.0" font-size="15" fill="#0f172a">r = 800//2 = 400</text>
<text x="484.0" y="216.0" font-size="16" fill="#2563eb" font-weight="bold">② เส้นทแยง = เส้นผ่านศูนย์กลาง 2r</text>
<text x="484.0" y="246.0" font-size="15" fill="#0f172a">a² + a² = (2r)² → a = r√2</text>
<text x="484.0" y="276.0" font-size="15" fill="#0f172a">a = 2√(400²/2) ≈ 565.69</text>
<text x="484.0" y="314.0" font-size="16" fill="#2563eb" font-weight="bold">③ มุมบนซ้าย (ใช้ a//2)</text>
<text x="484.0" y="344.0" font-size="15" fill="#0f172a">a//2 = 565.69… // 2 = 282.0</text>
<text x="484.0" y="374.0" font-size="15" fill="#0f172a">rect_x = 500 − 282.0 = 218.0</text>
<text x="484.0" y="404.0" font-size="15" fill="#7c3aed" font-weight="bold">rect_y = 400 − 282.0 = 118.0</text>
<text x="484.0" y="438.0" font-size="14" fill="#475569">// กับ float ได้ float ที่ปัดลง (282.0)</text>
</svg>