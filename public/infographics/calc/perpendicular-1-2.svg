<text x="24.0" y="38.0" font-size="21" fill="#0f172a" font-weight="bold">เวกเตอร์ (3, 4) กับ (−4, 3) ตั้งฉากกัน</text>
<text x="24.0" y="64.0" font-size="15" fill="#475569">โจทย์ 1.2: วาดตามสเกล 1 ช่อง = 1 หน่วย (แกน y ชี้ขึ้นแบบคณิตศาสตร์)</text>
