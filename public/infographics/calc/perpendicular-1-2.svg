<text x="40.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">−5</text>
<text x="80.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">−4</text>
<text x="120.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">−3</text>
<text x="160.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">−2</text>
<text x="200.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">−1</text>
<text x="280.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">1</text>
<text x="320.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">2</text>
<text x="360.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">3</text>
<text x="400.0" y="306.0" font-size="14" fill="#475569" text-anchor="middle">4</text>
<text x="234.0" y="335.0" font-size="14" fill="#475569" text-anchor="end">−1</text>
<text x="234.0" y="255.0" font-size="14" fill="#475569" text-anchor="end">1</text>
<text x="234.0" y="215.0" font-size="14" fill="#475569" text-anchor="end">2</text>
