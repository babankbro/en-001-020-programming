<polyline points="253.2,272.4 235.6,259.2 222.4,276.8" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<text x="372.0" y="120.0" font-size="15" fill="#2563eb" font-weight="bold">a = (3, 4)</text>
<text x="76.0" y="158.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">b = (−4, 3)</text>
<text x="300.0" y="282.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">3</text>
<text x="368.0" y="215.0" font-size="14" fill="#2563eb" font-weight="bold">4</text>
<text x="160.0" y="188.0" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">−4</text>
<text x="230.0" y="235.0" font-size="14" fill="#d97706" text-anchor="end" font-weight="bold">3</text>
<text x="248.0" y="252.0" font-size="14" fill="#7c3aed" font-weight="bold">90°</text>
<rect x="430.0" y="96.0" width="346.0" height="340.0" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="446.0" y="126.0" font-size="17" fill="#2563eb" font-weight="bold">① ผลคูณจุด</text>
<text x="446.0" y="154.0" font-size="16" fill="#0f172a">a·b = (3)(−4) + (4)(3)</text>
<text x="446.0" y="180.0" font-size="16" fill="#0f172a" font-weight="bold">     = −12 + 12 = 0</text>
<text x="446.0" y="206.0" font-size="15" fill="#7c3aed" font-weight="bold">ผลคูณจุด = 0  →  cos θ = 0  →  θ = 90°</text>
<text x="446.0" y="246.0" font-size="17" fill="#2563eb" font-weight="bold">② ขนาด (สามเหลี่ยมมุมฉาก 3-4-5)</text>
<text x="446.0" y="274.0" font-size="16" fill="#0f172a">|a| = √(3² + 4²) = √25 = 5</text>
<text x="446.0" y="300.0" font-size="16" fill="#0f172a">|b| = √((−4)² + 3²) = √25 = 5</text>
<text x="446.0" y="340.0" font-size="17" fill="#2563eb" font-weight="bold">③ b คือ a ที่หมุน 90° ด้วยกฎ</text>
<text x="446.0" y="368.0" font-size="16" fill="#0f172a">(x, y) → (−y, x) : (3, 4) → (−4, 3)</text>
<text x="446.0" y="396.0" font-size="15" fill="#475569">การหมุนไม่เปลี่ยนความยาว จึงยาว 5 เท่ากัน</text>
</svg>