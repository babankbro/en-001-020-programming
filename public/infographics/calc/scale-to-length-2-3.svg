<text x="426.0" y="122.0" font-size="17" fill="#2563eb" font-weight="bold">① หาขนาดเดิม</text>
<text x="426.0" y="150.0" font-size="16" fill="#0f172a">|v| = √((−9)² + 12²) = √225 = 15</text>
<text x="426.0" y="186.0" font-size="17" fill="#2563eb" font-weight="bold">② ทำให้เป็นเวกเตอร์หนึ่งหน่วย (ม่วง)</text>
<text x="426.0" y="214.0" font-size="16" fill="#0f172a">v̂ = (−9/15, 12/15) = (−0.6, 0.8)</text>
<text x="426.0" y="250.0" font-size="17" fill="#2563eb" font-weight="bold">③ คูณด้วยความยาวใหม่ L = 5 (เขียว)</text>
<text x="426.0" y="278.0" font-size="16" fill="#0f172a" font-weight="bold">v_new = (−0.6×5, 0.8×5) = (−3, 4)</text>
<text x="426.0" y="314.0" font-size="16" fill="#059669" font-weight="bold">ตรวจ: √(9 + 16) = 5 ✓</text>
<text x="426.0" y="352.0" font-size="15" fill="#475569">ลูกศรทั้งสามอยู่บนเส้นตรงเดียวกัน</text>
<text x="426.0" y="376.0" font-size="15" fill="#475569">= ทิศเดิม เปลี่ยนแค่ความยาว 15 → 1 → 5</text>
<text x="426.0" y="412.0" font-size="15" fill="#475569">(ข) ใช้หลักเดียวกัน: (−0.6, 0.8) × 15 = (−9, 12)</text>
