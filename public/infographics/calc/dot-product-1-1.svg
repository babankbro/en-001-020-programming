<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="24.0" y="38.0" font-size="21" fill="#0f172a" font-weight="bold">ผลคูณจุด u·v = คูณทีละตำแหน่งแล้วบวกรวม</text>
<text x="24.0" y="64.0" font-size="15" fill="#475569">โจทย์ 1.1: u = (2, −3, 1), v = (4, 0, −2)</text>
<text x="30.0" y="120.0" font-size="20" fill="#2563eb" font-weight="bold">u</text>
<text x="30.0" y="200.0" font-size="20" fill="#d97706" font-weight="bold">v</text>
<text x="30.0" y="284.0" font-size="15" fill="#059669" font-weight="bold">คูณทีละ</text>
<text x="30.0" y="302.0" font-size="15" fill="#059669" font-weight="bold">ตำแหน่ง</text>
<text x="205.0" y="82.0" font-size="14" fill="#475569" text-anchor="middle">ตำแหน่ง 0</text>
<rect x="150.0" y="90.0" width="110.0" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="205.0" y="120.2" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text>
<text x="205.0" y="162.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">×</text>
<rect x="150.0" y="170.0" width="110.0" height="46.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="205.0" y="200.2" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">4</text>
<line x1="205.0" y1="220.0" x2="205.0" y2="256.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-ink2)"/>
<rect x="150.0" y="262.0" width="110.0" height="46.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="205.0" y="290.8" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">2×4 = 8</text>
<text x="285.0" y="292.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold">+</text>
<text x="365.0" y="82.0" font-size="14" fill="#475569" text-anchor="middle">ตำแหน่ง 1</text>
<rect x="310.0" y="90.0" width="110.0" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="365.0" y="120.2" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">−3</text>
<text x="365.0" y="162.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">×</text>
<rect x="310.0" y="170.0" width="110.0" height="46.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="365.0" y="200.2" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text>
<line x1="365.0" y1="220.0" x2="365.0" y2="256.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-ink2)"/>
<rect x="310.0" y="262.0" width="110.0" height="46.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="365.0" y="290.8" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">(−3)×0 = 0</text>
<text x="445.0" y="292.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold">+</text>
<text x="525.0" y="82.0" font-size="14" fill="#475569" text-anchor="middle">ตำแหน่ง 2</text>
<rect x="470.0" y="90.0" width="110.0" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="525.0" y="120.2" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="525.0" y="162.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">×</text>
<rect x="470.0" y="170.0" width="110.0" height="46.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="525.0" y="200.2" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">−2</text>
<line x1="525.0" y1="220.0" x2="525.0" y2="256.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-ink2)"/>
<rect x="470.0" y="262.0" width="110.0" height="46.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="525.0" y="290.8" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">1×(−2) = −2</text>
<text x="605.0" y="292.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold">=</text>
<rect x="630.0" y="256.0" width="90.0" height="58.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="675.0" y="293.6" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="bold">6</text>
<text x="675.0" y="336.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">u·v</text>
<text x="30.0" y="351.0" font-size="20" fill="#d97706" font-weight="bold">|v|</text>
<text x="110.0" y="351.0" font-size="18" fill="#0f172a" font-weight="bold">= √( 4² + 0² + (−2)² ) = √( 16 + 0 + 4 ) = √20 ≈ 4.472</text>
<text x="110.0" y="377.0" font-size="15" fill="#475569">ขนาดเวกเตอร์ = ผลคูณจุดของเวกเตอร์กับตัวเอง แล้วถอดราก</text>
</svg>