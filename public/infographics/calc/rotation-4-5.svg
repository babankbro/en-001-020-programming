<rect x="430.0" y="92.0" width="346.0" height="340.0" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="446.0" y="120.0" font-size="16" fill="#0f172a" font-weight="bold">x' = x·cos θ − y·sin θ</text>
<text x="446.0" y="144.0" font-size="16" fill="#0f172a" font-weight="bold">y' = x·sin θ + y·cos θ</text>
<text x="446.0" y="180.0" font-size="15" fill="#059669" font-weight="bold">θ = 60°: cos = 0.5, sin = 0.866</text>
<text x="446.0" y="206.0" font-size="15" fill="#0f172a">x' = 4(0.5) − 0(0.866) = 2</text>
<text x="446.0" y="230.0" font-size="15" fill="#0f172a">y' = 4(0.866) + 0(0.5) = 3.464</text>
<text x="446.0" y="266.0" font-size="15" fill="#475569">ระยะจากจุดกำเนิดคงเดิม = 4</text>
<text x="446.0" y="288.0" font-size="15" fill="#475569">(ทุกจุดอยู่บนวงกลมเส้นประ)</text>
<text x="24.0" y="462.0" font-size="16" fill="#0f172a" font-weight="bold">(ข) theta_deg = frame * 4 , frames = 90</text>
