<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1058" width="800" height="1058" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ไล่ค่า move_ball ทีละบรรทัด (ขั้นตอนที่ 4)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: เฟรมที่ 1 ค่า x, y, vx, vy เปลี่ยนตามลำดับบรรทัดอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ตำแหน่ง x, y</text><rect x="280.8" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="314.8" y="116.0" font-size="15" fill="#0f172a">ความเร็ว vx, vy</text><rect x="441.2" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="475.2" y="116.0" font-size="15" fill="#0f172a">ค่าที่ได้หลังบรรทัดนั้น</text><rect x="20.0" y="144.0" width="760.0" height="44.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="36.0" y="172.0" font-size="16" xml:space="preserve"><tspan fill="#475569" font-weight="bold">เริ่ม (เฟรม 0): </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">x = 400, y = 100, vx = 3, vy = 0, radius = 15</tspan></text><text x="30.0" y="220.0" font-size="18" fill="#0f172a" font-weight="bold">เฟรมที่ 1 — ทำตามลำดับบรรทัดในโค้ด</text><circle cx="44.0" cy="249.0" r="14.0" fill="#2563eb"/><text x="44.0" y="254.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="68.0" y="254.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball["x"] += ball["vx"]</text><text x="68.0" y="280.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">x = 400 + 3 = </tspan><tspan fill="#059669" font-weight="bold">403</tspan></text><circle cx="44.0" cy="311.0" r="14.0" fill="#2563eb"/><text x="44.0" y="316.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="68.0" y="316.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball["y"] += ball["vy"]</text><text x="68.0" y="342.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">y = 100 + 0 = </tspan><tspan fill="#059669" font-weight="bold">100</tspan><tspan fill="#dc2626" font-weight="bold">  ← vy ยังเป็น 0!</tspan></text><circle cx="44.0" cy="373.0" r="14.0" fill="#d97706"/><text x="44.0" y="378.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="68.0" y="378.0" font-size="15" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball["vy"] += GRAVITY</text><text x="68.0" y="404.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">vy = 0 + 0.1 = </tspan><tspan fill="#059669" font-weight="bold">0.1</tspan></text><circle cx="44.0" cy="435.0" r="14.0" fill="#d97706"/><text x="44.0" y="440.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="68.0" y="440.0" font-size="15" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">vx, vy *= DAMPING (0.999)</text><text x="68.0" y="466.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">vx = 3×0.999 = </tspan><tspan fill="#059669" font-weight="bold">2.997</tspan><tspan fill="#0f172a">   vy = 0.1×0.999 = </tspan><tspan fill="#059669" font-weight="bold">0.0999</tspan></text><circle cx="44.0" cy="497.0" r="14.0" fill="#7c3aed"/><text x="44.0" y="502.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="68.0" y="502.0" font-size="15" fill="#7c3aed" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ตรวจชนผนัง / ชนพื้น</text><text x="68.0" y="528.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">x−15 = 388 &gt; 0, x+15 = 418 &lt; 800, y+15 = 115 &lt; 600 → </tspan><tspan fill="#059669" font-weight="bold">ไม่ชน</tspan></text><rect x="20.0" y="554.0" width="760.0" height="50.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="400.0" y="585.3" font-size="18" fill="#059669" text-anchor="middle" font-weight="bold">เฟรม 1: x = 403.0000   y = 100.0000   vx = 2.9970   vy = 0.0999</text><text x="30.0" y="638.0" font-size="18" fill="#0f172a" font-weight="bold">ตารางไล่ค่าที่ต้องเติม (ลอกลง answers.md แล้วเติมช่อง ____ ก่อนรัน)</text><rect x="20.0" y="654.0" width="760.0" height="38.0" rx="8" fill="#eff6ff"/><text x="36.0" y="679.0" font-size="15" fill="#2563eb" font-weight="bold">เฟรม</text><text x="100.0" y="679.0" font-size="15" fill="#2563eb" font-weight="bold">x  (x + vx)</text><text x="290.0" y="679.0" font-size="15" fill="#2563eb" font-weight="bold">y  (y + vy)</text><text x="480.0" y="679.0" font-size="15" fill="#2563eb" font-weight="bold">vx  (×0.999)</text><text x="610.0" y="679.0" font-size="15" fill="#2563eb" font-weight="bold">vy  (+0.1)×0.999</text><text x="46.0" y="722.0" font-size="16" fill="#0f172a" font-weight="bold">0</text><text x="100.0" y="722.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">400</text><text x="290.0" y="722.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100</text><text x="480.0" y="722.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text><text x="610.0" y="722.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="46.0" y="762.0" font-size="16" fill="#0f172a" font-weight="bold">1</text><text x="100.0" y="762.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">400 + 3 = 403.0000</text><text x="290.0" y="762.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 0 = 100.0000</text><text x="480.0" y="762.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2.9970</text><text x="610.0" y="762.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.0999</text><rect x="20.0" y="776.0" width="760.0" height="38.0" rx="6" fill="#fffbeb"/><text x="46.0" y="802.0" font-size="16" fill="#0f172a" font-weight="bold">2</text><text x="100.0" y="802.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">403 + 2.997 = ____</text><text x="290.0" y="802.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 0.0999 = ____</text><text x="480.0" y="802.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">____</text><text x="610.0" y="802.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">____</text><rect x="20.0" y="816.0" width="760.0" height="38.0" rx="6" fill="#fffbeb"/><text x="46.0" y="842.0" font-size="16" fill="#0f172a" font-weight="bold">3</text><text x="100.0" y="842.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">____</text><text x="290.0" y="842.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">____</text><text x="480.0" y="842.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">____</text><text x="610.0" y="842.0" font-size="15" fill="#d97706" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">____</text><text x="30.0" y="878.0" font-size="15" fill="#475569">เฉลยเฟรม 2: 405.9970, 100.0999, 2.9940, 0.1997 · เฟรม 3 ดูจากกล่อง output ในใบงาน</text><text x="30.0" y="920.0" font-size="18" fill="#0f172a" font-weight="bold">จุดที่มักผิด (ข้อ 6): สลับลำดับบรรทัดตอนไล่ค่ามือ</text><rect x="20.0" y="936.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="966.0" font-size="17" fill="#dc2626" font-weight="bold">✗ บวกความโน้มถ่วงก่อน</text><text x="36.0" y="990.0" font-size="15" fill="#0f172a">vy = 0 + 0.1 = 0.1 แล้วค่อย y += vy</text><text x="36.0" y="1014.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">เฟรม 1 ได้ y = </tspan><tspan fill="#dc2626" font-weight="bold">100.1</tspan><tspan fill="#0f172a"> (ไม่ตรงโปรแกรม)</tspan></text><rect x="408.0" y="936.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="966.0" font-size="17" fill="#059669" font-weight="bold">✓ ตามลำดับในโค้ด</text><text x="424.0" y="990.0" font-size="15" fill="#0f172a">y += vy ก่อน (vy = 0) แล้วค่อย vy += 0.1</text><text x="424.0" y="1014.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">เฟรม 1 ได้ y = </tspan><tspan fill="#059669" font-weight="bold">100.0000</tspan><tspan fill="#059669" font-weight="bold"> ✓</tspan></text></svg>