<text x="400.0" y="560.0" font-size="14" fill="#0f172a" text-anchor="middle">ยิ่งค่ามาก แสงช่องนั้นยิ่งสว่าง · ค่าเท่ากันทั้ง 3 ช่อง = เฉดเทา (0 ดำ → 255 ขาว) · ผสมแสง ไม่ใช่ผสมสีน้ำ: แดง + เขียว = เหลือง</text>
<text x="400.0" y="584.0" font-size="14" fill="#475569" text-anchor="middle">ตัวอย่าง: YELLOW = (255, 255, 0) แล้ว pygame.draw.rect(screen, YELLOW, (270, 180, 60, 40))</text>
