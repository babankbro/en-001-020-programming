<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ลูกบอลหลายลูกด้วยการวนซ้ำ (ขั้นตอนที่ 7)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: Ball(100 + i*20, 100, 3 * (−1)**i, ...) วางลูกที่ i ไว้ตรงไหน และวิ่งไปทางใด</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-blue)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">i คู่: vx = +3 (ขวา)</text><line x1="325.1" y1="111.0" x2="351.1" y2="111.0" stroke="#d97706" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-orange)"/><text x="359.1" y="116.0" font-size="15" fill="#0f172a">i คี่: vx = −3 (ซ้าย)</text><line x1="519.0" y1="111.0" x2="545.0" y2="111.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="553.0" y="116.0" font-size="15" fill="#0f172a">ตำแหน่งหลัง move() 1 ครั้ง</text><text x="30.0" y="168.0" font-size="18" fill="#0f172a" font-weight="bold">① ทาย 5 ลูกแรก (ข้อ 11) — เติมตารางก่อนรัน</text><rect x="20.0" y="182.0" width="760.0" height="38.0" rx="8" fill="#eff6ff"/><text x="40.0" y="207.0" font-size="15" fill="#2563eb" font-weight="bold">i</text><text x="110.0" y="207.0" font-size="15" fill="#2563eb" font-weight="bold">x = 100 + i*20</text><text x="270.0" y="207.0" font-size="15" fill="#2563eb" font-weight="bold">(−1)**i</text><text x="420.0" y="207.0" font-size="15" fill="#2563eb" font-weight="bold">vx = 3 × (−1)**i</text><text x="560.0" y="207.0" font-size="15" fill="#2563eb" font-weight="bold">x หลัง move()</text><text x="44.0" y="250.0" font-size="16" fill="#0f172a" font-weight="bold">0</text><text x="110.0" y="250.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 0 = 100</text><text x="270.0" y="250.0" font-size="16" fill="#2563eb" font-weight="bold">1</text><text x="420.0" y="250.0" font-size="16" fill="#2563eb" font-weight="bold">3</text><text x="560.0" y="250.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 3 = 103</text><text x="44.0" y="284.0" font-size="16" fill="#0f172a" font-weight="bold">1</text><text x="110.0" y="284.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 20 = 120</text><text x="270.0" y="284.0" font-size="16" fill="#d97706" font-weight="bold">−1</text><text x="420.0" y="284.0" font-size="16" fill="#d97706" font-weight="bold">−3</text><text x="560.0" y="284.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">120 − 3 = 117</text><text x="44.0" y="318.0" font-size="16" fill="#0f172a" font-weight="bold">2</text><text x="110.0" y="318.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 40 = 140</text><text x="270.0" y="318.0" font-size="16" fill="#2563eb" font-weight="bold">1</text><text x="420.0" y="318.0" font-size="16" fill="#2563eb" font-weight="bold">3</text><text x="560.0" y="318.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">140 + 3 = 143</text><text x="44.0" y="352.0" font-size="16" fill="#0f172a" font-weight="bold">3</text><text x="110.0" y="352.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 60 = 160</text><text x="270.0" y="352.0" font-size="16" fill="#d97706" font-weight="bold">−1</text><text x="420.0" y="352.0" font-size="16" fill="#d97706" font-weight="bold">−3</text><text x="560.0" y="352.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">160 − 3 = 157</text><text x="44.0" y="386.0" font-size="16" fill="#0f172a" font-weight="bold">4</text><text x="110.0" y="386.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100 + 80 = 180</text><text x="270.0" y="386.0" font-size="16" fill="#2563eb" font-weight="bold">1</text><text x="420.0" y="386.0" font-size="16" fill="#2563eb" font-weight="bold">3</text><text x="560.0" y="386.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">180 + 3 = 183</text><rect x="20.0" y="418.0" width="760.0" height="62.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="36.0" y="442.0" font-size="15" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">[(100, 3), (120, -3), (140, 3), (160, -3), (180, 3)]</text><text x="36.0" y="468.0" font-size="15" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">[103, 117, 143, 157, 183]</text><text x="764.0" y="455.0" font-size="15" fill="#475569" text-anchor="end">← output ที่ต้องตรงกัน</text><text x="30.0" y="516.0" font-size="16" fill="#0f172a" font-weight="bold">② ตามสเกล 4 เท่า: ห่างกัน 20 แต่เส้นผ่านศูนย์กลาง 30 → ลูกบอลวาดซ้อนกัน</text><line x1="40.0" y1="741.0" x2="500.0" y2="741.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="60.0" y1="736.0" x2="60.0" y2="746.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="100.0" y1="736.0" x2="100.0" y2="746.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><text x="100.0" y="766.0" font-size="15" fill="#475569" text-anchor="middle">100</text><line x1="140.0" y1="736.0" x2="140.0" y2="746.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="180.0" y1="736.0" x2="180.0" y2="746.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><text x="180.0" y="766.0" font-size="15" fill="#475569" text-anchor="middle">120</text><line x1="220.0" y1="736.0" x2="220.0" y2="746.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="260.0" y1="736.0" x2="260.0" y2="746.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><text x="260.0" y="766.0" font-size="15" fill="#475569" text-anchor="middle">140</text><line x1="300.0" y1="736.0" x2="300.0" y2="746.0" stroke="#94a3b8" stro