<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="36.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">วงวนเกม (Game Loop): 6 ขั้นที่ทำซ้ำทุกเฟรม</text><path d="M515.0,165.7 A250,185 0 0 1 566.9,192.3" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah-gray)"/><path d="M641.6,282.5 A250,185 0 0 1 641.6,377.5" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah-gray)"/><path d="M566.9,467.7 A250,185 0 0 1 515.0,494.3" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah-gray)"/><path d="M285.0,494.3 A250,185 0 0 1 233.1,467.7" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah-gray)"/><path d="M158.4,377.5 A250,185 0 0 1 158.4,282.5" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah-gray)"/><path d="M233.1,192.3 A250,185 0 0 1 285.0,165.7" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah-gray)"/><rect x="293.0" y="108.0" width="214.0" height="74.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="313.0" cy="131.0" r="13.0" fill="#2563eb"/><text x="313.0" y="136.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="335.0" y="136.0" font-size="16" fill="#2563eb" font-weight="bold">รับเหตุการณ์</text><text x="400.0" y="167.0" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">pygame.event.get()</text><rect x="509.5" y="200.5" width="214.0" height="74.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="529.5" cy="223.5" r="13.0" fill="#059669"/><text x="529.5" y="228.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="551.5" y="228.5" font-size="16" fill="#059669" font-weight="bold">ล้างจอ</text><text x="616.5" y="259.5" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">screen.fill(BLACK)</text><rect x="509.5" y="385.5" width="214.0" height="74.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="529.5" cy="408.5" r="13.0" fill="#d97706"/><text x="529.5" y="413.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="551.5" y="413.5" font-size="16" fill="#d97706" font-weight="bold">อัปเดตสถานะ</text><text x="616.5" y="444.5" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ball.move()</text><rect x="293.0" y="478.0" width="214.0" height="74.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><circle cx="313.0" cy="501.0" r="13.0" fill="#dc2626"/><text x="313.0" y="506.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="335.0" y="506.0" font-size="16" fill="#dc2626" font-weight="bold">วาดลงบัฟเฟอร์</text><text x="400.0" y="537.0" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ball.draw(screen)</text><rect x="76.5" y="385.5" width="214.0" height="74.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="96.5" cy="408.5" r="13.0" fill="#7c3aed"/><text x="96.5" y="413.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="118.5" y="413.5" font-size="16" fill="#7c3aed" font-weight="bold">แสดงภาพขึ้นจอ</text><text x="183.5" y="444.5" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">pygame.display.flip()</text><rect x="76.5" y="200.5" width="214.0" height="74.0" rx="12" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><circle cx="96.5" cy="223.5" r="13.0" fill="#0f172a"/><text x="96.5" y="228.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="118.5" y="228.5" font-size="16" fill="#0f172a" font-weight="bold">คุมอัตราเฟรม</text><text x="183.5" y="259.5" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">clock.tick(60)</text><text x="400.0" y="300.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">1 รอบ = 1 เฟรม</text><text x="400.0" y="326.0" font-size="15" fill="#475569" text-anchor="middle">60 FPS → 1000/60 ≈ 16.7 ms</text><text x="400.0" y="350.0" font-size="14" fill="#475569" text-anchor="middle">วาดเสร็จก่อน แล้ว flip ครั้งเดียว</text><text x="400.0" y="372.0" font-size="14" fill="#475569" text-anchor="middle">(Double Buffering ภาพไม่กะพริบ)</text><rect x="20.0" y="58.0" width="200.0" height="62.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="32.0" y="82.0" font-size="14" fill="#475569">ก่อนวน: pygame.init()</text><text x="32.0" y="105.0" font-size="14" fill="#475569" font-family="Consolas, 'Courier New', monospace">set_mode, Clock()</text><line x1="220.0" y1="92.0" x2="288.0" y2="118.0" stroke="#475569" stroke-width="1.5" marker-end="url(#ah-sub)"/><rect x="580.0" y="58.0" width="200.0" height="62.0" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="592.0" y="82.0" font-size="14" fill="#dc2626">QUIT → running = False</text><text x="592.0" y="105.0" font-size="14" fill="#dc2626">ออกวน → pygame.quit()</text><line x1="512.0" y1="118.0" x2="578.0" y2="92.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ah-red)" stroke-dasharray="4 3"/><text x="400.0" y="600.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">ลำดับที่ต้องจำ: event → fill → update → draw → flip → tick</text></svg>