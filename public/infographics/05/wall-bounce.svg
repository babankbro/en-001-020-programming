<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="400.0" y="38.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ชนพื้นแล้วต้อง "วางตำแหน่งกลับ" (r = 20, จอสูง 600)</text>
<rect x="20.0" y="52.0" width="760.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="141.4" y="74.0" font-size="15" text-anchor="start"><tspan fill="#475569" font-weight="bold">ภาพนี้ตอบคำถามว่า: </tspan><tspan fill="#0f172a">ทำไมกลับทิศอย่างเดียวทำให้ลูกบอลติดพื้น แต่กลับทิศ + วางกลับจึงเด้งขึ้นได้</tspan></text>
<text x="52.5" y="113.0" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">คำอธิบายสี:</text>
<rect x="144.4" y="101.0" width="18.0" height="14.0" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="168.4" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">บริเวณทะลุพื้น / กลับทิศอย่างเดียว</text>
<rect x="390.2" y="101.0" width="18.0" height="14.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="414.2" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">กลับทิศ + วางกลับ</text>
<rect x="535.2" y="101.0" width="18.0" height="14.0" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="559.2" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">จุดทึบ = เงื่อนไขชนเป็นจริง</text>
<rect x="20.0" y="130.0" width="760.0" height="150.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36.0" y="156.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">เฟรมที่ชน: ลูกบอลตกมาอยู่ที่ y = 590, vy = 5 (ทะลุพื้นไปแล้ว)</text>
<circle cx="46.0" cy="177.0" r="10" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="46.0" y="182.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="64.0" y="182.0" font-size="15" text-anchor="start"><tspan fill="#2563eb" font-weight="bold">ตรวจชน: </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">y + r = 590 + 20 = 610 ≥ 600</tspan><tspan fill="#0f172a"> → ชน</tspan></text>
<circle cx="46.0" cy="202.0" r="10" fill="#d97706" stroke="none" stroke-width="1.5"/>
<text x="46.0" y="207.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="64.0" y="207.0" font-size="15" text-anchor="start"><tspan fill="#d97706" font-weight="bold">กลับทิศ: </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">vy = -5 × 0.9 = -4.5</tspan></text>
<circle cx="46.0" cy="227.0" r="10" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="46.0" y="232.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="64.0" y="232.0" font-size="15" text-anchor="start"><tspan fill="#059669" font-weight="bold">วางกลับ (เฉพาะแบบถูก): </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">y = 600 - 20 = 580</tspan><tspan fill="#0f172a"> → ขอบล่างอยู่ที่ 600 พอดี</tspan></text>
<circle cx="46.0" cy="252.0" r="10" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<text x="46.0" y="257.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="64.0" y="257.0" font-size="15" text-anchor="start"><tspan fill="#7c3aed" font-weight="bold">เฟรมถัดไป: </tspan><tspan fill="#dc2626" font-family="Consolas, 'Courier New', monospace">✗ 590 - 4.5 = 585.5</tspan><tspan fill="#0f172a"> ขอบล่าง 605.5 ยังทะลุ · </tspan><tspan fill="#059669" font-family="Consolas, 'Courier New', monospace">✓ 580 - 4.5 = 575.5</tspan><tspan fill="#0f172a"> → 595.5</tspan></text>
