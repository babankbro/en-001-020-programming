<text x="36.0" y="808.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">กว้าง = 80·cos45° + 40·sin45° = 56.57 + 28.28 ≈ 84.85</tspan><tspan fill="#0f172a"> → พื้นผิว 84 พิกเซล</tspan></text>
<text x="36.0" y="834.0" font-size="15" fill="#0f172a" text-anchor="start">มุมบวก = ทวนเข็มนาฬิกาบนจอ · มุมลบ = ตามเข็ม · หมุน 90°, 180° กรอบแค่สลับกว้าง/สูง</text>
