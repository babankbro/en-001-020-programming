<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" width="800" height="770" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="400.0" y="38.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">pygame.transform: กลับ ย่อ/ขยาย และหมุนภาพ (ภาพต้นฉบับ 80×40)</text>
<text x="400.0" y="64.0" font-size="14" fill="#475569" text-anchor="middle">กรอบประ = ขนาดพื้นผิว (Surface) ใหม่ที่ฟังก์ชันคืนมา · ทุกฟังก์ชันคืนภาพใหม่ ไม่แก้ภาพเดิม</text>
