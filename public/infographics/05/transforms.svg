<rect x="17.0" y="670.0" width="766.0" height="90.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="32.0" y="694.0" font-size="14" fill="#0f172a" text-anchor="start">มุมบวก = หมุนทวนเข็มนาฬิกาบนจอ · มุมลบ = ตามเข็ม · หมุนมุมที่ไม่ใช่ 90° กรอบภาพจะโตขึ้นเพื่อให้มุมภาพไม่ถูกตัด</text>
<text x="32.0" y="720.0" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">✓ self.image = pygame.transform.rotate(self.original_image, angle)   หมุนจากต้นฉบับทุกครั้ง</text>
<text x="32.0" y="744.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">✗ self.image = pygame.transform.rotate(self.image, 10)   ทุกเฟรม → เบลอสะสม · หมุน 10 ครั้งกรอบโตจาก 80×40 เป็น 251×247</text>
