<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="36.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">สี่เหลี่ยมจัตุรัสแนบในวงกลม บนจอ 800×600 (วาดตามสเกล)</text><rect x="20.0" y="64.0" width="560.0" height="420.0" rx="0" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/><line x1="90.0" y1="64.0" x2="90.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="160.0" y1="64.0" x2="160.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="230.0" y1="64.0" x2="230.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="300.0" y1="64.0" x2="300.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="370.0" y1="64.0" x2="370.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="440.0" y1="64.0" x2="440.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="510.0" y1="64.0" x2="510.0" y2="484.0" stroke="#e2e8f0" stroke-width="1"/><line x1="20.0" y1="134.0" x2="580.0" y2="134.0" stroke="#e2e8f0" stroke-width="1"/><line x1="20.0" y1="204.0" x2="580.0" y2="204.0" stroke="#e2e8f0" stroke-width="1"/><line x1="20.0" y1="274.0" x2="580.0" y2="274.0" stroke="#e2e8f0" stroke-width="1"/><line x1="20.0" y1="344.0" x2="580.0" y2="344.0" stroke="#e2e8f0" stroke-width="1"/><line x1="20.0" y1="414.0" x2="580.0" y2="414.0" stroke="#e2e8f0" stroke-width="1"/><circle cx="300.0" cy="274.0" r="210.0" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><rect x="151.6" y="125.6" width="297.0" height="297.0" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><line x1="151.6" y1="125.6" x2="448.6" y2="422.6" stroke="#dc2626" stroke-width="14.0"/><line x1="151.6" y1="422.6" x2="448.6" y2="125.6" stroke="#dc2626" stroke-width="14.0"/><line x1="300.0" y1="274.0" x2="510.0" y2="274.0" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/><circle cx="300.0" cy="274.0" r="5.0" fill="#0f172a"/><text x="310.0" y="296.0" font-size="14" fill="#0f172a" font-weight="bold">(400, 300)</text><rect x="387.0" y="250.0" width="96.0" height="20.0" rx="4" fill="#ffffff"/><text x="435.0" y="265.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">r = 300</text><text x="300.0" y="115.6" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">a ≈ 424.26</text><circle cx="151.6" cy="125.6" r="5.0" fill="#0f172a"/><text x="141.6" y="119.6" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold">(188, 88)</text><circle cx="448.6" cy="422.6" r="5.0" fill="#0f172a"/><text x="458.6" y="440.6" font-size="14" fill="#0f172a">(612.26, 512.26)</text><text x="25.6" y="79.4" font-size="14" fill="#475569">(0, 0)</text><text x="574.4" y="477.0" font-size="14" fill="#475569" text-anchor="end">(800, 600)</text><rect x="600.0" y="64.0" width="180.0" height="420.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="614.0" y="92.0" font-size="16" fill="#0f172a" font-weight="bold">ทำไม a = r√2</text><text x="614.0" y="122.0" font-size="14" fill="#475569">เส้นทแยงของสี่เหลี่ยม</text><text x="614.0" y="144.0" font-size="14" fill="#475569">= เส้นผ่านศูนย์กลาง 2r</text><text x="614.0" y="166.0" font-size="15" fill="#0f172a" font-weight="bold">a² + a² = (2r)²</text><text x="614.0" y="188.0" font-size="15" fill="#2563eb" font-weight="bold">a = r√2 = 2√(r²/2)</text><text x="614.0" y="216.0" font-size="14" fill="#475569">r = 300 →</text><text x="614.0" y="238.0" font-size="15" fill="#2563eb" font-weight="bold">a ≈ 424.26</text><text x="614.0" y="260.0" font-size="15" fill="#0f172a" font-weight="bold">a//2 = 212.0</text><text x="614.0" y="282.0" font-size="14" fill="#475569">(ค่าจริง 212.13)</text><text x="614.0" y="310.0" font-size="14" fill="#475569">มุมบนซ้าย</text><text x="614.0" y="332.0" font-size="14" fill="#0f172a">(400 − 212, 300 − 212)</text><text x="614.0" y="354.0" font-size="15" fill="#0f172a" font-weight="bold">= (188.0, 88.0)</text><text x="614.0" y="382.0" font-size="14" fill="#475569">พื้นที่ a² = 2r²</text><text x="614.0" y="404.0" font-size="15" fill="#0f172a" font-weight="bold">= 180,000</text><text x="400.0" y="520.0" font-size="14" fill="#475569" text-anchor="middle">ลำดับการวาด: พื้นหลัง → วงกลมเขียว → สี่เหลี่ยมน้ำเงิน → เส้นทแยงแดงหนา 20 (วาดทีหลังทับของก่อน)</text></svg>