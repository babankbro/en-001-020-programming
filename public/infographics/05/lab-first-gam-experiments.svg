<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1210" width="800" height="1210" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ทดลองแก้ first_gam.py ทีละจุด (ข้อ 4)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: แก้แต่ละบรรทัดแล้วจอเปลี่ยนอย่างไร — ทายก่อน แล้วรันเทียบ</text><text x="30.0" y="112.0" font-size="16" fill="#475569" font-weight="bold">จอย่อสเกล 0.25 (800×600 → 200×150) · แก้ทีละข้อแล้วแก้กลับทุกครั้ง</text><rect x="20.0" y="130.0" width="760.0" height="176.0" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/><text x="36.0" y="162.0" font-size="17" fill="#0f172a" font-weight="bold">ต้นฉบับ</text><text x="36.0" y="192.0" font-size="15" fill="#0f172a">ลำดับ: circle → rect</text><text x="36.0" y="216.0" font-size="15" fill="#0f172a">→ line → line</text><rect x="270.0" y="143.0" width="200.0" height="150.0" rx="0" fill="#000000" stroke="#0f172a" stroke-width="2"/><circle cx="370.0" cy="218.0" r="75.0" fill="#00ff00"/><rect x="317.0" y="165.0" width="106.1" height="106.1" rx="0" fill="#0000ff"/><line x1="317.0" y1="165.0" x2="423.1" y2="271.1" stroke="#ff0000" stroke-width="5.0" stroke-linecap="butt"/><line x1="317.0" y1="271.1" x2="423.1" y2="165.0" stroke="#ff0000" stroke-width="5.0" stroke-linecap="butt"/><line x1="486.0" y1="218.0" x2="512.0" y2="218.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><text x="524.0" y="182.0" font-size="15" fill="#0f172a" font-weight="bold">รูปซ้อนกันตามลำดับที่วาด</text><text x="524.0" y="208.0" font-size="15" fill="#0f172a">สิ่งที่วาดทีหลังอยู่ด้านบน</text><rect x="20.0" y="320.0" width="760.0" height="176.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="36.0" y="352.0" font-size="17" fill="#d97706" font-weight="bold">① ย้าย draw.circle</text><text x="36.0" y="382.0" font-size="15" fill="#0f172a">ไปไว้หลัง draw.line</text><text x="36.0" y="406.0" font-size="15" fill="#0f172a">ทั้งสองเส้น</text><rect x="270.0" y="333.0" width="200.0" height="150.0" rx="0" fill="#000000" stroke="#0f172a" stroke-width="2"/><rect x="317.0" y="355.0" width="106.1" height="106.1" rx="0" fill="#0000ff"/><line x1="317.0" y1="355.0" x2="423.1" y2="461.1" stroke="#ff0000" stroke-width="5.0" stroke-linecap="butt"/><line x1="317.0" y1="461.1" x2="423.1" y2="355.0" stroke="#ff0000" stroke-width="5.0" stroke-linecap="butt"/><circle cx="370.0" cy="408.0" r="75.0" fill="#00ff00"/><line x1="486.0" y1="408.0" x2="512.0" y2="408.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><text x="524.0" y="372.0" font-size="15" fill="#d97706" font-weight="bold">วงกลมเขียวทับทุกอย่าง</text><text x="524.0" y="398.0" font-size="15" fill="#0f172a">เห็นวงกลมเขียวล้วน</text><text x="524.0" y="424.0" font-size="15" fill="#0f172a">เหลือปลายเส้นแดงจิ๋วที่ 4 มุม</text><rect x="20.0" y="510.0" width="760.0" height="176.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="542.0" font-size="17" fill="#dc2626" font-weight="bold">② ลบ display.flip()</text><text x="36.0" y="572.0" font-size="15" fill="#0f172a">วาดลงหน้าจอสำรอง</text><text x="36.0" y="596.0" font-size="15" fill="#0f172a">แต่ไม่สั่งแสดง</text><rect x="270.0" y="523.0" width="200.0" height="150.0" rx="0" fill="#000000" stroke="#0f172a" stroke-width="2"/><line x1="486.0" y1="598.0" x2="512.0" y2="598.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><text x="524.0" y="562.0" font-size="15" fill="#dc2626" font-weight="bold">หน้าต่างดำ ไม่เห็นรูปใดเลย</text><text x="524.0" y="588.0" font-size="15" fill="#0f172a">เพราะภาพที่วาดไม่ถูก</text><text x="524.0" y="614.0" font-size="15" fill="#0f172a">ส่งขึ้นจอ</text><rect x="20.0" y="700.0" width="760.0" height="176.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="36.0" y="732.0" font-size="17" fill="#7c3aed" font-weight="bold">③ tick(60) → tick(2)</text><text x="36.0" y="762.0" font-size="15" fill="#0f172a">วงวนทำงาน</text><text x="36.0" y="786.0" font-size="15" fill="#0f172a">2 รอบ/วินาที</text><rect x="270.0" y="713.0" width="200.0" height="150.0" rx="0" fill="#000000" stroke="#0f172a" stroke-width="2"/><circle cx="370.0" cy="788.0" r="75.0" fill="#00ff00"/><rect x="317.0" y="735.0" width="106.1" height="106.1" rx="0" fill="#0000ff"/><line x1="317.0" y1="735.0" x2="423.1" y2="841.1" stroke="#ff0000" stroke-width="5.0" stroke-linecap="butt"/><line x1="317.0" y1="841.1" x2="423.1" y2="735.0" stroke="#ff0000" stroke-width="5.0" stroke-linecap="butt"/><line x1="486.0" y1="788.0" x2="512.0" y2="788.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><text x="524.0" y="752.0" font-size="15" fill="#7c3aed" font-weight="bold">ภาพเหมือนเดิม (ไม่มีอะไรขยับ)</text><text x="524.0" y="778.0" font-size="15" fill="#0f172a">แต่กดปิดแล้วตอบสนองช้า</text><text x="524.0" y="804.0" font-size="15" fill="#0f172a">รอได้ถึง ~0.5 วินาที</text><text x="30.0" y="906.0" font-size="18" fill="#0f172a" font-weight="bold">ข้อผิดพลาดที่พบบ่อยในส่วนที่ 1 และวิธีแก้</text><rect x="20.0" y="922.0" width="372.0" height="150.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="952.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ไม่มีวงวนรับเหตุการณ์</text><text x="36.0" y="976.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">while running:</text><text x="36.0" y="1000.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    screen.fill(BLACK)</text><text x="36.0" y="1024.0" font-size="15" fill="#0f172a">(ไม่มี event.get()) หน้าต่าง "ไม่ตอบสนอง"</text><text x="36.0" y="1048.0" font-size="15" fill="#0f172a">กดปิดไม่ได้ ต้อง Ctrl+C ใน Terminal</text><rect x="408.0" y="922.0" width="372.0" height="150.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="952.0" font-size="17" fill="#059669" font-weight="bold">✓ ทุกเฟรมต้องรับเหตุการณ์ก่อน</text><text x="424.0" y="976.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for event in pygame.event.get():</text><text x="424.0" y="1000.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if event.type == pygame.QUIT:</text><text x="424.0" y="1024.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">        running = False</text><text x="424.0" y="1048.0" font-size="15" fill="#0f172a">ปิดหน้าต่างแล้วโปรแกรมจบ</text><rect x="20.0" y="1088.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="1118.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ใช้ WIDTH แทน HEIGHT</text><text x="36.0" y="1142.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">circle_radius = WIDTH//2</text><text x="36.0" y="1166.0" font-size="15" fill="#0f172a">r = 400 วงกลมสูง 800 ล้นจอบน–ล่าง</text><rect x="408.0" y="1088.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1118.0" font-size="17" fill="#059669" font-weight="bold">✓ ค่าที่ถูกจาก geo_check.py</text><text x="424.0" y="1142.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">circle_radius = HEIGHT//2</text><text x="424.0" y="1166.0" font-size="15" fill="#0f172a">r = 300 มุมสี่เหลี่ยม (188.0, 88.0)</text></svg>