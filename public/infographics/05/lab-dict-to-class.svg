<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 910" width="800" height="910" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ย้ายจากพจนานุกรมเป็นคลาส Ball (ขั้นตอนที่ 6)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: แต่ละส่วนของ ball_sim.py ย้ายไปอยู่ตรงไหนใน ball.py และวงวนเกมสั้นลงอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">แบบพจนานุกรม (ขั้นตอนที่ 5)</text><rect x="389.9" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="423.9" y="116.0" font-size="15" fill="#0f172a">แบบคลาส (ขั้นตอนที่ 6)</text><rect x="20.0" y="148.0" width="360.0" height="44.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="200.0" y="177.0" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball_sim.py</text><rect x="420.0" y="148.0" width="360.0" height="44.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="177.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball.py + ball_sim_v2.py</text><circle cx="34.0" cy="238.0" r="13.0" fill="#0f172a"/><text x="34.0" y="243.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="54.0" y="244.0" font-size="16" fill="#0f172a" font-weight="bold">สร้างข้อมูล</text><rect x="150.0" y="216.0" width="250.0" height="46.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="245.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball = {"x": 400, ...}</text><line x1="404.0" y1="239.0" x2="436.0" y2="239.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="440.0" y="216.0" width="340.0" height="46.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="245.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball = Ball(400, 100, 3, 0, 15, RED)</text><circle cx="34.0" cy="298.0" r="13.0" fill="#0f172a"/><text x="34.0" y="303.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="54.0" y="304.0" font-size="16" fill="#0f172a" font-weight="bold">อ่าน/แก้ค่า</text><rect x="150.0" y="276.0" width="250.0" height="46.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="305.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball["x"] += ball["vx"]</text><line x1="404.0" y1="299.0" x2="436.0" y2="299.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="440.0" y="276.0" width="340.0" height="46.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="305.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">self.x += self.vx</text><circle cx="34.0" cy="358.0" r="13.0" fill="#0f172a"/><text x="34.0" y="363.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="54.0" y="364.0" font-size="16" fill="#0f172a" font-weight="bold">เคลื่อนที่</text><rect x="150.0" y="336.0" width="250.0" height="46.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="365.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">move_ball(ball)</text><line x1="404.0" y1="359.0" x2="436.0" y2="359.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="440.0" y="336.0" width="340.0" height="46.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="365.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball.move()</text><circle cx="34.0" cy="418.0" r="13.0" fill="#0f172a"/><text x="34.0" y="423.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="54.0" y="424.0" font-size="16" fill="#0f172a" font-weight="bold">วาด</text><rect x="150.0" y="396.0" width="250.0" height="46.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="425.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">draw_ball(screen, ball)</text><line x1="404.0" y1="419.0" x2="436.0" y2="419.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="440.0" y="396.0" width="340.0" height="46.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="425.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ball.draw(screen)</text><circle cx="34.0" cy="478.0" r="13.0" fill="#0f172a"/><text x="34.0" y="483.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="54.0" y="484.0" font-size="16" fill="#0f172a" font-weight="bold">ค่าคงที่</text><rect x="150.0" y="456.0" width="250.0" height="46.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="485.0" font-size="15" fill="#0f172a">อยู่ใน ball_sim.py</text><line x1="404.0" y1="479.0" x2="436.0" y2="479.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="440.0" y="456.0" width="340.0" height="46.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="485.0" font-size="15" fill="#0f172a">อยู่หัวแฟ้ม ball.py → import ได้</text><rect x="20.0" y="520.0" width="760.0" height="56.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="400.0" y="554.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">ผลบนจอเหมือนขั้นตอนที่ 5 ทุกประการ — วงวนเกมเหลือ ball.move() + ball.draw(screen)</text><text x="30.0" y="606.0" font-size="18" fill="#0f172a" font-weight="bold">ข้อผิดพลาดที่พบบ่อยในขั้นตอนที่ 6 และวิธีแก้</text><rect x="20.0" y="622.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="652.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ตั้งชื่อแฟ้มอื่น เช่น ball1.py, my_ball.py</text><text x="36.0" y="676.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">from ball import Ball</text><text x="36.0" y="700.0" font-size="15" fill="#0f172a">ModuleNotFoundError: No module</text><text x="36.0" y="724.0" font-size="15" fill="#0f172a">named 'ball'</text><rect x="408.0" y="622.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="652.0" font-size="17" fill="#059669" font-weight="bold">✓ ใช้ชื่อ ball.py เท่านั้น</text><text x="424.0" y="676.0" font-size="15" fill="#0f172a">ball.py อยู่โฟลเดอร์เดียวกับ ball_sim_v2.py</text><text x="424.0" y="700.0" font-size="15" fill="#0f172a">แล้วรันจากโฟลเดอร์ Lab05_&lt;รหัส&gt;</text><rect x="20.0" y="764.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="794.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ลืม self. ในเมท็อด</text><text x="36.0" y="818.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">x += vx</text><text x="36.0" y="842.0" font-size="15" fill="#0f172a">UnboundLocalError: x ยังไม่มีค่า</text><text x="36.0" y="866.0" font-size="15" fill="#0f172a">เพราะ x ในเมท็อดไม่ใช่ self.x</text><rect x="408.0" y="764.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="794.0" font-size="17" fill="#059669" font-weight="bold">✓ ทุกค่าของลูกบอลอ้างผ่าน self</text><text x="424.0" y="818.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">self.x += self.vx</text><text x="424.0" y="842.0" font-size="15" fill="#0f172a">ค่าถูกเก็บในวัตถุ ใช้ต่อเฟรมถัดไป</text></svg>