<text x="422.0" y="806.0" font-size="18" fill="#059669" text-anchor="start" font-weight="bold">✓</text>
<text x="72.0" y="806.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">draw → fill → flip</tspan><tspan fill="#0f172a"> (จอเป็นสีพื้น)</tspan></text>
<text x="444.0" y="806.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">fill → draw → flip</tspan></text>
<rect x="36.0" y="832.0" width="356.0" height="44.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<rect x="408.0" y="832.0" width="356.0" height="44.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="50.0" y="860.0" font-size="18" fill="#dc2626" text-anchor="start" font-weight="bold">✗</text>
<text x="422.0" y="860.0" font-size="18" fill="#059669" text-anchor="start" font-weight="bold">✓</text>
<text x="72.0" y="860.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">สี่เหลี่ยม: x - size &lt;= 0</tspan></text>
<text x="444.0" y="860.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">สี่เหลี่ยม: x &lt;= 0</tspan><tspan fill="#0f172a"> (มุมบนซ้าย)</tspan></text>
