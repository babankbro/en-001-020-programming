<line x1="470.0" y1="322.0" x2="550.0" y2="282.0" stroke="#059669" stroke-width="2"/>
<line x1="330.0" y1="370.0" x2="250.0" y2="412.0" stroke="#d97706" stroke-width="2"/>
<line x1="470.0" y1="370.0" x2="550.0" y2="412.0" stroke="#dc2626" stroke-width="2"/>
<line x1="400.0" y1="378.0" x2="400.0" y2="600.0" stroke="#7c3aed" stroke-width="2"/>
<text x="150.0" y="304.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">① เวที: วนทุกเฟรม</text>
<text x="650.0" y="304.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">② วาดสิ่งที่เห็น</text>
<text x="150.0" y="396.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">③ ฟิสิกส์ในขั้น update</text>
<text x="650.0" y="396.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">④ ตรวจชนหลังขยับ</text>
<text x="410.0" y="590.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold">⑤ จัดทุกอย่างเป็นวัตถุ</text>
<rect x="20.0" y="734.0" width="760.0" height="154.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36.0" y="762.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">จุดที่มักผิด</text>
<rect x="36.0" y="778.0" width="356.0" height="44.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
