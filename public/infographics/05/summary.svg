<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="38.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">บทที่ 5 Pygame และการจำลองฟิสิกส์ — แผนที่แนวคิด</text><line x1="400.0" y1="285.0" x2="147.0" y2="129.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="653.0" y2="129.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="147.0" y2="454.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="653.0" y2="454.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="400.0" y2="504.0" stroke="#cbd5e1" stroke-width="2"/><rect x="22.0" y="70.0" width="250.0" height="118.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="34.0" y="96.0" font-size="16" fill="#2563eb" font-weight="bold">1. วงวนเกม + พิกัดจอ</text><text x="36.0" y="122.0" font-size="14" fill="#0f172a">• event→fill→update→draw→flip→tick</text><text x="36.0" y="144.0" font-size="14" fill="#0f172a">• clock.tick(60): 1 เฟรม ≈ 16.7 ms</text><text x="36.0" y="166.0" font-size="14" fill="#0f172a">• (0,0) มุมบนซ้าย, แกน y ชี้ลง</text><rect x="528.0" y="70.0" width="250.0" height="118.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="540.0" y="96.0" font-size="16" fill="#059669" font-weight="bold">2. วาดรูปทรง</text><text x="542.0" y="122.0" font-size="14" fill="#0f172a">• circle ใช้จุดศูนย์กลาง</text><text x="542.0" y="144.0" font-size="14" fill="#0f172a">• rect ใช้มุมบนซ้าย (x, y, w, h)</text><text x="542.0" y="166.0" font-size="14" fill="#0f172a">• แนบใน: a = r√2 ≈ 424.26</text><rect x="22.0" y="395.0" width="250.0" height="118.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="34.0" y="421.0" font-size="16" fill="#d97706" font-weight="bold">3. ออยเลอร์ + ความโน้มถ่วง</text><text x="36.0" y="447.0" font-size="14" fill="#0f172a">• x += vx, y += vy (ก่อน)</text><text x="36.0" y="469.0" font-size="14" fill="#0f172a">• vy += GRAVITY (0.1)</text><text x="36.0" y="491.0" font-size="14" fill="#0f172a">• v *= 0.999 ทุกเฟรม</text><rect x="528.0" y="395.0" width="250.0" height="118.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="540.0" y="421.0" font-size="16" fill="#dc2626" font-weight="bold">4. ชนขอบ + การหน่วง</text><text x="542.0" y="447.0" font-size="14" fill="#0f172a">• ชนซ้าย/ขวา กลับ vx</text><text x="542.0" y="469.0" font-size="14" fill="#0f172a">• ชนพื้น กลับ vy × 0.9</text><text x="542.0" y="491.0" font-size="14" fill="#0f172a">• วางกลับ y = H − r กันติด</text><rect x="275.0" y="445.0" width="250.0" height="118.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="287.0" y="471.0" font-size="16" fill="#7c3aed" font-weight="bold">5. คลาสและสไปรต์</text><text x="289.0" y="497.0" font-size="14" fill="#0f172a">• dict → class Ball (self)</text><text x="289.0" y="519.0" font-size="14" fill="#0f172a">• 100 ลูก: for i in range(N)</text><text x="289.0" y="541.0" font-size="14" fill="#0f172a">• Dog(Sprite): image, rect, update</text><rect x="280.0" y="237.0" width="240.0" height="96.0" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="400.0" y="273.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">เกมลูกบอลเด้ง</text><text x="400.0" y="299.0" font-size="14" fill="#475569" text-anchor="middle">วนซ้ำทีละเฟรม: อัปเดต → วาด</text><text x="400.0" y="321.0" font-size="14" fill="#475569" text-anchor="middle">ต่อยอดเป็นยานอวกาศ บทที่ 6–8</text></svg>