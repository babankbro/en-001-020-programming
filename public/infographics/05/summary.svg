<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 904" width="800" height="904" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="400.0" y="38.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">แผนที่แนวคิด บท 05: Pygame และการจำลองฟิสิกส์</text>
<rect x="20.0" y="52.0" width="760.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="126.5" y="74.0" font-size="15" text-anchor="start"><tspan fill="#475569" font-weight="bold">ภาพนี้ตอบคำถามว่า: </tspan><tspan fill="#0f172a">5 หัวข้อเชื่อมกันอย่างไรในเกมลูกบอลเด้ง และแต่ละหัวข้อต้องจำตัวเลขอะไร</tspan></text>
<text x="77.9" y="113.0" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีกล่อง:</text>
<rect x="161.4" y="101.0" width="18.0" height="14.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="185.4" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">1 วงวน/พิกัด</text>
<rect x="284.9" y="101.0" width="18.0" height="14.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="308.9" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">2 วาด/สี</text>
<rect x="374.9" y="101.0" width="18.0" height="14.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="398.9" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">3 ออยเลอร์</text>
<rect x="490.9" y="101.0" width="18.0" height="14.0" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="514.9" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">4 ชนขอบ</text>
<rect x="590.2" y="101.0" width="18.0" height="14.0" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="614.2" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">5 คลาส/สไปรต์</text>
<rect x="20.0" y="132.0" width="372.0" height="150.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="42.0" cy="156.0" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="161.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="62.0" y="162.0" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">วงวนเกม + พิกัดจอ</text>
<text x="38.0" y="190.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">event→fill→update→draw→flip→tick</tspan></text>
<text x="38.0" y="215.0" font-size="15" fill="#0f172a" text-anchor="start">60 FPS → 1000/60 ≈ 16.7 ms ต่อเฟรม</text>
<text x="38.0" y="240.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">FRAME_LIMIT 600 ÷ 60 = </tspan><tspan fill="#2563eb" font-weight="bold">10 วินาที</tspan></text>
<text x="38.0" y="265.0" font-size="15" fill="#0f172a" text-anchor="start">(0, 0) มุมบนซ้าย · y ชี้ลง</text>
<rect x="408.0" y="132.0" width="372.0" height="150.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="430.0" cy="156.0" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="161.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="450.0" y="162.0" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">วาดรูปทรงและสี RGB</text>
<text x="426.0" y="190.0" font-size="15" fill="#0f172a" text-anchor="start">circle ใช้ศูนย์กลาง · rect ใช้มุมบนซ้าย</text>
<text x="426.0" y="215.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">แนบใน r = 300: a = r√2 ≈ </tspan><tspan fill="#059669" font-weight="bold">424.26</tspan></text>
<text x="426.0" y="240.0" font-size="15" fill="#0f172a" text-anchor="start">มุมบนซ้าย (400−212, 300−212) = (188, 88)</text>
<text x="426.0" y="265.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">เหลือง </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(255, 255, 0)</tspan><tspan fill="#0f172a"> = แดง + เขียว</tspan></text>
<rect x="290.0" y="314.0" width="220.0" height="64.0" rx="32" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="342.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">เกมลูกบอลเด้ง</text>
<text x="400.0" y="366.0" font-size="15" fill="#475569" text-anchor="middle">ทำซ้ำทุกเฟรม</text>
<rect x="20.0" y="412.0" width="372.0" height="150.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="42.0" cy="436.0" r="13" fill="#d97706" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="441.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="62.0" y="442.0" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">ออยเลอร์ + ความโน้มถ่วง</text>
<text x="38.0" y="470.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">x += vx; y += vy</tspan><tspan fill="#0f172a"> ก่อน</tspan></text>
<text x="38.0" y="495.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">vy += 0.1</tspan><tspan fill="#0f172a"> แล้ว </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">*= 0.999</tspan></text>
<text x="38.0" y="520.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">เฟรม 1: y = </tspan><tspan fill="#d97706" font-weight="bold">100</tspan><tspan fill="#0f172a">, vy = 0.0999</tspan></text>
<text x="38.0" y="545.0" font-size="15" fill="#0f172a" text-anchor="start">ความเร่งคงที่ → เส้นทางพาราโบลา</text>
<rect x="408.0" y="412.0" width="372.0" height="150.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="430.0" cy="436.0" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="441.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="450.0" y="442.0" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">ชนขอบ + การหน่วง</text>
<text x="426.0" y="470.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">y + r &gt;= 600</tspan><tspan fill="#0f172a"> → vy = −vy × 0.9</tspan></text>
<text x="426.0" y="495.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">vy 5 → </tspan><tspan fill="#dc2626" font-weight="bold">−4.5</tspan><tspan fill="#0f172a"> · วางกลับ y = 580</tspan></text>
<text x="426.0" y="520.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">สี่เหลี่ยม: </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">x &lt;= 0 or x + size &gt;= W</tspan></text>
<text x="426.0" y="545.0" font-size="15" fill="#0f172a" text-anchor="start">ไม่วางกลับ → สั่นติดพื้น</text>
<rect x="20.0" y="600.0" width="760.0" height="116.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="42.0" cy="624.0" r="13" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="629.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="62.0" y="630.0" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="bold">จากพจนานุกรมสู่คลาสและสไปรต์</text>
<text x="38.0" y="658.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">Ball(400, 100, 3, 0, 15, RED)</tspan><tspan fill="#0f172a"> → __init__ เก็บค่าใน self · </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">3 * (-1)**i</tspan><tspan fill="#0f172a"> สลับ ±3</tspan></text>
<text x="38.0" y="683.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">class Dog(pygame.sprite.Sprite)</tspan><tspan fill="#0f172a"> + </tspan><tspan fill="#7c3aed" font-weight="bold" font-family="Consolas, 'Courier New', monospace">super().__init__()</tspan><tspan fill="#0f172a"> · ต้องมี image, rect, update()</tspan></text>
<text x="38.0" y="708.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">group.update() / group.draw(screen)</tspan><tspan fill="#0f172a"> · flip / scale / rotate จาก original_image</tspan></text>
