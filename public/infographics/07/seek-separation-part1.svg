<text x="488" y="294" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold">normalize() หารด้วยขนาด</text>
<text x="488" y="317" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(300 ÷ 500, −400 ÷ 500)</text>
