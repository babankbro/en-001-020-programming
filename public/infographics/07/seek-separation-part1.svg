<text x="590" y="846" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(206.36, 499.52)</text>
<text x="58" y="882" font-size="15" fill="#475569" text-anchor="start">เร่งทีละ 0.1 → จากนิ่งถึง max_speed = 3 ใช้ 3 ÷ 0.1 = 30 เฟรม (เกินจะถูก scale_to_length(3))</text>
<rect x="40" y="912" width="350" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="938" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ ลืม normalize หรือสลับลำดับลบ</text>
<text x="54" y="966" font-size="15" fill="#0f172a" text-anchor="start">direction × 0.1 = (30, −40) ขนาด 50 ต่อเฟรม!</text>
<text x="54" y="992" font-size="15" fill="#0f172a" text-anchor="start">self.pos − player = (−300, 400) → หนี</text>
<rect x="410" y="912" width="350" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="424" y="938" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ (ผู้เล่น − ตัวเอง) → normalize → × 0.1</text>
<text x="424" y="966" font-size="15" fill="#0f172a" text-anchor="start">ได้ (0.06, −0.08) ขนาด 0.1 เสมอ</text>
<text x="424" y="992" font-size="15" fill="#0f172a" text-anchor="start">ไม่ว่าจะอยู่ห่างผู้เล่นเท่าใด</text>
