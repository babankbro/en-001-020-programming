<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" width="800" height="1040" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="เวกเตอร์ไล่ตามจากศัตรู (200, 500) ไปผู้เล่น (500, 100) normalize แล้วคูณ 0.1 ได้ (0.06, −0.08)">
