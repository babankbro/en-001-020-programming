<text x="422" y="979" font-size="15" fill="#0f172a" text-anchor="start">diff = (20 − 350) % 360 = 30</text>
<text x="422" y="1001" font-size="15" fill="#0f172a" text-anchor="start">angle = 350 + 30 × 0.15 = 354.5000</text>
<text x="422" y="1023" font-size="15" fill="#0f172a" text-anchor="start">→ หมุนบวก 30° (ทางสั้น)</text>
