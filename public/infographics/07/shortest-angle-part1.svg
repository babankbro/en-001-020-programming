<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="800" height="920" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="วงล้อมุมแสดงทางสั้น +20 องศาจาก 170 ไป −170 เทียบกับทางยาว −340 องศา">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>วงล้อมุมแสดงทางสั้น +20 องศาจาก 170 ไป −170 เทียบกับทางยาว −340 องศา</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">หมุนทางที่สั้นที่สุด (ตอนที่ 1): % 360 แล้วเลือกฝั่ง</text>
<text x="400" y="65" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า ยานหันอยู่ 170° จะหมุนไป −170° ทางไหนจึงสั้นที่สุด</text>
<circle cx="240" cy="290" r="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="90" y1="290" x2="390" y2="290" stroke="#e2e8f0" stroke-width="1"/>
<line x1="240" y1="140" x2="240" y2="440" stroke="#e2e8f0" stroke-width="1"/>
<text x="100" y="295" font-size="15" fill="#475569" text-anchor="start">180°</text>
<text x="400" y="295" font-size="15" fill="#475569" text-anchor="start">0°</text>
<text x="240" y="130" font-size="15" fill="#475569" text-anchor="middle">90°</text>
<text x="240" y="462" font-size="15" fill="#475569" text-anchor="middle">−90°</text>
<path d="M163.18,276.46 A78,78 0 1 1 165.02,311.50" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
<path d="M78.49,261.52 A164,164 0 0 0 77.60,312.82" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrG)"/>
<line x1="240" y1="290" x2="96.2181" y2="264.647" stroke="#2563eb" stroke-width="3.2"/>
<line x1="240" y1="290" x2="96.2181" y2="315.353" stroke="#d97706" stroke-width="3.2"/>
<circle cx="240.00" cy="290.00" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="137.58" cy="271.941" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="137.58" y="277.441" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="137.58" cy="308.059" r="13" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="137.58" y="313.559" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="262" cy="390" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="262" y="395.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="280" y="395" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">−340° ทางยาว ✗</text>
<circle cx="48" cy="290" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="48" y="295.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="48" y="268" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">+20°</text>
<text x="40" y="484" font-size="15" fill="#475569" text-anchor="start">มุมวัดทวนเข็มนาฬิกา (ตรงกับทิศ (cos θ, −sin θ) ในเกม)</text>
<line x1="40" y1="507" x2="64" y2="507" stroke="#2563eb" stroke-width="3"/>
<text x="70" y="512" font-size="15" fill="#0f172a" text-anchor="start">① ปัจจุบัน 170°</text>
<line x1="40" y1="531" x2="64" y2="531" stroke="#d97706" stroke-width="3"/>
<text x="70" y="536" font-size="15" fill="#0f172a" text-anchor="start">② เป้าหมาย −170° (= 190°)</text>
<line x1="270" y1="507" x2="294" y2="507" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
<text x="300" y="512" font-size="15" fill="#0f172a" text-anchor="start">③ ทางยาว −340°</text>
<line x1="270" y1="531" x2="294" y2="531" stroke="#059669" stroke-width="3"/>
<text x="300" y="536" font-size="15" fill="#0f172a" text-anchor="start">④ ทางสั้น +20°</text>
<rect x="440" y="98" width="342" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="440" cy="98" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="440" y="103.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="458" y="121" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">angle ปัจจุบัน</text>
<text x="458" y="145" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">170</text>
<rect x="440" y="164" width="342" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="440" cy="164" r="13" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="440" y="169.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="458" y="187" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">target เป้าหมาย</text>
<text x="458" y="211" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−170</text>
<rect x="440" y="230" width="342" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="440" cy="230" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="440" y="235.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="458" y="253" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">ลบตรง ๆ: target − angle</text>
<text x="458" y="277" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−170 − 170 = −340</text>
<rect x="440" y="296" width="342" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="440" cy="296" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="440" y="301.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="458" y="319" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">บีบเข้า [0, 360): % 360</text>
<text x="458" y="343" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(−340) % 360 = 20</text>
<rect x="440" y="362" width="342" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="440" cy="362" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="440" y="367.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="458" y="385" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">20 &gt; 180 ? → ไม่ จึงคงไว้</text>
<text x="458" y="409" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">angle_diff = +20</text>
<rect x="440" y="434" width="342" height="82" rx="12" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="611" y="471" font-size="15" fill="#ffffff" text-anchor="middle">คำตอบ: angle_diff = +20</text>
<text x="611" y="495" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">หมุนบวก 20° (ทางสั้น)</text>
<rect x="40" y="560" width="720" height="182" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="56" y="586" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ตัวอย่างเพิ่ม: ถ้าผล % 360 เกิน 180 ให้ลบ 360</text>
<text x="56" y="614" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">angle → target</text>
<text x="176" y="614" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">target − angle</text>
<text x="300" y="614" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">% 360</text>
<text x="430" y="614" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">&gt; 180 ?</text>
<text x="560" y="614" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">angle_diff</text>
<line x1="50" y1="622" x2="750" y2="622" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="646" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10 → 350</text>
<text x="176" y="646" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">340</text>
<text x="300" y="646" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">340</text>
<text x="430" y="646" font-size="15" fill="#dc2626" text-anchor="start">ใช่ → −360</text>
<text x="560" y="646" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">−20</text>
<text x="56" y="671" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0 → −90</text>
<text x="176" y="671" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−90</text>
<text x="300" y="671" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">270</text>
<text x="430" y="671" font-size="15" fill="#dc2626" text-anchor="start">ใช่ → −360</text>
<text x="560" y="671" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">−90</text>
<text x="56" y="696" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−30 → 200</text>
<text x="176" y="696" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">230</text>
<text x="300" y="696" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">230</text>
<text x="430" y="696" font-size="15" fill="#dc2626" text-anchor="start">ใช่ → −360</text>
<text x="560" y="696" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">−130</text>
<text x="56" y="721" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0 → 180</text>
<text x="176" y="721" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">180</text>
<text x="300" y="721" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">180</text>
<text x="430" y="721" font-size="15" fill="#0f172a" text-anchor="start">ไม่</text>
<text x="560" y="721" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">+180  (ครึ่งรอบพอดี ไม่ลบ)</text>
<rect x="40" y="762" width="350" height="136" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="788" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ ใช้ผลต่างมุมตรง ๆ</text>
<text x="54" y="815" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">angle_diff = target - angle</text>
<text x="54" y="840" font-size="15" fill="#0f172a" text-anchor="start">= −340 → ยานหมุนเกือบรอบ (340°)</text>
<text x="54" y="865" font-size="15" fill="#0f172a" text-anchor="start">ทั้งที่สองทิศห่างกันแค่ 20°</text>
<rect x="410" y="762" width="350" height="136" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="424" y="788" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ % 360 แล้วลบ 360 ถ้าเกิน 180</text>
<text x="424" y="815" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(target - angle) % 360</text>
<text x="424" y="840" font-size="15" fill="#0f172a" text-anchor="start">ผลอยู่ในช่วง (−180, 180] เสมอ</text>
<text x="424" y="865" font-size="15" fill="#0f172a" text-anchor="start">= ทางที่สั้นที่สุด → +20°</text>
</svg>