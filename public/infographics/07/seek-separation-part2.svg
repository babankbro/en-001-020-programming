<line x1="64" y1="296.8" x2="433.6" y2="296.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="56" y="301.8" font-size="15" fill="#475569" text-anchor="end">310</text>
<line x1="64" y1="340.8" x2="433.6" y2="340.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="56" y="345.8" font-size="15" fill="#475569" text-anchor="end">320</text>
<line x1="64" y1="384.8" x2="433.6" y2="384.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="56" y="389.8" font-size="15" fill="#475569" text-anchor="end">330</text>
<line x1="64" y1="428.8" x2="433.6" y2="428.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="56" y="433.8" font-size="15" fill="#475569" text-anchor="end">340</text>
<rect x="94.8" y="230.8" width="132" height="132" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="182.8" y="186.8" width="132.0" height="132.0" rx="2" fill="#fef2f2" fill-opacity="0.7" stroke="#dc2626" stroke-width="1.6"/>
<rect x="182.8" y="230.8" width="44.0" height="88.0" fill="#7c3aed" fill-opacity="0.18"/>
<line x1="160.8" y1="296.8" x2="248.8" y2="252.8" stroke="#0f172a" stroke-width="1.8" stroke-dasharray="5 3"/>
<line x1="248.8" y1="252.8" x2="302.466" y2="225.967" stroke="#059669" stroke-width="3.2" marker-end="url(#arrG)"/>
<line x1="160.8" y1="296.8" x2="107.134" y2="323.633" stroke="#059669" stroke-width="3.2" marker-end="url(#arrG)"/>
<circle cx="248.80" cy="252.80" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="160.80" cy="296.80" r="6" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="256.8" y="276.8" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">ตัวเอง (300, 300)</text>
<text x="160.8" y="384.8" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">อีกตัว (280, 310)</text>
<circle cx="204.8" cy="200" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="204.8" y="205.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="209.2" cy="283.6" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="209.2" y="289.1" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="318.466" cy="219.967" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="318.466" y="225.467" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="64" y="488.4" font-size="15" fill="#475569" text-anchor="start">ลูกศรเขียววาดที่ 1 หน่วย = 60 px · พิกัดจอ y ชี้ลง</text>
<rect x="468" y="104" width="314" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="468" cy="104" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="468" y="109.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="486" y="127" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold">ตรวจชน</text>
<text x="486" y="151" font-size="15" fill="#0f172a" text-anchor="start">colliderect → True (ซ้อนกัน)</text>
<rect x="468" y="178" width="314" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="468" cy="178" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="468" y="183.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="486" y="201" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">push = ตัวเอง − อีกตัว</text>
<text x="486" y="225" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(300 − 280, 300 − 310) = (20, −10)</text>
<rect x="468" y="252" width="314" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
<circle cx="468" cy="252" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="468" y="257.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="486" y="275" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">ขนาด แล้ว normalize</text>
<text x="486" y="299" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">√(20² + 10²) = √500 ≈ 22.36</text>
<text x="486" y="321" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(20, −10) ÷ 22.36 ≈ (0.894, −0.447)</text>
<rect x="468" y="356" width="314" height="80" rx="12" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="625" y="392" font-size="15" fill="#ffffff" text-anchor="middle">คำตอบ: × 0.1 → ความเร่งแยกตัว</text>
<text x="625" y="416" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">ตัวเอง ≈ (0.089, −0.045)</text>
<text x="625" y="460" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">อีกตัวได้ทิศตรงข้าม ≈ (−0.089, 0.045)</text>
<rect x="40" y="500" width="200" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52" y="522" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">คำอธิบายสี</text>
<rect x="54" y="532" width="20" height="16" rx="3" fill="#dc262622" stroke="#dc2626" stroke-width="1.5"/>
<text x="86" y="546" font-size="15" fill="#0f172a" text-anchor="start">ตัวเอง</text>
<rect x="54" y="556" width="20" height="16" rx="3" fill="#d9770622" stroke="#d97706" stroke-width="1.5"/>
<text x="86" y="570" font-size="15" fill="#0f172a" text-anchor="start">อีกตัว</text>
<rect x="54" y="580" width="20" height="16" rx="3" fill="#7c3aed22" stroke="#7c3aed" stroke-width="1.5"/>
<text x="86" y="594" font-size="15" fill="#0f172a" text-anchor="start">ส่วนที่ซ้อนกัน</text>
<line x1="52" y1="613" x2="76" y2="613" stroke="#059669" stroke-width="3"/>
<text x="86" y="618" font-size="15" fill="#0f172a" text-anchor="start">แรงผลัก (ขนาด 0.1)</text>
<rect x="256" y="500" width="526" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="272" y="526" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">ตัวอย่างที่ 2 (แนวนอน): A (520, 400) ชน B (500, 400)</text>
<text x="272" y="554" font-size="15" fill="#0f172a" text-anchor="start">A: push = (20, 0) → (1, 0) × 0.1 = (0.1, 0) ไปขวา</text>
<text x="272" y="580" font-size="15" fill="#0f172a" text-anchor="start">B: push = (−20, 0) → (−1, 0) × 0.1 = (−0.1, 0) ไปซ้าย</text>
<text x="272" y="608" font-size="15" fill="#059669" text-anchor="start">ผลักคนละทิศ ขนาดเท่ากัน → ฝูงไม่รวมเป็นก้อนเดียว</text>
<rect x="40" y="652" width="350" height="132" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="678" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ ไม่กันกรณีเวกเตอร์ศูนย์</text>
<text x="54" y="705" font-size="15" fill="#0f172a" text-anchor="start">ตัดเงื่อนไข other is not self ทิ้ง</text>
<text x="54" y="730" font-size="15" fill="#0f172a" text-anchor="start">ตัวเองชนตัวเอง push = (0, 0)</text>
<text x="54" y="755" font-size="15" fill="#dc2626" text-anchor="start">normalize() → ValueError</text>
<rect x="410" y="652" width="350" height="132" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="424" y="678" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ ตรวจก่อน normalize เสมอ</text>
<text x="424" y="705" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">other is not self</text>
<text x="424" y="730" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">push.length() &gt; 0</text>
<text x="424" y="755" font-size="15" fill="#059669" text-anchor="start">แล้วจึง push.normalize() * 0.1</text>
</svg>