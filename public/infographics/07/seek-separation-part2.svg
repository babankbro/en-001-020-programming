<line x1="64" y1="164.8" x2="433.6" y2="164.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="56" y="169.8" font-size="15" fill="#475569" text-anchor="end">280</text>
<line x1="64" y1="208.8" x2="433.6" y2="208.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="56" y="213.8" font-size="15" fill="#475569" text-anchor="end">290</text>
<line x1="64" y1="252.8" x2="433.6" y2="252.8" stroke="#e2e8f0" stroke-width="1"/>
