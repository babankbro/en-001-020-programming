<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs><marker id="a_2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a_d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a_475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a_0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">แผนที่แนวคิดบทที่ 7: การเคลื่อนที่และพฤติกรรมศัตรู</text>
<text x="400" y="62" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal">ทุกหัวข้อคือเวกเตอร์ Vector2 ที่ถูกคำนวณใหม่ทุกเฟรม</text>
<line x1="400" y1="283" x2="140" y2="149" stroke="#2563eb" stroke-width="2"/>
<line x1="400" y1="283" x2="660" y2="149" stroke="#7c3aed" stroke-width="2"/>
<line x1="400" y1="283" x2="140" y2="389" stroke="#d97706" stroke-width="2"/>
<line x1="400" y1="283" x2="660" y2="389" stroke="#dc2626" stroke-width="2"/>
<line x1="400" y1="283" x2="400" y2="479" stroke="#059669" stroke-width="2"/>
<rect x="280" y="235" width="240" height="96" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="400" y="271" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">บทที่ 7</text>
<text x="400" y="297" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal">ทำให้วัตถุในเกม "คิดเองได้"</text>
<text x="400" y="319" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" font-family="Consolas, 'Courier New', monospace">pos (float) → rect (int)</text>
<rect x="20" y="90" width="240" height="118" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="34" y="118" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">1. แรงเสียดทาน</text>
<text x="34" y="144" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">velocity *= 0.97 ทุกเฟรม</text>
<text x="34" y="166" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">vₙ = 5 × 0.97ⁿ  ต่ำกว่า 1 ที่ n = 53</text>
<text x="34" y="188" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">ระยะสูงสุด 5 / 0.03 ≈ 166.7</text>
<rect x="540" y="90" width="240" height="118" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="554" y="118" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="bold">2. มอดูลและ config.py</text>
<text x="554" y="144" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">SCREEN_WIDTH = 1200</text>
<text x="554" y="166" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">from config import *</text>
<text x="554" y="188" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">แก้ที่เดียว เปลี่ยนทั้งเกม</text>
<rect x="20" y="330" width="240" height="118" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="34" y="358" font-size="17" fill="#d97706" text-anchor="start" font-weight="bold">3. ศัตรูสุ่ม + สะท้อน</text>
<text x="34" y="384" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">random.uniform(-3, 3)</text>
<text x="34" y="406" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">ชนซ้าย/ขวา: vel.x *= -1</text>
<text x="34" y="428" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">ชนบน/ล่าง: vel.y *= -1</text>
<rect x="540" y="330" width="240" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="554" y="358" font-size="17" fill="#dc2626" text-anchor="start" font-weight="bold">4. ไล่ตาม + แยกตัว</text>
<text x="554" y="384" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">(ผู้เล่น − ตัวเอง).normalize()</text>
<text x="554" y="406" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">แยกตัว: ตัวเอง − อีกตัว</text>
<text x="554" y="428" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">จำกัด scale_to_length(3)</text>
<rect x="280" y="420" width="240" height="118" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="294" y="448" font-size="17" fill="#059669" text-anchor="start" font-weight="bold">5. หมุนนุ่มนวล + ชนขอบ</text>
<text x="294" y="474" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">(target − angle) % 360</text>
<text x="294" y="496" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">ถ้า &gt; 180 ให้ลบ 360</text>
<text x="294" y="518" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">angle += diff × 0.15</text>
<text x="40" y="575" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">ข้อสังเกต: หัวข้อ 1 และ 5 ลดลงแบบเรขาคณิตเหมือนกัน (เหลือ 97% / 85% ของค่าเดิมทุกเฟรม)</text>
</svg>
