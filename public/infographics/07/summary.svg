<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 990" width="800" height="990" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="แผนที่แนวคิดบทที่ 7 เชื่อมโยง 5 หัวข้อ แรงเสียดทาน มอดูล config ศัตรูสุ่ม ศัตรูไล่ตาม และการหมุนนุ่มนวล">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>แผนที่แนวคิดบทที่ 7 เชื่อมโยง 5 หัวข้อ แรงเสียดทาน มอดูล config ศัตรูสุ่ม ศัตรูไล่ตาม และการหมุนนุ่มนวล</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">แผนที่แนวคิดบทที่ 7: การเคลื่อนที่และพฤติกรรมศัตรู</text>
<text x="400" y="65" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า ห้าหัวข้อเชื่อมกันอย่างไร และตัวเลขสำคัญของแต่ละหัวข้อคืออะไร</text>
<rect x="200" y="90" width="400" height="70" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="400" y="118" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">ทุกเฟรม: คำนวณเวกเตอร์ Vector2</text>
<text x="400" y="145" font-size="15" fill="#475569" text-anchor="middle">pos (float) → rect (int) → วาดบนจอ</text>
<line x1="400" y1="160" x2="400" y2="632" stroke="#0f172a" stroke-width="2"/>
<rect x="40" y="190" width="350" height="164" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="60" cy="212" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="60" y="217.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="82" y="218" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">แรงเสียดทาน</text>
<text x="56" y="246" font-size="15" fill="#0f172a" text-anchor="start">velocity *= 0.97 ทุกเฟรม</text>
<text x="56" y="270" font-size="15" fill="#0f172a" text-anchor="start">5 × 0.97ⁿ &lt; 1 → n &gt; ln 0.2 ÷ ln 0.97</text>
<text x="56" y="294" font-size="15" fill="#0f172a" text-anchor="start">≈ 52.84 → ปัดขึ้น</text>
<rect x="54" y="312" width="322" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="215" y="333" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">→ หยุดที่เฟรม n = 53</text>
<line x1="390" y1="272" x2="400" y2="272" stroke="#2563eb" stroke-width="2.4"/>
<circle cx="400.00" cy="272.00" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<rect x="410" y="190" width="350" height="164" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<circle cx="430" cy="212" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="430" y="217.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="452" y="218" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="bold">มอดูลและ config.py</text>
<text x="426" y="246" font-size="15" fill="#0f172a" text-anchor="start">SCREEN_WIDTH = 1200</text>
<text x="426" y="270" font-size="15" fill="#0f172a" text-anchor="start">from config import * → SCREEN_WIDTH</text>
<text x="426" y="294" font-size="15" fill="#0f172a" text-anchor="start">import config → config.SCREEN_WIDTH</text>
<rect x="424" y="312" width="322" height="30" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="585" y="333" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">→ แก้ที่เดียว เปลี่ยนทั้งเกม</text>
<line x1="410" y1="272" x2="400" y2="272" stroke="#7c3aed" stroke-width="2.4"/>
<circle cx="400.00" cy="272.00" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
<rect x="40" y="370" width="350" height="164" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<circle cx="60" cy="392" r="13" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="60" y="397.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="82" y="398" font-size="17" fill="#d97706" text-anchor="start" font-weight="bold">ศัตรูสุ่ม + สะท้อน</text>
<text x="56" y="426" font-size="15" fill="#0f172a" text-anchor="start">random.uniform(−3, 3) ทั้งสองแกน</text>
<text x="56" y="450" font-size="15" fill="#0f172a" text-anchor="start">ซ้าย/ขวา vel.x *= −1 · บน/ล่าง vel.y *= −1</text>
<text x="56" y="474" font-size="15" fill="#0f172a" text-anchor="start">(2.4, −1.8) ชนบน → (2.4, 1.8)</text>
<rect x="54" y="492" width="322" height="30" rx="8" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="215" y="513" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">→ อัตราเร็ว 3.0 คงเดิม</text>
<line x1="390" y1="452" x2="400" y2="452" stroke="#d97706" stroke-width="2.4"/>
<circle cx="400.00" cy="452.00" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
<rect x="410" y="370" width="350" height="164" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<circle cx="430" cy="392" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="430" y="397.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="452" y="398" font-size="17" fill="#dc2626" text-anchor="start" font-weight="bold">ไล่ตาม + แยกตัว</text>
<text x="426" y="426" font-size="15" fill="#0f172a" text-anchor="start">(ผู้เล่น − ตัวเอง).normalize() × 0.1</text>
<text x="426" y="450" font-size="15" fill="#0f172a" text-anchor="start">(200, 500) → (500, 100): (300, −400)</text>
<text x="426" y="474" font-size="15" fill="#0f172a" text-anchor="start">÷ 500 = (0.6, −0.8)</text>
<rect x="424" y="492" width="322" height="30" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="585" y="513" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">→ ความเร่ง (0.06, −0.08)</text>
<line x1="410" y1="452" x2="400" y2="452" stroke="#dc2626" stroke-width="2.4"/>
<circle cx="400.00" cy="452.00" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<rect x="40" y="550" width="350" height="164" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<circle cx="60" cy="572" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="60" y="577.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="82" y="578" font-size="17" fill="#059669" text-anchor="start" font-weight="bold">หมุนนุ่มนวล + ชนขอบ</text>
<text x="56" y="606" font-size="15" fill="#0f172a" text-anchor="start">(target − angle) % 360, เกิน 180 ลบ 360</text>
<text x="56" y="630" font-size="15" fill="#0f172a" text-anchor="start">170 → −170: (−340) % 360 = 20</text>
<text x="56" y="654" font-size="15" fill="#0f172a" text-anchor="start">lerp × 0.15: 13.5 → 24.975 → 34.7288</text>
<rect x="54" y="672" width="322" height="30" rx="8" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="215" y="693" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">→ หมุน +20° ทางสั้น</text>
<line x1="390" y1="632" x2="400" y2="632" stroke="#059669" stroke-width="2.4"/>
<circle cx="400.00" cy="632.00" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
<rect x="410" y="550" width="350" height="164" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="426" y="578" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">เส้นเชื่อมระหว่างหัวข้อ</text>
<text x="426" y="608" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">①↔⑤</text>
<text x="514" y="608" font-size="15" fill="#0f172a" text-anchor="start">ลดแบบเรขาคณิต 0.97ⁿ กับ 0.85ⁿ</text>
<text x="426" y="634" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">②→③④⑤</text>
<text x="514" y="634" font-size="15" fill="#0f172a" text-anchor="start">ตรวจขอบด้วย SCREEN_WIDTH ร่วม</text>
<text x="426" y="660" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">③↔⑤</text>
<text x="514" y="660" font-size="15" fill="#0f172a" text-anchor="start">สะท้อนขอบ (⑤ วางกลับที่ขอบก่อน)</text>
<text x="426" y="686" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">④</text>
<text x="514" y="686" font-size="15" fill="#0f172a" text-anchor="start">เวกเตอร์หนึ่งหน่วยจากบทที่ 2 และ 6</text>
<line x1="400" y1="632" x2="410" y2="632" stroke="#94a3b8" stroke-width="2"/>
<text x="40" y="742" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีของกล่องและเส้น = หัวข้อ:</text>
<rect x="250" y="729" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="272" y="742" font-size="15" fill="#0f172a" text-anchor="start">หัวข้อ 1</text>
<rect x="352" y="729" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="374" y="742" font-size="15" fill="#0f172a" text-anchor="start">หัวข้อ 2</text>
<rect x="454" y="729" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="476" y="742" font-size="15" fill="#0f172a" text-anchor="start">หัวข้อ 3</text>
<rect x="556" y="729" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="578" y="742" font-size="15" fill="#0f172a" text-anchor="start">หัวข้อ 4</text>
<rect x="658" y="729" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="680" y="742" font-size="15" fill="#0f172a" text-anchor="start">หัวข้อ 5</text>
<text x="40" y="776" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">กับดักที่พบบ่อย</text>
<rect x="40" y="790" width="350" height="192" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="52" y="814" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ ผิด</text>
<text x="52" y="842" font-size="15" fill="#0f172a" text-anchor="start">friction 0.97 = ลดลง 0.97 หน่วยต่อเฟรม</text>
<text x="52" y="868" font-size="15" fill="#0f172a" text-anchor="start">import config แล้วเรียก SCREEN_WIDTH ตรง ๆ</text>
<text x="52" y="894" font-size="15" fill="#0f172a" text-anchor="start">ชนขอบแล้วกลับทั้ง vel.x และ vel.y</text>
<text x="52" y="920" font-size="15" fill="#0f172a" text-anchor="start">ไล่ตามด้วย direction × 0.1 (ไม่ normalize)</text>
<text x="52" y="946" font-size="15" fill="#0f172a" text-anchor="start">angle_diff = target − angle = −340</text>
<rect x="410" y="790" width="350" height="192" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="422" y="814" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ ถูก</text>
<text x="422" y="842" font-size="15" fill="#0f172a" text-anchor="start">ลดลงร้อยละ 3 ของค่าปัจจุบัน (คูณ)</text>
<text x="422" y="868" font-size="15" fill="#0f172a" text-anchor="start">config.SCREEN_WIDTH หรือ from config import *</text>
<text x="422" y="894" font-size="15" fill="#0f172a" text-anchor="start">กลับเฉพาะแกนที่ตั้งฉากกับผนัง</text>
<text x="422" y="920" font-size="15" fill="#0f172a" text-anchor="start">normalize ก่อน → ขนาด 0.1 เสมอ</text>
<text x="422" y="946" font-size="15" fill="#0f172a" text-anchor="start">% 360 แล้วลบ 360 ถ้าเกิน 180 → +20</text>
</svg>