<text x="420" y="660" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="438" y="660" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">length = √(20² + 10²) = √500 ≈ 22.36</text>
