<text x="50" y="519" font-size="15" text-anchor="start" fill="#0f172a"><tspan fill="#0f172a" font-weight="bold">ทิศของ vel ยังเปลี่ยนได้ (หมุนเข้าหาผู้เล่น) แต่ขนาดถูกตัดไว้ที่ 3</tspan></text>
