<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="มุมหลัง lerp ทีละเฟรมจาก 0 ไป 90 องศาด้วยสัดส่วน 0.15">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>มุมหลัง lerp ทีละเฟรมจาก 0 ไป 90 องศาด้วยสัดส่วน 0.15</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">หมุนแบบนุ่มนวล (ตอนที่ 2): lerp ทีละ 15% ของมุมที่เหลือ</text>
<text x="400" y="65" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า หมุนจาก 0° ไป 90° ด้วย × 0.15 แต่ละเฟรมได้มุมเท่าใด</text>
<path d="M60,470 L360,470 A300,300 0 0 0 60,170 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="60" y1="470" x2="360" y2="470" stroke="#475569" stroke-width="2.4"/>
<line x1="60" y1="470" x2="60" y2="170" stroke="#d97706" stroke-width="3.2"/>
<text x="70" y="192" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">เป้าหมาย 90°</text>
<text x="354" y="460" font-size="15" fill="#475569" text-anchor="end">เริ่ม 0°</text>
<line x1="60" y1="470" x2="351.711" y2="399.966" stroke="#2563eb" stroke-width="2.4"/>
<text x="361.435" y="403.632" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">เฟรม 1: 13.5°</text>
<line x1="60" y1="470" x2="331.948" y2="343.333" stroke="#2563eb" stroke-width="2.4"/>
<text x="341.013" y="345.111" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">เฟรม 2: 24.98°</text>
<line x1="60" y1="470" x2="306.557" y2="299.092" stroke="#2563eb" stroke-width="2.4"/>
<text x="314.776" y="299.395" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">เฟรม 3: 34.73°</text>
<line x1="60" y1="470" x2="279.337" y2="265.326" stroke="#2563eb" stroke-width="2.4"/>
<text x="286.648" y="264.504" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">เฟรม 4: 43.02°</text>
<line x1="60" y1="470" x2="252.569" y2="239.963" stroke="#93c5fd" stroke-width="1.4"/>
<line x1="60" y1="470" x2="227.512" y2="221.123" stroke="#93c5fd" stroke-width="1.4"/>
<line x1="60" y1="470" x2="204.764" y2="207.239" stroke="#93c5fd" stroke-width="1.4"/>
<line x1="60" y1="470" x2="184.523" y2="197.064" stroke="#93c5fd" stroke-width="1.4"/>
<line x1="60" y1="470" x2="166.755" y2="189.637" stroke="#93c5fd" stroke-width="1.4"/>
<line x1="60" y1="470" x2="151.303" y2="184.231" stroke="#93c5fd" stroke-width="1.4"/>
<text x="154.347" y="176.706" font-size="15" fill="#3b82f6" text-anchor="start">เฟรม 10: 72.28°</text>
<path d="M230.00,470.00 A170,170 0 0 0 225.30,430.31" fill="none" stroke="#dc2626" stroke-width="4"/>
<text x="197.043" y="458.78" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">13.5</text>
<path d="M225.30,430.31 A170,170 0 0 0 214.10,398.22" fill="none" stroke="#059669" stroke-width="4"/>
<text x="190.294" y="429.531" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">11.475</text>
<path d="M214.10,398.22 A170,170 0 0 0 199.72,373.15" fill="none" stroke="#7c3aed" stroke-width="4"/>
<text x="179.689" y="406.309" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">9.754</text>
<path d="M199.72,373.15 A170,170 0 0 0 184.29,354.02" fill="none" stroke="#d97706" stroke-width="4"/>
<text x="167.437" y="388.39" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">8.291</text>
<circle cx="86" cy="216" r="13" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="86" y="221.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="258.614" cy="446.493" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="258.614" y="451.993" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="248.875" cy="404.227" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="248.875" y="409.727" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="60" y="498" font-size="15" fill="#475569" text-anchor="start">ตัวเลขบนส่วนโค้ง = มุมที่หมุนในเฟรมนั้น (เล็กลงเรื่อย ๆ)</text>
<rect x="470" y="96" width="312" height="272" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="470" cy="96" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="470" y="101.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="488" y="122" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ไล่ค่า (target = 90, × 0.15)</text>
<text x="484" y="150" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">เฟรม</text>
<text x="532" y="150" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">ที่เหลือ</text>
<text x="622" y="150" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">หมุน</text>
<text x="702" y="150" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">angle</text>
<line x1="480" y1="158" x2="772" y2="158" stroke="#cbd5e1" stroke-width="1"/>
<text x="496" y="182" font-size="15" fill="#0f172a" text-anchor="start">1</text>
<text x="532" y="182" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">90.0000</text>
<text x="622" y="182" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">13.5000</text>
<text x="702" y="182" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">13.5000</text>
<text x="496" y="209" font-size="15" fill="#0f172a" text-anchor="start">2</text>
<text x="532" y="209" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">76.5000</text>
<text x="622" y="209" font-size="15" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">11.4750</text>
<text x="702" y="209" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">24.9750</text>
<text x="496" y="236" font-size="15" fill="#0f172a" text-anchor="start">3</text>
<text x="532" y="236" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">65.0250</text>
<text x="622" y="236" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">9.7538</text>
<text x="702" y="236" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">34.7288</text>
<text x="496" y="263" font-size="15" fill="#0f172a" text-anchor="start">4</text>
<text x="532" y="263" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">55.2712</text>
<text x="622" y="263" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">8.2907</text>
<text x="702" y="263" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">43.0194</text>
<text x="496" y="290" font-size="15" fill="#0f172a" text-anchor="start">⋮</text>
<text x="490" y="317" font-size="15" fill="#0f172a" text-anchor="start">10</text>
<text x="532" y="317" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20.8455</text>
<text x="622" y="317" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3.1268</text>
<text x="702" y="317" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">72.2813</text>
<text x="486" y="358" font-size="15" fill="#475569" text-anchor="start">ที่เหลือ dₙ = 90 × 0.85ⁿ (เหมือนแรงเสียดทาน)</text>
<rect x="40" y="520" width="470" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<circle cx="40" cy="520" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="40" y="525.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="58" y="547" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="bold">เมื่อใดมุมต่างเหลือน้อยกว่า 1°</text>
<text x="58" y="575" font-size="15" fill="#0f172a" text-anchor="start">90 × 0.85ⁿ &lt; 1  →  n &gt; ln(1/90) ÷ ln 0.85</text>
<text x="58" y="601" font-size="15" fill="#0f172a" text-anchor="start">= (−4.4998) ÷ (−0.1625) ≈ 27.69</text>
<text x="58" y="627" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">ปัดขึ้น → n = 28 เฟรม (ไม่ถึงครึ่งวินาทีที่ 60 FPS)</text>
<rect x="530" y="520" width="230" height="120" rx="12" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="645" y="576" font-size="15" fill="#ffffff" text-anchor="middle">คำตอบ: มุมหลัง 4 เฟรม</text>
<text x="645" y="600" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">43.0194°</text>
<text x="645" y="628" font-size="15" fill="#ffffff" text-anchor="middle">เหลือ &lt; 1° ที่เฟรม 28</text>
<text x="40" y="672" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สี:</text>
<line x1="70" y1="667" x2="94" y2="667" stroke="#2563eb" stroke-width="3.2"/>
<text x="100" y="672" font-size="15" fill="#0f172a" text-anchor="start">รังสีมุมหลังแต่ละเฟรม</text>
<line x1="283.4" y1="667" x2="307.4" y2="667" stroke="#d97706" stroke-width="3.2"/>
<text x="313.4" y="672" font-size="15" fill="#0f172a" text-anchor="start">เป้าหมาย 90°</text>
<line x1="430.2" y1="667" x2="454.2" y2="667" stroke="#dc2626" stroke-width="3.2"/>
<text x="460.2" y="672" font-size="15" fill="#0f172a" text-anchor="start">ส่วนโค้งสี = มุมที่หมุนในเฟรม 1–4</text>
<rect x="40" y="696" width="350" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="722" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ คิดว่าหมุน 13.5° เท่ากันทุกเฟรม</text>
<text x="54" y="750" font-size="15" fill="#0f172a" text-anchor="start">13.5 × 7 = 94.5 → เกิน 90° ที่เฟรม 7</text>
<text x="54" y="776" font-size="15" fill="#0f172a" text-anchor="start">แต่ 0.15 คูณกับมุม "ที่เหลือ"</text>
<text x="54" y="802" font-size="15" fill="#0f172a" text-anchor="start">ซึ่งเล็กลงทุกเฟรม</text>
<text x="54" y="828" font-size="15" fill="#dc2626" text-anchor="start">ที่ถูก: เฟรม 7 อยู่ที่ 61.15° เท่านั้น</text>
<rect x="410" y="696" width="350" height="180" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="424" y="722" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ หมุน 15% ของมุมที่เหลือ</text>
<text x="424" y="750" font-size="15" fill="#0f172a" text-anchor="start">13.5 → 11.475 → 9.754 → 8.291 …</text>
<text x="424" y="776" font-size="15" fill="#0f172a" text-anchor="start">เร็วตอนแรก แล้วช้าลงเมื่อใกล้เป้า</text>
<text x="424" y="802" font-size="15" fill="#0f172a" text-anchor="start">เข้าใกล้ 90° แต่ไม่เท่ากันพอดี</text>
<text x="424" y="828" font-size="15" fill="#059669" text-anchor="start">lerp(a, b, t) = a + (b − a) t</text>
</svg>