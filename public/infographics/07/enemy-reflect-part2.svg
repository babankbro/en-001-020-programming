<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="กฎการสะท้อนและการตรวจขอบทีละเฟรม พร้อมอาการติดผนังและวิธีแก้">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>กฎการสะท้อนและการตรวจขอบทีละเฟรม พร้อมอาการติดผนังและวิธีแก้</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ศัตรูสุ่มสะท้อนขอบจอ (ตอนที่ 2): ตรวจขอบทีละเฟรม</text>
<text x="400" y="65" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า โค้ดกลับทิศในเฟรมใด และทำไมศัตรูบางตัวสั่นค้างที่ขอบ</text>
<circle cx="40" cy="96" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="40" y="101.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<rect x="40" y="96" width="350" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="124" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">ชนขอบซ้าย/ขวา</text>
<text x="56" y="152" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">vel.x *= -1</text>
<text x="56" y="180" font-size="15" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(2.4, -1.8)</text>
<text x="56" y="204" font-size="15" fill="#059669" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ (-2.4, -1.8)</text>
<text x="56" y="230" font-size="15" fill="#475569" text-anchor="start">vy ไม่เปลี่ยน</text>
<line x1="350" y1="126" x2="350" y2="226" stroke="#0f172a" stroke-width="4"/>
<line x1="294" y1="218" x2="347" y2="176" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrB)"/>
<line x1="347" y1="176" x2="294" y2="134" stroke="#059669" stroke-width="2.4" marker-end="url(#arrG)"/>
<rect x="410" y="96" width="350" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="426" y="124" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">ชนขอบบน/ล่าง</text>
<text x="426" y="152" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">vel.y *= -1</text>
<text x="426" y="180" font-size="15" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(2.4, -1.8)</text>
<text x="426" y="204" font-size="15" fill="#059669" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ (2.4, 1.8)</text>
<text x="426" y="230" font-size="15" fill="#475569" text-anchor="start">vx ไม่เปลี่ยน</text>
<line x1="630" y1="166" x2="746" y2="166" stroke="#0f172a" stroke-width="4"/>
<line x1="638" y1="220" x2="687" y2="169" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrB)"/>
<line x1="687" y1="169" x2="736" y2="220" stroke="#059669" stroke-width="2.4" marker-end="url(#arrG)"/>
<line x1="560" y1="296" x2="584" y2="296" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrB)"/>
<text x="592" y="301" font-size="15" fill="#0f172a" text-anchor="start">ก่อนชน</text>
<line x1="670" y1="296" x2="694" y2="296" stroke="#059669" stroke-width="2.4" marker-end="url(#arrG)"/>
<text x="702" y="301" font-size="15" fill="#0f172a" text-anchor="start">หลังชน</text>
<circle cx="40" cy="330" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="40" y="335.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="60" y="335" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ไล่ทีละเฟรม: pos.x = 1145, vel.x = 2.5, ศัตรูกว้าง 50, จอกว้าง 1200</text>
<text x="387.273" y="370" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">ขอบจอ 1200</text>
<text x="440" y="370" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">rect.right</text>
<text x="545" y="370" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">&gt; 1200 ?</text>
<text x="660" y="370" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">vel.x หลังตรวจ</text>

<rect x="98.1818" y="392" width="272.727" height="24" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="106.182" y="409" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 1: pos.x = 1147.5</text>
<text x="440" y="409" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1197</text>
<text x="545" y="409" font-size="15" fill="#0f172a" text-anchor="start">ไม่</text>
<text x="660" y="409" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+2.5</text>

<rect x="114.545" y="432" width="272.727" height="24" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="122.545" y="449" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 2: pos.x = 1150.0</text>
<text x="440" y="449" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1200</text>
<text x="545" y="449" font-size="15" fill="#0f172a" text-anchor="start">ไม่ (เท่ากัน)</text>
<text x="660" y="449" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+2.5</text>

<rect x="125.455" y="472" width="272.727" height="24" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="133.455" y="489" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 3: pos.x = 1152.5</text>
<text x="440" y="489" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1202</text>
<text x="545" y="489" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">ใช่</text>
<text x="660" y="489" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−2.5</text>

<rect x="114.545" y="512" width="272.727" height="24" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="122.545" y="529" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 4: pos.x = 1150.0</text>
<text x="440" y="529" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1200</text>
<text x="545" y="529" font-size="15" fill="#0f172a" text-anchor="start">ไม่ (เท่ากัน)</text>
<text x="660" y="529" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−2.5</text>

<rect x="98.1818" y="552" width="272.727" height="24" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="106.182" y="569" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 5: pos.x = 1147.5</text>
<text x="440" y="569" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1197</text>
<text x="545" y="569" font-size="15" fill="#0f172a" text-anchor="start">ไม่</text>
<text x="660" y="569" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−2.5</text>
<line x1="387.273" y1="378" x2="387.273" y2="592" stroke="#dc2626" stroke-width="2.4"/>
<text x="114.545" y="610" font-size="15" fill="#94a3b8" text-anchor="middle">1150</text>
<text x="223.636" y="610" font-size="15" fill="#94a3b8" text-anchor="middle">1170</text>
<text x="332.727" y="610" font-size="15" fill="#94a3b8" text-anchor="middle">1190</text>
<rect x="40" y="628" width="480" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="40" cy="628" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="40" y="633.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="58" y="656" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 2: rect.right = 1200 ไม่มากกว่า 1200 → ยังไม่กลับ</text>
<text x="58" y="682" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 3: rect.right = int(1152.5) + 50 = 1202 &gt; 1200</text>
<text x="58" y="708" font-size="15" fill="#0f172a" text-anchor="start">→ vel.x = 2.5 × (−1) = −2.5 แล้วเคลื่อนกลับ</text>
<rect x="540" y="628" width="220" height="96" rx="12" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="650" y="672" font-size="15" fill="#ffffff" text-anchor="middle">คำตอบ: กลับทิศที่</text>
<text x="650" y="696" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">เฟรม 3 (vel.x = −2.5)</text>
<circle cx="40" cy="744" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="40" y="749.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="60" y="750" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">จุดที่มักผิด: เริ่มล้ำขอบอยู่แล้ว pos.x = 1160, vel.x = 2.5</text>
<rect x="40" y="764" width="350" height="176" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="790" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ กลับทิศอย่างเดียว → สั่นค้าง</text>
<text x="54" y="818" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 1: right = 1212 &gt; 1200 → vel −2.5</text>
<text x="54" y="844" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 2: right = 1210 ยังเกิน → vel +2.5</text>
<text x="54" y="870" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 3: right = 1212 ยังเกิน → vel −2.5</text>
<text x="54" y="896" font-size="15" fill="#dc2626" text-anchor="start">กลับไปกลับมาทุกเฟรม ไม่หลุดจากขอบ</text>
<rect x="410" y="764" width="350" height="176" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="424" y="790" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ วางกลับที่ขอบก่อน แล้วค่อยกลับทิศ</text>
<text x="424" y="818" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">rect.right = SCREEN_WIDTH</text>
<text x="424" y="844" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">pos.x = rect.x   # = 1150</text>
<text x="424" y="870" font-size="15" fill="#0f172a" text-anchor="start">เฟรม 2: pos.x = 1147.5, right = 1197 ✓</text>
<text x="424" y="896" font-size="15" fill="#059669" text-anchor="start">หลุดจากขอบได้ทันที (ยานในหัวข้อ 5 ใช้วิธีนี้)</text>
</svg>