<line x1="480" y1="396" x2="424" y2="459" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
<path d="M150,148 H10 V522 H97" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrP)"/>
<rect x="584" y="90" width="200" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="584" cy="90" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="584" y="95.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="602" y="116" font-size="15" fill="#0f172a" text-anchor="start">รันครั้งเดียวตอนถูก import</text>
<text x="602" y="140" font-size="15" fill="#0f172a" text-anchor="start">ครั้งแรก → สร้างตัวแปร</text>
<text x="602" y="164" font-size="15" fill="#0f172a" text-anchor="start">SCREEN_WIDTH = 1200</text>
<text x="602" y="188" font-size="15" fill="#0f172a" text-anchor="start">เก็บใน sys.modules</text>
<line x1="584" y1="148" x2="432" y2="148" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="584" y="260" width="200" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="584" cy="260" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="584" y="265.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="602" y="286" font-size="15" fill="#0f172a" text-anchor="start">ทั้งสามไฟล์ใช้</text>
<text x="602" y="310" font-size="15" fill="#0f172a" text-anchor="start">SCREEN_WIDTH ได้ตรง ๆ</text>
<text x="602" y="334" font-size="15" fill="#0f172a" text-anchor="start">ได้ค่า 1200 ชุดเดียวกัน</text>
<text x="602" y="358" font-size="15" fill="#0f172a" text-anchor="start">(ไม่ต้องมี config. นำหน้า)</text>
<line x1="584" y1="328" x2="574" y2="328" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="584" y="456" width="200" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="584" cy="456" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="584" y="461.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="602" y="482" font-size="15" fill="#0f172a" text-anchor="start">นำเข้าคลาสจากทั้งสามไฟล์</text>
<text x="602" y="506" font-size="15" fill="#0f172a" text-anchor="start">และ config (เส้นประ)</text>
<text x="602" y="530" font-size="15" fill="#0f172a" text-anchor="start">นำเข้าไหลทางเดียวบน→ล่าง</text>
<text x="602" y="554" font-size="15" fill="#0f172a" text-anchor="start">ไม่เกิด Circular Import</text>
<line x1="584" y1="530" x2="486" y2="530" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="40" y="648" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">ลูกศรชี้จากไฟล์ที่ถูกนำเข้า → ไฟล์ที่นำเข้า:</text>
<line x1="40" y1="672" x2="68" y2="672" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrP)"/>
<text x="76" y="677" font-size="15" fill="#0f172a" text-anchor="start">ค่าคงที่จาก config</text>
<line x1="257.2" y1="672" x2="285.2" y2="672" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrB)"/>
<text x="293.2" y="677" font-size="15" fill="#0f172a" text-anchor="start">คลาส Space</text>
<line x1="407.2" y1="672" x2="435.2" y2="672" stroke="#d97706" stroke-width="2.4" marker-end="url(#arrO)"/>
<text x="443.2" y="677" font-size="15" fill="#0f172a" text-anchor="start">คลาส Enemy</text>
<line x1="557.2" y1="672" x2="585.2" y2="672" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrR)"/>
<text x="593.2" y="677" font-size="15" fill="#0f172a" text-anchor="start">คลาส RedEnemy</text>
<rect x="40" y="704" width="480" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="40" cy="704" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="40" y="709.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="58" y="731" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ลองเปลี่ยนขนาดจอเป็น 1600 × 1200</text>
<text x="58" y="759" font-size="15" fill="#0f172a" text-anchor="start">config.py:  SCREEN_WIDTH = 1600  (แก้ 1 บรรทัด)</text>
<text x="58" y="785" font-size="15" fill="#0f172a" text-anchor="start">space.py, enemy.py:  rect.right &gt; SCREEN_WIDTH</text>
<text x="58" y="811" font-size="15" fill="#0f172a" text-anchor="start">→ ตรวจขอบขวาที่ 1600 ทันที โดยไม่ต้องแก้ไฟล์เหล่านี้</text>
<rect x="540" y="704" width="220" height="130" rx="12" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="650" y="765" font-size="15" fill="#ffffff" text-anchor="middle">คำตอบ: แก้ที่เดียว ทุกไฟล์เห็น</text>
<text x="650" y="789" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">SCREEN_WIDTH = 1600</text>
<text x="40" y="856" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">จุดที่มักผิด</text>
<circle cx="150" cy="851" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="150" y="856.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<rect x="40" y="868" width="350" height="126" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="894" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ import config แล้วเรียกชื่อตรง ๆ</text>
<text x="54" y="920" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">import config</text>
<text x="54" y="944" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(SCREEN_WIDTH)</text>
<text x="54" y="968" font-size="15" fill="#dc2626" text-anchor="start">→ NameError: ไม่มีชื่อ SCREEN_WIDTH</text>
<rect x="410" y="868" width="350" height="126" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="424" y="894" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ เลือกแบบใดแบบหนึ่งให้ตรงกัน</text>
<text x="424" y="920" font-size="15" fill="#0f172a" text-anchor="start">import config → config.SCREEN_WIDTH</text>
<text x="424" y="944" font-size="15" fill="#0f172a" text-anchor="start">from config import * → SCREEN_WIDTH</text>
<text x="424" y="968" font-size="15" fill="#059669" text-anchor="start">ทั้งสองแบบได้ 1200</text>
