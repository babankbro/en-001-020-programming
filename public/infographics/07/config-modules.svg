<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" width="800" height="1010" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="แผนภาพการนำเข้า config.py ถูกนำเข้าโดย space.py enemy.py red_enemy.py และ main.py">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>แผนภาพการนำเข้า config.py ถูกนำเข้าโดย space.py enemy.py red_enemy.py และ main.py</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">มอดูล config.py: นำเข้าครั้งเดียว ใช้ค่าร่วมกันทั้งเกม</text>
<text x="400" y="65" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า ไฟล์ใดนำเข้าอะไร และทำไมแก้ config.py ที่เดียวจึงเปลี่ยนทั้งเกม</text>
<rect x="150" y="96" width="280" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="290" y="124" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="bold">config.py</text>
<text x="290" y="154" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">SCREEN_WIDTH = 1200</text>
<text x="290" y="180" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">SCREEN_HEIGHT = 900</text>
<circle cx="150" cy="96" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="150" y="101.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<rect x="20" y="262" width="184" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="112" y="288" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">space.py</text>
<text x="112" y="316" font-size="15" fill="#7c3aed" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve" textLength="164" lengthAdjust="spacingAndGlyphs">from config import *</text>
<text x="112" y="344" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">class Space</text>
<text x="112" y="372" font-size="15" fill="#475569" text-anchor="middle">ยานผู้เล่น</text>
<line x1="290" y1="202" x2="112" y2="259" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
<rect x="204" y="262" width="184" height="132" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="296" y="288" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">enemy.py</text>
<text x="296" y="316" font-size="15" fill="#7c3aed" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve" textLength="164" lengthAdjust="spacingAndGlyphs">from config import *</text>
<text x="296" y="344" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">class Enemy</text>
<text x="296" y="372" font-size="15" fill="#475569" text-anchor="middle">สุ่ม + สะท้อน</text>
<line x1="290" y1="202" x2="296" y2="259" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
<rect x="388" y="262" width="184" height="132" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="480" y="288" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">red_enemy.py</text>
<text x="480" y="316" font-size="15" fill="#7c3aed" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve" textLength="164" lengthAdjust="spacingAndGlyphs">from config import *</text>
<text x="480" y="344" font-size="15" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">class RedEnemy</text>
<text x="480" y="372" font-size="15" fill="#475569" text-anchor="middle">ไล่ตาม + แยกตัว</text>
<line x1="290" y1="202" x2="480" y2="259" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
<circle cx="20" cy="262" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="20" y="267.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<rect x="100" y="462" width="384" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="292" y="488" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">main.py (รันไฟล์นี้: วงวนเกม)</text>
<text x="130" y="518" font-size="15" fill="#7c3aed" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">from config import *</text>
<text x="130" y="542" font-size="15" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">from space import Space</text>
<text x="130" y="566" font-size="15" fill="#d97706" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">from enemy import Enemy</text>
<text x="130" y="590" font-size="15" fill="#dc2626" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">from red_enemy import RedEnemy</text>
<circle cx="100" cy="462" r="13" fill="#0f172a" stroke="#ffffff" stroke-width="2"/><text x="100" y="467.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<line x1="112" y1="396" x2="160" y2="459" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
