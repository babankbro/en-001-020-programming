<rect x="20.0" y="396.0" width="760.0" height="44.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="187.8" y="424.0" font-size="17" text-anchor="start"><tspan fill="#0f172a">ลำดับเข้า </tspan><tspan fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace">x → y → z</tspan><tspan fill="#0f172a">   แต่ลำดับออก </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">z → y → x</tspan><tspan fill="#0f172a">  (กลับกันเสมอ)</tspan></text>
<text x="30.0" y="476.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">เมท็อดของคลาส Stack ↔ คำสั่งลิสต์ไพทอน (ตัวอย่างเมื่อ items = ['x', 'y', 'z'])</text>
<text x="30.0" y="506.0" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">เมท็อด</text>
<text x="200.0" y="506.0" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">ลิสต์ไพทอน</text>
<text x="400.0" y="506.0" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">ผลลัพธ์</text>
<rect x="22.0" y="518.0" width="756.0" height="30.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="539.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">push(item)</text>
<text x="200.0" y="539.0" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">items.append(item)</text>
<text x="400.0" y="539.0" font-size="15" fill="#0f172a" text-anchor="start">push('w') → ['x','y','z','w']</text>
<rect x="22.0" y="552.0" width="756.0" height="30.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="573.0" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">pop()</text>
<text x="200.0" y="573.0" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">items.pop()</text>
<text x="400.0" y="573.0" font-size="15" fill="#0f172a" text-anchor="start">คืน 'z' เหลือ ['x','y']</text>
<rect x="22.0" y="586.0" width="756.0" height="30.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="607.0" font-size="15" fill="#059669" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">peek()</text>
<text x="200.0" y="607.0" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">items[-1]</text>
<text x="400.0" y="607.0" font-size="15" fill="#0f172a" text-anchor="start">คืน 'z' สแตกไม่เปลี่ยน</text>
<rect x="22.0" y="620.0" width="756.0" height="30.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="641.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">is_empty()</text>
<text x="200.0" y="641.0" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">len(items) == 0</text>
<text x="400.0" y="641.0" font-size="15" fill="#0f172a" text-anchor="start">False</text>
<rect x="22.0" y="654.0" width="756.0" height="30.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="30.0" y="675.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">size()</text>
<text x="200.0" y="675.0" font-size="15" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">len(items)</text>
<text x="400.0" y="675.0" font-size="15" fill="#0f172a" text-anchor="start">3</text>
<rect x="22.0" y="702.0" width="756.0" height="54.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="36.0" y="724.0" font-size="15" fill="#0f172a" text-anchor="start">ทำไมใช้ท้ายลิสต์เป็นบนสุด: pop() ที่ท้ายไม่ต้องเลื่อนสมาชิกตัวอื่น (เร็ว)</text>
<text x="36.0" y="746.0" font-size="15" fill="#0f172a" text-anchor="start">ถ้า pop(0) ที่หัวลิสต์ ได้ตัวที่เข้าก่อนออกก่อน = คิว (Queue, FIFO) ไม่ใช่สแตก</text>
<rect x="20.0" y="772.0" width="760.0" height="154.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36.0" y="800.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">จุดที่มักผิด</text>
<rect x="36.0" y="816.0" width="356.0" height="44.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<rect x="408.0" y="816.0" width="356.0" height="44.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="50.0" y="844.0" font-size="18" fill="#dc2626" text-anchor="start" font-weight="bold">✗</text>
<text x="422.0" y="844.0" font-size="18" fill="#059669" text-anchor="start" font-weight="bold">✓</text>
<text x="72.0" y="844.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">items[0]</tspan><tspan fill="#0f172a"> คือบนสุด</tspan></text>
<text x="444.0" y="844.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">items[-1]</tspan><tspan fill="#0f172a"> คือบนสุด (items[0] = ก้น)</tspan></text>
<rect x="36.0" y="870.0" width="356.0" height="44.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<rect x="408.0" y="870.0" width="356.0" height="44.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="50.0" y="898.0" font-size="18" fill="#dc2626" text-anchor="start" font-weight="bold">✗</text>
<text x="422.0" y="898.0" font-size="18" fill="#059669" text-anchor="start" font-weight="bold">✓</text>
<text x="72.0" y="898.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">peek: return items.pop()</tspan></text>
<text x="444.0" y="898.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">peek: return items[-1]</tspan><tspan fill="#0f172a"> ไม่หยิบออก</tspan></text>
</svg>