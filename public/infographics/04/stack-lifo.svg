<text x="400.0" y="38.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">สแตก (Stack): เข้าหลังออกก่อน (LIFO) และบั๊ก pop สองครั้งใน stack_v2.py</text>
<text x="400.0" y="64.0" font-size="15" fill="#475569" text-anchor="middle">ปากสแตกอยู่ด้านบน = ท้ายลิสต์ items[-1] · กล่องแดงประ = ค่าที่ pop ออกมา</text>
