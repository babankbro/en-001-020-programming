<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="400.0" y="38.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">แผนที่แนวคิด บท 04: ลิสต์ซ้อนลิสต์ ตาราง และสแตก</text>
<rect x="20.0" y="52.0" width="760.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="160.1" y="74.0" font-size="15" text-anchor="start"><tspan fill="#475569" font-weight="bold">ภาพนี้ตอบคำถามว่า: </tspan><tspan fill="#0f172a">5 หัวข้อของบทเชื่อมกันอย่างไร และแต่ละหัวข้อต้องจำตัวเลขอะไร</tspan></text>
<text x="81.3" y="113.0" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีกล่อง:</text>
<rect x="164.8" y="101.0" width="18.0" height="14.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="188.8" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">1 ตาราง 2 มิติ</text>
<rect x="279.1" y="101.0" width="18.0" height="14.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="303.1" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">2 f-string</text>
<rect x="396.3" y="101.0" width="18.0" height="14.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="420.3" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">3 สำเนาตื้น</text>
<rect x="495.6" y="101.0" width="18.0" height="14.0" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="519.6" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">4 สแตก</text>
<rect x="586.4" y="101.0" width="18.0" height="14.0" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="610.4" y="113.0" font-size="15" fill="#0f172a" text-anchor="start">5 // % pandas</text>
<rect x="20.0" y="132.0" width="372.0" height="150.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="42.0" cy="156.0" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="161.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="62.0" y="162.0" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">ลิสต์ซ้อนลิสต์ = ตาราง</text>
<text x="38.0" y="190.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">scores[1][2]</tspan><tspan fill="#0f172a"> = แถว 1 คอลัมน์ 2 = </tspan><tspan fill="#2563eb" font-weight="bold">67</tspan></text>
<text x="38.0" y="215.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">len(scores)</tspan><tspan fill="#0f172a"> = 3 แถว · </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">len(scores[0])</tspan><tspan fill="#0f172a"> = 4</tspan></text>
<text x="38.0" y="240.0" font-size="15" fill="#0f172a" text-anchor="start">เฉลี่ยแถว ÷ คอลัมน์: 265/4 = 66.25</text>
<text x="38.0" y="265.0" font-size="15" fill="#0f172a" text-anchor="start">เฉลี่ยคอลัมน์ ÷ แถว: 236/3 ≈ 78.67</text>
<rect x="408.0" y="132.0" width="372.0" height="150.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="430.0" cy="156.0" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="161.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="450.0" y="162.0" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">f-string และ col_widths</text>
<text x="426.0" y="190.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">max(len(str(row[i])))</tspan><tspan fill="#0f172a"> ต่อคอลัมน์</tspan></text>
<text x="426.0" y="215.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">f"{x:&lt;{w}}"</tspan><tspan fill="#0f172a"> ชิดซ้ายกว้าง w</tspan></text>
<text x="426.0" y="240.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">col_widths = [7, 4, 7, 7, 8]</tspan></text>
<text x="426.0" y="265.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">line_length = 33 + 5×3 = </tspan><tspan fill="#059669" font-weight="bold">48</tspan></text>
<rect x="290.0" y="314.0" width="220.0" height="64.0" rx="32" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="342.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">บท 04</text>
<text x="400.0" y="366.0" font-size="15" fill="#475569" text-anchor="middle">List of Lists &amp; Stack</text>
<rect x="20.0" y="412.0" width="372.0" height="150.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="42.0" cy="436.0" r="13" fill="#d97706" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="441.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="62.0" y="442.0" font-size="16" fill="#d97706" text-anchor="start" font-weight="bold">สำเนาตื้น (Shallow Copy)</text>
<text x="38.0" y="470.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">copy()</tspan><tspan fill="#0f172a"> คัดลอกแค่ลิสต์ชั้นนอก</tspan></text>
<text x="38.0" y="495.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">table_show[1] is scores[0]</tspan><tspan fill="#d97706" font-weight="bold"> → True</tspan></text>
<text x="38.0" y="520.0" font-size="15" fill="#0f172a" text-anchor="start">แทรกชื่อในแถว → ต้นฉบับเปลี่ยน</text>
<text x="38.0" y="545.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">แก้: </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">copy.deepcopy()</tspan></text>
<rect x="408.0" y="412.0" width="372.0" height="150.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="430.0" cy="436.0" r="13" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="441.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="450.0" y="442.0" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="bold">สแตก (Stack) LIFO</text>
<text x="426.0" y="470.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">push=append · pop=pop() · peek=[-1]</tspan></text>
<text x="426.0" y="495.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">push k, m · pop · push n → </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">pop(), size()</tspan></text>
<text x="426.0" y="520.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">= </tspan><tspan fill="#7c3aed" font-weight="bold" font-family="Consolas, 'Courier New', monospace">n 1</tspan><tspan fill="#0f172a"> (ซ้ายไปขวา)</tspan></text>
<text x="426.0" y="545.0" font-size="15" fill="#0f172a" text-anchor="start">pop 2 ครั้ง/รอบ + 3 ตัว → IndexError</text>
<rect x="20.0" y="600.0" width="760.0" height="116.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="42.0" cy="624.0" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="629.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="62.0" y="630.0" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">การหารปัดลง // มอดุโล % และ pandas</text>
<text x="38.0" y="658.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">row = k // cols, col = k % cols</tspan><tspan fill="#0f172a"> → k = 9, 4 คอลัมน์ → (2, 1) = 95</tspan></text>
<text x="38.0" y="683.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">-7 // 2 = </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">-4</tspan><tspan fill="#0f172a"> (ปัดลง) · </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">-7 % 2 = 1</tspan><tspan fill="#0f172a"> · </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">-340 % 360 = 20</tspan></text>
<text x="38.0" y="708.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">pd.DataFrame(scores, columns=..., index=...)</tspan><tspan fill="#0f172a"> → shape (3, 4)</tspan></text>
