<line x1="400.0" y1="300.0" x2="655.0" y2="400.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="400.0" y1="300.0" x2="400.0" y2="490.0" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="290.0" y="252.0" width="220.0" height="96.0" rx="48" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="292.0" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">บท 04</text>
<text x="400.0" y="320.0" font-size="16" fill="#475569" text-anchor="middle">List of Lists &amp; Stack</text>
<rect x="20.0" y="90.0" width="250.0" height="140.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="44.0" cy="116.0" r="13" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="44.0" y="121.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="64.0" y="122.0" font-size="16" fill="#2563eb" font-weight="bold">ลิสต์ซ้อนลิสต์ = ตาราง</text>
<text x="36.0" y="156.0" font-size="15" fill="#0f172a">table[i][j] แถว i คอลัมน์ j</text>
<text x="36.0" y="182.0" font-size="15" fill="#0f172a">len(t) แถว · len(t[0]) คอลัมน์</text>
<text x="36.0" y="208.0" font-size="15" fill="#0f172a">เฉลี่ยแถว ÷ คอลัมน์ · คอลัมน์ ÷ แถว</text>
<rect x="530.0" y="90.0" width="250.0" height="140.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="554.0" cy="116.0" r="13" fill="#059669" stroke="none" stroke-width="1"/>
<text x="554.0" y="121.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="574.0" y="122.0" font-size="16" fill="#059669" font-weight="bold">f-string และ col_widths</text>
<text x="546.0" y="156.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">max(len(str(row[i])))</text>
<text x="546.0" y="182.0" font-size="15" fill="#0f172a">f&quot;{x:&lt;{w}}&quot; ชิดซ้าย</text>
<text x="546.0" y="208.0" font-size="15" fill="#0f172a">ยาว = Σ w + 3 × คอลัมน์</text>
<rect x="20.0" y="330.0" width="250.0" height="140.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="44.0" cy="356.0" r="13" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="44.0" y="361.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="64.0" y="362.0" font-size="16" fill="#d97706" font-weight="bold">สำเนาตื้น (Shallow Copy)</text>
<text x="36.0" y="396.0" font-size="15" fill="#0f172a">copy() คัดลอกแค่ลิสต์ชั้นนอก</text>
<text x="36.0" y="422.0" font-size="15" fill="#0f172a">แถวข้างในยังใช้ร่วมกัน</text>
<text x="36.0" y="448.0" font-size="15" fill="#0f172a">แก้ด้วย copy.deepcopy()</text>
<rect x="530.0" y="330.0" width="250.0" height="140.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="554.0" cy="356.0" r="13" fill="#7c3aed" stroke="none" stroke-width="1"/>
<text x="554.0" y="361.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="574.0" y="362.0" font-size="16" fill="#7c3aed" font-weight="bold">สแตก (Stack) LIFO</text>
<text x="546.0" y="396.0" font-size="15" fill="#0f172a">push = append · pop = pop()</text>
<text x="546.0" y="422.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">peek = items[-1]</text>
<text x="546.0" y="448.0" font-size="15" fill="#0f172a">pop ตอนว่าง → IndexError</text>
<rect x="275.0" y="420.0" width="250.0" height="140.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="299.0" cy="446.0" r="13" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="299.0" y="451.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="319.0" y="452.0" font-size="16" fill="#dc2626" font-weight="bold">// % และ pandas</text>
<text x="291.0" y="486.0" font-size="15" fill="#0f172a">row = k // cols, col = k % cols</text>
<text x="291.0" y="512.0" font-size="15" fill="#0f172a">-7 // 2 = -4 (ปัดลงเสมอ)</text>
<text x="291.0" y="538.0" font-size="15" fill="#0f172a">DataFrame · df.mean()</text>
