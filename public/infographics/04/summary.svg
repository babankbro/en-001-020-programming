<text x="72.0" y="806.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">scores[j][i]</tspan><tspan fill="#0f172a"> / หาร len ผิดฝั่ง</tspan></text>
<text x="444.0" y="806.0" font-size="15" text-anchor="start"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">scores[i][j]</tspan><tspan fill="#0f172a"> · คอลัมน์หาร len(scores)</tspan></text>
