<text x="0.0" y="0.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold"></text>
<text x="400.0" y="290.0" font-size="15" fill="#0f172a" text-anchor="middle"></text>
<text x="150.0" y="304.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">① สร้างตาราง</text>
<text x="652.0" y="304.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">② พิมพ์ให้สวย</text>
<text x="150.0" y="396.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">③ ระวังตอนแทรกหัว</text>
<text x="652.0" y="396.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">④ คลาสแรกของวิชา</text>
<text x="470.0" y="470.0" font-size="15" fill="#0f172a" text-anchor="middle"></text>
<text x="410.0" y="590.0" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">⑤ คณิตจำนวนเต็ม + ไลบรารี</text>
