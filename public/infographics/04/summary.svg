<text x="444.0" y="860.0" font-size="15" text-anchor="start"><tspan fill="#0f172a">pop ทำก่อน → </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">n 1</tspan></text>
