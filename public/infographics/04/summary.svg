<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="400.0" y="38.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">แผนที่แนวคิด บท 04: ลิสต์ซ้อนลิสต์ ตาราง และสแตก</text>
<text x="400.0" y="64.0" font-size="15" fill="#475569" text-anchor="middle">จากตาราง 2 มิติ → พิมพ์ให้สวย → ระวังสำเนาตื้น → โครงสร้างข้อมูลสแตกด้วยคลาส</text>
<line x1="400.0" y1="300.0" x2="145.0" y2="160.0" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="400.0" y1="300.0" x2="655.0" y2="160.0" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
