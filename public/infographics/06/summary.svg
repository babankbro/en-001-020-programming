<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1056" width="800" height="1056" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">บทที่ 6 ในภาพเดียว: เวกเตอร์ เมทริกซ์ การหมุน และยานอวกาศ</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: 5 หัวข้อของบทนี้ต่อกันอย่างไร จนนำไปควบคุมยานอวกาศได้</text><rect x="20.0" y="96.0" width="370.0" height="230.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="48.0" cy="126.0" r="14.0" fill="#2563eb"/><text x="48.0" y="131.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="72.0" y="132.0" font-size="18" fill="#2563eb" font-weight="bold">เวกเตอร์ NumPy</text><text x="40.0" y="168.0" font-size="15" fill="#0f172a">• บวก/ลบ ทีละสมาชิก</text><text x="40.0" y="194.0" font-size="15" fill="#0f172a">• B − A = ลูกศรจาก A ไป B</text><text x="40.0" y="220.0" font-size="15" fill="#0f172a">• หนึ่งหน่วย = v / |v|</text><rect x="34.0" y="244.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="268.0" font-size="15" fill="#2563eb" font-weight="bold">(1, 5) − (4, 1) = (−3, 4) → ยาว 5</text><text x="40.0" y="308.0" font-size="15" fill="#dc2626">✗ ลิสต์ [1,2]+[3,4] = ต่อกัน</text><rect x="410.0" y="96.0" width="370.0" height="230.0" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="438.0" cy="126.0" r="14.0" fill="#059669"/><text x="438.0" y="131.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="462.0" y="132.0" font-size="18" fill="#059669" font-weight="bold">เมทริกซ์</text><text x="430.0" y="168.0" font-size="15" fill="#0f172a">• ช่อง (i, j) = แถว i · คอลัมน์ j</text><text x="430.0" y="194.0" font-size="15" fill="#0f172a">• ใช้ @ ไม่ใช่ *</text><text x="430.0" y="220.0" font-size="15" fill="#0f172a">• AB ≠ BA</text><rect x="424.0" y="244.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="434.0" y="268.0" font-size="15" fill="#059669" font-weight="bold">[[1,2],[3,4]] @ [[5,6],[7,8]] → c₁₂ = 22</text><text x="430.0" y="308.0" font-size="15" fill="#dc2626">✗ P * Q = คูณทีละตำแหน่ง</text><rect x="20.0" y="346.0" width="370.0" height="230.0" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="48.0" cy="376.0" r="14.0" fill="#d97706"/><text x="48.0" y="381.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="72.0" y="382.0" font-size="18" fill="#d97706" font-weight="bold">มุมและ atan2</text><text x="40.0" y="418.0" font-size="15" fill="#0f172a">• เรเดียน = องศา × π/180</text><text x="40.0" y="444.0" font-size="15" fill="#0f172a">• จุดบนวงกลม (r cos θ, r sin θ)</text><text x="40.0" y="470.0" font-size="15" fill="#0f172a">• atan2(y, x): ทิศ → มุม</text><rect x="34.0" y="494.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="44.0" y="518.0" font-size="15" fill="#d97706" font-weight="bold">atan2(4, 3) = 53.13°</text><text x="40.0" y="558.0" font-size="15" fill="#dc2626">✗ math.cos(30) ใส่องศาตรง ๆ</text><rect x="410.0" y="346.0" width="370.0" height="230.0" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="438.0" cy="376.0" r="14.0" fill="#7c3aed"/><text x="438.0" y="381.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="462.0" y="382.0" font-size="18" fill="#7c3aed" font-weight="bold">เมทริกซ์การหมุน</text><text x="430.0" y="418.0" font-size="15" fill="#0f172a">• R = [[cos, −sin], [sin, cos]]</text><text x="430.0" y="444.0" font-size="15" fill="#0f172a">• รอบจุด c: R(p − c) + c</text><text x="430.0" y="470.0" font-size="15" fill="#0f172a">• ระยะจาก c ไม่เปลี่ยน</text><rect x="424.0" y="494.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="434.0" y="518.0" font-size="15" fill="#7c3aed" font-weight="bold">(7, 3) รอบ (3, 3) ไป 90° → (3, 7)</text><text x="430.0" y="558.0" font-size="15" fill="#dc2626">✗ R·p + c ได้ (0, 10)</text><rect x="20.0" y="596.0" width="760.0" height="380.0" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/><circle cx="48.0" cy="626.0" r="14.0" fill="#0f172a"/><text x="48.0" y="631.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="72.0" y="632.0" font-size="18" fill="#0f172a" font-weight="bold">ควบคุมยานอวกาศ (game/space.py) — ใช้ 1–4 ครบทุกขั้น</text><rect x="36.0" y="656.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="56.0" cy="678.0" r="12.0" fill="#2563eb"/><text x="56.0" y="683.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="76.0" y="684.0" font-size="15" fill="#2563eb" font-weight="bold">ปุ่ม ↑ + →</text><text x="144.0" y="716.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(1, −1)</text><text x="144.0" y="742.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 1)</text><line x1="254.0" y1="704.0" x2="286.0" y2="704.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="288.0" y="656.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="308.0" cy="678.0" r="12.0" fill="#2563eb"/><text x="308.0" y="683.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="328.0" y="684.0" font-size="15" fill="#2563eb" font-weight="bold">normalize</text><text x="396.0" y="716.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(0.707, −0.707)</text><text x="396.0" y="742.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 1)</text><line x1="506.0" y1="704.0" x2="538.0" y2="704.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="540.0" y="656.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="560.0" cy="678.0" r="12.0" fill="#d97706"/><text x="560.0" y="683.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="580.0" y="684.0" font-size="15" fill="#d97706" font-weight="bold">atan2(−y, x) − 90</text><text x="648.0" y="716.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">−45°</text><text x="648.0" y="742.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 3)</text><line x1="648.0" y1="754.0" x2="648.0" y2="784.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="540.0" y="786.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><circle cx="560.0" cy="808.0" r="12.0" fill="#7c3aed"/><text x="560.0" y="813.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="580.0" y="814.0" font-size="15" fill="#7c3aed" font-weight="bold">หมุนทางสั้น × 0.15</text><text x="648.0" y="846.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(t − a) % 360</text><text x="648.0" y="872.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 4)</text><line x1="538.0" y1="834.0" x2="506.0" y2="834.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="288.0" y="786.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="308.0" cy="808.0" r="12.0" fill="#d97706"/><text x="308.0" y="813.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="328.0" y="814.0" font-size="15" fill="#d97706" font-weight="bold">thrust (cos, −sin)</text><text x="396.0" y="846.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(0.141, −0.141)</text><text x="396.0" y="872.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 3)</text><line x1="286.0" y1="834.0" x2="254.0" y2="834.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="36.0" y="786.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="56.0" cy="808.0" r="12.0" fill="#0f172a"/><text x="56.0" y="813.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="76.0" y="814.0" font-size="15" fill="#0f172a" font-weight="bold">friction × 0.97</text><text x="144.0" y="846.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">5 → 4.85</text><text x="144.0" y="872.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 5)</text><text x="36.0" y="916.0" font-size="15" fill="#0f172a">ตัวอย่างไล่ค่า: กด ↑ กับ → → ทิศ (0.707, −0.707) → มุมเป้า −45° → ยานค่อย ๆ หันไป → เร่งเฉียงขึ้นขวา</text><text x="36.0" y="946.0" font-size="15" fill="#475569">ปล่อยปุ่ม → ความเร็วคูณ 0.97 ทุกเฟรม และไม่เกิน max_speed: (6, 8) → (3, 4)</text><rect x="20.0" y="996.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="1022.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="1007.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="1022.0" font-size="15" fill="#0f172a">เวกเตอร์</text><rect x="248.4" y="1007.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="282.4" y="1022.0" font-size="15" fill="#0f172a">เมทริกซ์</text><rect x="362.4" y="1007.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="396.4" y="1022.0" font-size="15" fill="#0f172a">มุม/ตรีโกณ</text><rect x="495.8" y="1007.0" width="26.0" height="18.0" rx="4" fill="#7c3aed33" stroke="#7c3aed" stroke-width="1.5"/><text x="529.8" y="1022.0" font-size="15" fill="#0f172a">การหมุน</text><circle cx="622.8" cy="1017.0" r="6.0" fill="#dc2626"/><text x="643.8" y="1022.0" font-size="15" fill="#0f172a">กับดัก</text></svg>