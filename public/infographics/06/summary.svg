<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="38.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">บทที่ 6 เวกเตอร์ เมทริกซ์ และการหมุน — แผนที่แนวคิด</text><line x1="400.0" y1="285.0" x2="147.0" y2="129.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="653.0" y2="129.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="147.0" y2="454.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="653.0" y2="454.0" stroke="#cbd5e1" stroke-width="2"/><line x1="400.0" y1="285.0" x2="400.0" y2="504.0" stroke="#cbd5e1" stroke-width="2"/><rect x="22.0" y="70.0" width="250.0" height="118.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="34.0" y="96.0" font-size="16" fill="#2563eb" font-weight="bold">1. เวกเตอร์ NumPy</text><text x="36.0" y="122.0" font-size="14" fill="#0f172a">• u + v ทีละสมาชิก (ไม่ใช่ต่อลิสต์)</text><text x="36.0" y="144.0" font-size="14" fill="#0f172a">• norm (3, 4) = 5</text><text x="36.0" y="166.0" font-size="14" fill="#0f172a">• หนึ่งหน่วย v / norm → (0.6, 0.8)</text><rect x="528.0" y="70.0" width="250.0" height="118.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="540.0" y="96.0" font-size="16" fill="#059669" font-weight="bold">2. เมทริกซ์</text><text x="542.0" y="122.0" font-size="14" fill="#0f172a">• c_ij = แถว i · คอลัมน์ j</text><text x="542.0" y="144.0" font-size="14" fill="#0f172a">• A @ B ≠ A * B</text><text x="542.0" y="166.0" font-size="14" fill="#0f172a">• AB ≠ BA, AI = A</text><rect x="22.0" y="395.0" width="250.0" height="118.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="34.0" y="421.0" font-size="16" fill="#d97706" font-weight="bold">3. มุม + atan2</text><text x="36.0" y="447.0" font-size="14" fill="#0f172a">• rad = deg × π / 180</text><text x="36.0" y="469.0" font-size="14" fill="#0f172a">• cos/sin รับเรเดียน</text><text x="36.0" y="491.0" font-size="14" fill="#0f172a">• atan2(y, x): (−1, −1) → −135°</text><rect x="528.0" y="395.0" width="250.0" height="118.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="540.0" y="421.0" font-size="16" fill="#dc2626" font-weight="bold">4. เมทริกซ์การหมุน</text><text x="542.0" y="447.0" font-size="14" fill="#0f172a">• R(θ) = [[c, −s], [s, c]]</text><text x="542.0" y="469.0" font-size="14" fill="#0f172a">• (10, 0) หมุน 30° → (8.66, 5)</text><text x="542.0" y="491.0" font-size="14" fill="#0f172a">• รอบจุด c: R(p − c) + c</text><rect x="275.0" y="445.0" width="250.0" height="118.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="287.0" y="471.0" font-size="16" fill="#7c3aed" font-weight="bold">5. ยานอวกาศ</text><text x="289.0" y="497.0" font-size="14" fill="#0f172a">• ปุ่ม → input_dir → normalize</text><text x="289.0" y="519.0" font-size="14" fill="#0f172a">• atan2(−y, x) − 90 = target</text><text x="289.0" y="541.0" font-size="14" fill="#0f172a">• (target − angle) % 360</text><rect x="280.0" y="237.0" width="240.0" height="96.0" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/><text x="400.0" y="273.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">คณิตศาสตร์ของยาน</text><text x="400.0" y="299.0" font-size="14" fill="#475569" text-anchor="middle">เวกเตอร์ = ทิศ + ขนาด</text><text x="400.0" y="321.0" font-size="14" fill="#475569" text-anchor="middle">เมทริกซ์ = เครื่องหมุนจุด</text></svg>