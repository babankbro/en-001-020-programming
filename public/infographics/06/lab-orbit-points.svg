.0" y="231.0" font-size="15" fill="#dc2626" font-weight="bold">theta</text><text x="610.0" y="231.0" font-size="15" fill="#dc2626" font-weight="bold">จุด (x, y)</text><text x="452.0" y="268.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="524.0" y="268.0" font-size="15" fill="#0f172a" font-weight="bold">0°</text><text x="610.0" y="268.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">( 10.00,   0.00)</text><text x="452.0" y="298.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">15</text><text x="524.0" y="298.0" font-size="15" fill="#0f172a" font-weight="bold">30°</text><text x="610.0" y="298.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(  8.66,   5.00)</text><text x="452.0" y="328.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">45</text><text x="524.0" y="328.0" font-size="15" fill="#0f172a" font-weight="bold">90°</text><text x="610.0" y="328.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(  0.00,  10.00)</text><text x="452.0" y="358.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">90</text><text x="524.0" y="358.0" font-size="15" fill="#0f172a" font-weight="bold">180°</text><text x="610.0" y="358.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(-10.00,   0.00)</text><text x="452.0" y="388.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">180</text><text x="524.0" y="388.0" font-size="15" fill="#0f172a" font-weight="bold">360°</text><text x="610.0" y="388.0" font-size="15" fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="p