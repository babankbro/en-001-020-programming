<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1052" width="800" height="1052" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ยานอวกาศ ตอนที่ 1: จากปุ่มที่กด สู่มุมที่ยานต้องหัน</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: กดปุ่มแล้วโค้ดหา target_angle อย่างไร ทำไมต้องใส่ −y และลบ 90</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">พิกัดจอ (y ชี้ลง)</text><rect x="302.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="336.4" y="116.0" font-size="15" fill="#0f172a">พิกัดคณิตศาสตร์ (y ชี้ขึ้น)</text><rect x="530.9" y="101.0" width="26.0" height="18.0" rx="4" fill="#7c3aed33" stroke="#7c3aed" stroke-width="1.5"/><text x="564.9" y="116.0" font-size="15" fill="#0f172a">มุมของยาน (0 = หัวขึ้น)</text><text x="30.0" y="168.0" font-size="18" fill="#0f172a" font-weight="bold">ตัวอย่างไล่ค่า: กดปุ่ม ↑ ขึ้น และ → ขวา พร้อมกัน</text><rect x="20.0" y="186.0" width="236.0" height="214.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="46.0" cy="214.0" r="14.0" fill="#2563eb"/><text x="46.0" y="219.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="68.0" y="220.0" font-size="16" fill="#2563eb" font-weight="bold">ปุ่ม → input_dir</text><text x="36.0" y="256.0" font-size="15" fill="#0f172a">ขวา: x += 1, ขึ้น: y −= 1</text><text x="36.0" y="284.0" font-size="15" fill="#0f172a">ได้ (1, −1) ยาว √2 ≈ 1.414</text><text x="36.0" y="312.0" font-size="15" fill="#0f172a">normalize: ÷ 1.414</text><rect x="36.0" y="338.0" width="204.0" height="46.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="138.0" y="369.0" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">(0.707, −0.707)</text><line x1="259.0" y1="293.0" x2="278.0" y2="293.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="282.0" y="186.0" width="236.0" height="214.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="308.0" cy="214.0" r="14.0" fill="#d97706"/><text x="308.0" y="219.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="330.0" y="220.0" font-size="16" fill="#d97706" font-weight="bold">กลับแกน y แล้วหามุม</text><text x="298.0" y="256.0" font-size="15" fill="#0f172a">จอ y ชี้ลง → ใส่ −y</text><text x="298.0" y="284.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">atan2(−y, x)</text><text x="298.0" y="312.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">= atan2(0.707, 0.707)</text><rect x="298.0" y="338.0" width="204.0" height="46.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="400.0" y="369.0" font-size="20" fill="#d97706" text-anchor="middle" font-weight="bold">45°</text><line x1="521.0" y1="293.0" x2="540.0" y2="293.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="544.0" y="186.0" width="236.0" height="214.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="570.0" cy="214.0" r="14.0" fill="#7c3aed"/><text x="570.0" y="219.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="592.0" y="220.0" font-size="16" fill="#7c3aed" font-weight="bold">ลบ 90 ให้ 0 = หัวขึ้น</text><text x="560.0" y="256.0" font-size="15" fill="#0f172a">atan2 ให้ 0° ที่ทิศขวา</text><text x="560.0" y="284.0" font-size="15" fill="#0f172a">แต่ภาพยานหัวขึ้นที่มุม 0</text><text x="560.0" y="312.0" font-size="15" fill="#0f172a">45 − 90</text><rect x="560.0" y="338.0" width="204.0" height="46.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="662.0" y="369.0" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="bold">−45°</text><rect x="20.0" y="420.0" width="520.0" height="70.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="280.0" y="462.0" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="bold">target_angle = −45°  → ยานหันเฉียงขึ้นขวา</text><rect x="560.0" y="420.0" width="220.0" height="70.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><path d="M624.1,440.9 L609.3,474.1 L605.8,459.2 L590.9,455.7 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="642.0" y="450.0" font-size="15" fill="#475569">หันตามปุ่ม</text><text x="642.0" y="472.0" font-size="15" fill="#059669" font-weight="bold">ที่กดจริง ✓</text><text x="30.0" y="530.0" font-size="18" fill="#0f172a" font-weight="bold">ครบ 6 กรณี (ทำ ① ② ③ แบบเดียวกัน)</text><rect x="20.0" y="544.0" width="760.0" height="38.0" rx="8" fill="#eff6ff"/><text x="36.0" y="569.0" font-size="16" fill="#2563eb" font-weight="bold">ปุ่ม</text><text x="190.0" y="569.0" font-size="16" fill="#2563eb" font-weight="bold">input_dir</text><text x="360.0" y="569.0" font-size="16" fill="#2563eb" font-weight="bold">② atan2(−y, x)</text><text x="520.0" y="569.0" font-size="16" fill="#2563eb" font-weight="bold">③ target_angle</text><text x="690.0" y="569.0" font-size="16" fill="#2563eb" font-weight="bold">ยานหัน</text><text x="36.0" y="614.0" font-size="16" fill="#0f172a" font-weight="bold">↑ ขึ้น</text><text x="190.0" y="614.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(0, −1)</text><text x="360.0" y="614.0" font-size="17" fill="#d97706" font-weight="bold">90°</text><text x="520.0" y="614.0" font-size="17" fill="#7c3aed" font-weight="bold">90 − 90 = 0°</text><path d="M710.0,593.0 L719.8,618.5 L710.0,612.5 L700.2,618.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="36.0" y="658.0" font-size="16" fill="#0f172a" font-weight="bold">→ ขวา</text><text x="190.0" y="658.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(1, 0)</text><text x="360.0" y="658.0" font-size="17" fill="#d97706" font-weight="bold">0°</text><text x="520.0" y="658.0" font-size="17" fill="#7c3aed" font-weight="bold">0 − 90 = −90°</text><path d="M725.0,652.0 L699.5,661.8 L705.5,652.0 L699.5,642.2 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="36.0" y="702.0" font-size="16" fill="#0f172a" font-weight="bold">← ซ้าย</text><text x="190.0" y="702.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(−1, 0)</text><text x="360.0" y="702.0" font-size="17" fill="#d97706" font-weight="bold">180°</text><text x="520.0" y="702.0" font-size="17" fill="#7c3aed" font-weight="bold">180 − 90 = 90°</text><path d="M695.0,696.0 L720.5,686.2 L714.5,696.0 L720.5,705.8 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="36.0" y="746.0" font-size="16" fill="#0f172a" font-weight="bold">↓ ลง</text><text x="190.0" y="746.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(0, 1)</text><text x="360.0" y="746.0" font-size="17" fill="#d97706" font-weight="bold">−90°</text><text x="520.0" y="746.0" font-size="17" fill="#7c3aed" font-weight="bold">−90 − 90 = −180°</text><path d="M710.0,755.0 L700.2,729.5 L710.0,735.5 L719.8,729.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><rect x="20.0" y="762.0" width="760.0" height="42.0" rx="8" fill="#f5f3ff"/><text x="36.0" y="790.0" font-size="16" fill="#0f172a" font-weight="bold">↑+→ ขึ้น+ขวา</text><text x="190.0" y="790.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(1, −1)</text><text x="360.0" y="790.0" font-size="17" fill="#d97706" font-weight="bold">45°</text><text x="520.0" y="790.0" font-size="17" fill="#7c3aed" font-weight="bold">45 − 90 = −45°</text><path d="M720.6,773.4 L709.5,798.3 L706.8,787.2 L695.7,784.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="36.0" y="834.0" font-size="16" fill="#0f172a" font-weight="bold">↓+← ลง+ซ้าย</text><text x="190.0" y="834.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(−1, 1)</text><text x="360.0" y="834.0" font-size="17" fill="#d97706" font-weight="bold">−135°</text><text x="520.0" y="834.0" font-size="17" fill="#7c3aed" font-weight="bold">−135 − 90 = −225°</text><path d="M699.4,838.6 L710.5,813.7 L713.2,824.8 L724.3,827.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="30.0" y="888.0" font-size="15" fill="#475569">ปุ่มทแยงต้อง normalize ก่อน ไม่งั้นยานเดินทแยงเร็วกว่าแนวตรง ~41% (√2 ≈ 1.414)</text><rect x="20.0" y="908.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="938.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ลืมเครื่องหมายลบหน้า y</text><text x="36.0" y="962.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">atan2(input_dir.y, input_dir.x) - 90</text><text x="36.0" y="986.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">กดขึ้น (0, −1): −90 − 90 = </tspan><tspan fill="#dc2626" font-weight="bold">−180°</tspan></text><text x="36.0" y="1010.0" font-size="15" fill="#0f172a">ยานหันลง ตรงข้ามกับปุ่มที่กด</text><rect x="408.0" y="908.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="938.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: กลับแกน y ก่อนหามุม</text><text x="424.0" y="962.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">atan2(-input_dir.y, input_dir.x) - 90</text><text x="424.0" y="986.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">กดขึ้น (0, −1): 90 − 90 = </tspan><tspan fill="#059669" font-weight="bold">0°</tspan></text><text x="424.0" y="1010.0" font-size="15" fill="#0f172a">ยานหัวขึ้นตามปุ่ม</text></svg>