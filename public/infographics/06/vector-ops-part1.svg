<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="800" height="880" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">บวกเวกเตอร์ u + v แบบ "หางต่อหัว"</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: บวกเวกเตอร์สองตัวแล้วได้ลูกศรอะไร และ NumPy คำนวณอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-blue)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">u = (3, 1)</text><line x1="266.8" y1="111.0" x2="292.8" y2="111.0" stroke="#059669" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-green)"/><text x="300.8" y="116.0" font-size="15" fill="#0f172a">v = (1, 4)</text><line x1="398.0" y1="111.0" x2="424.0" y2="111.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-purple)"/><text x="432.0" y="116.0" font-size="15" fill="#0f172a">ผลลัพธ์ u + v</text><line x1="552.0" y1="111.0" x2="578.0" y2="111.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="586.0" y="116.0" font-size="15" fill="#0f172a">ลำดับสลับ v แล้ว u</text><rect x="20.0" y="146.0" width="390.0" height="420.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">กริดตามสเกล: 1 ช่อง = 1 หน่วย (y ชี้ขึ้น)</text><line x1="76.0" y1="510.0" x2="76.0" y2="230.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="132.0" y1="510.0" x2="132.0" y2="230.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="132.0" y="532.0" font-size="15" fill="#475569" text-anchor="middle">1</text><line x1="188.0" y1="510.0" x2="188.0" y2="230.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="188.0" y="532.0" font-size="15" fill="#475569" text-anchor="middle">2</text><line x1="244.0" y1="510.0" x2="244.0" y2="230.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="244.0" y="532.0" font-size="15" fill="#475569" text-anchor="middle">3</text><line x1="300.0" y1="510.0" x2="300.0" y2="230.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="300.0" y="532.0" font-size="15" fill="#475569" text-anchor="middle">4</text><line x1="356.0" y1="510.0" x2="356.0" y2="230.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="356.0" y="532.0" font-size="15" fill="#475569" text-anchor="middle">5</text><line x1="76.0" y1="510.0" x2="356.0" y2="510.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="76.0" y1="454.0" x2="356.0" y2="454.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="68.0" y="459.0" font-size="15" fill="#475569" text-anchor="end">1</text><line x1="76.0" y1="398.0" x2="356.0" y2="398.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="68.0" y="403.0" font-size="15" fill="#475569" text-anchor="end">2</text><line x1="76.0" y1="342.0" x2="356.0" y2="342.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="68.0" y="347.0" font-size="15" fill="#475569" text-anchor="end">3</text><line x1="76.0" y1="286.0" x2="356.0" y2="286.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="68.0" y="291.0" font-size="15" fill="#475569" text-anchor="end">4</text><line x1="76.0" y1="230.0" x2="356.0" y2="230.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="68.0" y="235.0" font-size="15" fill="#475569" text-anchor="end">5</text><text x="68.0" y="530.0" font-size="15" fill="#475569" text-anchor="end">0</text><text x="362.0" y="515.0" font-size="16" fill="#475569" font-style="italic">x</text><text x="82.0" y="224.0" font-size="16" fill="#475569" font-style="italic">y</text><line x1="76.0" y1="510.0" x2="132.0" y2="286.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><line x1="132.0" y1="286.0" x2="300.0" y2="230.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><line x1="76.0" y1="510.0" x2="244.0" y2="454.0" stroke="#2563eb" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-blue)"/><line x1="244.0" y1="454.0" x2="300.0" y2="230.0" stroke="#059669" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-green)"/><line x1="76.0" y1="510.0" x2="300.0" y2="230.0" stroke="#7c3aed" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-purple)"/><circle cx="244.0" cy="454.0" r="5.0" fill="#2563eb"/><text x="236.0" y="442.0" font-size="16" fill="#2563eb" text-anchor="end" font-weight="bold">(3, 1)</text><circle cx="300.0" cy="230.0" r="5.0" fill="#7c3aed"/><text x="300.0" y="216.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="bold">(4, 5)</text><line x1="286.0" y1="490.4" x2="210.4" y2="465.2" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="210.4" cy="465.2" r="3.5" fill="#475569"/><circle cx="300.0" cy="490.4" r="14.0" fill="#2563eb"/><text x="300.0" y="495.9" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="333.6" y1="364.4" x2="272.0" y2="342.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="272.0" cy="342.0" r="3.5" fill="#475569"/><circle cx="345.6" cy="364.4" r="14.0" fill="#059669"/><text x="345.6" y="369.9" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><line x1="143.2" y1="319.6" x2="193.6" y2="363.3" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="193.6" cy="363.3" r="3.5" fill="#475569"/><circle cx="131.2" cy="311.6" r="14.0" fill="#7c3aed"/><text x="131.2" y="317.1" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><circle cx="444.0" cy="171.0" r="14.0" fill="#2563eb"/><text x="444.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="466.0" y="176.0" font-size="16" fill="#2563eb" font-weight="bold">วาด u จากจุดกำเนิด</text><text x="466.0" y="200.0" font-size="15" fill="#475569">เริ่ม (0, 0) ไป 3 ทางขวา 1 ขึ้น</text><text x="466.0" y="224.0" font-size="15" fill="#475569">ปลายลูกศรอยู่ที่ (3, 1)</text><circle cx="444.0" cy="253.0" r="14.0" fill="#059669"/><text x="444.0" y="258.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="466.0" y="258.0" font-size="16" fill="#059669" font-weight="bold">วาด v ต่อจากปลาย u</text><text x="466.0" y="282.0" font-size="15" fill="#475569">หางของ v วางที่ (3, 1)</text><text x="466.0" y="306.0" font-size="15" fill="#475569">ไปอีก 1 ทางขวา 4 ขึ้น → ถึง (4, 5)</text><circle cx="444.0" cy="335.0" r="14.0" fill="#7c3aed"/><text x="444.0" y="340.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="466.0" y="340.0" font-size="16" fill="#7c3aed" font-weight="bold">ลากจากหางแรกถึงหัวสุดท้าย</text><text x="466.0" y="364.0" font-size="15" fill="#475569">ลูกศรม่วงนี้คือ u + v</text><rect x="430.0" y="392.0" width="350.0" height="92.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="446.0" y="422.0" font-size="17" xml:space="preserve"><tspan fill="#475569">แกน x: </tspan><tspan fill="#2563eb" font-weight="bold">3</tspan><tspan fill="#0f172a"> + </tspan><tspan fill="#059669" font-weight="bold">1</tspan><tspan fill="#0f172a"> = </tspan><tspan fill="#7c3aed" font-weight="bold">4</tspan></text><text x="446.0" y="454.0" font-size="17" xml:space="preserve"><tspan fill="#475569">แกน y: </tspan><tspan fill="#2563eb" font-weight="bold">1</tspan><tspan fill="#0f172a"> + </tspan><tspan fill="#059669" font-weight="bold">4</tspan><tspan fill="#0f172a"> = </tspan><tspan fill="#7c3aed" font-weight="bold">5</tspan></text><text x="764.0" y="439.0" font-size="15" fill="#475569" text-anchor="end">บวกทีละแกน</text><rect x="430.0" y="500.0" width="350.0" height="64.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="605.0" y="539.7" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="bold">u + v = (4, 5)</text><text x="30.0" y="596.0" font-size="15" fill="#475569">เส้นประเทา: วาด v ก่อนแล้วต่อด้วย u ก็ถึง (4, 5) เหมือนกัน → u + v = v + u (สลับที่ได้)</text><text x="30.0" y="636.0" font-size="16" fill="#0f172a" font-weight="bold">ในโค้ด NumPy ทำ "บวกทีละสมาชิก" ให้อัตโนมัติ:</text><rect x="20.0" y="650.0" width="760.0" height="46.0" rx="10" fill="#0f172a"/><text x="36.0" y="680.0" font-size="16" xml:space="preserve"><tspan fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">np.array([3, 1]) + np.array([1, 4])</tspan><tspan fill="#94a3b8">   # ผลลัพธ์ </tspan><tspan fill="#86efac" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[4 5]</tspan></text><rect x="20.0" y="716.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="746.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ใช้ลิสต์ธรรมดา</text><text x="36.0" y="770.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">[3, 1] + [1, 4]</text><text x="36.0" y="794.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ได้ </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[3, 1, 1, 4]</tspan></text><text x="36.0" y="818.0" font-size="15" fill="#0f172a">← ลิสต์ "ต่อกัน" ไม่ได้บวก</text><rect x="408.0" y="716.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="746.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: แปลงเป็น np.array ก่อน</text><text x="424.0" y="770.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">np.array([3, 1]) + np.array([1, 4])</text><text x="424.0" y="794.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ได้ </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[4 5]</tspan></text><text x="424.0" y="818.0" font-size="15" fill="#0f172a">← ไม่มีจุลภาค = อาร์เรย์ NumPy</text></svg>