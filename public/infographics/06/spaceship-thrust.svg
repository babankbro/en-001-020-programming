<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 990" width="800" height="990" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ยานอวกาศ ตอนที่ 3: เร่งตามทิศที่หัน จำกัดความเร็ว และแรงเสียดทาน</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: มุมของยานกลายเป็นความเร่งได้อย่างไร และความเร็วถูกควบคุมอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-purple)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ความเร่ง (thrust)</text><line x1="307.8" y1="111.0" x2="333.8" y2="111.0" stroke="#dc2626" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-red)"/><text x="341.8" y="116.0" font-size="15" fill="#0f172a">ความเร็วก่อนจำกัด</text><line x1="486.6" y1="111.0" x2="512.6" y2="111.0" stroke="#059669" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-green)"/><text x="520.6" y="116.0" font-size="15" fill="#0f172a">ความเร็วหลังจำกัด</text><rect x="20.0" y="146.0" width="760.0" height="300.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="176.0" r="14.0" fill="#7c3aed"/><text x="42.0" y="181.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="64.0" y="182.0" font-size="16" fill="#7c3aed" font-weight="bold">มุม → ความเร่ง: บวก 90 กลับ แล้วใช้ (cos, −sin) × thrust   (thrust = 0.2 ค่าสมมติ)</text><text x="44.0" y="220.0" font-size="15" fill="#475569" font-weight="bold">ตัวอย่าง: ยานหัน −45° (จากตอนที่ 1)</text><text x="44.0" y="252.0" font-size="16" xml:space="preserve"><tspan fill="#0f172a">−45 + 90 = </tspan><tspan fill="#d97706" font-weight="bold">45°</tspan></text><text x="44.0" y="282.0" font-size="16" xml:space="preserve"><tspan fill="#0f172a">cos 45° = 0.707,  −sin 45° = −0.707</tspan></text><text x="44.0" y="312.0" font-size="16" xml:space="preserve"><tspan fill="#0f172a">× 0.2 → accel = </tspan><tspan fill="#7c3aed" font-weight="bold">(0.141, −0.141)</tspan></text><text x="44.0" y="342.0" font-size="16" xml:space="preserve"><tspan fill="#475569">ขนาด = 0.2 พอดี เพราะ (cos, sin) ยาว 1</tspan></text><rect x="44.0" y="380.0" width="330.0" height="48.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="209.0" y="410.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="bold">ยานพุ่งเฉียงขึ้นขวา ตามที่หัว ✓</text><text x="410.0" y="222.0" font-size="15" fill="#2563eb" font-weight="bold">angle</text><text x="480.0" y="222.0" font-size="15" fill="#2563eb" font-weight="bold">+90</text><text x="560.0" y="222.0" font-size="15" fill="#2563eb" font-weight="bold">accel</text><text x="700.0" y="222.0" font-size="15" fill="#2563eb" font-weight="bold">ไปทาง</text><text x="410.0" y="260.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">0</text><text x="480.0" y="260.0" font-size="16" fill="#d97706">90°</text><text x="560.0" y="260.0" font-size="16" fill="#7c3aed" font-family="Consolas, 'Courier New', monospace">(0, −0.2)</text><path d="M708.0,241.0 L716.5,263.1 L708.0,257.9 L699.5,263.1 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><line x1="752.0" y1="266.0" x2="752.0" y2="242.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-purple)"/><text x="410.0" y="304.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">−90</text><text x="480.0" y="304.0" font-size="16" fill="#d97706">0°</text><text x="560.0" y="304.0" font-size="16" fill="#7c3aed" font-family="Consolas, 'Courier New', monospace">(0.2, 0)</text><path d="M721.0,298.0 L698.9,306.4 L704.1,298.0 L698.9,289.6 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><line x1="740.0" y1="298.0" x2="764.0" y2="298.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-purple)"/><text x="410.0" y="348.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">90</text><text x="480.0" y="348.0" font-size="16" fill="#d97706">180°</text><text x="560.0" y="348.0" font-size="16" fill="#7c3aed" font-family="Consolas, 'Courier New', monospace">(−0.2, 0)</text><path d="M695.0,342.0 L717.1,333.6 L711.9,342.0 L717.1,