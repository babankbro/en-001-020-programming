<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="36.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">วงกลมหนึ่งหน่วยและ math.atan2(y, x) (หน่วยองศา, y ชี้ขึ้น)</text><line x1="90.0" y1="305.0" x2="460.0" y2="305.0" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah-ink)"/><line x1="275.0" y1="490.0" x2="275.0" y2="120.0" stroke="#0f172a" stroke-width="1.5" marker-end="url(#ah-ink)"/><text x="464.0" y="323.0" font-size="15" fill="#0f172a" font-weight="bold">x</text><text x="265.0" y="130.0" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold">y</text><circle cx="275.0" cy="305.0" r="145.0" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="420.0" cy="305.0" r="5.0" fill="#2563eb"/><text x="430.0" y="295.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">(1, 0) → 0°</text><circle cx="275.0" cy="160.0" r="5.0" fill="#2563eb"/><text x="285.0" y="150.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">(0, 1) → 90°</text><circle cx="130.0" cy="305.0" r="5.0" fill="#2563eb"/><text x="120.0" y="295.0" font-size="14" fill="#2563eb" text-anchor="end" font-weight="bold">(−1, 0) → 180°</text><circle cx="275.0" cy="450.0" r="5.0" fill="#dc2626"/><text x="285.0" y="474.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">(0, −1) → −90°</text><line x1="275.0" y1="305.0" x2="377.5" y2="202.5" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="377.5" cy="202.5" r="5.0" fill="#059669"/><text x="390.3" y="194.7" font-size="14" fill="#059669" text-anchor="start" font-weight="bold">(1, 1) → 45°</text><line x1="275.0" y1="305.0" x2="172.5" y2="407.5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="172.5" cy="407.5" r="5.0" fill="#dc2626"/><text x="159.7" y="432.3" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold">(−1, −1) → −135°</text><line x1="275.0" y1="305.0" x2="377.5" y2="407.5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="377.5" cy="407.5" r="5.0" fill="#dc2626"/><text x="390.3" y="432.3" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">(1, −1) → −45°</text><line x1="275.0" y1="305.0" x2="172.5" y2="202.5" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="172.5" cy="202.5" r="5.0" fill="#059669"/><text x="159.7" y="194.7" font-size="14" fill="#059669" text-anchor="end" font-weight="bold">(−1, 1) → 135°</text><line x1="275.0" y1="305.0" x2="362.0" y2="189.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="362.0" cy="189.0" r="5.0" fill="#7c3aed"/><text x="372.8" y="179.6" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="bold">(3, 4) → 53.13°</text><path d="M335,305 A60,60 0 0 0 311.0,257.0" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-purple)"/><path d="M315,305 A40,40 0 0 1 246.7,333.3" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah-red)"/><text x="339.0" y="265.0" font-size="14" fill="#7c3aed">ทวนเข็ม = บวก</text><rect x="225.0" y="381.0" width="100.0" height="22.0" rx="4" fill="#ffffff"/><text x="275.0" y="397.0" font-size="14" fill="#dc2626" text-anchor="middle">ตามเข็ม = ลบ</text><rect x="540.0" y="70.0" width="240.0" height="440.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="556.0" y="100.0" font-size="15" fill="#0f172a" font-weight="bold">ช่วงผลลัพธ์ (−180°, 180°]</text><text x="556.0" y="134.0" font-size="15" fill="#2563eb" font-weight="bold">atan2 รับ y ก่อน x</text><text x="556.0" y="158.0" font-size="14" fill="#0f172a">atan2(1, 0) = 90°</text><text x="556.0" y="182.0" font-size="14" fill="#0f172a">atan2(0, 1) = 0°</text><text x="556.0" y="216.0" font-size="15" fill="#dc2626" font-weight="bold">ทำไมไม่ใช้ atan(y/x)</text><text x="556.0" y="240.0" font-size="14" fill="#0f172a">(1, 1): atan(1) = 45°</text><text x="556.0" y="264.0" font-size="14" fill="#dc2626">(−1, −1): atan(1) = 45° ✗</text><text x="556.0" y="288.0" font-size="14" fill="#0f172a">แยกจตุภาคไม่ได้ และ x = 0</text><text x="556.0" y="312.0" font-size="14" fill="#0f172a">ทำให้หารด้วยศูนย์</text><text x="556.0" y="346.0" font-size="15" fill="#7c3aed" font-weight="bold">(3, 4): ขนาด 5</text><text x="556.0" y="370.0" font-size="14" fill="#0f172a">atan2(4, 3) ≈ 53.13°</text><text x="556.0" y="404.0" font-size="15" fill="#0f172a" font-weight="bold">จุดบนวงกลมรัศมี r</text><text x="556.0" y="428.0" font-size="14" fill="#0f172a">(r cos θ, r sin θ)</text><text x="556.0" y="452.0" font-size="14" fill="#0f172a">cos² θ + sin² θ = 1</text></svg>