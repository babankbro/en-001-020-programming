ont-weight="bold">8.66</tspan></text><circle cx="410.0" cy="399.0" r="14.0" fill="#2563eb"/><text x="410.0" y="404.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="432.0" y="404.0" font-size="16" fill="#2563eb" font-weight="bold">y′ = แถว 2 · (10, 0)</text><text x="432.0" y="428.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">0.5×10 + 0.866×0 = </tspan><tspan fill="#059669" font-weight="bold">5</tspan></text><circle cx="410.0" cy="451.0" r="14.0" fill="#059669"/><text x="410.0" y="456.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="432.0" y="456.0" font-size="16" fill="#059669" font-weight="bold">ตรวจ: ระยะจากจุดหมุนเท่าเดิม</text><text x="432.0" y="480.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">√(8.66² + 5²) = √100 = </tspan><tspan fill="#059669" font-weight="bold">10</tspan><tspan fill="#059669" font-weight="bold"> ✓</tspan></text><rect x="396.0" y="502.0" width="384.0" height="64.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="588.0" y="541.4" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">R(30°) · (10, 0) = (8.66, 5)</text><text x="30.0" y="584.0" font-size="17" fill="#0f172a" font-weight="bold">มุมพิเศษที่ควรจำ (หมุนทวนเข็มรอบ (0, 0))</text><rect x="20.0" y="598.0" width="760.0" height="128.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="36.0" y="628.0" font-size="16" fill="#d97706" font-weight="bold">90°</text><text x="140.0" y="628.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(x, y) → (−y, x)</text><text x="380.0" y="628.0" font-size="16" fill="#059669" font-family="Consolas, 'Courier New', monospace">(3, 4) → (−4, 3)</text><text x="580.0" y="628.0" font-size="15" fill="#475569">สลับ x, y แล้วใส่ลบตัวหน้า</text><text x="36.0" y="666.0" font-size="16" fill="#d97706" font-weight="bold">180°</text><text x="140.0" y="666.0" font-size="16" fill="#0