-size="15" fill="#475569">10 &gt; max_speed = 5 → ต้องย่อ</text><circle cx="344.0" cy="877.0" r="14.0" fill="#d97706"/><text x="344.0" y="882.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="366.0" y="882.0" font-size="16" fill="#d97706" font-weight="bold">หารด้วยขนาด: (0.6, 0.8)</text><text x="366.0" y="906.0" font-size="15" fill="#475569">ได้เวกเตอร์หนึ่งหน่วย ทิศเดิม</text><circle cx="344.0" cy="927.0" r="14.0" fill="#059669"/><text x="344.0" y="932.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="366.0" y="932.0" font-size="16" fill="#059669" font-weight="bold">คูณ length = 5</text><text x="366.0" y="956.0" font-size="15" fill="#475569">(0.6×5, 0.8×5)</text><rect x="330.0" y="974.0" width="450.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="555.0" y="1004.6" font-size="19" fill="#059669" text-anchor="middle" font-weight="bold">output: 3.0 4.0</text><rect x="20.0" y="1050.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="1080.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ลืมลบหน้า sin</text><text x="36.0" y="1104.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(cos(r)*thrust, sin(r)*thrust)</text><text x="36.0" y="1128.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">angle 0 → accel = (0, </tspan><tspan fill="#dc2626" font-weight="bold">+0.2</tspan><tspan fill="#0f172a">) พุ่งลง</tspan></text><rect x="408.0" y="1050.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1080.0" font-size="17" fill="#059669" font-weight="bold">✓ y ของจอชี้ลง ต้องใส่ลบ</text><text x="424.0" y="1104.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(cos(r)*thrust, -sin(r)*thrust)</text><text x="424.0" y="1128.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">angle 0 → accel = (0, </tspan><tspan fill="#059669" font-weight="bold">−0.2</tspan><tspan fill="#0f172a">) พุ่งขึ้น</tspan></text></svg>