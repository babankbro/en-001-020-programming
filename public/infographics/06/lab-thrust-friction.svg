<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1172" width="800" height="1172" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ยานอวกาศ: ความเร่ง แรงเสียดทาน และความเร็วสูงสุด (ขั้นตอนที่ 9)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: มุมของยานกลายเป็นความเร่งอย่างไร และความเร็วเปลี่ยนทีละเฟรมเมื่อกด/ปล่อยปุ่ม</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-purple)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ทิศความเร่งบนจอ</text><rect x="307.8" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="341.8" y="116.0" font-size="15" fill="#0f172a">กดปุ่ม (+thrust)</text><rect x="478.0" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="512.0" y="116.0" font-size="15" fill="#0f172a">ปล่อยปุ่ม (×0.97)</text><text x="30.0" y="168.0" font-size="17" fill="#0f172a" font-weight="bold">① accel_from_angle(angle, 0.2): มุมของยาน → ทิศความเร่ง (ข้อ 19)</text><rect x="20.0" y="186.0" width="144.0" height="196.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="92.0" y="210.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">angle = 0</text><circle cx="92.0" cy="262.0" r="30.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><line x1="92.0" y1="262.0" x2="92.0" y2="232.0" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="butt" marker-end="url(#ah-purple)"/><text x="44.0" y="316.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ax =  0.0000</text><text x="44.0" y="338.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ay = −0.2000</text><text x="92.0" y="366.0" font-size="15" fill="#475569" text-anchor="middle">ยานพุ่งขึ้น</text><rect x="172.0" y="186.0" width="144.0" height="196.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="244.0" y="210.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">angle = −90</text><circle cx="244.0" cy="262.0" r="30.0" f