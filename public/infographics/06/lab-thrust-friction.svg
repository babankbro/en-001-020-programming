0.0000</text><text x="500.0" y="338.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ay =  0.2000</text><text x="548.0" y="366.0" font-size="15" fill="#475569" text-anchor="middle">ยานพุ่งลง</text><rect x="628.0" y="186.0" width="144.0" height="196.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="700.0" y="210.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">angle = −45</text><circle cx="700.0" cy="262.0" r="30.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><line x1="700.0" y1="262.0" x2="721.2" y2="240.8" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="butt" marker-end="url(#ah-purple)"/><text x="652.0" y="316.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ax =  0.1414</text><text x="652.0" y="338.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ay = −0.1414</text><text x="700.0" y="366.0" font-size="15" fill="#475569" text-anchor="middle">ยานพุ่งขึ้น+ขวา</text><text x="30.0" y="408.0" font-size="15" fill="#475569">แปลงกลับจากตาราง target_angle พอดี: กดขึ้น → target 0 → accel ชี้ขึ้น (ay ติดลบบนจอ)</text><text x="30.0" y="448.0" font-size="18" fill="#0f172a" font-weight="bold">② ไล่ vy ทีละเฟรม (ข้อ 20): กดขึ้น 3 เฟรม แล้วปล่อย 3 เฟรม</text><rect x="100.0" y="478.0" width="660.0" height="200.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><line x1="100.0" y1="498.0" x2="760.0" y2="498.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><text x="92.0" y="503.0" font-size="15" fill="#475569" text-anchor="end">0</text><line x1="100.0" y1="648.0" x2="760.0" y2="648.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="92.0" y="653.0" font-size="15" fill="#475569" text-anchor="end">−0.6</text><line x1="100.0" y1="573.0" x2="760.0" y2="573.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="92.0" y="578.0" font-size="15" fill="#475569" text-anchor="end">−0.3</text><text x="92.0" y="470.0" font-size="15" fill="#475569" text-anchor="end" font-style="italic">vy</text><rect x="124.0" y="498.0" width="80.0" height="50.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="164.0" y="570.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">−0.20</text><text x="164.0" y="700.0" font-size="15" fill="#475569" text-anchor="middle">กด 1</text><rect x="230.0" y="498.0" width="80.0" height="100.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="270.0" y="620.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">−0.40</text><text x="270.0" y="700.0" font-size="15" fill="#475569" text-anchor="middle">กด 2</text><rect x="336.0" y="498.0" width="80.0" height="150.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="376.0" y="670.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">−0.60</text><text x="376.0" y="700.0" font-size="15" fill="#475569" text-anchor="middle">กด 3</text><rect x="442.0" y="498.0" width="80.0" height="145.5" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="482.0" y="665.5" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">−0.5820</text><text x="482.0" y="700.0" font-size="15" fill="#475569" text-anchor="middle">ปล่อย 1</text><rect x="548.0" y="498.0" width="80.0" height="141.1" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="588.0" y="661.1" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">−0.5645</text><text x="588.0" y="700.0" font-size="15" fill="#475569" text-anchor="middle">ปล่อย 2</text><rect x="654.0" y="498.0" width="80.0" height="136.9" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="694.0" y="656.9" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">−0.5476</text><text x="694.0" y="700.0" font-size="15" fill="#475569" text-anchor="middle">ปล่อย 3</text><text x="164.0" y="518.0" font-size="15" fill="#0f172a"></text><text x="30.0" y="730.0" font-size="15" fill="#0f172a">กด: vy += −0.2 (เพิ่มคงที่) · ปล่อย: vy × 0.97 (ลดทีละ 3% ไม่ใช่ลบ 0.03)</text><text x="30.0" y="754.0" font-size="15" fill="#475569">คำถาม 3.2: 0.6 × 0.97ⁿ &lt; 0.1 → n &gt; 58.8 → 59 เฟรม (0.97⁵⁸×0.6 ≈ 0.1025, 0.97⁵⁹×0.6 ≈ 0.0990)</text><text x="30.0" y="788.0" font-size="18" fill="#0f172a" font-weight="bold">③ จำกัดความเร็วสูงสุด (ข้อ 21): scale_to_length(6, 8, 5)</text><line x1="70.0" y1="998.0" x2="70.0" y2="808.8" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="70.0" y1="998.0" x2="259.2" y2="998.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="92.0" y1="998.0" x2="92.0" y2="808.8" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="976.0" x2="259.2" y2="976.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="114.0" y1="998.0" x2="114.0" y2="808.8" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="954.0" x2="259.2" y2="954.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="136.0" y1="998.0" x2="136.0" y2="808.8" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="932.0" x2="259.2" y2="932.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="158.0" y1="998.0" x2="158.0" y2="808.8" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="910.0" x2="259.2" y2="910.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="180.0" y1="998.0" x2="180.0" y2="808.8" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="888.0" x2="259.2" y2="888.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="202.0" y1="998.0" x2="202.0" y2="808.8" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="866.0" x2="259.2" y2="866.0" stroke="#e2e8f0" st