<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1034" width="800" height="1034" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">@ กับ * ไม่เหมือนกัน และลำดับการคูณสำคัญ</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: ใช้เครื่องหมายไหนคูณเมทริกซ์ สลับลำดับได้ไหม และขนาดต้องเข้ากันอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">คูณเมทริกซ์ (แถว·คอลัมน์)</text><rect x="371.5" y="101.0" width="26.0" height="18.0" rx="4" fill="#dc262633" stroke="#dc2626" stroke-width="1.5"/><text x="405.5" y="116.0" font-size="15" fill="#0f172a">คูณทีละตำแหน่ง ไม่ใช่คูณเมทริกซ์</text><rect x="20.0" y="150.0" width="240.0" height="300.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="46.0" cy="178.0" r="14.0" fill="#059669"/><text x="46.0" y="183.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="68.0" y="184.0" font-size="17" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">P @ Q</text><text x="113.0" y="247.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">19</text><text x="167.0" y="247.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">22</text><text x="113.0" y="301.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">43</text><text x="167.0" y="301.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">50</text><path d="M94.0,212 L86.0,212 L86.0,320 L94.0,320" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M186.0,212 L194.0,212 L194.0,320 L186.0,320" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="36.0" y="360.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">c₁₁ = 1×5 + 2×7 = 19</text><text x="36.0" y="388.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">c₁₂ = 1×6 + 2×8 = 22</text><text x="140.0" y="434.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">คูณเมทริกซ์ ✓</text><rect x="280.0" y="150.0" width="240.0" height="300.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="306.0" cy="178.0" r="14.0" fill="#059669"/><text x="306.0" y="183.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="328.0" y="184.0" font-size="17" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">Q @ P  (สลับลำดับ)</text><text x="373.0" y="247.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">23</text><text x="427.0" y="247.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">34</text><text x="373.0" y="301.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">31</text><text x="427.0" y="301.6" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">46</text><path d="M354.0,212 L346.0,212 L346.0,320 L354.0,320" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M446.0,212 L454.0,212 L454.0,320 L446.0,320" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="296.0" y="360.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">c₁₁ = 5×1 + 6×3 = 23</text><text x="296.0" y="388.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">c₁₂ = 5×2 + 6×4 = 34</text><text x="400.0" y="434.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">ได้ค่าใหม่ ≠ P @ Q</text><rect x="540.0" y="150.0" width="240.0" height="300.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><circle cx="566.0" cy="178.0" r="14.0" fill="#dc2626"/><text x="566.0" y="183.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="588.0" y="184.0" font-size="17" fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">P * Q</text><text x="633.0" y="247.6" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="bold">5</text><text x="687.0" y="247.6" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="bold">12</text><text x="633.0" y="301.6" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="bold">21</text><text x="687.0" y="301.6" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="bold">32</text><path d="M614.0,212 L606.0,212 L606.0,320 L614.0,320" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M706.0,212 L714.0,212 L714.0,320 L706.0,320" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="556.0" y="360.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">1×5 = 5,  2×6 = 12</text><text x="556.0" y="388.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">3×7 = 21,  4×8 = 32</text><text x="660.0" y="434.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">แค่คูณตัวที่ตรงกัน</text><text x="400.0" y="482.0" font-size="16" fill="#475569" text-anchor="middle">P = [[1, 2], [3, 4]]   Q = [[5, 6], [7, 8]]   ชุดเดียวกันทั้งสามกล่อง</text><rect x="20.0" y="504.0" width="760.0" height="210.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="534.0" r="14.0" fill="#0f172a"/><text x="42.0" y="539.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="64.0" y="540.0" font-size="17" fill="#0f172a" font-weight="bold">ขนาดต้องเข้ากัน: คอลัมน์ของตัวหน้า = แถวของตัวหลัง</text><rect x="60.0" y="566.0" width="78.0" height="52.0" rx="4" fill="#05966922" stroke="#059669" stroke-width="2"/><text x="99.0" y="640.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">2×3</text><text x="160.0" y="600.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">@</text><rect x="186.0" y="556.0" width="52.0" height="78.0" rx="4" fill="#05966922" stroke="#059669" stroke-width="2"/><text x="212.0" y="656.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">3×2</text><text x="262.0" y="600.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">=</text><rect x="286.0" y="570.0" width="52.0" height="52.0" rx="4" fill="#05966922" stroke="#059669" stroke-width="2"/><text x="312.0" y="644.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">2×2</text><text x="60.0" y="690.0" font-size="16" fill="#059669" font-weight="bold">3 = 3 ✓ ได้ขนาด 2×2 (แถวตัวหน้า × คอลัมน์ตัวหลัง)</text><rect x="440.0" y="566.0" width="78.0" height="52.0" rx="4" fill="#dc262622" stroke="#dc2626" stroke-width="2"/><text x="479.0" y="640.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">2×3</text><text x="540.0" y="600.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">@</text><rect x="566.0" y="566.0" width="78.0" height="52.0" rx="4" fill="#dc262622" stroke="#dc2626" stroke-width="2"/><text x="605.0" y="640.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">2×3</text><text x="680.0" y="600.0" font-size="28" fill="#dc2626" text-anchor="middle" font-weight="bold">✗</text><text x="440.0" y="670.0" font-size="16" fill="#dc2626" font-weight="bold">3 ≠ 2 → ValueError</text><text x="440.0" y="694.0" font-size="15" fill="#475569">คอลัมน์ตัวหน้า 3 แต่แถวตัวหลัง 2 → คูณไม่ได้</text><rect x="20.0" y="730.0" width="760.0" height="150.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="760.0" r="14.0" fill="#2563eb"/><text x="42.0" y="765.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="64.0" y="766.0" font-size="17" fill="#0f172a" font-weight="bold">เมทริกซ์ × เวกเตอร์ = ทุกแถว · เวกเตอร์ (ใช้ในการหมุนจุด หัวข้อ 4)</text><text x="78.0" y="814.5" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="114.0" y="814.5" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="78.0" y="850.5" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="114.0" y="850.5" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">4</text><path d="M68,790 L60,790 L60,862 L68,862" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M124,790 L132,790 L132,862 L124,862" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="150.0" y="832.0" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">@</text><text x="190.0" y="814.5" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">5</text><text x="190.0" y="850.5" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">6</text><path d="M180,790 L172,790 L172,862 L180,862" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M200,790 L208,790 L208,862 L200,862" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="232.0" y="832.0" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">=</text><text x="260.0" y="816.0" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">1×5 + 2×6 = 5 + 12 = 17</text><text x="260.0" y="852.0" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">3×5 + 4×6 = 15 + 24 = 39</text><rect x="560.0" y="790.0" width="200.0" height="72.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="660.0" y="814.0" font-size="15" fill="#475569" text-anchor="middle">M @ x</text><text x="660.0" y="846.0" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="bold">[17 39]</text><rect x="20.0" y="900.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="930.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ใช้ * คูณเมทริกซ์</text><text x="36.0" y="954.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">P * Q  →  [[ 5 12] [21 32]]</text><text x="36.0" y="978.0" font-size="15" fill="#0f172a">คูณทีละตำแหน่ง ไม่ใช่แถว·คอลัมน์</text><rect x="408.0" y="900.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="930.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: ใช้ @ หรือ np.matmul</text><text x="424.0" y="954.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">P @ Q  →  [[19 22] [43 50]]</text><text x="424.0" y="978.0" font-size="15" fill="#0f172a">และระวังลำดับ: P @ Q ≠ Q @ P</text></svg>