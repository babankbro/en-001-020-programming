<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ลบเวกเตอร์ B − A: ลูกศรชี้จาก A ไป B</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: จะหาทิศทางและระยะจากจุด A ไปจุด B ได้อย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#dc2626" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-red)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">B − A (จาก A ไป B)</text><line x1="334.8" y1="111.0" x2="360.8" y2="111.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="368.8" y="116.0" font-size="15" fill="#0f172a">ลูกศรเดียวกันย้ายมาที่ (0, 0)</text><line x1="584.9" y1="111.0" x2="610.9" y2="111.0" stroke="#d97706" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-orange)"/><text x="618.9" y="116.0" font-size="15" fill="#0f172a">เวกเตอร์หนึ่งหน่วย</text><rect x="20.0" y="146.0" width="410.0" height="400.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">กริดตามสเกล: 1 ช่อง = 1 หน่วย</text><line x1="60.0" y1="500.0" x2="60.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="60.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">−4</text><line x1="100.0" y1="500.0" x2="100.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="100.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">−3</text><line x1="140.0" y1="500.0" x2="140.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="140.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">−2</text><line x1="180.0" y1="500.0" x2="180.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="180.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">−1</text><line x1="220.0" y1="500.0" x2="220.0" y2="220.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="260.0" y1="500.0" x2="260.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="260.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">1</text><line x1="300.0" y1="500.0" x2="300.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="300.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">2</text><line x1="340.0" y1="500.0" x2="340.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="340.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">3</text><line x1="380.0" y1="500.0" x2="380.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="380.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">4</text><line x1="420.0" y1="500.0" x2="420.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="420.0" y="522.0" font-size="15" fill="#475569" text-anchor="middle">5</text><line x1="60.0" y1="500.0" x2="420.0" y2="500.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="60.0" y1="460.0" x2="420.0" y2="460.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="465.0" font-size="15" fill="#475569" text-anchor="end">1</text><line x1="60.0" y1="420.0" x2="420.0" y2="420.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="425.0" font-size="15" fill="#475569" text-anchor="end">2</text><line x1="60.0" y1="380.0" x2="420.0" y2="380.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="385.0" font-size="15" fill="#475569" text-anchor="end">3</text><line x1="60.0" y1="340.0" x2="420.0" y2="340.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="345.0" font-size="15" fill="#475569" text-anchor="end">4</text><line x1="60.0" y1="300.0" x2="420.0" y2="300.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="305.0" font-size="15" fill="#475569" text-anchor="end">5</text><line x1="60.0" y1="260.0" x2="420.0" y2="260.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="265.0" font-size="15" fill="#475569" text-anchor="end">6</text><line x1="60.0" y1="220.0" x2="420.0" y2="220.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="225.0" font-size="15" fill="#475569" text-anchor="end">7</text><text x="212.0" y="520.0" font-size="15" fill="#475569" text-anchor="end">0</text><text x="426.0" y="505.0" font-size="16" fill="#475569" font-style="italic">x</text><text x="226.0" y="214.0" font-size="16" fill="#475569" font-style="italic">y</text><circle cx="220.0" cy="500.0" r="40.0" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="220.0" y1="500.0" x2="100.0" y2="340.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="butt" stroke-dasharray="7 5" marker-end="url(#ah-red)"/><line x1="380.0" y1="460.0" x2="260.0" y2="300.0" stroke="#dc2626" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-red)"/><line x1="220.0" y1="500.0" x2="196.0" y2="468.0" stroke="#d97706" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-orange)"/><circle cx="380.0" cy="460.0" r="6.0" fill="#0f172a"/><text x="370.0" y="484.0" font-size="17" fill="#0f172a" text-anchor="end" font-weight="bold">A (4, 1)</text><circle cx="260.0" cy="300.0" r="6.0" fill="#0f172a"/><text x="270.0" y="292.0" font-size="17" fill="#0f172a" font-weight="bold">B (1, 5)</text><text x="96.0" y="328.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">(−3, 4)</text><text x="180.0" y="465.0" font-size="15" fill="#d97706" text-anchor="end" font-weight="bold">(−0.6, 0.8)</text><circle cx="212.0" cy="272.0" r="14.0" fill="#0f172a"/><text x="212.0" y="277.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="226.0" y1="272.0" x2="254.0" y2="297.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="254.0" cy="297.0" r="3.5" fill="#475569"/><line x1="364.0" y1="344.0" x2="320.0" y2="380.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="320.0" cy="380.0" r="3.5" fill="#475569"/><circle cx="378.0" cy="340.0" r="14.0" fill="#dc2626"/><text x="378.0" y="345.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><line x1="88.0" y1="428.0" x2="160.0" y2="420.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="160.0" cy="420.0" r="3.5" fill="#475569"/><circle cx="82.0" cy="428.0" r="14.0" fill="#dc2626"/><text x="82.0" y="433.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><line x1="284.0" y1="452.0" x2="206.0" y2="480.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="206.0" cy="480.0" r="3.5" fill="#475569"/><circle cx="298.0" cy="452.0" r="14.0" fill="#d97706"/><text x="298.0" y="457.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><circle cx="460.0" cy="171.0" r="14.0" fill="#0f172a"/><text x="460.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="482.0" y="176.0" font-size="16" fill="#0f172a" font-weight="bold">กำหนดจุดสองจุด</text><text x="482.0" y="200.0" font-size="15" fill="#475569">A = (4, 1) ศัตรู, B = (1, 5) ผู้เล่น</text><circle cx="460.0" cy="225.0" r="14.0" fill="#dc2626"/><text x="460.0" y="230.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="482.0" y="230.0" font-size="16" fill="#dc2626" font-weight="bold">ปลายทาง − ต้นทาง</text><text x="482.0" y="254.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">B − A = (1 − 4, 5 − 1) = </tspan><tspan fill="#dc2626" font-weight="bold">(−3, 4)</tspan></text><text x="482.0" y="278.0" font-size="15" fill="#475569">ลูกศรแดงเริ่มที่ A ปลายอยู่ที่ B พอดี</text><circle cx="460.0" cy="303.0" r="14.0" fill="#dc2626"/><text x="460.0" y="308.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="482.0" y="308.0" font-size="16" fill="#dc2626" font-weight="bold">หาความยาว (ระยะห่าง)</text><text x="482.0" y="332.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">√((−3)² + 4²) = √(9 + 16) = √25 = </tspan><tspan fill="#dc2626" font-weight="bold">5</tspan></text><text x="482.0" y="356.0" font-size="15" fill="#475569">ย้ายมาเริ่มที่ (0, 0) ก็ยาว 5 ช่องเท่าเดิม</text><circle cx="460.0" cy="381.0" r="14.0" fill="#d97706"/><text x="460.0" y="386.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="482.0" y="386.0" font-size="16" fill="#d97706" font-weight="bold">หารด้วยความยาว → ยาว 1</text><text x="482.0" y="410.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(−3/5, 4/5) = </tspan><tspan fill="#d97706" font-weight="bold">(−0.6, 0.8)</tspan></text><text x="482.0" y="434.0" font-size="15" fill="#475569">ทิศเดิม แต่ปลายแตะวงกลมรัศมี 1</text><rect x="446.0" y="460.0" width="334.0" height="76.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="613.0" y="484.0" font-size="15" fill="#475569" text-anchor="middle">ผลลัพธ์: ทิศ (เวกเตอร์หนึ่งหน่วย) และระยะ</text><text x="613.0" y="520.0" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">(−0.6, 0.8)  ระยะ 5</text><rect x="20.0" y="566.0" width="760.0" height="46.0" rx="10" fill="#0f172a"/><text x="36.0" y="596.0" font-size="16" xml:space="preserve"><tspan fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">d = B - A; n = np.linalg.norm(d); d / n</tspan><tspan fill="#94a3b8">  # </tspan><tspan fill="#86efac" font-weight="bold" font-family="Consolas, 'Courier New', monospace">5.0  [-0.6  0.8]</tspan></text><rect x="20.0" y="630.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="660.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ลบสลับลำดับ</text><text x="36.0" y="684.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">A − B = </tspan><tspan fill="#dc2626" font-weight="bold">(3, −4)</tspan></text><text x="36.0" y="708.0" font-size="15" fill="#0f172a">ชี้จาก B ไป A (กลับทิศ)</text><text x="36.0" y="732.0" font-size="15" fill="#0f172a">ศัตรูจะวิ่งหนีผู้เล่นแทนที่จะไล่</text><rect x="408.0" y="630.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="660.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: "ปลายทาง − ต้นทาง"</text><text x="424.0" y="684.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ไป B จาก A → B − A = </tspan><tspan fill="#059669" font-weight="bold">(−3, 4)</tspan></text><text x="424.0" y="708.0" font-size="15" fill="#0f172a">ระยะ 5 เท่ากันทั้งสองแบบ ต่างแค่ทิศ</text><text x="424.0" y="732.0" font-size="15" fill="#0f172a">ก่อนหารเช็ก if length() &gt; 0 กันหาร 0</text></svg>