<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1134" width="800" height="1134" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ผลลัพธ์ NumPy ที่ควรได้: เวกเตอร์ (ขั้นตอนที่ 1–2)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: แต่ละบรรทัดในเซลล์คำนวณอย่างไร และทำไมลิสต์ให้ผลต่างจาก np.array</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">np.array (คิดทีละตำแหน่ง)</text><rect x="374.8" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="408.8" y="116.0" font-size="15" fill="#0f172a">ลิสต์ไพทอน</text><rect x="515.8" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="549.8" y="116.0" font-size="15" fill="#0f172a">ผลลัพธ์</text><text x="30.0" y="168.0" font-size="18" fill="#0f172a" font-weight="bold">① ขั้นตอนที่ 1: a = [1, 2, 3], b = [3, 3, 0] — เครื่องหมายเดียวกัน ผลต่างกัน</text><rect x="20.0" y="190.0" width="370.0" height="250.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="36.0" y="218.0" font-size="17" fill="#d97706" font-weight="bold">ลิสต์: + คือต่อกัน, * 2 คือซ้ำ</text><text x="36.0" y="252.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a + b</text><rect x="36.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="55.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="78.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="97.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="120.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="139.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="162.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="181.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="204.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="223.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="246.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="265.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="36.0" y="326.0" font-size="15" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ [1, 2, 3, 3, 3, 0]  (6 ตัว)</text><text x="36.0" y="362.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a * 2</text><rect x="36.0" y="372.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="55.0" y="396.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="78.0" y="372.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="97.0" y="396.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="120.0" y="372.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="139.0" y="396.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="162.0" y="372.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="181.0" y="396.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="204.0" y="372.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="223.0" y="396.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="246.0" y="372.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="265.0" y="396.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="36.0" y="430.0" font-size="15" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ [1, 2, 3, 1, 2, 3]</text><rect x="410.0" y="190.0" width="370.0" height="250.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="426.0" y="218.0" font-size="17" fill="#2563eb" font-weight="bold">np.array: คิดทีละตำแหน่ง</text><text x="426.0" y="252.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">u + v</text><rect x="426.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="445.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="468.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="487.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="510.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="529.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="560.0" y="286.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">+</text><rect x="574.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="593.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="616.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="635.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="658.0" y="262.0" width="38.0" height="36.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="677.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="426.0" y="326.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ [4 5 3]  (3 ตัวเท่าเดิม)</text><text x="426.0" y="362.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">u * 2   u ** 2   u - v</text><text x="426.0" y="394.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ [2 4 6]   [1 4 9]</text><text x="426.0" y="422.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ [-2 -1  3]</text><text x="30.0" y="468.0" font-size="15" fill="#475569">สังเกตการพิมพ์: ลิสต์มีจุลภาค [1, 2, 3] · np.array คั่นด้วยช่องว่าง [4 5 3] (คำถาม 1.1)</text><text x="30.0" y="506.0" font-size="18" fill="#0f172a" font-weight="bold">② ขั้นตอนที่ 2: ขนาด เวกเตอร์หนึ่งหน่วย และผลคูณจุด</text><rect x="20.0" y="522.0" width="330.0" height="330.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="550.0" font-size="17" fill="#0f172a" font-weight="bold">w = (3, 4) ตามสเกล 1 หน่วย = 50 px</text><line x1="64.0" y1="812.0" x2="64.0" y2="582.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="64.0" y1="812.0" x2="324.0" y2="812.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="114.0" y1="812.0" x2="114.0" y2="582.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="64.0" y1="762.0" x2="324.0" y2="762.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="114.0" y="832.0" font-size="15" fill="#475569" text-anchor="middle">1</text><line x1="164.0" y1="812.0" x2="164.0" y2="582.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="64.0" y1="712.0" x2="324.0" y2="712.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="164.0" y="832.0" font-size="15" fill="#475569" text-anchor="middle">2</text><line x1="214.0" y1="812.0" x2="214.0" y2="582.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="64.0" y1="662.0" x2="324.0" y2="662.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="214.0" y="832.0" font-size="15" fill="#475569" text-anchor="middle">3</text><line x1="264.0" y1="812.0" x2="264.0" y2="582.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="64.0" y1="612.0" x2="324.0" y2="612.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="264.0" y="832.0" font-size="15" fill="#475569" text-anchor="middle">4</text><line x1="314.0" y1="812.0" x2="314.0" y2="582.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="314.0" y="832.0" font-size="15" fill="#475569" text-anchor="middle">5</text><text x="56.0" y="767.0" font-size="15" fill="#475569" text-anchor="end">1</text><text x="56.0" y="717.0" font-size="15" fill="#475569" text-anchor="end">2</text><text x="56.0" y="667.0" font-size="15" fill="#475569" text-anchor="end">3</text><text x="56.0" y="617.0" font-size="15" fill="#475569" text-anchor="end">4</text><line x1="64.0" y1="812.0" x2="214.0" y2="612.0" stroke="#2563eb" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-blue)"/><line x1="64.0" y1="812.0" x2="94.0" y2="772.0" stroke="#059669" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-green)"/><text x="222.0" y="616.0" font-size="15" fill="#2563eb" font-weight="bold">w = (3, 4)</text><text x="141.5" y="697.0" font-size="15" fill="#2563eb" text-anchor="end" font-weight="bold">|w| = 5.0</text><text x="104.0" y="790.0" font-size="15" fill="#059669" font-weight="bold">ŵ = (0.6, 0.8)</text><circle cx="384.0" cy="553.0" r="14.0" fill="#2563eb"/><text x="384.0" y="558.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="406.0" y="558.0" font-size="16" fill="#2563eb" font-weight="bold">norm(v), v = (3, 3, 0)</text><text x="406.0" y="582.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">√(3² + 3² + 0²) = √18 ≈ </tspan><tspan fill="#059669" font-weight="bold">4.242640687119285</tspan></text><circle cx="384.0" cy="603.0" r="14.0" fill="#2563eb"/><text x="384.0" y="608.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="406.0" y="608.0" font-size="16" fill="#2563eb" font-weight="bold">norm((3, 4))</text><text x="406.0" y="632.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">√(9 + 16) = √25 = </tspan><tspan fill="#059669" font-weight="bold">5.0</tspan></text><circle cx="384.0" cy="653.0" r="14.0" fill="#059669"/><text x="384.0" y="658.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="406.0" y="658.0" font-size="16" fill="#059669" font-weight="bold">w_hat = w / norm(w)</text><text x="406.0" y="682.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(3/5, 4/5) = </tspan><tspan fill="#059669" font-weight="bold">[0.6 0.8]</tspan><tspan fill="#0f172a">  ยาว </tspan><tspan fill="#059669" font-weight="bold">1.0</tspan></text><circle cx="384.0" cy="703.0" r="14.0" fill="#7c3aed"/><text x="384.0" y="708.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="406.0" y="708.0" font-size="16" fill="#7c3aed" font-weight="bold">np.dot(u, v)</text><text x="406.0" y="732.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">1×3 + 2×3 + 3×0 = </tspan><tspan fill="#059669" font-weight="bold">9</tspan></text><circle cx="384.0" cy="753.0" r="14.0" fill="#d97706"/><text x="384.0" y="758.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="406.0" y="758.0" font-size="16" fill="#d97706" font-weight="bold">ข้อ 4: u = (2, −3, 1), v = (4, 0, −2)</text><text x="406.0" y="782.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">u+v = </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[ 6 -3 -1]</tspan><tspan fill="#0f172a">  u−v = </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[-2 -3  3]</tspan></text><text x="406.0" y="806.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">u·v = 8 + 0 − 2 = </tspan><tspan fill="#059669" font-weight="bold">6</tspan><tspan fill="#0f172a">   |v| = √20 ≈ </tspan><tspan fill="#059669" font-weight="bold">4.47</tspan></text><text x="30.0" y="878.0" font-size="18" fill="#0f172a" font-weight="bold">ข้อผิดพลาดที่พบบ่อยในขั้นตอนที่ 1–2</text><rect x="20.0" y="894.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="924.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ใช้ลิสต์แทน np.array</text><text x="36.0" y="948.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">[1, 2, 3] + [3, 3, 0]</text><text x="36.0" y="972.0" font-size="15" fill="#0f172a">ได้ [1, 2, 3, 3, 3, 0] ไม่ใช่การบวกเวกเตอร์</text><rect x="408.0" y="894.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="924.0" font-size="17" fill="#059669" font-weight="bold">✓ แปลงเป็น np.array ก่อนคำนวณ</text><text x="424.0" y="948.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">np.array(a) + np.array(b)</text><text x="424.0" y="972.0" font-size="15" fill="#0f172a">ได้ [4 5 3]</text><rect x="20.0" y="1012.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="1042.0" font-size="17" fill="#dc2626" font-weight="bold">✗ normalize เวกเตอร์ศูนย์</text><text x="36.0" y="1066.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">np.array([0, 0]) / 0</text><text x="36.0" y="1090.0" font-size="15" fill="#0f172a">ได้ [nan nan] + RuntimeWarning</text><rect x="408.0" y="1012.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1042.0" font-size="17" fill="#059669" font-weight="bold">✓ ตรวจขนาดก่อนหาร</text><text x="424.0" y="1066.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">if input_dir.length() &gt; 0:</text><text x="424.0" y="1090.0" font-size="15" fill="#0f172a">แล้วค่อย normalize</text></svg>