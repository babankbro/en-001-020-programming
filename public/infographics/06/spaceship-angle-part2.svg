ke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">มุมปัจจุบัน</text><line x1="260.3" y1="111.0" x2="286.3" y2="111.0" stroke="#d97706" stroke-width="3" stroke-linecap="round"/><text x="294.3" y="116.0" font-size="15" fill="#0f172a">มุมเป้าหมาย</text><line x1="400.2" y1="111.0" x2="426.2" y2="111.0" stroke="#059669" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-green)"/><text x="434.2" y="116.0" font-size="15" fill="#0f172a">ทางสั้น ✓</text><line x1="528.2" y1="111.0" x2="554.2" y2="111.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="562.2" y="116.0" font-size="15" fill="#0f172a">ทางไกล ✗</text><rect x="20.0" y="146.0" width="340.0" height="380.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">หน้าปัดมุมของยาน</text><circle cx="190.0" cy="340.0" r="120.0" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="190.0" cy="220.0" r="4.0" fill="#475569"/><text x="190.0" y="203.0" font-size="15" fill="#475569" text-anchor="middle">0 (หัวขึ้น)</text><circle cx="70.0" cy="340.0" r="4.0" fill="#475569"/><text x="48.0" y="345.0" font-size="15" fill="#475569" text-anchor="middle">90</text><circle cx="310.0" cy="340.0" r="4.0" fill="#475569"/><text x="332.0" y="345.0" font-size="15" fill="#475569" text-anchor="middle">−90</text><circle cx="190.0" cy="460.0" r="4.0" fill="#475569"/><text x="190.0" y="500.0" font-size="15" fill="#475569" text-anchor="middle">±180</text><text x="36.0" y="200.0" font-size="15" fill="#475569">มุมบวก = ทวนเข็ม</text><line x1="190.0" y1="340.0" x2="170.2" y2="452.3" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="190.0" y1="340.0" x2="209.8" y2="452.3" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><path d="M175.1,424.7 L169.2,423.4 L163.4,421.8 L157.8,419.7 L152.3,417.3 L147.0,414.5 L141.9,411.3 L137.1,407.8 L132.5,403.9 L128.1,399.7 L124.1,395.3 L120.4,390.5 L117.1,385.6 L114.1,380.4 L111.4,375.0 L109.2,369.4 L107.3,363.7 L105.9,357.9 L104.8,352.0 L104.2,346.0 L104.0,340.0 L104.2,334.0 L104.8,328.0 L105.9,322.1 L107.3,316.3 L109.2,310.6 L111.4,305.0 L114.1,299.6 L117.1,294.4 L120.4,289.5 L124.1,284.7 L128.1,280.3 L132.5,276.1 L137.1,272.2 L141.9,268.7 L147.0,265.5 L152.3,262.7 L157.8,260.3 L163.4,258.2 L169.2,256.6 L175.1,255.3 L181.0,254.5 L187.0,254.1 L193.0,254.1 L199.0,254.5 L204.9,255.3 L210.8,256.6 L216.6,258.2 L222.2,260.3 L227.7,262.7 L233.0,265.5 L238.1,268.7 L242.9,272.2 L247.5,276.1 L251.9,280.3 L255.9,284.7 L259.6,289.5 L262.9,294.4 L265.9,299.6 L268.6,305.0 L270.8,310.6 L272.7,316.3 L274.1,322.1 L275.2,328.0 L275.8,334.0 L276.0,340.0 L275.8,346.0 L275.2,352.0 L274.1,357.9 L272.7,363.7 L270.8,369.4 L268.6,375.0 L265.9,380.4 L262.9,385.6 L259.6,390.5 L255.9,395.3 L251.9,399.7 L247.5,403.9 L242.9,407.8 L238.1,411.3 L233.0,414.5 L227.7,417.3 L222.2,419.7 L216.6,421.8 L210.8,423.4 L204.9,424.7" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ah-red)"/><path d="M166.4,473.9 L171.1,474.7 L175.8,475.3 L180.5,475.7 L185.3,475.9 L190.0,476.0 L194.7,475.9 L199.5,475.7 L204.2,475.3 L208.9,474.7 L213.6,473.9" stroke="#059669" stroke-width="5" fill="none" marker-end="url(#ah-green)"/><text x="136.0" y="454.0" font-size="15" fill="#2563eb" text-anchor="end" font-weight="bold">ปัจจุบัน 170°</text><text x="244.0" y="454.0" font-size="15" fill="#d97706" font-weight="bold">เป้า −170°</text><text x="190.0" y="524.0" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">ทางสั้น +20° ✓</text><text x="190.0" y="322.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">−340° ✗</text><circle cx="390.0" cy="171.0" r="14.0" fill="#dc2626"/><text x="390.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="412.0" y="176.0" font-size="16" fill="#dc2626" font-weight="bold">ลบมุมตรง ๆ</text><text x="412.0" y="200.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">−170 − 170 = </tspan><tspan fill="#dc2626" font-weight="bold">−340</tspan><tspan fill="#dc2626">  (เกือบครบรอบ!)</tspan></text><circle cx="390.0" cy="223.0" r="14.0" fill="#0f172a"/><text x="390.0" y="228.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="412.0" y="228.0" font-size="16" fill="#0f172a" font-weight="bold">บังคับเข้าช่วง [0, 360) ด้วย % 360</text><text x="412.0" y="252.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">−340 % 360 = </tspan><tspan fill="#0f172a" font-weight="bold">20</tspan></text><circle cx="390.0" cy="275.0" r="14.0" fill="#059669"/><text x="390.0" y="280.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="412.0" y="280.0" font-size="16" fill="#059669" font-weight="bold">ถ้าเกิน 180 ให้ลบ 360</text><text x="412.0" y="304.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">20 ไม่เกิน 180 → angle_diff = </tspan><tspan fill="#059669" font-weight="bold">+20</tspan></text><rect x="376.0" y="324.0" width="404.0" height="96.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="390.0" y="350.0" font-size="15" fill="#475569" font-weight="bold">อีกตัวอย่าง: angle = 10, target = 350</text><text x="390.0" y="376.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">350 − 10 = 340 → % 360 = 340</tspan></text><text x="390.0" y="402.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">340 &gt; 180 → 340 − 360 = </tspan><tspan fill="#059669" font-weight="bold">−20</tspan><tspan fill="#475569"> (หมุนลบ 20°)</tspan></text><rect x="376.0" y="436.0" width="404.0" height="58.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="578.0" y="472.4" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">angle_diff = +20° (ทางสั้น)</text><rect x="20.0" y="546.0" width="760.0" height="250.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="576.0" r="14.0" fill="#7c3aed"/><text x="42.0" y="581.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="64.0" y="582.0" font-size="16" fill="#7c3aed" font-weight="bold">หมุนทีละ 15% ของมุมที่เหลือ: angle += angle_diff × 0.15  (ตัวอย่างเริ่ม 0 เป้า −90)</text><line x1="80.0" y1="660.0" x2="740.0" y2="660.0" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><line x1="80.0" y1="652.0" x2="80.0" y2="668.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="80.0" y="718.0" font-size="15" fill="#475569" text-anchor="middle">0°</text><line x1="300.0" y1="652.0" x2="300.0" y2="668.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="300.0" y="718.0" font-size="15" fill="#475569" text-anchor="middle">−30°</text><line x1="520.0" y1="652.0" x2="520.0" y2="668.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="520.0" y="718.0" font-size="15" fill="#475569" text-anchor="middle">−60°</text><line x1="740.0" y1="652.0" x2="740.0" y2="668.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="740.0" y="718.0" font-size="15" fill="#475569" text-anchor="middle">−90°</text><text x="740.0" y="642.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">เป้า</text><circle cx="740.0" cy="660.0" r="7.0" fill="#d97706"/><circle cx="80.0" cy="660.0" r="7.0" fill="#2563eb"/><text x="80.0" y="638.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">เริ่ม 0</text><circle cx="179.0" cy="660.0" r="7.0" fill="#7c3aed"/><text x="179.0" y="616.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">เฟรม 1: −13.5</text><circle cx="263.1" cy="660.0" r="7.0" fill="#7c3aed"/><text x="263.1" y="638.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">เฟรม 2: −24.975</text><circle cx="334.7" cy="660.0" r="7.0" fill="#7c3aed"/><text x="334.7" y="616.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">เฟรม 3: −34.729</text><path d="M84.0,674 Q129.5,700 175.0,674" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ah-green)"/><path d="M183.0,674 Q221.075,700 259.15,674" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ah-green)"/><path d="M267.15,674 Q298.91375,700 330.6775,674" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ah-green)"/><text x="40.0" y="744.0" font-size="16" fill="#0f172a">เหลือ 90 → 76.5 → 65.025 → 55.271 (คูณ 0.85 ทุกเฟรม: เหลือ d × 0.85ⁿ)</text><text x="40.0" y="772.0" font-size="15" fill="#475569">ก้าวแรกยาว แล้วสั้นลงเรื่อย ๆ → ยานหมุนเร็วตอนแรก แล้วค่อย ๆ ชะลอเมื่อใกล้เป้า</text><rect x="20.0" y="816.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="846.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ใช้ target − angle ตรง ๆ</text><text x="36.0" y="870.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">angle_diff = target - angle  # -340</text><text x="36.0" y="894.0" font-size="15" fill="#0f172a">ยานหมุนอ้อมเกือบรอบ 340°</text><rect x="408.0" y="816.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="846.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: % 360 แล้วลบ 360 ถ้าเกิน 180</text><text x="424.0" y="870.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">d = (target - angle) % 360  # 20</text><text x="424.0" y="894.0" font-size="15" fill="#0f172a">ผลอยู่ในช่วง (−180, 180] เสมอ</text></svg>