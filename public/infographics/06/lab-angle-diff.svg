<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1268" width="800" height="1268" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ยานอวกาศ: มุมต่างที่สั้นที่สุด และหมุนแบบนุ่มนวล (ขั้นตอนที่ 8)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: เติมคอลัมน์ raw, % 360, diff อย่างไร และมุมเข้าใกล้เป้าหมายทีละเฟรมแบบใด</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#0f172a33" stroke="#0f172a" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">raw = target − angle</text><rect x="345.6" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="379.6" y="116.0" font-size="15" fill="#0f172a">% 360 (ได้ 0–359)</text><rect x="538.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="572.4" y="116.0" font-size="15" fill="#0f172a">diff ที่ใช้หมุน</text><text x="30.0" y="168.0" font-size="18" fill="#0f172a" font-weight="bold">① ตารางที่ต้องเติมด้วยมือ (ข้อ 16): ถ้า % 360 เกิน 180 ให้ลบ 360</text><rect x="20.0" y="182.0" width="760.0" height="38.0" rx="8" fill="#fffbeb"/><text x="36.0" y="207.0" font-size="15" fill="#d97706" font-weight="bold">angle</text><text x="130.0" y="207.0" font-size="15" fill="#d97706" font-weight="bold">target</text><text x="230.0" y="207.0" font-size="15" fill="#d97706" font-weight="bold">raw</text><text x="340.0" y="207.0" font-size="15" fill="#d97706" font-weight="bold">raw % 360</text><text x="470.0" y="207.0" font-size="15" fill="#d97706" font-weight="bold">&gt; 180 ?</text><text x="640.0" y="207.0" font-size="15" fill="#d97706" font-weight="bold">diff</text><text x="36.0" y="250.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">170</text><text x="130.0" y="250.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−170</text><text x="230.0" y="250.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−340</text><text x="340.0" y="250.0" font-size="16" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text><text x="470.0" y="250.0" font-size="15" fill="#475569">ไม่ → ใช้เลย</text><text x="640.0" y="250.0" font-size="17" fill="#059669" font-weight="bold">20</text><rect x="20.0" y="262.0" width="760.0" height="34.0" rx="6" fill="#f8fafc"/><text x="36.0" y="286.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10</text><text x="130.0" y="286.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">350</text><text x="230.0" y="286.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">340</text><text x="340.0" y="286.0" font-size="16" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">340</text><text x="470.0" y="286.0" font-size="15" fill="#dc2626" font-weight="bold">ใช่ → 340 − 360</text><text x="640.0" y="286.0" font-size="17" fill="#059669" font-weight="bold">−20</text><text x="36.0" y="322.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="130.0" y="322.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−90</text><text x="230.0" y="322.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−90</text><text x="340.0" y="322.0" font-size="16" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">270</text><text x="470.0" y="322.0" font-size="15" fill="#dc2626" font-weight="bold">ใช่ → 270 − 360</text><text x="640.0" y="322.0" font-size="17" fill="#059669" font-weight="bold">−90</text><rect x="20.0" y="334.0" width="760.0" height="34.0" rx="6" fill="#f8fafc"/><text x="36.0" y="358.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">170</text><text x="130.0" y="358.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−90</text><text x="230.0" y="358.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−260</text><text x="340.0" y="358.0" font-size="16" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100</text><text x="470.0" y="358.0" font-size="15" fill="#475569">ไม่ → ใช้เลย</text><text x="640.0" y="358.0" font-size="17" fill="#059669" font-weight="bold">100</text><text x="36.0" y="394.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−30</text><text x="130.0" y="394.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">200</text><text x="230.0" y="394.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">230</text><text x="340.0" y="394.0" font-size="16" fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">230</text><text x="470.0" y="394.0" font-size="15" fill="#dc2626" font-weight="bold">ใช่ → 230 − 360</text><text x="640.0" y="394.0" font-size="17" fill="#059669" font-weight="bold">−130</text><text x="30.0" y="432.0" font-size="15" fill="#475569">มอดุโลของจำนวนลบในไพทอนได้ผลบวก: −340 % 360 = 20, −90 % 360 = 270, −260 % 360 = 100</text><text x="30.0" y="476.0" font-size="18" fill="#0f172a" font-weight="bold">② ตัวอย่างแถวแรก: หันอยู่ 170° อยากไป −170°</text><circle cx="150.0" cy="626.0" r="100.0" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="150.0" y="509.0" font-size="15" fill="#475569" text-anchor="middle">0°</text><text x="28.0" y="631.0" font-size="15" fill="#475569" text-anchor="middle">90°</text><text x="150.0" y="770.0" font-size="15" fill="#475569" text-anchor="middle">±180°</text><text x="272.0" y="631.0" font-size="15" fill="#475569" text-anchor="middle">−90°</text><line x1="150.0" y1="626.0" x2="132.6" y2="724.5" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="150.0" y1="626.0" x2="167.4" y2="724.5" stroke="#d97706" stroke-width="3" stroke-linecap="round"/><path d="M137.8,694.9 A70,70 0 0 1 162.2,694.9" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#ah-green)"/><path d="M142.4,669.3 A44,44 0 1 0 157.6,669.3" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ah-red)"/><text x="122.6" y="732.5" font-size="15" fill="#2563eb" text-anchor="end" font-weight="bold">170</text><text x="177.4" y="732.5" font-size="15" fill="#d97706" font-weight="bold">−170</text><circle cx="314.0" cy="511.0" r="14.0" fill="#0f172a"/><text x="314.0" y="516.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="336.0" y="516.0" font-size="16" fill="#0f172a" font-weight="bold">raw = −170 − 170 = −340</text><text x="336.0" y="540.0" font-size="15" fill="#475569">ถ้าใช้ตรง ๆ ยานหมุนตามเข็ม 340° (ทางไกล ✗)</text><circle cx="314.0" cy="561.0" r="14.0" fill="#d97706"/><text x="314.0" y="566.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="336.0" y="566.0" font-size="16" fill="#d97706" font-weight="bold">−340 % 360 = 20</text><text x="336.0" y="590.0" font-size="15" fill="#475569">ไม่เกิน 180 จึงใช้ได้เลย</text><circle cx="314.0" cy="611.0" r="14.0" fill="#059669"/><text x="314.0" y="616.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="336.0" y="616.0" font-size="16" fill="#059669" font-weight="bold">diff = 20 → หมุนทวนเข็มแค่ 20°</text><text x="336.0" y="640.0" font-size="15" fill="#475569">ผ่านมุม 180° ไปหา −170° (ทางสั้น ✓)</text><text x="30.0" y="796.0" font-size="18" fill="#0f172a" font-weight="bold">③ หมุนแบบนุ่มนวล (ข้อ 17–18): angle += diff × 0.15 จาก 0° ไป −90°</text><rect x="100.0" y="826.0" width="640.0" height="220.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><line x1="100.0" y1="1026.0" x2="740.0" y2="1026.0" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="92.0" y="1031.0" font-size="15" fill="#d97706" text-anchor="end" font-weight="bold">−90</text><text x="92.0" y="851.0" font-size="15" fill="#475569" text-anchor="end">0</text><text x="92.0" y="941.0" font-size="15" fill="#475569" text-anchor="end">−45</text><line x1="100.0" y1="936.0" x2="740.0" y2="936.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="130.0" y="846.0" width="80.0" height="2.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="170.0" y="866.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">0</text><text x="170.0" y="1068.0" font-size="15" fill="#475569" text-anchor="middle">เฟรม 0</text><rect x="230.0" y="846.0" width="80.0" height="27.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="270.0" y="893.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">−13.500</text><text x="270.0" y="1068.0" font-size="15" fill="#475569" text-anchor="middle">เฟรม 1</text><line x1="270.0" y1="901.0" x2="270.0" y2="998.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="270.0" y="1018.0" font-size="15" fill="#dc2626" text-anchor="middle">−76.500</text><rect x="330.0" y="846.0" width="80.0" height="50.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="370.0" y="916.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">−24.975</text><text x="370.0" y="1068.0" font-size="15" fill="#475569" text-anchor="middle">เฟรม 2</text><line x1="370.0" y1="924.0" x2="370.0" y2="998.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="370.0" y="1018.0" font-size="15" fill="#dc2626" text-anchor="middle">−65.025</text><rect x="430.0" y="846.0" width="80.0" height="69.5" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="470.0" y="935.5" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">−34.729</text><text x="470.0" y="1068.0" font-size="15" fill="#475569" text-anchor="middle">เฟรม 3</text><line x1="470.0" y1="943.5" x2="470.0" y2="998.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="470.0" y="1018.0" font-size="15" fill="#dc2626" text-anchor="middle">−55.271</text><rect x="530.0" y="846.0" width="80.0" height="86.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="570.0" y="952.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">−43.019</text><text x="570.0" y="1068.0" font-size="15" fill="#475569" text-anchor="middle">เฟรม 4</text><line x1="570.0" y1="960.0" x2="570.0" y2="998.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="570.0" y="1018.0" font-size="15" fill="#dc2626" text-anchor="middle">−46.981</text><rect x="630.0" y="846.0" width="80.0" height="100.1" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="670.0" y="966.1" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">−50.067</text><text x="670.0" y="1068.0" font-size="15" fill="#475569" text-anchor="middle">เฟรม 5</text><line x1="670.0" y1="974.1" x2="670.0" y2="998.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="670.0" y="1018.0" font-size="15" fill="#dc2626" text-anchor="middle">−39.933</text><text x="30.0" y="1102.0" font-size="15" fill="#0f172a">ตัวเลขแดง = มุมที่เหลือ (target − angle) ขนาด 90 × 0.85ⁿ เช่นเฟรม 3: 90 × 0.614 = 55.27</text><text x="30.0" y="1126.0" font-size="15" fill="#0f172a">ไม่ถึง −90 พอดี (เหลือ 85% ทุกเฟรม) แต่เหลือน้อยกว่า 1° ตั้งแต่เฟรม ~28</text><rect x="20.0" y="1146.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="1176.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ใช้ raw โดยไม่ % 360 และไม่ปรับ</text><text x="36.0" y="1200.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">angle_diff = target - angle</text><text x="36.0" y="1224.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">170 → −170: diff = </tspan><tspan fill="#dc2626" font-weight="bold">−340</tspan><tspan fill="#0f172a"> หมุนอ้อมเกือบรอบ</tspan></text><rect x="408.0" y="1146.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1176.0" font-size="17" fill="#059669" font-weight="bold">✓ % 360 แล้วลบ 360 ถ้าเกิน 180</text><text x="424.0" y="1200.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(target - angle) % 360</text><text x="424.0" y="1224.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ได้ diff = </tspan><tspan fill="#059669" font-weight="bold">20</tspan><tspan fill="#0f172a"> หมุนทางสั้น</tspan></text></svg>