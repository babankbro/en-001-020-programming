<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 776" width="800" height="776" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="36.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ยานอวกาศ: ปุ่ม → input_dir → target_angle → หมุนทางที่สั้นที่สุด</text><rect x="20.0" y="56.0" width="760.0" height="34.0" rx="8" fill="#eff6ff"/><text x="40.0" y="79.0" font-size="15" fill="#2563eb" font-weight="bold">ปุ่ม</text><text x="170.0" y="79.0" font-size="15" fill="#2563eb" font-weight="bold">input_dir</text><text x="330.0" y="79.0" font-size="15" fill="#2563eb" font-weight="bold">atan2(−y, x)</text><text x="490.0" y="79.0" font-size="15" fill="#2563eb" font-weight="bold">target_angle</text><text x="660.0" y="79.0" font-size="15" fill="#2563eb" font-weight="bold">ยานหัน</text><rect x="20.0" y="92.0" width="760.0" height="40.0" rx="6" fill="#f8fafc"/><text x="40.0" y="118.0" font-size="15" fill="#0f172a" font-weight="bold">↑ ขึ้น</text><text x="170.0" y="118.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(0, −1)</text><text x="330.0" y="118.0" font-size="15" fill="#0f172a">90°</text><text x="490.0" y="118.0" font-size="15" fill="#7c3aed" font-weight="bold">0°</text><path d="M700.0,97.0 L690.0,123.0 L700.0,117.0 L710.0,123.0 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><text x="40.0" y="158.0" font-size="15" fill="#0f172a" font-weight="bold">→ ขวา</text><text x="170.0" y="158.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(1, 0)</text><text x="330.0" y="158.0" font-size="15" fill="#0f172a">0°</text><text x="490.0" y="158.0" font-size="15" fill="#7c3aed" font-weight="bold">−90°</text><path d="M715.0,152.0 L689.0,142.0 L695.0,152.0 L689.0,162.0 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><rect x="20.0" y="172.0" width="760.0" height="40.0" rx="6" fill="#f8fafc"/><text x="40.0" y="198.0" font-size="15" fill="#0f172a" font-weight="bold">← ซ้าย</text><text x="170.0" y="198.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(−1, 0)</text><text x="330.0" y="198.0" font-size="15" fill="#0f172a">180°</text><text x="490.0" y="198.0" font-size="15" fill="#7c3aed" font-weight="bold">90°</text><path d="M685.0,192.0 L711.0,202.0 L705.0,192.0 L711.0,182.0 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><text x="40.0" y="238.0" font-size="15" fill="#0f172a" font-weight="bold">↓ ลง</text><text x="170.0" y="238.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(0, 1)</text><text x="330.0" y="238.0" font-size="15" fill="#0f172a">−90°</text><text x="490.0" y="238.0" font-size="15" fill="#7c3aed" font-weight="bold">−180°</text><path d="M700.0,247.0 L710.0,221.0 L700.0,227.0 L690.0,221.0 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><rect x="20.0" y="252.0" width="760.0" height="40.0" rx="6" fill="#f8fafc"/><text x="40.0" y="278.0" font-size="15" fill="#0f172a" font-weight="bold">↑+→ ขึ้น+ขวา</text><text x="170.0" y="278.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(1, −1)</text><text x="330.0" y="278.0" font-size="15" fill="#0f172a">45°</text><text x="490.0" y="278.0" font-size="15" fill="#7c3aed" font-weight="bold">−45°</text><path d="M710.6,261.4 L685.2,272.7 L696.5,275.5 L699.3,286.8 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><text x="40.0" y="318.0" font-size="15" fill="#0f172a" font-weight="bold">↓+← ลง+ซ้าย</text><text x="170.0" y="318.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(−1, 1)</text><text x="330.0" y="318.0" font-size="15" fill="#0f172a">−135°</text><text x="490.0" y="318.0" font-size="15" fill="#7c3aed" font-weight="bold">−225°</text><path d="M689.4,322.6 L714.8,311.3 L703.5,308.5 L700.7,297.2 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><text x="40.0" y="364.0" font-size="14" fill="#475569">ใส่ −y เพราะแกน y ของจอชี้ลง · ลบ 90 เพราะภาพยานหันหัวขึ้นที่มุม 0</text><text x="40.0" y="386.0" font-size="14" fill="#475569">ปุ่มทแยงต้อง normalize ก่อน: (1, −1) → (0.707, −0.707) ทิศเดิม มุมเดิม</text><rect x="20.0" y="406.0" width="370.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="432.0" font-size="16" fill="#0f172a" font-weight="bold">หันอยู่ 170° อยากไป −170°</text><text x="36.0" y="454.0" font-size="14" fill="#475569">(มุมบวก = หมุนทวนเข็ม, ±180 = หัวลง)</text><circle cx="205.0" cy="586.0" r="96.0" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="205.0" cy="490.0" r="3.0" fill="#475569"/><circle cx="109.0" cy="586.0" r="3.0" fill="#475569"/><circle cx="301.0" cy="586.0" r="3.0" fill="#475569"/><text x="205.0" y="480.0" font-size="14" fill="#475569" text-anchor="middle">0 (หัวขึ้น)</text><text x="101.0" y="591.0" font-size="14" fill="#475569" text-anchor="end">90</text><text x="309.0" y="591.0" font-size="14" fill="#475569">−90</text><line x1="205.0" y1="586.0" x2="188.3" y2="680.5" stroke="#2563eb" stroke-width="2.5"/><line x1="205.0" y1="586.0" x2="221.7" y2="680.5" stroke="#d97706" stroke-width="2.5"/><text x="166.3" y="682.5" font-size="14" fill="#2563eb" text-anchor="end" font-weight="bold">ปัจจุบัน 170</text><text x="243.7" y="682.5" font-size="14" fill="#d97706" font-weight="bold">เป้า −170</text><path d="M185.9,694.3 A110,110 0 0 0 224.1,694.3" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)"/><path d="M192.2,658.9 A74,74 0 1 1 217.8,658.9" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah-red)" stroke-dasharray="6 4"/><text x="205.0" y="558.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">−340° ✗ ทางไกล</text><text x="205.0" y="736.0" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">+20° ✓ ทางสั้น</text><rect x="410.0" y="406.0" width="370.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="426.0" y="432.0" font-size="15" fill="#0f172a" font-weight="bold">angle_diff = (target − angle) % 360</text><text x="426.0" y="454.0" font-size="14" fill="#475569">ถ้า &gt; 180 ให้ลบ 360 → ช่วง (−180, 180]</text><text x="430.0" y="486.0" font-size="14" fill="#2563eb" font-weight="bold">angle</text><text x="510.0" y="486.0" font-size="14" fill="#2563eb" font-weight="bold">target</text><text x="600.0" y="486.0" font-size="14" fill="#2563eb" font-weight="bold">% 360</text><text x="690.0" y="486.0" font-size="14" fill="#2563eb" font-weight="bold">diff</text><text x="430.0" y="512.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">170</text><text x="510.0" y="512.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">−170</text><text x="600.0" y="512.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">20</text><text x="690.0" y="512.0" font-size="14" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">20</text><text x="430.0" y="536.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">10</text><text x="510.0" y="536.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">350</text><text x="600.0" y="536.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">340</text><text x="690.0" y="536.0" font-size="14" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">−20</text><text x="430.0" y="560.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">0</text><text x="510.0" y="560.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">−90</text><text x="600.0" y="560.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">270</text><text x="690.0" y="560.0" font-size="14" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">−90</text><text x="430.0" y="584.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">170</text><text x="510.0" y="584.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">−90</text><text x="600.0" y="584.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">100</text><text x="690.0" y="584.0" font-size="14" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">100</text><text x="430.0" y="608.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">350</text><text x="510.0" y="608.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">20</text><text x="600.0" y="608.0" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">30</text><text x="690.0" y="608.0" font-size="14" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">30</text><text x="426.0" y="652.0" font-size="15" fill="#0f172a" font-weight="bold">หมุนนุ่มนวล: angle += diff × 0.15</text><text x="426.0" y="678.0" font-size="14" fill="#475569">เป้า −90 เริ่ม 0:</text><text x="426.0" y="702.0" font-size="14" fill="#7c3aed" font-weight="bold">0 → −13.5 → −24.975 → −34.729</text><text x="426.0" y="728.0" font-size="14" fill="#475569">มุมที่เหลือหลัง n เฟรม = d × 0.85ⁿ</text></svg>