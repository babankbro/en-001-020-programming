"226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="224.0" y="588.0" font-size="15" fill="#475569" text-anchor="middle">2</text><line x1="258.0" y1="566.0" x2="258.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="258.0" y="588.0" font-size="15" fill="#475569" text-anchor="middle">3</text><line x1="292.0" y1="566.0" x2="292.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="292.0" y="588.0" font-size="15" fill="#475569" text-anchor="middle">4</text><line x1="326.0" y1="566.0" x2="326.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="326.0" y="588.0" font-size="15" fill="#475569" text-anchor="middle">5</text><line x1="360.0" y1="566.0" x2="360.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="360.0" y="588.0" font-size="15" fill="#475569" text-anchor="middle">6</text><line x1="394.0" y1="566.0" x2="394.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="394.0" y="588.0" font-size="15" fill="#475569" text-anchor="middle">7</text><line x1="54.0" y1="566.0" x2="394.0" y2="566.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/><line x1="54.0" y1="532.0" x2="394.0" y2="532.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="46.0" y="537.0" font-size="15" fill="#475569" text-anchor="end">1</text><line x1="54.0" y1="498.0" x2="394.0" y2="498.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="46.0" y="503.0" font-size="15" fill="#475569" text-anchor="end">2</text><line x1="54.0" y1="464.0" x2="394.0" y2="464.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="46.0" y="469.0" font-size="15" fill="#475569" text-anchor="end">3</text><line x1="54.0" y1="430.0" x2="394.0" y2="430.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="46.0" y="435.0" font-size="15" fill="#475569" text-anchor="end">4</text><line x1="54.0" y1="396