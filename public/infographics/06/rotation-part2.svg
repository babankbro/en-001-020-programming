p="round" stroke-dasharray="3 4" marker-end="url(#ah-green)"/><circle cx="258.0" cy="464.0" r="6.0" fill="#0f172a"/><text x="250.0" y="486.0" font-size="16" fill="#0f172a" text-anchor="end" font-weight="bold">c (3, 3)</text><circle cx="394.0" cy="464.0" r="6.0" fill="#2563eb"/><text x="394.0" y="488.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">p (7, 3)</text><circle cx="258.0" cy="328.0" r="6.0" fill="#059669"/><text x="268.0" y="320.0" font-size="16" fill="#059669" font-weight="bold">(3, 7)</text><text x="292.0" y="556.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">(4, 0)</text><text x="148.0" y="424.0" font-size="16" fill="#7c3aed" text-anchor="end" font-weight="bold">(0, 4)</text><text x="182.0" y="232.0" font-size="17" fill="#dc2626" font-weight="bold">✗ (0, 10)</text><circle cx="156.0" cy="226.0" r="6.0" fill="#dc2626"/><circle cx="224.0" cy="544.0" r="14.0" fill="#d97706"/><text x="224.0" y="549.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="122.0" cy="498.0" r="14.0" fill="#7c3aed"/><text x="122.0" y="503.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><line x1="136.0" y1="498.0" x2="153.0" y2="498.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="153.0" cy="498.0" r="3.5" fill="#7c3aed"/><circle cx="193.4" cy="341.6" r="14.0" fill="#059669"/><text x="193.4" y="347.1" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><line x1="203.4" y1="351.6" x2="207.0" y2="379.0" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="207.0" cy="379.0" r="3.5" fill="#059669"/><circle cx="470.0" cy="171.0" r="14.0" fill="#d97706"/><text x="470.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="492.0" y="176.0" font-size="16" fill="#d97706" font-weight="bold">เลื่อน: ทำให้ c เป็น (0, 0)</text><text x="492.0" y="200.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">p − c = (7 − 3, 3 − 3) = </tspan><tspan fill="#d97706" font-weight="bold">(4, 0)</tspan></text><circle cx="470.0" cy="225.0" r="14.0" fill="#7c3aed"/><text x="470.0" y="230.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="492.0" y="230.0" font-size="16" fill="#7c3aed" font-weight="bold">หมุน 90° รอบ (0, 0)</text><text x="492.0" y="254.0" font-size="15" fill="#475569">90°: (x, y) → (−y, x)</text><text x="492.0" y="278.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(4, 0) → </tspan><tspan fill="#7c3aed" font-weight="bold">(0, 4)</tspan></text><circle cx="470.0" cy="303.0" r="14.0" fill="#059669"/><text x="470.0" y="308.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="492.0" y="308.0" font-size="16" fill="#059669" font-weight="bold">เลื่อนกลับ: บวก c คืน</text><text x="492.0" y="332.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(0, 4) + (3, 3) = </tspan><tspan fill="#059669" font-weight="bold">(3, 7)</tspan></text><rect x="456.0" y="356.0" width="324.0" height="70.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="470.0" y="384.0" font-size="15" fill="#475569">ตรวจ: ระยะห่างจาก c เท่าเดิม</text><text x="470.0" y="410.0" font-size="15" fill="#0f172a">ก่อน |p − c| = 4, หลัง |(3, 7) − c| = 4 ✓</text><rect x="456.0" y="442.0" width="324.0" height="72.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="618.0" y="466.0" font-size="15" fill="#475569" text-anchor="middle">หมุน p รอบ c ไป 90°</text><text x="618.0" y="498.0" font-size="24" fill="#059669" text-anchor="middle" font-weight="bold">(3, 7)</text><rect x="20.0" y="636.0" width="760.0" height="46.0" rx="10" fill="#0f172a"/><text x="36.0" y="666.0" font-size="16" xml:space="preserve"><tspan fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">new_pos = R.dot(p - c) + c</tspan><tspan fill="#94a3b8">   # ลบก่อน → หมุน → บวกกลับ → </tspan><tspan fill="#86efac" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[3 7]</tspan></text><rect x="20.0" y="700.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="730.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ลืมลบ c ก่อนหมุน</text><text x="36.0" y="754.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">R.dot(p) + c</text><text x="36.0" y="778.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">= (−3, 7) + (3, 3) = </tspan><tspan fill="#dc2626" font-weight="bold">(0, 10)</tspan></text><text x="36.0" y="802.0" font-size="15" fill="#0f172a">หมุนรอบ (0, 0) แล้วเลื่อนทั้งภาพ</text><rect x="408.0" y="700.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="730.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: ลบก่อน หมุน แล้วบวกกลับ</text><text x="424.0" y="754.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">R.dot(p - c) + c</text><text x="424.0" y="778.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">= (0, 4) + (3, 3) = </tspan><tspan fill="#059669" font-weight="bold">(3, 7)</tspan></text><text x="424.0" y="802.0" font-size="15" fill="#0f172a">c เป็นจุดเดียวที่ไม่ขยับ</text></svg>