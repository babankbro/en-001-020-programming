<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 968" width="800" height="968" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ยานอวกาศ: ปุ่มกด → input_dir → target_angle (ขั้นตอนที่ 7)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: กดปุ่มแต่ละแบบแล้ว target_angle เป็นเท่าใด และยานหันไปทางไหน</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">input_dir (y จอชี้ลง)</text><rect x="331.6" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="365.6" y="116.0" font-size="15" fill="#0f172a">atan2(−dy, dx)</text><rect x="499.5" y="101.0" width="26.0" height="18.0" rx="4" fill="#7c3aed33" stroke="#7c3aed" stroke-width="1.5"/><text x="533.5" y="116.0" font-size="15" fill="#0f172a">target = มุม − 90</text><text x="30.0" y="170.0" font-size="18" fill="#0f172a" font-weight="bold">ทำ 3 ขั้นต่อหนึ่งกรณี (ตัวอย่าง: ขึ้น+ขวา)</text><rect x="20.0" y="186.0" width="236.0" height="130.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="44.0" cy="210.0" r="14.0" fill="#2563eb"/><text x="44.0" y="215.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="66.0" y="216.0" font-size="16" fill="#2563eb" font-weight="bold">ปุ่ม → input_dir</text><text x="34.0" y="246.0" font-size="15" fill="#0f172a">ขวา dx = 1, ขึ้น dy = −1</text><rect x="34.0" y="260.0" width="208.0" height="42.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="138.0" y="288.0" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="bold">(1, −1)</text><line x1="258.0" y1="251.0" x2="278.0" y2="251.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="282.0" y="186.0" width="236.0" height="130.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="306.0" cy="210.0" r="14.0" fill="#d97706"/><text x="306.0" y="215.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="328.0" y="216.0" font-size="16" fill="#d97706" font-weight="bold">กลับแกน y แล้วหามุม</text><text x="296.0" y="246.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">−dy = 1 → atan2(1, 1)</text><rect x="296.0" y="260.0" width="208.0" height="42.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="400.0" y="288.0" font-size="19" fill="#d97706" text-anchor="middle" font-weight="bold">45°</text><line x1="520.0" y1="251.0" x2="540.0" y2="251.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="544.0" y="186.0" width="236.0" height="130.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="568.0" cy="210.0" r="14.0" fill="#7c3aed"/><text x="568.0" y="215.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="590.0" y="216.0" font-size="16" fill="#7c3aed" font-weight="bold">ลบ 90 (0° = หัวขึ้น)</text><text x="558.0" y="246.0" font-size="15" fill="#0f172a">45 − 90</text><rect x="558.0" y="260.0" width="208.0" height="42.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="662.0" y="288.0" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="bold">−45.0</text><text x="30.0" y="352.0" font-size="18" fill="#0f172a" font-weight="bold">ตารางที่ต้องเติมด้วยมือ (ข้อ 14) — เฉลยตรงกับ output ในใบงาน</text><rect x="20.0" y="366.0" width="760.0" height="38.0" rx="8" fill="#eff6ff"/><text x="36.0" y="391.0" font-size="15" fill="#2563eb" font-weight="bold">ปุ่ม</text><text x="160.0" y="391.0" font-size="15" fill="#2563eb" font-weight="bold">input_dir</text><text x="290.0" y="391.0" font-size="15" fill="#2563eb" font-weight="bold">② atan2(−dy, dx)</text><text x="470.0" y="391.0" font-size="15" fill="#2563eb" font-weight="bold">③ target</text><text x="640.0" y="391.0" font-size="15" fill="#2563eb" font-weight="bold">ยานหัน</text><text x="36.0" y="440.0" font-size="16" fill="#0f172a" font-weight="bold">ขึ้น</text><text x="160.0" y="440.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(0, −1)</text><text x="290.0" y="440.0" font-size="16" fill="#d97706" font-weight="bold">90°</text><text x="470.0" y="440.0" font-size="16" fill="#7c3aed" font-weight="bold">90 − 90 = 0.0</text><path d="M664.0,419.0 L673.8,444.5 L664.0,438.5 L654.2,444.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><rect x="20.0" y="458.0" width="760.0" height="44.0" rx="6" fill="#f8fafc"/><text x="36.0" y="486.0" font-size="16" fill="#0f172a" font-weight="bold">ขวา</text><text x="160.0" y="486.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(1, 0)</text><text x="290.0" y="486.0" font-size="16" fill="#d97706" font-weight="bold">0°</text><text x="470.0" y="486.0" font-size="16" fill="#7c3aed" font-weight="bold">0 − 90 = −90.0</text><path d="M679.0,480.0 L653.5,489.8 L659.5,480.0 L653.5,470.2 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="36.0" y="532.0" font-size="16" fill="#0f172a" font-weight="bold">ซ้าย</text><text x="160.0" y="532.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(−1, 0)</text><text x="290.0" y="532.0" font-size="16" fill="#d97706" font-weight="bold">180°</text><text x="470.0" y="532.0" font-size="16" fill="#7c3aed" font-weight="bold">180 − 90 = 90.0</text><path d="M649.0,526.0 L674.5,516.2 L668.5,526.0 L674.5,535.8 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><rect x="20.0" y="550.0" width="760.0" height="44.0" rx="6" fill="#f8fafc"/><text x="36.0" y="578.0" font-size="16" fill="#0f172a" font-weight="bold">ลง</text><text x="160.0" y="578.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(0, 1)</text><text x="290.0" y="578.0" font-size="16" fill="#d97706" font-weight="bold">−90°</text><text x="470.0" y="578.0" font-size="16" fill="#7c3aed" font-weight="bold">−90 − 90 = −180.0</text><path d="M664.0,587.0 L654.2,561.5 L664.0,567.5 L673.8,561.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="36.0" y="624.0" font-size="16" fill="#0f172a" font-weight="bold">ขึ้น+ขวา</text><text x="160.0" y="624.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(1, −1)</text><text x="290.0" y="624.0" font-size="16" fill="#d97706" font-weight="bold">45°</text><text x="470.0" y="624.0" font-size="16" fill="#7c3aed" font-weight="bold">45 − 90 = −45.0</text><path d="M674.6,607.4 L663.5,632.3 L660.8,621.2 L649.7,618.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><rect x="20.0" y="642.0" width="760.0" height="44.0" rx="6" fill="#f8fafc"/><text x="36.0" y="670.0" font-size="16" fill="#0f172a" font-weight="bold">ลง+ซ้าย</text><text x="160.0" y="670.0" font-size="15" fill="#2563eb" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(−1, 1)</text><text x="290.0" y="670.0" font-size="16" fill="#d97706" font-weight="bold">−135°</text><text x="470.0" y="670.0" font-size="16" fill="#7c3aed" font-weight="bold">−135 − 90 = −225.0</text><path d="M653.4,674.6 L664.5,649.7 L667.2,660.8 L678.3,663.5 Z" stroke="#7c3aed" stroke-width="2" fill="#7c3aed33"/><text x="30.0" y="712.0" font-size="15" fill="#475569">ลง+ซ้าย ได้ −225 ซึ่งเป็นทิศเดียวกับ 135 (ต่างกัน 360) — ทิศของยานจึงเหมือนกัน</text><text x="30.0" y="742.0" font-size="18" fill="#0f172a" font-weight="bold">ข้อ 15: normalize ไม่เปลี่ยนมุม</text><rect x="20.0" y="756.0" width="760.0" height="72.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="36.0" y="784.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">normalize(1, -1) = (0.7071067811865475, -0.7071067811865475)</text><text x="36.0" y="812.0" font-size="15" fill="#059669" font-weight="bold">target_angle ยังเป็น −45° เพราะ atan2 ดูแค่ทิศ ไม่สนใจความยาว · ขนาด 0 → คืน (0, 0) ไม่หาร</text><rect x="20.0" y="846.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="876.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ลืมเครื่องหมายลบหน้า dy (คำถาม 3.1)</text><text x="36.0" y="900.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">math.atan2(dy, dx)</text><text x="36.0" y="924.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">กดขึ้น: atan2(−1, 0) = −90 → </tspan><tspan fill="#dc2626" font-weight="bold">−180° หันลง</tspan></text><rect x="408.0" y="846.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="876.0" font-size="17" fill="#059669" font-weight="bold">✓ กลับแกน y ก่อนหามุม</text><text x="424.0" y="900.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">math.atan2(-dy, dx)</text><text x="424.0" y="924.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">กดขึ้น: atan2(1, 0) = 90 → </tspan><tspan fill="#059669" font-weight="bold">0° หัวขึ้น</tspan></text></svg>