<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1014" width="800" height="1014" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ผลลัพธ์ NumPy ที่ควรได้: เมทริกซ์ (ขั้นตอนที่ 3)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: * กับ @ ต่างกันอย่างไร และคูณเมทริกซ์ 2×2 ด้วยมือ (แถว · คอลัมน์) ทำอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">แถวของตัวหน้า</text><rect x="293.8" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="327.8" y="116.0" font-size="15" fill="#0f172a">คอลัมน์ของตัวหลัง</text><rect x="474.7" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="508.7" y="116.0" font-size="15" fill="#0f172a">ช่องผลลัพธ์</text><rect x="611.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#dc262633" stroke="#dc2626" stroke-width="1.5"/><text x="645.4" y="116.0" font-size="15" fill="#0f172a">ถูกคูณด้วย 0</text><text x="30.0" y="168.0" font-size="18" fill="#0f172a" font-weight="bold">① A กับ B = เมทริกซ์เอกลักษณ์ (ข้อ 5)</text><rect x="43.0" y="217.0" width="34.0" height="34.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><rect x="83.0" y="257.0" width="34.0" height="34.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><rect x="123.0" y="297.0" width="34.0" height="34.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="60.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="100.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="140.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="60.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">4</text><text x="100.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">6</text><text x="140.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">6</text><text x="60.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">7</text><text x="100.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">8</text><text x="140.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">10</text><path d="M48,214 L40,214 L40,334 L48,334" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M152,214 L160,214 L160,334 L152,334" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="100.0" y="202.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">A + B</text><text x="100.0" y="360.0" font-size="15" fill="#475569" text-anchor="middle">แนวทแยง +1</text><rect x="333.0" y="217.0" width="34.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="373.0" y="217.0" width="34.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="293.0" y="257.0" width="34.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="373.0" y="257.0" width="34.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="293.0" y="297.0" width="34.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="333.0" y="297.0" width="34.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="350.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="390.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="310.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="350.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">5</text><text x="390.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="310.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="350.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">0</text><text x="390.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">9</text><path d="M298,214 L290,214 L290,334 L298,334" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M402,214 L410,214 L410,334 L402,334" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="350.0" y="202.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">A * B</text><text x="350.0" y="360.0" font-size="15" fill="#475569" text-anchor="middle">ทีละตำแหน่ง: เหลือ 1, 5, 9</text><text x="560.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="600.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="640.0" y="240.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="560.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">4</text><text x="600.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">5</text><text x="640.0" y="280.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">6</text><text x="560.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">7</text><text x="600.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">8</text><text x="640.0" y="320.8" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">9</text><path d="M548,214 L540,214 L540,334 L548,334" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M652,214 L660,214 L660,334 L652,334" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="600.0" y="202.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">A @ B</text><text x="600.0" y="360.0" font-size="15" fill="#475569" text-anchor="middle">ได้ A กลับมา</text><text x="30.0" y="394.0" font-size="15" fill="#0f172a">A − B = [[0 2 3] [4 4 6] [7 8 8]] (แนวทแยงลบ 1) · A @ B = np.matmul(A, B) = A.dot(B) ให้ผลเดียวกัน</text><text x="30.0" y="438.0" font-size="18" fill="#0f172a" font-weight="bold">② คูณ P @ Q ด้วยมือ: ช่อง (แถว i, คอลัมน์ j) = แถว i ของ P · คอลัมน์ j ของ Q (ข้อ 6)</text><rect x="43.0" y="491.0" width="48.0" height="48.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="97.0" y="491.0" width="48.0" height="48.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="67.0" y="522.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="121.0" y="522.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="67.0" y="576.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="121.0" y="576.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">4</text><path d="M48,488 L40,488 L40,596 L48,596" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M140,488 L148,488 L148,596 L140,596" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="94.0" y="476.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">P</text><text x="170.0" y="550.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold">@</text><rect x="203.0" y="491.0" width="48.0" height="48.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><rect x="203.0" y="545.0" width="48.0" height="48.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="227.0" y="522.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">5</text><text x="281.0" y="522.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">6</text><text x="227.0" y="576.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">7</text><text x="281.0" y="576.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">8</text><path d="M208,488 L200,488 L200,596 L208,596" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M300,488 L308,488 L308,596 L300,596" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="254.0" y="476.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Q</text><text x="330.0" y="550.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold">=</text><rect x="363.0" y="491.0" width="48.0" height="48.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="387.0" y="522.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">19</text><text x="441.0" y="522.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">22</text><text x="387.0" y="576.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">43</text><text x="441.0" y="576.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">50</text><path d="M368,488 L360,488 L360,596 L368,596" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M460,488 L468,488 L468,596 L460,596" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="414.0" y="476.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">P @ Q</text><text x="500.0" y="504.0" font-size="15" xml:space="preserve"><tspan fill="#475569" font-weight="bold">(1,1) </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">1×5 + 2×7 = </tspan><tspan fill="#059669" font-weight="bold">19</tspan></text><text x="500.0" y="532.0" font-size="15" xml:space="preserve"><tspan fill="#475569" font-weight="bold">(1,2) </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">1×6 + 2×8 = </tspan><tspan fill="#059669" font-weight="bold">22</tspan></text><text x="500.0" y="560.0" font-size="15" xml:space="preserve"><tspan fill="#475569" font-weight="bold">(2,1) </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">3×5 + 4×7 = </tspan><tspan fill="#059669" font-weight="bold">43</tspan></text><text x="500.0" y="588.0" font-size="15" xml:space="preserve"><tspan fill="#475569" font-weight="bold">(2,2) </tspan><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">3×6 + 4×8 = </tspan><tspan fill="#059669" font-weight="bold">50</tspan></text><text x="30.0" y="636.0" font-size="18" fill="#0f172a" font-weight="bold">③ สลับลำดับ Q @ P ได้ผลต่าง และ P * Q คือคูณทีละตำแหน่ง</text><text x="67.0" y="718.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">23</text><text x="121.0" y="718.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">34</text><text x="67.0" y="772.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">31</text><text x="121.0" y="772.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">46</text><path d="M48,684 L40,684 L40,792 L48,792" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M140,684 L148,684 L148,792 L140,792" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="94.0" y="672.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Q @ P</text><text x="170.0" y="700.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">5×1 + 6×3 = </tspan><tspan fill="#059669" font-weight="bold">23</tspan></text><text x="170.0" y="728.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">5×2 + 6×4 = </tspan><tspan fill="#059669" font-weight="bold">34</tspan></text><text x="170.0" y="756.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">7×1 + 8×3 = </tspan><tspan fill="#059669" font-weight="bold">31</tspan></text><text x="170.0" y="784.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">7×2 + 8×4 = </tspan><tspan fill="#059669" font-weight="bold">46</tspan></text><text x="447.0" y="718.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">5</text><text x="501.0" y="718.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">12</text><text x="447.0" y="772.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">21</text><text x="501.0" y="772.9" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">32</text><path d="M428,684 L420,684 L420,792 L428,792" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M520,684 L528,684 L528,792 L520,792" stroke="#0f172a" stroke-width="2.5" fill="none"/><text x="474.0" y="672.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">P * Q</text><text x="550.0" y="714.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1×5, 2×6</text><text x="550.0" y="742.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3×7, 4×8</text><text x="550.0" y="776.0" font-size="15" fill="#dc2626" font-weight="bold">ไม่ใช่การคูณเมทริกซ์</text><rect x="20.0" y="822.0" width="760.0" height="52.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="400.0" y="854.3" font-size="18" fill="#059669" text-anchor="middle" font-weight="bold">P @ Q = [[19 22] [43 50]]  ≠  Q @ P = [[23 34] [31 46]]  → ลำดับสำคัญ</text><rect x="20.0" y="892.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="922.0" font-size="17" fill="#dc2626" font-weight="bold">✗ ใช้ * เพื่อคูณเมทริกซ์</text><text x="36.0" y="946.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">P * Q  → [[ 5 12] [21 32]]</text><text x="36.0" y="970.0" font-size="15" fill="#0f172a">เป็นการคูณทีละตำแหน่งเท่านั้น</text><rect x="408.0" y="892.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="922.0" font-size="17" fill="#059669" font-weight="bold">✓ ใช้ @, np.matmul หรือ .dot</text><text x="424.0" y="946.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">P @ Q  → [[19 22] [43 50]]</text><text x="424.0" y="970.0" font-size="15" fill="#0f172a">แถว · คอลัมน์ ตามนิยาม</text></svg>