<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">จากมุมองศา สู่จุดบนวงกลม</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: จุดบนวงกลมรัศมี 10 ที่มุม 30° อยู่ที่พิกัดใด และต้องแปลงหน่วยอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#d97706" stroke-width="3" stroke-linecap="round"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">มุม θ</text><line x1="227.9" y1="111.0" x2="253.9" y2="111.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="261.9" y="116.0" font-size="15" fill="#0f172a">x = r cos θ</text><line x1="366.7" y1="111.0" x2="392.7" y2="111.0" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="400.7" y="116.0" font-size="15" fill="#0f172a">y = r sin θ</text><circle cx="514.2" cy="111.0" r="6.0" fill="#7c3aed"/><text x="535.2" y="116.0" font-size="15" fill="#0f172a">จุดคำตอบ</text><rect x="20.0" y="146.0" width="400.0" height="430.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">วาดตามสเกล: 1 หน่วย = 16 px (y ชี้ขึ้น)</text><line x1="36.0" y1="380.0" x2="404.0" y2="380.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah-gray)"/><line x1="220.0" y1="564.0" x2="220.0" y2="191.2" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah-gray)"/><text x="400.0" y="372.0" font-size="16" fill="#475569" text-anchor="end" font-style="italic">x</text><text x="228.0" y="194.4" font-size="16" fill="#475569" font-style="italic">y</text><circle cx="220.0" cy="380.0" r="160.0" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="380.0" cy="380.0" r="4.5" fill="#475569"/><text x="386.0" y="402.0" font-size="15" fill="#475569">0° (10, 0)</text><circle cx="220.0" cy="220.0" r="4.5" fill="#475569"/><text x="228.0" y="214.0" font-size="15" fill="#475569">90° (0, 10)</text><circle cx="60.0" cy="380.0" r="4.5" fill="#475569"/><text x="56.0" y="402.0" font-size="15" fill="#475569">180° (−10, 0)</text><circle cx="220.0" cy="540.0" r="4.5" fill="#475569"/><text x="228.0" y="560.0" font-size="15" fill="#475569">270° (0, −10)</text><line x1="358.6" y1="300.0" x2="358.6" y2="380.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="358.6" y1="300.0" x2="220.0" y2="300.0" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="220.0" y1="380.0" x2="358.6" y2="300.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M272,380 A52,52 0 0 0 265.0,354.0" stroke="#d97706" stroke-width="3" fill="none"/><text x="280.0" y="372.0" font-size="16" fill="#d97706" font-weight="bold">30°</text><circle cx="358.6" cy="300.0" r="7.0" fill="#7c3aed"/><text x="346.6" y="286.0" font-size="17" fill="#7c3aed" text-anchor="end" font-weight="bold">(8.66, 5)</text><text x="289.3" y="402.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">8.66</text><text x="214.0" y="345.0" font-size="15" fill="#059669" text-anchor="end" font-weight="bold">5</text><text x="136.8" y="306.4" font-size="15" fill="#475569" text-anchor="middle">r = 10</text><circle cx="332.0" cy="356.0" r="14.0" fill="#d97706"/><text x="332.0" y="361.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="388.6" cy="340.0" r="14.0" fill="#2563eb"/><text x="388.6" y="345.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><line x1="374.6" y1="340.0" x2="358.6" y2="340.0" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="358.6" cy="340.0" r="3.5" fill="#2563eb"/><circle cx="394.6" cy="264.0" r="14.0" fill="#7c3aed"/><text x="394.6" y="269.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><line x1="384.6" y1="274.0" x2="364.6" y2="294.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="364.6" cy="294.0" r="3.5" fill="#7c3aed"/><circle cx="452.0" cy="171.0" r="14.0" fill="#d97706"/><text x="452.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="474.0" y="176.0" font-size="16" fill="#d97706" font-weight="bold">แปลงองศาเป็นเรเดียน</text><text x="474.0" y="200.0" font-size="15" fill="#475569">ฟังก์ชันตรีโกณรับเรเดียนเท่านั้น</text><text x="474.0" y="224.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">30 × π/180 = </tspan><tspan fill="#d97706" font-weight="bold">0.524</tspan><tspan fill="#0f172a"> เรเดียน</tspan></text><circle cx="452.0" cy="249.0" r="14.0" fill="#2563eb"/><text x="452.0" y="254.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="474.0" y="254.0" font-size="16" fill="#2563eb" font-weight="bold">หาค่า cos และ sin</text><text x="474.0" y="278.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">cos 0.524 = </tspan><tspan fill="#2563eb" font-weight="bold">0.866</tspan></text><text x="474.0" y="302.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">sin 0.524 = </tspan><tspan fill="#059669" font-weight="bold">0.5</tspan></text><circle cx="452.0" cy="327.0" r="14.0" fill="#7c3aed"/><text x="452.0" y="332.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="474.0" y="332.0" font-size="16" fill="#7c3aed" font-weight="bold">คูณรัศมี แล้วบวกจุดศูนย์กลาง</text><text x="474.0" y="356.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">x = 0 + 10 × 0.866 = </tspan><tspan fill="#2563eb" font-weight="bold">8.66</tspan></text><text x="474.0" y="380.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">y = 0 + 10 × 0.5 = </tspan><tspan fill="#059669" font-weight="bold">5</tspan></text><rect x="438.0" y="408.0" width="342.0" height="72.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="609.0" y="432.0" font-size="15" fill="#475569" text-anchor="middle">จุดบนวงกลมที่มุม 30°</text><text x="609.0" y="464.0" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="bold">(8.66, 5)</text><text x="438.0" y="508.0" font-size="15" fill="#475569">สูตร: x = cx + r·cos θ,  y = cy + r·sin θ</text><text x="30.0" y="612.0" font-size="17" fill="#0f172a" font-weight="bold">ตารางแปลงหน่วยที่ควรจำ (เรเดียน = องศา × π/180)</text><rect x="20.0" y="626.0" width="760.0" height="120.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="656.0" font-size="16" fill="#0f172a" font-weight="bold">องศา</text><text x="155.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">0°</text><rect x="198.0" y="634.0" width="78.0" height="106.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="237.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">30°</text><text x="319.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">45°</text><text x="401.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">60°</text><text x="483.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">90°</text><text x="565.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">180°</text><text x="647.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">270°</text><text x="729.0" y="656.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">360°</text><text x="34.0" y="692.0" font-size="16" fill="#0f172a" font-weight="bold">เรเดียน</text><text x="155.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">0</text><text x="237.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">π/6</text><text x="319.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">π/4</text><text x="401.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">π/3</text><text x="483.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">π/2</text><text x="565.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">π</text><text x="647.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">3π/2</text><text x="729.0" y="692.0" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">2π</text><text x="34.0" y="728.0" font-size="16" fill="#0f172a" font-weight="bold">ค่าประมาณ</text><text x="155.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0</text><text x="237.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0.524</text><text x="319.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0.785</text><text x="401.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">1.047</text><text x="483.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">1.571</text><text x="565.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">3.142</text><text x="647.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">4.712</text><text x="729.0" y="728.0" font-size="16" fill="#475569" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">6.283</text><rect x="20.0" y="764.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="794.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ใส่องศาตรง ๆ</text><text x="36.0" y="818.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">math.cos(30)  →  0.154</text><text x="36.0" y="842.0" font-size="15" fill="#0f172a">ไพทอนเข้าใจว่าเป็น 30 เรเดียน (≈ 1719°)</text><rect x="408.0" y="764.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="794.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: แปลงก่อนทุกครั้ง</text><text x="424.0" y="818.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">math.cos(math.radians(30))  →  0.866</text><text x="424.0" y="842.0" font-size="15" fill="#0f172a">หรือ np.cos(np.radians(30))</text></svg>