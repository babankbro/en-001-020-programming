<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">atan2: หามุมจากเวกเตอร์ (ทิศ → มุม)</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: เวกเตอร์ (x, y) ชี้ไปที่มุมกี่องศา และทำไมต้องใช้ atan2 แทน atan</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><circle cx="147.4" cy="111.0" r="6.0" fill="#059669"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ครึ่งบน y &gt; 0 → มุมบวก (ทวนเข็ม)</text><circle cx="440.7" cy="111.0" r="6.0" fill="#dc2626"/><text x="461.7" y="116.0" font-size="15" fill="#0f172a">ครึ่งล่าง y &lt; 0 → มุมลบ (ตามเข็ม)</text><rect x="20.0" y="146.0" width="420.0" height="440.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">วงกลมหนึ่งหน่วย: ค่า math.degrees(math.atan2(y, x))</text><line x1="84.0" y1="370.0" x2="382.0" y2="370.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah-gray)"/><line x1="230.0" y1="516.0" x2="230.0" y2="218.0" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah-gray)"/><path d="M360,370 A130,130 0 0 0 100,370" stroke="#059669" stroke-width="4" fill="none"/><path d="M360,370 A130,130 0 0 1 100,370" stroke="#dc2626" stroke-width="4" fill="none"/><circle cx="360.0" cy="370.0" r="6.0" fill="#0f172a"/><text x="390.0" y="364.0" font-size="15" fill="#475569">(1, 0)</text><text x="390.0" y="386.0" font-size="17" fill="#0f172a" font-weight="bold">0°</text><circle cx="321.9" cy="278.1" r="6.0" fill="#059669"/><text x="351.6" y="253.9" font-size="15" fill="#475569" text-anchor="middle">(1, 1)</text><text x="351.6" y="272.9" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">45°</text><circle cx="230.0" cy="240.0" r="6.0" fill="#059669"/><text x="216.0" y="218.0" font-size="17" fill="#059669" text-anchor="end" font-weight="bold">90°</text><text x="168.0" y="218.0" font-size="15" fill="#475569" text-anchor="end">(0, 1)</text><circle cx="138.1" cy="278.1" r="6.0" fill="#059669"/><text x="108.4" y="253.9" font-size="15" fill="#475569" text-anchor="middle">(−1, 1)</text><text x="108.4" y="272.9" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold">135°</text><circle cx="100.0" cy="370.0" r="6.0" fill="#0f172a"/><text x="74.0" y="364.0" font-size="15" fill="#475569" text-anchor="end">(−1, 0)</text><text x="74.0" y="386.0" font-size="17" fill="#0f172a" text-anchor="end" font-weight="bold">180°</text><circle cx="138.1" cy="461.9" r="6.0" fill="#dc2626"/><text x="108.4" y="480.1" font-size="15" fill="#475569" text-anchor="middle">(−1, −1)</text><text x="108.4" y="499.1" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">−135°</text><circle cx="230.0" cy="500.0" r="6.0" fill="#dc2626"/><text x="216.0" y="530.0" font-size="17" fill="#dc2626" text-anchor="end" font-weight="bold">−90°</text><text x="168.0" y="530.0" font-size="15" fill="#475569" text-anchor="end">(0, −1)</text><circle cx="321.9" cy="461.9" r="6.0" fill="#dc2626"/><text x="351.6" y="480.1" font-size="15" fill="#475569" text-anchor="middle">(1, −1)</text><text x="351.6" y="499.1" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">−45°</text><line x1="230.0" y1="370.0" x2="308.0" y2="266.0" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="butt" marker-end="url(#ah-purple)"/><path d="M276,370 A46,46 0 0 0 257.6,333.2" stroke="#7c3aed" stroke-width="2.5" fill="none"/><text x="280.0" y="346.0" font-size="15" fill="#7c3aed" font-weight="bold">53.13°</text><circle cx="342.0" cy="220.0" r="14.0" fill="#7c3aed"/><text x="342.0" y="225.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="330.0" y1="230.0" x2="292.4" y2="286.8" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="292.4" cy="286.8" r="3.5" fill="#7c3aed"/><circle cx="80.0" cy="538.0" r="14.0" fill="#dc2626"/><text x="80.0" y="543.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><line x1="93.0" y1="531.0" x2="165.0" y2="482.6" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="165.0" cy="482.6" r="3.5" fill="#dc2626"/><circle cx="472.0" cy="171.0" r="14.0" fill="#7c3aed"/><text x="472.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="494.0" y="176.0" font-size="16" fill="#7c3aed" font-weight="bold">เริ่มจากเวกเตอร์ (x, y)</text><text x="494.0" y="200.0" font-size="15" fill="#475569">เช่น (3, 4) ลูกศรม่วง</text><circle cx="472.0" cy="225.0" r="14.0" fill="#7c3aed"/><text x="472.0" y="230.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="494.0" y="230.0" font-size="16" fill="#7c3aed" font-weight="bold">เรียก atan2 โดยใส่ y ก่อน x</text><text x="494.0" y="254.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">math.atan2(4, 3) = </tspan><tspan fill="#7c3aed" font-weight="bold">0.927</tspan></text><text x="494.0" y="278.0" font-size="15" fill="#475569">หน่วยเป็นเรเดียน</text><circle cx="472.0" cy="303.0" r="14.0" fill="#7c3aed"/><text x="472.0" y="308.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="494.0" y="308.0" font-size="16" fill="#7c3aed" font-weight="bold">แปลงเป็นองศา</text><text x="494.0" y="332.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a" font-family="Consolas, 'Courier New', monospace">math.degrees(0.927) = </tspan><tspan fill="#7c3aed" font-weight="bold">53.13°</tspan></text><circle cx="472.0" cy="357.0" r="14.0" fill="#dc2626"/><text x="472.0" y="362.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="494.0" y="362.0" font-size="16" fill="#dc2626" font-weight="bold">ผลอยู่ในช่วง (−180°, 180°]</text><text x="494.0" y="386.0" font-size="15" fill="#475569">ครึ่งล่างได้มุมลบ เช่น (0, −1) → −90°</text><text x="494.0" y="410.0" font-size="15" fill="#475569">ไม่มีวันได้ 270°</text><rect x="458.0" y="434.0" width="322.0" height="70.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="619.0" y="458.0" font-size="15" fill="#475569" text-anchor="middle">atan2(4, 3) ในหน่วยองศา</text><text x="619.0" y="488.0" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="bold">53.13°</text><text x="458.0" y="534.0" font-size="15" fill="#475569">ขนาดไม่มีผล: (0.6, 0.8) ก็ได้ 53.13°</text><rect x="20.0" y="606.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="636.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ใช้ atan(y / x)</text><text x="36.0" y="660.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(1, 1): atan(1) = </tspan><tspan fill="#dc2626" font-weight="bold">45°</tspan></text><text x="36.0" y="684.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(−1, −1): atan(1) = </tspan><tspan fill="#dc2626" font-weight="bold">45°</tspan><tspan fill="#dc2626"> ซ้ำ!</tspan></text><text x="36.0" y="708.0" font-size="15" fill="#0f172a">และ x = 0 → หารด้วยศูนย์</text><rect x="408.0" y="606.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="636.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: atan2(y, x) แยกจตุภาคได้</text><text x="424.0" y="660.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(1, 1): atan2(1, 1) = </tspan><tspan fill="#059669" font-weight="bold">45°</tspan></text><text x="424.0" y="684.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(−1, −1): atan2(−1, −1) = </tspan><tspan fill="#059669" font-weight="bold">−135°</tspan></text><text x="424.0" y="708.0" font-size="15" fill="#0f172a">ระวังสลับ: atan2(0, 1) = 0° ≠ atan2(1, 0) = 90°</text></svg>