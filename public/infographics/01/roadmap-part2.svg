<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 924" width="800" height="924" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">ทำไมต้องเรียนตามลำดับ: แนวคิดเดียวถูกใช้ซ้ำ 4 บท</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า เวกเตอร์หนึ่งหน่วย (Unit Vector) จากบทที่ 2 ไปโผล่ที่ไหนบ้างในเกม</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">บทไพทอนล้วน</text>
<rect x="246.4" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="273.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">บท Pygame</text>
<rect x="368.9" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="395.9" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ผลที่คำนวณได้</text>
<line x1="504.9" y1="120" x2="524.9" y2="120" stroke="#7c3aed" stroke-width="3"/>
<text x="531.9" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ส่งต่อไปบทถัดไป</text>
<rect x="30" y="152" width="740" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="56" cy="180" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="56" y="186" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="82" y="186" font-size="17" fill="#2563eb" font-weight="bold" xml:space="preserve">บท 2 — นิยาม lenv และ unitv</text>
<rect x="50" y="204" width="250" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="225" font-size="15" fill="#475569" xml:space="preserve">เริ่มจาก</text>
<text x="60" y="247" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">เวกเตอร์ (3, 4)</text>
<line x1="302" y1="230" x2="324" y2="230" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<text x="330" y="225" font-size="15" fill="#0f172a" xml:space="preserve">ยาว = √(3² + 4²) = √25 = 5</text>
<text x="330" y="248" font-size="15" fill="#0f172a" xml:space="preserve">หารด้วยความยาว: (3/5, 4/5)</text>
<line x1="576" y1="230" x2="596" y2="230" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<rect x="600" y="206" width="156" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="678" y="235.6" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(0.6, 0.8)</text>
<line x1="56" y1="272" x2="56" y2="290" stroke="#7c3aed" stroke-width="3" marker-end="url(#ar-purple)"/>
<rect x="30" y="292" width="740" height="120" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="56" cy="320" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="56" y="326" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="82" y="326" font-size="17" fill="#059669" font-weight="bold" xml:space="preserve">บท 6 — ยานเดินทแยงไม่เร็วกว่าแนวตรง</text>
<rect x="50" y="344" width="250" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="365" font-size="15" fill="#475569" xml:space="preserve">เริ่มจาก</text>
<text x="60" y="387" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">กดขวา + ลง = (1, 1)</text>
<line x1="302" y1="370" x2="324" y2="370" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<text x="330" y="365" font-size="15" fill="#0f172a" xml:space="preserve">ยาว = √(1² + 1²) ≈ 1.414 (เร็วเกิน)</text>
<text x="330" y="388" font-size="15" fill="#0f172a" xml:space="preserve">normalize(): (1/1.414, 1/1.414)</text>
<line x1="576" y1="370" x2="596" y2="370" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<rect x="600" y="346" width="156" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="678" y="375.6" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(0.707, 0.707)</text>
<line x1="56" y1="412" x2="56" y2="430" stroke="#7c3aed" stroke-width="3" marker-end="url(#ar-purple)"/>
<rect x="30" y="432" width="740" height="120" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="56" cy="460" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="56" y="466" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="82" y="466" font-size="17" fill="#059669" font-weight="bold" xml:space="preserve">บท 7 — ศัตรูไล่ตามผู้เล่น</text>
<rect x="50" y="484" width="250" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="505" font-size="15" fill="#475569" xml:space="preserve">เริ่มจาก</text>
<text x="60" y="527" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">ทิศไปหาผู้เล่น (300, −400)</text>
<line x1="302" y1="510" x2="324" y2="510" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<text x="330" y="505" font-size="15" fill="#0f172a" xml:space="preserve">ยาว = √(300² + 400²) = 500</text>
<text x="330" y="528" font-size="15" fill="#0f172a" xml:space="preserve">normalize() แล้วคูณ 0.1</text>
<line x1="576" y1="510" x2="596" y2="510" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<rect x="600" y="486" width="156" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="678" y="515.6" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(0.06, −0.08)</text>
<line x1="56" y1="552" x2="56" y2="570" stroke="#7c3aed" stroke-width="3" marker-end="url(#ar-purple)"/>
<rect x="30" y="572" width="740" height="120" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="56" cy="600" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="56" y="606" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<text x="82" y="606" font-size="17" fill="#059669" font-weight="bold" xml:space="preserve">บท 8 — กระสุนพุ่งไปที่เมาส์</text>
<rect x="50" y="624" width="250" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="645" font-size="15" fill="#475569" xml:space="preserve">เริ่มจาก</text>
<text x="60" y="667" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">ยาน (400, 300) → เมาส์ (460, 380)</text>
<line x1="302" y1="650" x2="324" y2="650" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<text x="330" y="645" font-size="15" fill="#0f172a" xml:space="preserve">ผลต่าง (60, 80) ยาว 100 → (0.6, 0.8)</text>
<text x="330" y="668" font-size="15" fill="#0f172a" xml:space="preserve">คูณ bullet_speed = 10</text>
<line x1="576" y1="650" x2="596" y2="650" stroke="#0f172a" stroke-width="2" marker-end="url(#ar-ink)"/>
<rect x="600" y="626" width="156" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="678" y="655.6" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">(6, 8)</text>
<rect x="30" y="712" width="740" height="64" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="400" y="739" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">สรุป: ผลลัพธ์ทุกบทมาจากสูตรเดียวกัน  เวกเตอร์ ÷ ความยาวของมัน</text>
<text x="400" y="762" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">ถ้าบทที่ 2 ยังไม่แน่น บทที่ 6–8 จะยากเป็นทวีคูณ</text>
<rect x="30" y="796" width="362" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="54" cy="822" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="54" y="828" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="76" y="828" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">ข้ามแบบฝึกหัดบท 2 ไปทำเกมเลย</text>
<text x="48" y="852" font-size="15" fill="#0f172a" xml:space="preserve">เจอ normalize() ในบท 6 แล้วงง</text>
<text x="48" y="876" font-size="15" fill="#0f172a" xml:space="preserve">ไม่รู้ว่าทำไมต้องหารด้วยความยาว</text>
<rect x="408" y="796" width="362" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="822" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="828" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="828" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">ทำแบบฝึกหัดทุกบทก่อนไปบทถัดไป</text>
<text x="426" y="852" font-size="15" fill="#0f172a" xml:space="preserve">ฝึก (3, 4) → 5 → (0.6, 0.8) ให้คล่อง</text>
<text x="426" y="876" font-size="15" fill="#0f172a" xml:space="preserve">บท 6–8 ก็แค่ใช้สูตรเดิมซ้ำ</text>
</svg>
