<rect x="40" y="810" width="6" height="58" rx="3" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="56" y="833" font-size="15" fill="#0f172a" xml:space="preserve">แถว ④ คือหัวใจ: เซลล์ B ไม่ได้เปลี่ยน แต่ x เพิ่มจาก 6 เป็น 7 เพราะ kernel ยังจำ x ของรอบก่อน</text>
<text x="56" y="855" font-size="15" fill="#0f172a" xml:space="preserve">หมายเลขใน In[ ] บอกลำดับที่รันจริง (อาจไม่ตรงกับลำดับเซลล์บนจอ)</text>
<rect x="40" y="886" width="720" height="52" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="918" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">ถ้ารันเซลล์ A ครั้งเดียว แล้วรัน B 3 ครั้ง</text>
<text x="742" y="919" font-size="20" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">6 → 7 → 8</text>
<rect x="40" y="960" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="986" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="992" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="992" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">นับตามจำนวนเซลล์ที่เห็นบนจอ</text>
<text x="58" y="1016" font-size="15" fill="#0f172a" xml:space="preserve">เห็นเซลล์ B หนึ่งเซลล์ → ตอบ 6</text>
<text x="58" y="1040" font-size="15" fill="#0f172a" xml:space="preserve">ทั้งที่รัน B ไปแล้ว 2 ครั้ง (In[2], In[3])</text>
<rect x="408" y="960" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="986" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="992" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="992" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">นับจำนวนครั้งที่รันจริงจาก In[ ]</text>
<text x="426" y="1016" font-size="15" fill="#0f172a" xml:space="preserve">รัน B 2 ครั้ง → x = 7</text>
<text x="426" y="1040" font-size="15" fill="#0f172a" xml:space="preserve">สับสนเมื่อไร: Restart and run all</text>
