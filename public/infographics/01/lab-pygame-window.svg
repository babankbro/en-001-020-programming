<text x="400" y="720.0" font-size="14" fill="#475569" text-anchor="middle">ขั้น 3–4 (เส้นประ) ยังไม่มีในไฟล์นี้ — บทที่ 5 จะเติมลูกบอลเด้งลงในโครงเดียวกัน</text>
<circle cx="38" cy="752.0" r="13" fill="#d97706"/>
<text x="38" y="757.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="60" y="758.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ข้อ 21: คอมเมนต์ 3 บรรทัดของ for event ... แล้วรัน</text>
<rect x="60" y="774.0" width="350" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="76" y="800.0" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ ไม่มี event.get() ในลูป</text>
<text x="76" y="828.0" font-size="15" fill="#0f172a" text-anchor="start">หน้าต่าง &quot;ไม่ตอบสนอง (Not Responding)&quot;</text>
<text x="76" y="850.0" font-size="15" fill="#0f172a" text-anchor="start">กด ✕ ไม่ได้ เพราะไม่มีใครอ่าน QUIT</text>
<text x="76" y="872.0" font-size="15" fill="#0f172a" text-anchor="start">ปิดด้วย Ctrl+C ในเทอร์มินัล</text>
<rect x="426" y="774.0" width="350" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="442" y="800.0" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ เอาคอมเมนต์ออก</text>
<text x="442" y="828.0" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for event in pygame.event.get():</text>
<text x="442" y="850.0" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if event.type == pygame.QUIT:</text>
<text x="442" y="872.0" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">        running = False</text>
<rect x="60" y="902.0" width="716" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="76" y="925.0" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">คำถาม 3.1: ลบ flip() → fill() วาดลงบัฟเฟอร์หลังจอแต่ไม่ถูกสลับขึ้นมาแสดง ภาพจึงไม่อัปเดต</text>
</svg>
