<line x1="400" y1="318" x2="560" y2="404" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
<ellipse cx="400" cy="318" rx="170" ry="40" fill="#0f172a"/>
<text x="400" y="314" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">บท 01 เริ่มต้นรายวิชา</text>
<text x="400" y="338" font-size="14" fill="#cbd5e1" text-anchor="middle">แผนที่ · วิธีคิด · เครื่องมือ · error · พื้นฐาน</text>
<rect x="24" y="64" width="236" height="168" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="24" y="64" width="236" height="34" rx="10" fill="#2563eb"/>
<rect x="24" y="84" width="236" height="14" rx="0" fill="#2563eb"/>
<text x="36" y="87" font-size="15" fill="#ffffff" font-weight="bold">1. เส้นทาง 8 บท</text>
<text x="38" y="124" font-size="14" fill="#0f172a">• บท 1–4 ไพทอนบน Notebook</text>
<text x="38" y="150" font-size="14" fill="#0f172a">• บท 5–8 Pygame บนเครื่อง</text>
<text x="38" y="176" font-size="14" fill="#0f172a">• จบที่เกมยิงยานอวกาศ</text>
<text x="38" y="202" font-size="14" fill="#0f172a">• สอบ: อัตนัย 60 + ปรนัย 40</text>
<rect x="282" y="64" width="236" height="168" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<rect x="282" y="64" width="236" height="34" rx="10" fill="#059669"/>
<rect x="282" y="84" width="236" height="14" rx="0" fill="#059669"/>
<text x="294" y="87" font-size="15" fill="#ffffff" font-weight="bold">2. วงจรแก้ปัญหา 4 ขั้น</text>
<text x="296" y="124" font-size="14" fill="#0f172a">• วิเคราะห์ → ออกแบบ</text>
<text x="296" y="150" font-size="14" fill="#0f172a">• → เขียนโค้ด → ทดสอบ</text>
<text x="296" y="176" font-size="14" fill="#0f172a">• trace table ตามลำดับบรรทัด</text>
<text x="296" y="202" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">y: 100 → 101.0 (5 เฟรม)</text>
<rect x="540" y="64" width="236" height="168" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="540" y="64" width="236" height="34" rx="10" fill="#7c3aed"/>
<rect x="540" y="84" width="236" height="14" rx="0" fill="#7c3aed"/>
<text x="552" y="87" font-size="15" fill="#ffffff" font-weight="bold">3. เครื่องมือ &amp; pip</text>
<text x="554" y="124" font-size="14" fill="#0f172a">• Python 3.10+ ติ๊ก Add to PATH</text>
<text x="554" y="150" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">python -m pip install ...</text>
<text x="554" y="176" font-size="14" fill="#0f172a">• VS Code: เลือก interpreter</text>
<text x="554" y="202" font-size="14" fill="#0f172a">• Colab เปิด Pygame ไม่ได้</text>
<rect x="90" y="404" width="300" height="168" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<rect x="90" y="404" width="300" height="34" rx="10" fill="#d97706"/>
<rect x="90" y="424" width="300" height="14" rx="0" fill="#d97706"/>
<text x="102" y="427" font-size="15" fill="#ffffff" font-weight="bold">4. .py / .ipynb &amp; error</text>
<text x="104" y="464" font-size="14" fill="#0f172a">• .py รันใหม่ทุกครั้ง บนลงล่าง</text>
<text x="104" y="490" font-size="14" fill="#0f172a">• .ipynb ตัวแปรค้างใน kernel</text>
<text x="104" y="516" font-size="14" fill="#0f172a">• อ่าน Traceback จากบรรทัดล่าง</text>
<text x="104" y="542" font-size="14" fill="#0f172a">• SyntaxError ตรวจก่อนรัน</text>
<rect x="410" y="404" width="300" height="168" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<rect x="410" y="404" width="300" height="34" rx="10" fill="#dc2626"/>
<rect x="410" y="424" width="300" height="14" rx="0" fill="#dc2626"/>
<text x="422" y="427" font-size="15" fill="#ffffff" font-weight="bold">5. ทบทวน EN-001-002</text>
<text x="424" y="464" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">/ // % ** · if/elif · range</text>
<text x="424" y="490" font-size="14" fill="#0f172a">• ฟังก์ชัน · ตัวแปร local</text>
<text x="424" y="516" font-size="14" fill="#0f172a">• ลิสต์ · dict.get · slice</text>
<text x="424" y="542" font-size="14" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">class · __init__ · self</text>
<text x="400" y="604" font-size="14" fill="#475569" text-anchor="middle">ต่อยอดกัน: รู้เส้นทาง → มีวิธีคิด → เครื่องมือพร้อม → รันและแก้ error ได้ → พื้นฐานพร้อมสำหรับบทที่ 2</text>
</svg>
