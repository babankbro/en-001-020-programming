<text x="400" y="38" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="middle">แผนที่แนวคิด บทที่ 1 แนะนำรายวิชาและเครื่องมือ</text>
<line x1="400" y1="318" x2="142" y2="232" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="400" y1="318" x2="400" y2="232" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4"/>
