<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 622" width="800" height="622" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="แผนที่แนวคิด 5 หัวข้อของบทที่ 1">
