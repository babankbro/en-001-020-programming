<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1052" width="800" height="1052" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">ตารางไล่ค่า: ลูกบอลตก 5 เฟรม (GRAVITY = 0.1)</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า ไล่ค่า y และ vy ทีละเฟรมอย่างไร และทำไมลำดับบรรทัดจึงเปลี่ยนคำตอบ</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ค่า y</text>
<rect x="189.1" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="216.1" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ค่า vy</text>
<line x1="275.6" y1="120" x2="295.6" y2="120" stroke="#7c3aed" stroke-width="3"/>
<text x="302.6" y="125" font-size="15" fill="#0f172a" xml:space="preserve">vy ของแถวก่อนถูกนำมาบวก</text>
<rect x="501.3" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="528.3" y="125" font-size="15" fill="#0f172a" xml:space="preserve">คำตอบ</text>
<rect x="40" y="152" width="400" height="152" rx="10" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="56" y="182" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">GRAVITY = 0.1</text>
<text x="56" y="208" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">y, vy = 100, 0</text>
<text x="56" y="234" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for frame in range(1, 6):</text>
<text x="56" y="260" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#93c5fd" font-family="Consolas, 'Courier New', monospace">    y += vy        </tspan><tspan fill="#fbbf24" font-family="Consolas, 'Courier New', monospace"># ①</tspan></text>
<text x="56" y="286" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#6ee7b7" font-family="Consolas, 'Courier New', monospace">    vy += GRAVITY  </tspan><tspan fill="#fbbf24" font-family="Consolas, 'Courier New', monospace"># ②</tspan></text>
<circle cx="474" cy="192" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="474" y="198" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="498" y="190" font-size="16" fill="#2563eb" font-weight="bold" xml:space="preserve">y += vy  ทำก่อน</text>
<text x="498" y="212" font-size="15" fill="#475569" xml:space="preserve">ใช้ vy ที่ได้จากแถวก่อนหน้า</text>
<line x1="470" y1="208" x2="300" y2="260" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="300" cy="260" r="3.5" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="474" cy="256" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="474" y="262" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="498" y="254" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">vy += 0.1  ทำทีหลัง</text>
<text x="498" y="276" font-size="15" fill="#475569" xml:space="preserve">ค่าใหม่นี้ถูกใช้ในเฟรมถัดไป</text>
<line x1="470" y1="272" x2="300" y2="286" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="300" cy="286" r="3.5" fill="#059669" stroke="none" stroke-width="1.5"/>
<rect x="40" y="334" width="720" height="44" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="95" y="362" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">เฟรม</text>
<text x="350" y="362" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">① y ← y + vy</text>
<text x="655" y="362" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">② vy ← vy + 0.1</text>
<rect x="40" y="378" width="720" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="95" y="407" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">เริ่ม</text>
<text x="350" y="407" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">100</text>
<text x="655" y="407" font-size="17" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text>
<rect x="40" y="424" width="720" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="95" y="453" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="200" y="453" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#2563eb">100 + </tspan><tspan fill="#059669" font-weight="bold">0</tspan> = <tspan fill="#2563eb" font-weight="bold">100</tspan></text>
<text x="655" y="453" font-size="17" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.1</text>
<path d="M633,406 C535,422 320.77500000000003,428 266.77500000000003,436" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar-purple)"/>
<rect x="40" y="470" width="720" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="95" y="499" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="200" y="499" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#2563eb">100 + </tspan><tspan fill="#059669" font-weight="bold">0.1</tspan> = <tspan fill="#2563eb" font-weight="bold">100.1</tspan></text>
<text x="655" y="499" font-size="17" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.2</text>
<path d="M633,452 C535,468 330.125,474 276.125,482" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar-purple)"/>
<rect x="40" y="516" width="720" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="95" y="545" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="200" y="545" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#2563eb">100.1 + </tspan><tspan fill="#059669" font-weight="bold">0.2</tspan> = <tspan fill="#2563eb" font-weight="bold">100.3</tspan></text>
<text x="655" y="545" font-size="17" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.3</text>
<path d="M633,498 C535,514 348.825,520 294.825,528" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar-purple)"/>
<rect x="40" y="562" width="720" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="95" y="591" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<text x="200" y="591" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#2563eb">100.3 + </tspan><tspan fill="#059669" font-weight="bold">0.3</tspan> = <tspan fill="#2563eb" font-weight="bold">100.6</tspan></text>
<text x="655" y="591" font-size="17" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.4</text>
<path d="M633,544 C535,560 348.825,566 294.825,574" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar-purple)"/>
<rect x="40" y="608" width="720" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="95" y="637" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">5</text>
<text x="200" y="637" font-size="17" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#2563eb">100.6 + </tspan><tspan fill="#059669" font-weight="bold">0.4</tspan> = <tspan fill="#d97706" font-weight="bold">101.0</tspan></text>
<text x="655" y="637" font-size="17" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.5</text>
<path d="M633,590 C535,606 348.825,612 294.825,620" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar-purple)"/>
<rect x="40" y="672" width="720" height="54" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="705" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">คำตอบเฟรมที่ 5 (y หลัง ①, vy หลัง ②)</text>
<text x="742" y="706" font-size="20" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">y = 101.0, vy = 0.5</text>
<circle cx="55" cy="762" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="768" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="80" y="768" font-size="17" fill="#0f172a" font-weight="bold" xml:space="preserve">เห็นแบบแผนแล้วสรุปเป็นสูตร (ตรวจกลับด้วยการรันจริงเสมอ)</text>
<rect x="40" y="784" width="720" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="60" y="814" font-size="16" fill="#0f172a" xml:space="preserve">ระยะที่ตกแต่ละเฟรม 0, 0.1, 0.2, 0.3, 0.4 → y เฟรมที่ n = 100 + 0.1 × n(n − 1) / 2</text>
<text x="60" y="842" font-size="16" fill="#0f172a" xml:space="preserve"><tspan font-weight="bold">n = 5:  </tspan><tspan font-family="Consolas, 'Courier New', monospace">100 + 0.1 × 10 = 101.0</tspan><tspan fill="#059669" font-weight="bold">  ✓ ตรงกับตาราง</tspan></text>
<text x="60" y="866" font-size="16" fill="#0f172a" xml:space="preserve"><tspan font-weight="bold">n = 10: </tspan><tspan font-family="Consolas, 'Courier New', monospace">100 + 0.1 × 45 = 104.5</tspan><tspan fill="#475569">  ไม่ต้องไล่ 10 แถว</tspan></text>
<rect x="40" y="900" width="352" height="128" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="926" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="932" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="932" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">สลับเป็น ② ก่อน ①</text>
<text x="58" y="956" font-size="15" fill="#0f172a" xml:space="preserve">vy = 0.1 ก่อน แล้ว y = 100 + 0.1</text>
<text x="58" y="980" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">เฟรม 1: y = 100.1</text>
<text x="58" y="1004" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">เฟรม 5: y = 101.5</text>
<rect x="408" y="900" width="352" height="128" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="926" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="932" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="932" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">ไล่ตามลำดับบรรทัดจริง</text>
<text x="426" y="956" font-size="15" fill="#0f172a" xml:space="preserve">y ใช้ vy เดิม (0) แล้วจึงเพิ่ม vy</text>
<text x="426" y="980" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">เฟรม 1: y = 100</text>
<text x="426" y="1004" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">เฟรม 5: y = 101.0</text>
</svg>
