<text x="122" y="97" font-size="15" fill="#0f172a" text-anchor="start">เซลล์โค้ด</text>
<rect x="198.6" y="84" width="18" height="18" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
<text x="224.6" y="97" font-size="15" fill="#0f172a" text-anchor="start">output ปกติ</text>
<rect x="321.3" y="84" width="18" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="347.3" y="97" font-size="15" fill="#0f172a" text-anchor="start">error</text>
