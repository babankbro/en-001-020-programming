<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ขั้นตอนที่ 5: Notebook แรกบน Colab (ข้อย่อย 9–13)</text>
<text x="400" y="66" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: แต่ละเซลล์ควรแสดงอะไร และทำไมลำดับการรันเซลล์จึงสำคัญ</text>
<text x="24" y="97" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีในภาพ:</text>
