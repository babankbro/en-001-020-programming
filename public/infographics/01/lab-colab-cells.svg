<text x="66" y="148" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace">Lab01_&lt;รหัสนักศึกษา&gt;.ipynb</text>
<text x="556" y="148" font-size="14" fill="#2563eb" text-anchor="end" font-weight="bold">+ Code</text>
<rect x="110" y="176" width="450" height="114" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="80" cy="192" r="11" fill="#e2e8f0"/>
<path d="M 76 186 L 86 192 L 76 198 z" fill="#475569"/>
<rect x="66" y="206" width="30" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="81" y="221" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1]</text>
<text x="122" y="199" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;Hello, my name is &lt;ชื่อของคุณ&gt;.&quot;)</text>
<text x="122" y="219" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a = 5</text>
<text x="122" y="239" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">b = 2</text>
<text x="122" y="259" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;a x b =&quot;, a*b)</text>
<text x="122" y="279" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(type(a), type(a / b))</text>
<rect x="110" y="296" width="450" height="68" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<text x="122" y="314" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Hello, my name is &lt;ชื่อของคุณ&gt;.</text>
<text x="122" y="334" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a x b = 10</text>
<text x="122" y="354" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;class &#x27;int&#x27;&gt; &lt;class &#x27;float&#x27;&gt;</text>
<circle cx="590" cy="188" r="13" fill="#d97706"/>
<text x="590" y="193" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="612" y="194" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">ข้อ 10: Shift+Enter</text>
<text x="590" y="216" font-size="15" fill="#0f172a" text-anchor="start">a / b ใช้ / จึงได้ float</text>
<text x="590" y="238" font-size="15" fill="#0f172a" text-anchor="start">ส่วน a เป็น int</text>
<text x="590" y="260" font-size="15" fill="#0f172a" text-anchor="start">print 3 ครั้ง → 3 บรรทัด</text>
<rect x="110" y="384" width="450" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="80" cy="400" r="11" fill="#e2e8f0"/>
<path d="M 76 394 L 86 400 L 76 406 z" fill="#475569"/>
<rect x="66" y="414" width="30" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="81" y="429" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[2]</text>
<text x="122" y="407" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a * b</text>
<rect x="110" y="424" width="450" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<text x="122" y="442" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10</text>
<circle cx="590" cy="396" r="13" fill="#d97706"/>
<text x="590" y="401" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="612" y="402" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">ข้อ 11: ไม่มี print</text>
<text x="590" y="424" font-size="15" fill="#0f172a" text-anchor="start">บรรทัดสุดท้ายเป็นนิพจน์</text>
<text x="590" y="446" font-size="15" fill="#0f172a" text-anchor="start">Notebook แสดงค่าให้เอง</text>
<rect x="110" y="488" width="450" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="80" cy="504" r="11" fill="#e2e8f0"/>
<path d="M 76 498 L 86 504 L 76 510 z" fill="#475569"/>
<rect x="66" y="518" width="30" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="81" y="533" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[3]</text>
<text x="122" y="511" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(c)</text>
<rect x="110" y="528" width="450" height="88" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="122" y="546" font-size="13.5" fill="#dc2626" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">----------------------------------------</text>
<text x="122" y="566" font-size="13.5" fill="#dc2626" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">NameError      Traceback (most recent call last)</text>
<text x="122" y="586" font-size="13.5" fill="#dc2626" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">...</text>
<text x="122" y="606" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">NameError: name &#x27;c&#x27; is not defined</text>
<circle cx="590" cy="500" r="13" fill="#d97706"/>
<text x="590" y="505" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="612" y="506" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">ข้อ 12: เกิด error</text>
<text x="590" y="528" font-size="15" fill="#0f172a" text-anchor="start">ยังไม่เคยสร้างตัวแปร c</text>
<text x="590" y="550" font-size="15" fill="#0f172a" text-anchor="start">อ่านบรรทัดล่างสุดก่อน</text>
<rect x="48" y="644" width="524" height="30" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="60" y="665" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">ข้อ 13: แทรกเซลล์ใหม่ &quot;ด้านบน&quot; เซลล์ print(c) แล้วรันตามลำดับ ↓</text>
<rect x="110" y="688" width="450" height="34" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="80" cy="704" r="11" fill="#e2e8f0"/>
<path d="M 76 698 L 86 704 L 76 710 z" fill="#475569"/>
<rect x="66" y="718" width="30" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="81" y="733" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[4]</text>
<text x="122" y="711" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">c = a + b</text>
<rect x="110" y="750" width="450" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="80" cy="766" r="11" fill="#e2e8f0"/>
<path d="M 76 760 L 86 766 L 76 772 z" fill="#475569"/>
<rect x="66" y="780" width="30" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="81" y="795" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[5]</text>
<text x="122" y="773" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(c)</text>
<rect x="110" y="790" width="450" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<text x="122" y="808" font-size="13.5" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">7</text>
<circle cx="590" cy="700" r="13" fill="#d97706"/>
<text x="590" y="705" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="612" y="706" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">ข้อ 13: ผลลัพธ์ 7</text>
<text x="590" y="728" font-size="15" fill="#0f172a" text-anchor="start">c = 5 + 2 = 7</text>
<text x="590" y="750" font-size="15" fill="#0f172a" text-anchor="start">เลข [4] [5] = ลำดับที่รัน</text>
<text x="590" y="772" font-size="15" fill="#0f172a" text-anchor="start">จริง ไม่ใช่ตำแหน่งบนหน้า</text>
<rect x="48" y="680" width="524" height="150" rx="10" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="38" cy="874" r="13" fill="#d97706"/>
<text x="38" y="879" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="60" y="880" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">คำถาม 2.1: Runtime → Restart session แล้วรันเฉพาะ print(c)</text>
<rect x="60" y="896" width="350" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="76" y="924" font-size="15" fill="#dc2626" text-anchor="start" font-weight="bold">✗ Restart แล้วรัน print(c) ทันที</text>
<text x="76" y="948" font-size="15" fill="#0f172a" text-anchor="start">kernel ล้างตัวแปร a, b, c หมด</text>
<text x="76" y="972" font-size="15" fill="#0f172a" text-anchor="start">→ NameError: name &#x27;c&#x27; is not defined</text>
<rect x="426" y="896" width="350" height="98" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="442" y="924" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ รันเซลล์ที่นิยามตัวแปรใหม่ก่อน</text>
<text x="442" y="948" font-size="15" fill="#0f172a" text-anchor="start">รันเซลล์ [1] → c = a + b → print(c)</text>
<text x="442" y="972" font-size="15" fill="#0f172a" text-anchor="start">จากบนลงล่าง (ไฟล์ .py ทำแบบนี้เสมอ)</text>
</svg>
