<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1106" width="800" height="1106" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">ทายผลก่อนรัน (1): ตัวดำเนินการ เงื่อนไข และการวนซ้ำ</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า 7 / 2, 7 // 2, 7 % 2 ต่างกันอย่างไร และ while หยุดที่ค่าใด</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ค่าเริ่มต้น/ระหว่างทาง</text>
<rect x="306.4" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="333.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">เงื่อนไขจริง</text>
<rect x="433.7" y="111" width="20" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="460.7" y="125" font-size="15" fill="#0f172a" xml:space="preserve">เงื่อนไขเท็จ</text>
<rect x="561" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="588" y="125" font-size="15" fill="#0f172a" xml:space="preserve">คำตอบ</text>
<circle cx="55" cy="166" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="80" y="172" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">แบ่งของ 7 ชิ้น ทีละ 2 ชิ้น</text>
<circle cx="70" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="110" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="164" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="204" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="258" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="298" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="352" cy="224" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<rect x="50" y="204" width="80" height="40" rx="10" fill="none" stroke="#059669" stroke-width="2"/>
<rect x="144" y="204" width="80" height="40" rx="10" fill="none" stroke="#059669" stroke-width="2"/>
<rect x="238" y="204" width="80" height="40" rx="10" fill="none" stroke="#059669" stroke-width="2"/>
<rect x="332" y="204" width="40" height="40" rx="10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
<text x="170" y="266" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">3 กลุ่มเต็ม</text>
<text x="352" y="266" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">เศษ 1</text>
<text x="420" y="218" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">7 / 2</text>
<text x="500" y="218" font-size="17" fill="#64748b" xml:space="preserve">→</text>
<rect x="526" y="196" width="56" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="554" y="218.4" font-size="15" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3.5</text>
<text x="594" y="218" font-size="15" fill="#475569" xml:space="preserve">หารปกติ ได้ float เสมอ</text>
<text x="420" y="258" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">7 // 2</text>
<text x="500" y="258" font-size="17" fill="#64748b" xml:space="preserve">→</text>
<rect x="526" y="236" width="56" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="554" y="258.4" font-size="15" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<text x="594" y="258" font-size="15" fill="#475569" xml:space="preserve">นับกลุ่มเต็ม (หารปัดลง)</text>
<text x="420" y="298" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">7 % 2</text>
<text x="500" y="298" font-size="17" fill="#64748b" xml:space="preserve">→</text>
<rect x="526" y="276" width="56" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="554" y="298.4" font-size="15" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<text x="594" y="298" font-size="15" fill="#475569" xml:space="preserve">เศษที่เหลือ (มอดุโล)</text>
<text x="420" y="338" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2 ** 3</text>
<text x="500" y="338" font-size="17" fill="#64748b" xml:space="preserve">→</text>
<rect x="526" y="316" width="56" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="554" y="338.4" font-size="15" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">8</text>
<text x="594" y="338" font-size="15" fill="#475569" xml:space="preserve">2 × 2 × 2 (ยกกำลัง)</text>
<circle cx="55" cy="372" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="378" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="80" y="378" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">if / elif ตรวจบนลงล่าง เข้าเงื่อนไขแรกที่จริงแล้วหยุด  (score = 72)</text>
<rect x="40" y="400" width="106.5" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="93.2" y="422.4" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">score = 72</text>
<line x1="149.5" y1="417" x2="167.5" y2="417" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-gray)"/>
<rect x="170.5" y="400" width="127.2" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="234.1" y="422.4" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">72 &gt;= 80 ?  เท็จ</text>
<line x1="300.7" y1="417" x2="318.7" y2="417" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-gray)"/>
<rect x="321.7" y="400" width="127.2" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="385.3" y="422.4" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">72 &gt;= 70 ?  จริง</text>
<line x1="451.9" y1="417" x2="469.9" y2="417" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-gray)"/>
<rect x="472.9" y="400" width="114.8" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="530.3" y="422.4" font-size="15" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">grade = "B"</text>
<text x="40" y="460" font-size="15" fill="#475569" xml:space="preserve">เมื่อเจอเงื่อนไขจริงแล้ว else ไม่ถูกตรวจอีก จึงได้ B ไม่ใช่ C</text>
<circle cx="55" cy="494" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="500" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="80" y="500" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">range(1, 6, 2): เริ่ม 1 เพิ่มทีละ 2 หยุดก่อนถึง 6</text>
<line x1="60" y1="560" x2="700" y2="560" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="554" x2="80" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="80" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">0</text>
<line x1="180" y1="554" x2="180" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="180" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">1</text>
<circle cx="180" cy="560" r="12" fill="#d97706" stroke="none" stroke-width="1.5"/>
<line x1="280" y1="554" x2="280" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="280" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">2</text>
<line x1="380" y1="554" x2="380" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="380" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">3</text>
<circle cx="380" cy="560" r="12" fill="#d97706" stroke="none" stroke-width="1.5"/>
<line x1="480" y1="554" x2="480" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="480" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">4</text>
<line x1="580" y1="554" x2="580" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="580" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">5</text>
<circle cx="580" cy="560" r="12" fill="#d97706" stroke="none" stroke-width="1.5"/>
<line x1="680" y1="554" x2="680" y2="566" stroke="#64748b" stroke-width="1.5"/>
<text x="680" y="588" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">6</text>
<path d="M190,548 Q280.0,520 370,548" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="280" y="528" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+2</text>
<path d="M390,548 Q480.0,520 570,548" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="480" y="528" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+2</text>
<circle cx="680" cy="560" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
<text x="680" y="565" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="680" y="610" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">6 ไม่รวม</text>
<text x="380" y="622" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve">ได้ 1, 3, 5</text>
<circle cx="55" cy="648" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="654" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<text x="80" y="654" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">while count &lt; 5: count += 2   ตรวจเงื่อนไข “ก่อน” ทุกรอบ</text>
<rect x="40" y="674" width="720" height="38" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="100" y="699" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">รอบ</text>
<text x="290" y="699" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">ตรวจ count &lt; 5</text>
<text x="590" y="699" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">count หลัง count += 2</text>
<rect x="40" y="716" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="100" y="743" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<rect x="210" y="721" width="160" height="32" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="290" y="742.4" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">0 &lt; 5  จริง</text>
<text x="590" y="743" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0 + 2 = 2</text>
<rect x="40" y="762" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="100" y="789" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<rect x="210" y="767" width="160" height="32" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="290" y="788.4" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">2 &lt; 5  จริง</text>
<text x="590" y="789" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2 + 2 = 4</text>
<rect x="40" y="808" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="100" y="835" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<rect x="210" y="813" width="160" height="32" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="290" y="834.4" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">4 &lt; 5  จริง</text>
<text x="590" y="835" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4 + 2 = 6</text>
<rect x="40" y="854" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="100" y="881" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">—</text>
<rect x="210" y="859" width="160" height="32" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="290" y="880.4" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">6 &lt; 5  เท็จ</text>
<text x="590" y="881" font-size="16" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">ออกจากลูป</text>
<rect x="40" y="908" width="720" height="50" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="939" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">print(count) แสดง</text>
<text x="742" y="941.4" font-size="24" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">6</text>
<rect x="40" y="978" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="1004" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="1010" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="1010" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">ตอบ 5 เพราะเงื่อนไขเขียนว่า &lt; 5</text>
<text x="58" y="1034" font-size="15" fill="#0f172a" xml:space="preserve">count ไม่เคยเท่ากับ 5 เลย (0, 2, 4, 6)</text>
<text x="58" y="1058" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.1 + 0.2 == 0.3  →  False</text>
<rect x="408" y="978" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="1004" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="1010" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="1010" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">ไล่ทีละรอบ: 4 &lt; 5 จริง จึงบวกอีกเป็น 6</text>
<text x="426" y="1034" font-size="15" fill="#0f172a" xml:space="preserve">แล้ว 6 &lt; 5 เท็จ จึงหยุด</text>
<text x="426" y="1058" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">round(0.1 + 0.2, 2)  →  0.3</text>
</svg>
