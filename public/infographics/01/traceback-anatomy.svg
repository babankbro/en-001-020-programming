<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1022" width="800" height="1022" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">อ่าน Traceback ทีละขั้น: พังที่ไหน และผิดที่ไหน</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า ควรอ่าน error message ลำดับใด และทำไมบรรทัดที่พังอาจไม่ใช่บรรทัดที่ผิด</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ชนิด error</text>
<rect x="229" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="256" y="125" font-size="15" fill="#0f172a" xml:space="preserve">บรรทัดที่พังจริง</text>
<rect x="373.7" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="400.7" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ผู้เรียก (ต้นเหตุ)</text>
<rect x="529.8" y="111" width="20" height="18" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="556.8" y="125" font-size="15" fill="#0f172a" xml:space="preserve">หัว Traceback</text>
<text x="40" y="158" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">โค้ดใน lab01.py</text>
<rect x="40" y="170" width="720" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="56" y="198" font-size="15" fill="#64748b" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<text x="90" y="198" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def average(total, n):</text>
<rect x="80" y="205" width="300" height="26" rx="4" fill="#fffbeb" stroke="none" stroke-width="0"/>
<text x="56" y="224" font-size="15" fill="#64748b" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text>
<text x="90" y="224" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    return total / n</text>
<text x="56" y="250" font-size="15" fill="#64748b" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<text x="90" y="250" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"></text>
<rect x="80" y="257" width="300" height="26" rx="4" fill="#eff6ff" stroke="none" stroke-width="0"/>
<text x="56" y="276" font-size="15" fill="#64748b" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text>
<text x="90" y="276" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(average(30, 0))</text>
<text x="400" y="224" font-size="15" fill="#d97706" font-weight="bold" xml:space="preserve">← บรรทัด 2: สูตรหาร (ถูกต้องแล้ว)</text>
<text x="400" y="276" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">← บรรทัด 4: ส่ง n = 0 เข้าไป</text>
<text x="40" y="328" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">ผลที่ได้ตอนรัน (อ่านตามหมายเลข ① → ④ ไม่ใช่บนลงล่าง)</text>
<rect x="40" y="340" width="400" height="244" rx="10" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="54" y="370" font-size="15" fill="#c4b5fd" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Traceback (most recent call last):</text>
<text x="54" y="398" font-size="15" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  File "lab01.py", line 4, in &lt;module&gt;</text>
<text x="54" y="426" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    print(average(30, 0))</text>
<text x="54" y="454" font-size="15" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">          ^^^^^^^^^^^^^^</text>
<text x="54" y="482" font-size="15" fill="#fdba74" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  File "lab01.py", line 2, in average</text>
<text x="54" y="510" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    return total / n</text>
<text x="54" y="538" font-size="15" fill="#fdba74" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">           ~~~~~~^~~</text>
<text x="54" y="566" font-size="15" fill="#fca5a5" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ZeroDivisionError: division by zero</text>
<rect x="500" y="346" width="268" height="58" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<rect x="500" y="346" width="6" height="58" rx="3" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="516" y="369" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">most recent call last</text>
<text x="516" y="391" font-size="15" fill="#0f172a" xml:space="preserve">ชั้นที่เกิดล่าสุดอยู่ล่างสุด</text>
<line x1="466" y1="368" x2="434" y2="365" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="434" cy="365" r="3.5" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<circle cx="482" cy="368" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="482" y="374" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<rect x="500" y="416" width="268" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<rect x="500" y="416" width="6" height="58" rx="3" fill="#2563eb" stroke="none" stroke-width="0"/>
<text x="516" y="439" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">ชั้นบน = ผู้เรียก</text>
<text x="516" y="461" font-size="15" fill="#0f172a" xml:space="preserve">line 4 ส่ง average(30, 0) → n = 0</text>
<line x1="466" y1="438" x2="434" y2="393" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="434" cy="393" r="3.5" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="482" cy="438" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="482" y="444" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<rect x="500" y="486" width="268" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<rect x="500" y="486" width="6" height="58" rx="3" fill="#d97706" stroke="none" stroke-width="0"/>
<text x="516" y="509" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">ชั้นล่างสุด = บรรทัดที่พังจริง</text>
<text x="516" y="531" font-size="15" fill="#0f172a" xml:space="preserve">line 2 ใน average, ^ ชี้ที่ /</text>
<line x1="466" y1="508" x2="434" y2="477" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="434" cy="477" r="3.5" fill="#d97706" stroke="none" stroke-width="1.5"/>
<circle cx="482" cy="508" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="482" y="514" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<rect x="500" y="552" width="268" height="58" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<rect x="500" y="552" width="6" height="58" rx="3" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="516" y="575" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">อ่านบรรทัดสุดท้ายก่อน</text>
<text x="516" y="597" font-size="15" fill="#0f172a" xml:space="preserve">ชนิด ZeroDivisionError = หารด้วยศูนย์</text>
<line x1="466" y1="574" x2="434" y2="561" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="434" cy="561" r="3.5" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<circle cx="482" cy="574" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="482" y="580" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="40" y="636" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">ไล่ค่าให้เห็นต้นเหตุ</text>
<rect x="40" y="650" width="188.8" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="134.4" y="673" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">บรรทัด 4: average(30, 0)</text>
<line x1="231.8" y1="668" x2="249.8" y2="668" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-gray)"/>
<rect x="252.8" y="650" width="130.9" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="318.2" y="673" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">total = 30, n = 0</text>
<line x1="386.7" y1="668" x2="404.7" y2="668" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-gray)"/>
<rect x="407.7" y="650" width="126.7" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="471" y="673" font-size="15" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve">บรรทัด 2: 30 / 0</text>
<line x1="537.4" y1="668" x2="555.4" y2="668" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar-gray)"/>
<rect x="558.4" y="650" width="160" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="638.4" y="673" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">ZeroDivisionError</text>
<rect x="40" y="704" width="720" height="50" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="58" y="735" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">แก้ที่ผู้เรียก: average(30, 3)</text>
<text x="742" y="736.7" font-size="22" fill="#059669" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10.0</text>
<rect x="40" y="774" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="800" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="806" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="806" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">แก้สูตรในบรรทัด 2</text>
<text x="58" y="830" font-size="15" fill="#0f172a" xml:space="preserve">total / n ถูกอยู่แล้ว แก้ไปก็ไม่หาย</text>
<text x="58" y="854" font-size="15" fill="#0f172a" xml:space="preserve">เพราะต้นเหตุคือค่า n = 0 จากบรรทัด 4</text>
<rect x="408" y="774" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="800" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="806" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="806" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">ไล่ขึ้นไปดูชั้นบน (ผู้เรียก)</text>
<text x="426" y="830" font-size="15" fill="#0f172a" xml:space="preserve">ส่งค่าที่ถูก เช่น average(30, 3)</text>
<text x="426" y="854" font-size="15" fill="#0f172a" xml:space="preserve">หรือป้องกัน if n == 0: ก่อนหาร</text>
<rect x="40" y="898" width="720" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="56" y="926" font-size="16" fill="#7c3aed" font-weight="bold" xml:space="preserve">เทียบ: SyntaxError ไม่มีหัว Traceback เพราะโปรแกรมยังไม่เริ่มรันเลย</text>
<text x="56" y="956" font-size="16" fill="#0f172a" xml:space="preserve"><tspan font-weight="bold">โค้ด: </tspan><tspan font-family="Consolas, 'Courier New', monospace">print("Hello"</tspan></text>
<text x="56" y="984" font-size="16" fill="#0f172a" xml:space="preserve"><tspan font-weight="bold">บรรทัดสุดท้าย: </tspan><tspan font-family="Consolas, 'Courier New', monospace">SyntaxError: '(' was never closed</tspan></text>
</svg>
