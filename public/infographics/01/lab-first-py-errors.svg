<text x="84" y="203" font-size="13" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2</text>
<text x="96" y="203" font-size="13.5" fill="#475569" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">n1, n2, n3 = 5, 10, 15</text>
<rect x="574" y="188" width="104" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
