<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1241" width="800" height="1241" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="เปรียบเทียบ SyntaxError ที่ไม่รันเลยกับ TypeError ที่รันบรรทัด 1-5 แล้วล้มที่บรรทัด 6 พร้อมวิธีอ่าน Traceback">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<title>เปรียบเทียบ SyntaxError ที่ไม่รันเลยกับ TypeError ที่รันบรรทัด 1-5 แล้วล้มที่บรรทัด 6 พร้อมวิธีอ่าน Traceback</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ขั้นตอนที่ 6: first.py — SyntaxError กับ TypeError ต่างกันอย่างไร</text>
<text x="400" y="66" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: โปรแกรมเริ่มทำงานแล้วหรือยังตอนเกิด error และอ่าน Traceback อย่างไร</text>
<text x="24" y="97" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีในภาพ:</text>
<rect x="96" y="84" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="122" y="97" font-size="15" fill="#0f172a" text-anchor="start">บรรทัดที่รันแล้ว</text>
<rect x="229.79999999999998" y="84" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
<text x="255.79999999999998" y="97" font-size="15" fill="#0f172a" text-anchor="start">ไม่ได้รัน</text>
<rect x="324.6" y="84" width="18" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="350.6" y="97" font-size="15" fill="#0f172a" text-anchor="start">จุดที่ผิด</text>
<rect x="411.6" y="84" width="18" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="437.6" y="97" font-size="15" fill="#0f172a" text-anchor="start">ลำดับอ่าน</text>
<circle cx="38" cy="136" r="13" fill="#d97706"/>
<text x="38" y="141" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="60" y="142" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ข้อ 14: ลืม ) ท้ายบรรทัด 5 → SyntaxError (ตรวจไวยากรณ์ก่อนรัน)</text>
<rect x="60" y="156" width="500" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="64" y="166" width="492" height="20" rx="3" fill="#f1f5f9" stroke="none" stroke-width="0"/>
<text x="84" y="181" font-size="13" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">1</text>
<text x="96" y="181" font-size="13.5" fill="#475569" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;start&quot;)</text>
