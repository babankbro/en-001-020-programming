<title>สคริปต์ check_env.py ผลลัพธ์ 7 บรรทัด ลำดับการ import และการเลือก interpreter ใน VS Code</title>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ขั้นตอนที่ 4: check_env.py และผลลัพธ์ที่ควรเห็น</text>
<text x="400" y="66" font-size="15" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: ผลรันที่ถูกต้องหน้าตาเป็นอย่างไร และถ้า import ไม่ผ่านต้องดูตรงไหน</text>
<text x="24" y="97" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">สีในภาพ:</text>
<rect x="96" y="84" width="18" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="122" y="97" font-size="15" fill="#0f172a" text-anchor="start">โค้ดที่พิมพ์</text>
<rect x="198.6" y="84" width="18" height="18" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.8"/>
<text x="224.6" y="97" font-size="15" fill="#0f172a" text-anchor="start">ข้อความทักทาย pygame</text>
<rect x="386.0999999999999" y="84" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="412.0999999999999" y="97" font-size="15" fill="#0f172a" text-anchor="start">บรรทัดที่ต้องส่ง</text>
<rect x="519.8999999999999" y="84" width="18" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="545.8999999999999" y="97" font-size="15" fill="#0f172a" text-anchor="start">ข้อผิดพลาด</text>
<circle cx="38" cy="138" r="13" fill="#d97706"/>
<text x="38" y="143" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="60" y="144" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">พิมพ์ไฟล์ check_env.py ในโฟลเดอร์ ps-course (VS Code)</text>
<rect x="60" y="160" width="716" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="84" y="186" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">1</text>
<text x="98" y="186" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">import sys</text>
<text x="84" y="207" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2</text>
<text x="98" y="207" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">import pygame, numpy, matplotlib, pandas</text>
<text x="84" y="228" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">3</text>
<text x="98" y="228" font-size="14" fill="#0f172a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"></text>
<text x="84" y="249" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">4</text>
<text x="98" y="249" font-size="14" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;Python    :&quot;, sys.version.split()[0])</text>
<text x="84" y="270" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">5</text>
<text x="98" y="270" font-size="14" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;pygame    :&quot;, pygame.version.ver)</text>
<text x="84" y="291" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">6</text>
<text x="98" y="291" font-size="14" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;numpy     :&quot;, numpy.__version__)</text>
<text x="84" y="312" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">7</text>
<text x="98" y="312" font-size="14" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;matplotlib:&quot;, matplotlib.__version__)</text>
<text x="84" y="333" font-size="14" fill="#94a3b8" text-anchor="end" font-family="Consolas, 'Courier New', monospace">8</text>
<text x="98" y="333" font-size="14" fill="#2563eb" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(&quot;pandas    :&quot;, pandas.__version__)</text>
<path d="M 520 239 h 20 v 99 h -20" stroke="#059669" stroke-width="2" fill="none"/>
<text x="550" y="287" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">print 5 บรรทัด</text>
<text x="550" y="308" font-size="15" fill="#059669" text-anchor="start">→ output 5 บรรทัดล่าง</text>
<circle cx="38" cy="380" r="13" fill="#d97706"/>
<text x="38" y="385" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="60" y="386" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">รัน: กด ▶ มุมขวาบน หรือพิมพ์  python check_env.py</text>
