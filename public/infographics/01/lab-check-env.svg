<text x="74" y="602" font-size="14" fill="#86efac" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">pandas    : 2.2.0</text>
<circle cx="38" cy="474" r="13" fill="#d97706"/>
<text x="38" y="479" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<path d="M 330 502 h 14 v 106 h -14" stroke="#86efac" stroke-width="2" fill="none"/>
<text x="356" y="546" font-size="15" fill="#86efac" text-anchor="start" font-weight="bold">บรรทัด 3–7 = เวอร์ชันครบ 5 ตัว</text>
<text x="356" y="568" font-size="15" fill="#86efac" text-anchor="start">→ แคปหน้าจอส่ง (จากเครื่องตนเอง)</text>
<rect x="60" y="632" width="716" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="76" y="655" font-size="15" fill="#475569" text-anchor="start">บรรทัด 1–2 สีเทา: pygame พิมพ์ทักทายเองตอน import — ไม่ใช่ error (เลขรุ่นต่างเล็กน้อยได้)</text>
<circle cx="38" cy="702" r="13" fill="#d97706"/>
<text x="38" y="707" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="60" y="708" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ถ้าหยุดที่บรรทัด 2: ไพทอน import จากซ้ายไปขวา และหยุดที่ตัวแรกที่หาไม่พบ</text>
