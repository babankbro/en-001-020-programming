<rect x="60" y="876" width="716" height="36" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="76" y="900" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">✓ แก้: python -m pip install pandas  (ติดตั้งเฉพาะตัวที่ขาด แล้วรันใหม่)</text>
<circle cx="38" cy="946" r="13" fill="#d97706"/>
<text x="38" y="951" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="60" y="952" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">สาเหตุอันดับหนึ่งของ ModuleNotFoundError: VS Code รันด้วยไพทอนคนละตัว</text>
<rect x="60" y="970" width="350" height="168" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
