<text x="74" y="448" font-size="14" fill="#fde68a" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&gt; python check_env.py</text>
<text x="74" y="470" font-size="14" fill="#94a3b8" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">pygame 2.6.1 (SDL 2.28.4, Python 3.12.8)</text>
<text x="74" y="492" font-size="14" fill="#94a3b8" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Hello from the pygame community. https://www.pygame.org/contribute.html</text>
