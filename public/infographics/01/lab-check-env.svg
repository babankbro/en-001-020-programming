<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1162" width="800" height="1162" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif" role="img" aria-label="สคริปต์ check_env.py ผลลัพธ์ 7 บรรทัด ลำดับการ import และการเลือก interpreter ใน VS Code">
