<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" width="800" height="1010" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ข้อจำกัดของกริด: วัตถุคร่อมเส้นแบ่ง</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: ทำไมกริดช่องเดียวพลาดการชนบางคู่ และแก้ด้วยการตรวจช่องข้างเคียงอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ศัตรู 50×50</text><circle cx="285.2" cy="111.0" r="6.0" fill="#dc2626"/><text x="306.2" y="116.0" font-size="15" fill="#0f172a">กระสุน</text><rect x="375.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="409.4" y="116.0" font-size="15" fill="#0f172a">ช่องที่ตรวจ (ช่องเดียว)</text><line x1="584.4" y1="111.0" x2="610.4" y2="111.0" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="618.4" y="116.0" font-size="15" fill="#0f172a">3×3 ช่องข้างเคียง</text><rect x="20.0" y="146.0" width="420.0" height="470.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">ซูมช่อง row 1–3, col 3–5 (สเกล 0.8)</text><rect x="190.0" y="330.0" width="120.0" height="120.0" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><line x1="70.0" y1="210.0" x2="70.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="70.0" y="590.0" font-size="15" fill="#475569" text-anchor="middle">450</text><line x1="190.0" y1="210.0" x2="190.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="190.0" y="590.0" font-size="15" fill="#475569" text-anchor="middle">600</text><line x1="310.0" y1="210.0" x2="310.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="310.0" y="590.0" font-size="15" fill="#475569" text-anchor="middle">750</text><line x1="430.0" y1="210.0" x2="430.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="430.0" y="590.0" font-size="15" fill="#475569" text-anchor="middle">900</text><line x1="70.0" y1="210.0" x2="430.0" y2="210.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="64.0" y="215.0" font-size="15" fill="#475569" text-anchor="end">150</text><line x1="70.0" y1="330.0" x2="430.0" y2="330.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="64.0" y="335.0" font-size="15" fill="#475569" text-anchor="end">300</text><line x1="70.0" y1="450.0" x2="430.0" y2="450.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="64.0" y="455.0" font-size="15" fill="#475569" text-anchor="end">450</text><line x1="70.0" y1="570.0" x2="430.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/><text x="64.0" y="575.0" font-size="15" fill="#475569" text-anchor="end">600</text><text x="76.0" y="230.0" font-size="15" fill="#94a3b8">(1,3)</text><text x="76.0" y="350.0" font-size="15" fill="#94a3b8">(2,3)</text><text x="76.0" y="470.0" font-size="15" fill="#94a3b8">(3,3)</text><text x="196.0" y="230.0" font-size="15" fill="#94a3b8">(1,4)</text><text x="196.0" y="350.0" font-size="15" fill="#94a3b8">(2,4)</text><text x="196.0" y="470.0" font-size="15" fill="#94a3b8">(3,4)</text><text x="316.0" y="230.0" font-size="15" fill="#94a3b8">(1,5)</text><text x="316.0" y="350.0" font-size="15" fill="#94a3b8">(2,5)</text><text x="316.0" y="470.0" font-size="15" fill="#94a3b8">(3,5)</text><rect x="73.0" y="213.0" width="354.0" height="354.0" rx="4" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5"/><rect x="162.0" y="422.0" width="40.0" height="40.0" rx="2" fill="#d9770644" stroke="#d97706" stroke-width="2.5"/><circle cx="182.0" cy="442.0" r="4.0" fill="#d97706"/><circle cx="194.0" cy="434.0" r="6.0" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/><circle cx="126.0" cy="506.0" r="14.0" fill="#d97706"/><text x="126.0" y="511.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="138.0" y1="498.0" x2="174.0" y2="462.0" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="174.0" cy="462.0" r="3.5" fill="#d97706"/><circle cx="270.0" cy="506.0" r="14.0" fill="#dc2626"/><text x="270.0" y="511.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><line x1="260.0" y1="496.0" x2="197.0" y2="439.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="197.0" cy="439.0" r="3.5" fill="#dc2626"/><text x="156.0" y="412.0" font-size="15" fill="#d97706" text-anchor="end" font-weight="bold">ศัตรู</text><text x="210.0" y="416.0" font-size="15" fill="#dc2626" font-weight="bold">กระสุน</text><circle cx="470.0" cy="171.0" r="14.0" fill="#d97706"/><text x="470.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="492.0" y="176.0" font-size="16" fill="#d97706" font-weight="bold">ศัตรู: จุดศูนย์กลาง (590, 440)</text><text x="492.0" y="200.0" font-size="15" fill="#475569">(440 // 150, 590 // 150) = (2, 3)</text><text x="492.0" y="224.0" font-size="15" fill="#475569">แต่ตัวกล่อง x 565–615 ยื่นข้ามเส้น 600</text><circle cx="470.0" cy="245.0" r="14.0" fill="#dc2626"/><text x="470.0" y="250.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="492.0" y="250.0" font-size="16" fill="#dc2626" font-weight="bold">กระสุนที่ (605, 430)</text><text x="492.0" y="274.0" font-size="15" fill="#475569">(430 // 150, 605 // 150) = (2, 4)</text><text x="492.0" y="298.0" font-size="15" fill="#475569">อยู่ในกล่องศัตรูจริง: 565 ≤ 605 ≤ 615 ✓</text><circle cx="470.0" cy="319.0" r="14.0" fill="#2563eb"/><text x="470.0" y="324.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="492.0" y="324.0" font-size="16" fill="#2563eb" font-weight="bold">กริดช่องเดียวตรวจแค่ cells[2][4]</text><text x="492.0" y="348.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ศัตรูอยู่ใน cells[2][3] → </tspan><tspan fill="#dc2626" font-weight="bold">พลาด!</tspan></text><circle cx="470.0" cy="369.0" r="14.0" fill="#059669"/><text x="470.0" y="374.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="492.0" y="374.0" font-size="16" fill="#059669" font-weight="bold">แก้: ตรวจ 3×3 ช่องรอบกระสุน</text><text x="492.0" y="398.0" font-size="15" fill="#475569">row 1–3, col 3–5 → เจอศัตรู ✓</text><rect x="456.0" y="416.0" width="324.0" height="60.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="618.0" y="452.6" font-size="19" fill="#059669" text-anchor="middle" font-weight="bold">ตรวจช่องข้างเคียง = ไม่พลาด</text><rect x="20.0" y="636.0" width="760.0" height="196.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="666.0" font-size="17" fill="#0f172a" font-weight="bold">ผลทดลองในใบงาน (กระสุน 40 ศัตรู 2,000 กริด 48 ช่อง)</text><text x="36.0" y="700.0" font-size="15" fill="#2563eb" font-weight="bold">วิธี</text><text x="300.0" y="700.0" font-size="15" fill="#2563eb" font-weight="bold">เปรียบเทียบ/เฟรม</text><text x="500.0" y="700.0" font-size="15" fill="#2563eb" font-weight="bold">พบการชน</text><text x="620.0" y="700.0" font-size="15" fill="#2563eb" font-weight="bold">สรุป</text><text x="36.0" y="734.0" font-size="16" fill="#dc2626" font-weight="bold">ตรวจทุกคู่</text><text x="300.0" y="734.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">80,000</text><text x="500.0" y="734.0" font-size="16" fill="#0f172a">181 คู่</text><text x="620.0" y="734.0" font-size="15" fill="#dc2626" font-weight="bold">ครบแต่ช้า</text><text x="36.0" y="766.0" font-size="16" fill="#2563eb" font-weight="bold">กริดช่องเดียว</text><text x="300.0" y="766.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1,649</text><text x="500.0" y="766.0" font-size="16" fill="#0f172a">129 คู่</text><text x="620.0" y="766.0" font-size="15" fill="#2563eb" font-weight="bold">เร็ว แต่พลาด</text><text x="36.0" y="798.0" font-size="16" fill="#059669" font-weight="bold">กริด + ช่องข้างเคียง</text><text x="300.0" y="798.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5,688</text><text x="500.0" y="798.0" font-size="16" fill="#0f172a">181 คู่</text><text x="620.0" y="798.0" font-size="15" fill="#059669" font-weight="bold">ครบ และยังเร็ว</text><rect x="20.0" y="852.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="882.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: สร้างกริดด้วย [[]] * 3</text><text x="36.0" y="906.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">cells = [[]] * 3; cells[0].append(1)</text><text x="36.0" y="930.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">→ </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[[1], [1], [1]]</tspan><tspan fill="#475569"> ทุกช่องคือลิสต์เดียวกัน</tspan></text><rect x="408.0" y="852.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="882.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: สร้างลิสต์ใหม่ทุกช่อง</text><text x="424.0" y="906.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">cells = [[] for _ in range(3)]</text><text x="424.0" y="930.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">→ </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[[1], [], []]</tspan></text><text x="30.0" y="988.0" font-size="15" fill="#475569">ระวังขอบจอ: y = 900 → 900 // 150 = 6 แต่แถวมีแค่ 0–5 → IndexError ใช้ min(row, rows − 1)</text></svg>