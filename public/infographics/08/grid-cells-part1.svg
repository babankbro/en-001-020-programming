[5] → IndexError (แถวมีแค่ 0–5)</text><text x="36.0" y="1148.0" font-size="15" fill="#0f172a">(150, 149) ก็จะได้ (1, 0) ผิดช่อง</text><rect x="408.0" y="1046.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1076.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: row มาจาก y, col มาจาก x</text><text x="424.0" y="1100.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(820 // 150, 1000 // 150) = </tspan><tspan fill="#059669" font-weight="bold">(5, 6)</tspan></text><text x="424.0" y="1124.0" font-size="15" fill="#0f172a">return y // size, x // size</text><text x="424.0" y="1148.0" font-size="15" fill="#0f172a">เหมือน table[i][j] ในลิสต์ซ้อนลิสต์</text></svg>