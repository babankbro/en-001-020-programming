="middle" font-weight="bold">6</text><text x="560.0" y="670.0" font-size="15" fill="#475569" text-anchor="middle">900</text><text x="672.5" y="190.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="bold">7</text><text x="635.0" y="670.0" font-size="15" fill="#475569" text-anchor="middle">1050</text><text x="710.0" y="670.0" font-size="15" fill="#475569" text-anchor="middle">1200</text><text x="100.0" y="242.5" font-size="16" fill="#2563eb" text-anchor="end" font-weight="bold">0</text><text x="100.0" y="317.5" font-size="16" fill="#475569" text-anchor="end" font-weight="bold">1</text><text x="100.0" y="392.5" font-size="16" fill="#475569" text-anchor="end" font-weight="bold">2</text><text x="100.0" y="467.5" font-size="16" fill="#475569" text-anchor="end" font-weight="bold">3</text><text x="100.0" y="542.5" font-size="16" fill="#475569" text-anchor="end" font-weight="bold">4</text><text x="100.0" y="617.5" font-size="16" fill="#d97706" text-anchor="end" font-weight="bold">5</text><text x="66.0" y="430.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">row</text><text x="410.0" y="166.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">col</text><circle cx="610.0" cy="610.0" r="7.0" fill="#059669"/><text x="600.0" y="598.0" font-size="15" fill="#059669" text-anchor="end" font-weight="bold">(1000, 820)</text><circle cx="185.0" cy="274.5" r="7.0" fill="#2563eb"/><text x="195.0" y="300.5" font-size="15" fill="#2563eb" font-weight="bold">(150, 149)</text><text x="597.5" y="638.5" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">[5][6]</text><circle cx="740.0" cy="237.5" r="14.0" fill="#d97706"/><text x="740.0" y="243.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="726.0" y1="235.0" x2="597.5" y2="174.0" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="597.5" cy="174.0" r="3.5" fill="#d97706"/><circle cx="7