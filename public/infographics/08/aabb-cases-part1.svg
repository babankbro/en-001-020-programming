"173.2" cy="286.0" r="14.0" fill="#2563eb"/><text x="173.2" y="291.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><circle cx="470.0" cy="171.0" r="14.0" fill="#d97706"/><text x="470.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="492.0" y="176.0" font-size="16" fill="#d97706" font-weight="bold">เช็กแกน x (แถบตั้ง)</text><text x="492.0" y="200.0" font-size="15" fill="#475569">200 ≤ px ≤ 250 ?  (enemy.x ถึง +50)</text><circle cx="470.0" cy="221.0" r="14.0" fill="#d97706"/><text x="470.0" y="226.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="492.0" y="226.0" font-size="16" fill="#d97706" font-weight="bold">เช็กแกน y (แถบนอน)</text><text x="492.0" y="250.0" font-size="15" fill="#475569">300 ≤ py ≤ 350 ?</text><circle cx="470.0" cy="271.0" r="14.0" fill="#2563eb"/><text x="470.0" y="276.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="492.0" y="276.0" font-size="16" fill="#2563eb" font-weight="bold">เชื่อมด้วย and</text><text x="492.0" y="300.0" font-size="15" fill="#475569">ชนเมื่อจริงทั้งคู่ = ส่วนที่แถบตัดกัน</text><text x="492.0" y="324.0" font-size="15" fill="#475569">ซึ่งก็คือกล่องสีน้ำเงินพอดี</text><rect x="456.0" y="342.0" width="324.0" height="116.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="470.0" y="366.0" font-size="15" fill="#475569" font-weight="bold">ไล่ค่า (225, 320):</text><text x="470.0" y="392.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">x: 200 ≤ 225 ≤ 250 </tspan><tspan fill="#059669" font-weight="bold">✓</tspan></text><text x="470.0" y="418.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">y: 300 ≤ 320 ≤ 350 </tspan><tspan fill="#059669" font-weight="bold">✓</tspan></text><text x="470.0" y="444.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">✓ and ✓ → </tspan><tspan fill="#059669" font-weight="bold">ชน</tspan></text>