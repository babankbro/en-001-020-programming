<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 986" width="800" height="986" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">จุดอยู่ในกล่องหรือไม่: ต้องผ่านทั้งแกน x และแกน y</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: กระสุนที่จุด (px, py) โดนศัตรูขนาด 50×50 ที่มุมบนซ้าย (200, 300) หรือไม่</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">กล่องศัตรู (and)</text><rect x="301.3" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="335.3" y="116.0" font-size="15" fill="#0f172a">แถบที่ผ่านแค่แกนเดียว</text><circle cx="523.4" cy="111.0" r="6.0" fill="#059669"/><text x="544.4" y="116.0" font-size="15" fill="#0f172a">ชน</text><circle cx="602.8" cy="111.0" r="6.0" fill="#dc2626"/><text x="623.8" y="116.0" font-size="15" fill="#0f172a">ไม่ชน</text><rect x="20.0" y="146.0" width="420.0" height="430.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">ตามสเกล (y ชี้ลง) 1 px เกม = 2.6 px</text><line x1="64.0" y1="210.0" x2="64.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="90.0" y1="210.0" x2="90.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="116.0" y1="210.0" x2="116.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="142.0" y1="210.0" x2="142.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="168.0" y1="210.0" x2="168.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="194.0" y1="210.0" x2="194.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="220.0" y1="210.0" x2="220.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="246.0" y1="210.0" x2="246.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="272.0" y1="210.0" x2="272.0" y2="522.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="298.0" y1="210.0" x2="298.