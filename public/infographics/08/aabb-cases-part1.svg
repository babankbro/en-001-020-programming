30.0" y="770.0" font-size="18" fill="#dc2626" font-weight="bold">✗</text><text x="460.0" y="770.0" font-size="16" fill="#475569" font-weight="bold">ไม่ชน</text><text x="620.0" y="770.0" font-size="16" fill="#dc2626" font-weight="bold">ชน ← ผิด!</text><text x="36.0" y="808.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(250, 350)</text><text x="200.0" y="808.0" font-size="18" fill="#059669" font-weight="bold">✓</text><text x="330.0" y="808.0" font-size="18" fill="#059669" font-weight="bold">✓</text><text x="460.0" y="808.0" font-size="16" fill="#059669" font-weight="bold">ชน</text><text x="620.0" y="808.0" font-size="16" fill="#475569">ชน</text><rect x="20.0" y="838.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="868.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: เชื่อมด้วย or</text><text x="36.0" y="892.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(x ในช่วง) or (y ในช่วง)</text><text x="36.0" y="916.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(230, 360) อยู่ใต้ศัตรู แต่ได้ </tspan><tspan fill="#dc2626" font-weight="bold">ชน</tspan></text><text x="36.0" y="940.0" font-size="15" fill="#0f172a">ศัตรูทั้งแถวตายทันที (ไม่ error แต่เกมผิด)</text><rect x="408.0" y="838.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="868.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: เชื่อมด้วย and</text><text x="424.0" y="892.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(x ในช่วง) and (y ในช่วง)</text><text x="424.0" y="916.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(230, 360) y = 360 &gt; 350 → </tspan><tspan fill="#059669" font-weight="bold">ไม่ชน</tspan></text><text x="424.0" y="940.0" font-size="15" fill="#0f172a">นับเฉพาะจุดที่อยู่ในกล่องจริง</text></svg>