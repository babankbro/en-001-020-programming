<text x="675" y="522.9" font-size="14" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(6.0, 8.0)</text>
<rect x="40" y="536" width="170" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="125" y="558.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(100,100)→(−20,260)</text>
<rect x="210" y="536" width="110" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="265" y="558.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(−120, 160)</text>
<rect x="320" y="536" width="80" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="558.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">200</text>
<rect x="400" y="536" width="120" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="460" y="558.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(−0.6, 0.8)</text>
<rect x="520" y="536" width="70" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="558.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">15</text>
<rect x="590" y="536" width="170" height="36" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="558.9" font-size="14" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(−9.0, 12.0)</text>
<rect x="40" y="572" width="170" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="125" y="594.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(400,300)→(400,300)</text>
<rect x="210" y="572" width="110" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="265" y="594.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(0, 0)</text>
<rect x="320" y="572" width="80" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="594.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0</text>
<rect x="400" y="572" width="120" height="36" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/>
<text x="460" y="594.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">หาไม่ได้</text>
<rect x="520" y="572" width="70" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="594.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">10</text>
<rect x="590" y="572" width="170" height="36" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="594.9" font-size="14" fill="#dc2626" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(0, 0)</text>
<text x="40" y="630" font-size="14" fill="#475569" text-anchor="start">แถวสุดท้าย: length == 0 จึง return (0, 0) ทันที ก่อนถึงการหาร</text>
<circle cx="52" cy="675" r="13" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="52" y="680" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="74" y="680" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">ขั้นตอนที่ 2: Bullet(400, 300, 6, 8).update() 3 ครั้ง — บวกความเร็วเดิมทุกเฟรม</text>
<rect x="90" y="698" width="140" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="160" y="718" font-size="14" fill="#475569" text-anchor="middle">เริ่ม</text>
<text x="160" y="738" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(400, 300)</text>
<line x1="232" y1="722" x2="258" y2="722" stroke="#059669" stroke-width="2" marker-end="url(#smG)"/>
<text x="245" y="766" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">+(6, 8)</text>
<rect x="260" y="698" width="140" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="330" y="718" font-size="14" fill="#475569" text-anchor="middle">เฟรม 1</text>
<text x="330" y="738" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(406, 308)</text>
<line x1="402" y1="722" x2="428" y2="722" stroke="#059669" stroke-width="2" marker-end="url(#smG)"/>
<text x="415" y="766" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">+(6, 8)</text>
<rect x="430" y="698" width="140" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="500" y="718" font-size="14" fill="#475569" text-anchor="middle">เฟรม 2</text>
<text x="500" y="738" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(412, 316)</text>
<line x1="572" y1="722" x2="598" y2="722" stroke="#059669" stroke-width="2" marker-end="url(#smG)"/>
<text x="585" y="766" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">+(6, 8)</text>
<rect x="600" y="698" width="140" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="670" y="718" font-size="14" fill="#475569" text-anchor="middle">เฟรม 3</text>
<text x="670" y="738" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(418, 324)</text>
<rect x="40" y="790" width="352" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="819" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">✗ ลืม normalize</text>
<text x="54" y="843" font-size="15" fill="#0f172a" text-anchor="start">ใช้ (dx, dy) × speed ตรง ๆ = (600, 800)</text>
<text x="54" y="865" font-size="15" fill="#0f172a" text-anchor="start">→ กระสุนเร็วตามระยะเมาส์ (ยาว 1000)</text>
<text x="54" y="887" font-size="15" fill="#0f172a" text-anchor="start">ไม่มีเช็ก length == 0 → ZeroDivisionError</text>
<rect x="408" y="790" width="352" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="422" y="819" font-size="16" fill="#059669" text-anchor="start" font-weight="bold">✓ หารด้วย length ก่อน</text>
<text x="422" y="843" font-size="15" fill="#0f172a" text-anchor="start">ได้ทิศยาว 1 แล้วคูณ speed → ยาว 10 เสมอ</text>
<text x="422" y="865" font-size="15" fill="#0f172a" text-anchor="start">ไม่ว่าเมาส์ใกล้หรือไกล</text>
<text x="422" y="887" font-size="15" fill="#0f172a" text-anchor="start">เช็ก length == 0 แล้ว return (0, 0)</text>
</svg>