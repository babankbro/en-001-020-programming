<rect x="320" y="464" width="80" height="36" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="486.9" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">length</text>
<rect x="400" y="464" width="120" height="36" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="460" y="486.9" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">หนึ่งหน่วย</text>
<rect x="520" y="464" width="70" height="36" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="486.9" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">speed</text>
<rect x="590" y="464" width="170" height="36" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="486.9" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">ผลลัพธ์</text>
<rect x="40" y="500" width="170" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="125" y="522.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(400,300)→(460,380)</text>
<rect x="210" y="500" width="110" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="265" y="522.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">(60, 80)</text>
<rect x="320" y="500" width="80" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="522.9" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">100</text>
