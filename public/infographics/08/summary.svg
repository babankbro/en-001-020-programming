<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1056" width="800" height="1056" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">บทที่ 8 ในภาพเดียว: กระสุน การชน การลบ กริด และ FPS</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: 5 หัวข้อของบทนี้ทำงานร่วมกันอย่างไรใน 1 เฟรมของเกม</text><rect x="20.0" y="96.0" width="370.0" height="230.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="48.0" cy="126.0" r="14.0" fill="#2563eb"/><text x="48.0" y="131.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="72.0" y="132.0" font-size="18" fill="#2563eb" font-weight="bold">ยิงไปที่เมาส์</text><text x="40.0" y="168.0" font-size="15" fill="#0f172a">• d = เมาส์ − ยาน</text><text x="40.0" y="194.0" font-size="15" fill="#0f172a">• normalize → ยาว 1</text><text x="40.0" y="220.0" font-size="15" fill="#0f172a">• × bullet_speed</text><rect x="34.0" y="244.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="268.0" font-size="15" fill="#2563eb" font-weight="bold">(60, 80) → (0.6, 0.8) → (6, 8)</text><text x="40.0" y="308.0" font-size="15" fill="#dc2626">✗ ไม่ normalize: ไกลยิ่งเร็ว</text><rect x="410.0" y="96.0" width="370.0" height="230.0" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="438.0" cy="126.0" r="14.0" fill="#059669"/><text x="438.0" y="131.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="462.0" y="132.0" font-size="18" fill="#059669" font-weight="bold">การชนแบบ AABB</text><text x="430.0" y="168.0" font-size="15" fill="#0f172a">• จุดในกล่อง: x ในช่วง and y ในช่วง</text><text x="430.0" y="194.0" font-size="15" fill="#0f172a">• กล่องซ้อน: 4 เงื่อนไขด้วย and</text><text x="430.0" y="220.0" font-size="15" fill="#0f172a">• rect.colliderect() แตะขอบไม่นับ</text><rect x="424.0" y="244.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="434.0" y="268.0" font-size="15" fill="#059669" font-weight="bold">(225, 320) ในกล่อง (200, 300) 50×50 ✓</text><text x="430.0" y="308.0" font-size="15" fill="#dc2626">✗ ใช้ or: ชนทั้งแถว</text><rect x="20.0" y="346.0" width="370.0" height="230.0" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="48.0" cy="376.0" r="14.0" fill="#d97706"/><text x="48.0" y="381.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="72.0" y="382.0" font-size="18" fill="#d97706" font-weight="bold">ลบจากลิสต์อย่างปลอดภัย</text><text x="40.0" y="418.0" font-size="15" fill="#0f172a">• for x in xs[:] (วนบนสำเนา)</text><text x="40.0" y="444.0" font-size="15" fill="#0f172a">• จด mask ไว้ก่อนค่อยลบ</text><text x="40.0" y="470.0" font-size="15" fill="#0f172a">• list comprehension / kill()</text><rect x="34.0" y="494.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="44.0" y="518.0" font-size="15" fill="#d97706" font-weight="bold">[1, 2, 2, 3] ลบ 2 → [1, 3]</text><text x="40.0" y="558.0" font-size="15" fill="#dc2626">✗ ลบขณะวนต้นฉบับ → [1, 2, 3]</text><rect x="410.0" y="346.0" width="370.0" height="230.0" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="438.0" cy="376.0" r="14.0" fill="#7c3aed"/><text x="438.0" y="381.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="462.0" y="382.0" font-size="18" fill="#7c3aed" font-weight="bold">กริดแบ่งพื้นที่</text><text x="430.0" y="418.0" font-size="15" fill="#0f172a">• (row, col) = (y // size, x // size)</text><text x="430.0" y="444.0" font-size="15" fill="#0f172a">• ตรวจเฉพาะวัตถุในช่องเดียวกัน</text><text x="430.0" y="470.0" font-size="15" fill="#0f172a">• คร่อมเส้น → ตรวจช่องข้างเคียง</text><rect x="424.0" y="494.0" width="342.0" height="36.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="434.0" y="518.0" font-size="15" fill="#7c3aed" font-weight="bold">(1000, 820) → cells[5][6]</text><text x="430.0" y="558.0" font-size="15" fill="#dc2626">✗ [[]] * n ได้ลิสต์เดียวกันซ้ำ</text><rect x="20.0" y="596.0" width="760.0" height="380.0" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/><circle cx="48.0" cy="626.0" r="14.0" fill="#0f172a"/><text x="48.0" y="631.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="72.0" y="632.0" font-size="18" fill="#0f172a" font-weight="bold">Big-O และ FPS — ลำดับงานใน 1 เฟรม (งบ 16.7 ms ที่ 60 FPS)</text><rect x="36.0" y="656.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="56.0" cy="678.0" r="12.0" fill="#2563eb"/><text x="56.0" y="683.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="76.0" y="684.0" font-size="15" fill="#2563eb" font-weight="bold">สร้างกระสุน</text><text x="144.0" y="716.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ทุก 10 เฟรม</text><text x="144.0" y="742.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 1)</text><line x1="254.0" y1="704.0" x2="286.0" y2="704.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="288.0" y="656.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="308.0" cy="678.0" r="12.0" fill="#2563eb"/><text x="308.0" y="683.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="328.0" y="684.0" font-size="15" fill="#2563eb" font-weight="bold">อัปเดตตำแหน่ง</text><text x="396.0" y="716.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">pos += vel</text><text x="396.0" y="742.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 1)</text><line x1="506.0" y1="704.0" x2="538.0" y2="704.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="540.0" y="656.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><circle cx="560.0" cy="678.0" r="12.0" fill="#7c3aed"/><text x="560.0" y="683.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="580.0" y="684.0" font-size="15" fill="#7c3aed" font-weight="bold">ใส่ศัตรูลงกริด</text><text x="648.0" y="716.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">clear() + add()</text><text x="648.0" y="742.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 4)</text><line x1="648.0" y1="754.0" x2="648.0" y2="784.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="540.0" y="786.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/><circle cx="560.0" cy="808.0" r="12.0" fill="#059669"/><text x="560.0" y="813.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="580.0" y="814.0" font-size="15" fill="#059669" font-weight="bold">ตรวจชนในช่อง</text><text x="648.0" y="846.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">colliderect</text><text x="648.0" y="872.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 2)</text><line x1="538.0" y1="834.0" x2="506.0" y2="834.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="288.0" y="786.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="308.0" cy="808.0" r="12.0" fill="#d97706"/><text x="308.0" y="813.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="328.0" y="814.0" font-size="15" fill="#d97706" font-weight="bold">ลบที่ถูกยิง</text><text x="396.0" y="846.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">kill() / xs[:]</text><text x="396.0" y="872.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 3)</text><line x1="286.0" y1="834.0" x2="254.0" y2="834.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-ink)"/><rect x="36.0" y="786.0" width="216.0" height="96.0" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><circle cx="56.0" cy="808.0" r="12.0" fill="#0f172a"/><text x="56.0" y="813.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="76.0" y="814.0" font-size="15" fill="#0f172a" font-weight="bold">วัด FPS</text><text x="144.0" y="846.0" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">get_fps()</text><text x="144.0" y="872.0" font-size="15" fill="#475569" text-anchor="middle">(หัวข้อ 5)</text><text x="36.0" y="916.0" font-size="15" fill="#0f172a">กระสุน 40 × ศัตรู 2,000: ตรวจทุกคู่ 80,000 ครั้ง/เฟรม O(B·E) → กริด 48 ช่อง ≈ 1,667 (วัดจริง 1,649)</text><text x="36.0" y="946.0" font-size="15" fill="#475569">get_fps() = 35.2 → 1000 / 35.2 ≈ 28.4 ms ต่อเฟรม เกินงบ 16.7 ms = เกมช้า</text><rect x="20.0" y="996.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="1022.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="1007.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="168.4" y="1022.0" font-size="15" fill="#0f172a">กระสุน</text><rect x="237.6" y="1007.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="271.6" y="1022.0" font-size="15" fill="#0f172a">การชน</text><rect x="340.8" y="1007.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="374.8" y="1022.0" font-size="15" fill="#0f172a">การลบ</text><rect x="444.0" y="1007.0" width="26.0" height="18.0" rx="4" fill="#7c3aed33" stroke="#7c3aed" stroke-width="1.5"/><text x="478.0" y="1022.0" font-size="15" fill="#0f172a">กริด</text><circle cx="542.9" cy="1017.0" r="6.0" fill="#dc2626"/><text x="563.9" y="1022.0" font-size="15" fill="#0f172a">กับดัก</text></svg>