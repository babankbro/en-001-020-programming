<rect x="682" y="566.88" width="46" height="3.12" rx="2" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="653" y="414" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="normal">80,000</text>
<text x="705" y="560.88" font-size="14" fill="#059669" text-anchor="middle" font-weight="normal">1,667</text>
<text x="679" y="590" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal">E = 2,000</text>
<line x1="120" y1="570" x2="760" y2="570" stroke="#0f172a" stroke-width="1.5"/>
<rect x="130" y="384" width="14" height="14" rx="0" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="150" y="396" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">ทุกคู่ 40 × E</text>
<rect x="270" y="384" width="14" height="14" rx="0" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="290" y="396" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">กริด ≈ 40E / 48</text>
<text x="400" y="615" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">60 FPS มีงบเวลาเฟรมละ ≈ 16.7 ms — ถ้างานต่อเฟรมเกินงบ clock.get_fps() จะต่ำกว่า 60</text>
