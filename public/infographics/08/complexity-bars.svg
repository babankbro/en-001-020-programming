<text x="700" y="318" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">80,000</text>
<text x="220" y="122" font-size="15" fill="#0f172a" text-anchor="end" font-weight="normal">ตรวจทุกคู่ B × E</text>
<rect x="230" y="100" width="470" height="32" rx="3" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="690" y="122" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">80,000</text>
<text x="220" y="172" font-size="15" fill="#0f172a" text-anchor="end" font-weight="normal">กริด + ช่องข้างเคียง</text>
<rect x="230" y="150" width="33.42" height="32" rx="3" fill="#d97706" stroke="none" stroke-width="1.5"/>
<text x="271.42" y="172" font-size="15" fill="#d97706" text-anchor="start" font-weight="bold">5,688 (ชนครบ 181 คู่)</text>
<text x="220" y="222" font-size="15" fill="#0f172a" text-anchor="end" font-weight="normal">กริดช่องเดียว</text>
<rect x="230" y="200" width="9.69" height="32" rx="3" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="247.69" y="222" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">1,649 (ชน 129 คู่ พลาด 52)</text>
<text x="220" y="272" font-size="15" fill="#0f172a" text-anchor="end" font-weight="normal">ค่าประมาณ 80,000 / 48</text>
<rect x="230" y="250" width="9.79" height="32" rx="3" fill="#475569" stroke="none" stroke-width="1.5"/>
<text x="247.79" y="272" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">≈ 1,667</text>
<line x1="230" y1="90" x2="230" y2="300" stroke="#0f172a" stroke-width="1.5"/>
<text x="400" y="360" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">ศัตรูเพิ่ม → ตรวจทุกคู่โตเป็นสัดส่วนตรง O(B·E) · กริดหารด้วยจำนวนช่อง (48)</text>
