<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">จำนวนการเปรียบเทียบต่อเฟรม: ตรวจทุกคู่ vs กริด</text>
<text x="400" y="62" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal">กระสุน 40 ลูก ศัตรู 2,000 ตัว ตำแหน่งสุ่ม random.seed(8) จากใบงาน (สเกลเชิงเส้น)</text>
<line x1="230" y1="90" x2="230" y2="300" stroke="#e2e8f0" stroke-width="1"/>
<text x="230" y="318" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">0</text>
<line x1="347.5" y1="90" x2="347.5" y2="300" stroke="#e2e8f0" stroke-width="1"/>
<text x="347.5" y="318" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">20,000</text>
<line x1="465" y1="90" x2="465" y2="300" stroke="#e2e8f0" stroke-width="1"/>
<text x="465" y="318" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">40,000</text>
<line x1="582.5" y1="90" x2="582.5" y2="300" stroke="#e2e8f0" stroke-width="1"/>
<text x="582.5" y="318" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">60,000</text>
