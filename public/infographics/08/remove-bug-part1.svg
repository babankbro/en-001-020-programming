<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1140" width="800" height="1140" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ลบขณะวนลูป: ทำไม [1, 2, 2, 3] ลบ 2 ไม่หมด</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: for x in xs: แล้ว xs.remove(x) ข้ามสมาชิกไปได้อย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-blue)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ดัชนีภายในของ for (i)</text><rect x="341.3" y="101.0" width="26.0" height="18.0" rx="4" fill="#dc262633" stroke="#dc2626" stroke-width="1.5"/><text x="375.3" y="116.0" font-size="15" fill="#0f172a">ตัวที่ถูกลบ</text><rect x="469.3" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="503.3" y="116.0" font-size="15" fill="#0f172a">ตัวที่ถูกข้าม</text><rect x="20.0" y="146.0" width="760.0" height="46.0" rx="10" fill="#0f172a"/><text x="36.0" y="176.0" font-size="16" xml:space="preserve"><tspan fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">xs = [1, 2, 2, 3]</tspan><tspan fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">; </tspan><tspan fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">for x in xs: if x == 2: xs.remove(x)</tspan></text><circle cx="44.0" cy="290.0" r="14.0" fill="#2563eb"/><text x="44.0" y="295.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><rect x="120.0" y="260.0" width="60.0" height="60.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="298.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="150.0" y="340.0" font-size="15" fill="#475569" text-anchor="middle">0</text><rect x="180.0" y="260.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="210.0" y="298.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="210.0" y="340.0" font-size="15" fill="#475569" text-anchor="middle">1</text><rect x="240.0" y="260.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="298.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="270.0" y="340.0" font-size="15" fill="#475569" text-anchor="middle">2</text><rect x="300.0" y="260.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330.0" y="298.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="330.0" y="340.0" font-size="15" fill="#475569" text-anchor="middle">3</text><line x1="150.0" y1="226.0" x2="150.0" y2="254.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="150.0" y="220.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">i = 0</text><line x1="404.0" y1="282.0" x2="368.0" y2="290.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="368.0" cy="290.0" r="3.5" fill="#475569"/><text x="410.0" y="280.0" font-size="17" fill="#2563eb" font-weight="bold">รอบ 1: i = 0 → x = 1</text><text x="410.0" y="306.0" font-size="15" fill="#475569">1 ไม่ใช่ 2 → ไม่ลบ</text><text x="410.0" y="330.0" font-size="15" fill="#475569">ลิสต์ยังเป็น [1, 2, 2, 3]</text><circle cx="44.0" cy="450.0" r="14.0" fill="#dc2626"/><text x="44.0" y="455.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><rect x="120.0" y="420.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="458.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="150.0" y="500.0" font-size="15" fill="#475569" text-anchor="middle">0</text><rect x="180.0" y="420.0" width="60.0" height="60.0" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="210.0" y="458.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><line x1="190.0" y1="430.0" x2="230.0" y2="470.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><text x="210.0" y="500.0" font-size="15" fill="#475569" text-anchor="middle">1</text><rect x="240.0" y="420.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="458.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="270.0" y="500.0" font-size="15" fill="#475569" text-anchor="middle">2</text><rect x="300.0" y="420.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330.0" y="458.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="330.0" y="500.0" font-size="15" fill="#475569" text-anchor="middle">3</text><path d="M270.0,510 Q240,532 216.0,514" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#ah-orange)"/><path d="M330.0,510 Q300,532 276.0,514" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#ah-orange)"/><text x="270.0" y="552.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">เลื่อนซ้าย</text><line x1="210.0" y1="386.0" x2="210.0" y2="414.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="210.0" y="380.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">i = 1</text><line x1="404.0" y1="442.0" x2="368.0" y2="450.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="368.0" cy="450.0" r="3.5" fill="#475569"/><text x="410.0" y="440.0" font-size="17" fill="#dc2626" font-weight="bold">รอบ 2: i = 1 → x = 2</text><text x="410.0" y="466.0" font-size="15" fill="#475569">ลบ 2 ตัวแรก → [1, 2, 3]</text><text x="410.0" y="490.0" font-size="15" fill="#475569">ตัวหลังทุกตัวเลื่อนซ้าย 1 ช่อง</text><circle cx="44.0" cy="640.0" r="14.0" fill="#d97706"/><text x="44.0" y="645.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><rect x="120.0" y="610.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="648.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="150.0" y="690.0" font-size="15" fill="#475569" text-anchor="middle">0</text><rect x="180.0" y="610.0" width="60.0" height="60.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="210.0" y="648.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="210.0" y="690.0" font-size="15" fill="#475569" text-anchor="middle">1</text><rect x="240.0" y="610.0" width="60.0" height="60.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="270.0" y="648.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="270.0" y="690.0" font-size="15" fill="#475569" text-anchor="middle">2</text><text x="210.0" y="714.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">ถูกข้าม</text><line x1="270.0" y1="576.0" x2="270.0" y2="604.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="270.0" y="570.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">i = 2</text><line x1="404.0" y1="632.0" x2="308.0" y2="640.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="308.0" cy="640.0" r="3.5" fill="#475569"/><text x="410.0" y="630.0" font-size="17" fill="#d97706" font-weight="bold">รอบ 3: i = 2 → x = 3</text><text x="410.0" y="656.0" font-size="15" fill="#475569">2 ตัวที่สองย้ายไปอยู่ i = 1</text><text x="410.0" y="680.0" font-size="15" fill="#475569">ซึ่งผ่านไปแล้ว → ถูกข้าม!</text><circle cx="44.0" cy="800.0" r="14.0" fill="#0f172a"/><text x="44.0" y="805.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><rect x="120.0" y="770.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="808.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><text x="150.0" y="850.0" font-size="15" fill="#475569" text-anchor="middle">0</text><rect x="180.0" y="770.0" width="60.0" height="60.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="210.0" y="808.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><text x="210.0" y="850.0" font-size="15" fill="#475569" text-anchor="middle">1</text><rect x="240.0" y="770.0" width="60.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="808.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><text x="270.0" y="850.0" font-size="15" fill="#475569" text-anchor="middle">2</text><line x1="330.0" y1="736.0" x2="330.0" y2="764.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-ink)"/><text x="330.0" y="730.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">i = 3</text><text x="330.0" y="808.0" font-size="22" fill="#475569" text-anchor="middle">∅</text><text x="410.0" y="790.0" font-size="17" fill="#0f172a" font-weight="bold">จบ: i = 3 ≥ len(xs) = 3</text><text x="410.0" y="816.0" font-size="15" fill="#475569">ลูปหยุด ทั้งที่ยังมี 2 เหลืออยู่</text><rect x="140.0" y="880.0" width="520.0" height="64.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="400.0" y="919.7" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="bold">ผลลัพธ์ [1, 2, 3]  ✗ ลบไม่หมด</text><text x="400.0" y="970.0" font-size="15" fill="#475569" text-anchor="middle">ไพทอนไม่แจ้ง error — โปรแกรมรันจบ แต่ผลผิดเงียบ ๆ (ในเกม: กระสุนบางนัดไม่หายไป)</text><rect x="20.0" y="990.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="1020.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ลบจากลิสต์ที่กำลังวน</text><text x="36.0" y="1044.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for x in xs:</text><text x="36.0" y="1068.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if x == 2: xs.remove(x)</text><text x="36.0" y="1092.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">→ </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1, 2, 3]</tspan></text><rect x="408.0" y="990.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1020.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: วนบนสำเนา xs[:]</text><text x="424.0" y="1044.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for x in xs[:]:</text><text x="424.0" y="1068.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if x == 2: xs.remove(x)</text><text x="424.0" y="1092.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">→ </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1, 3]</tspan><tspan fill="#475569">  (ดูภาพถัดไป)</tspan></text></svg>