<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1300" width="800" height="1300" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">3 วิธีลบอย่างปลอดภัย: สำเนา · จดไว้ก่อน · สร้างลิสต์ใหม่</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: แก้บั๊กลบไม่หมดได้อย่างไร และใช้กับกระสุนที่ออกนอกจอในเกมอย่างไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-blue)"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ตัวชี้บนสำเนา</text><rect x="280.8" y="101.0" width="26.0" height="18.0" rx="4" fill="#dc262633" stroke="#dc2626" stroke-width="1.5"/><text x="314.8" y="116.0" font-size="15" fill="#0f172a">ถูกลบจากต้นฉบับ</text><rect x="454.2" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="488.2" y="116.0" font-size="15" fill="#0f172a">ผลลัพธ์ที่ถูก</text><rect x="20.0" y="146.0" width="760.0" height="430.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="176.0" r="14.0" fill="#2563eb"/><text x="42.0" y="181.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="64.0" y="182.0" font-size="17" fill="#2563eb" font-weight="bold">วนบนสำเนา for x in xs[:] — ตัวชี้เดินบนสำเนาที่ไม่มีวันเปลี่ยน</text><text x="110.0" y="220.0" font-size="15" fill="#475569" text-anchor="middle">สำเนา xs[:] (ไม่เปลี่ยน)</text><text x="560.0" y="220.0" font-size="15" fill="#475569" text-anchor="middle">ต้นฉบับ xs หลังรอบนั้น</text><rect x="30.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="53.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="76.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="99.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="122.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="168.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="191.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><line x1="53.0" y1="218.0" x2="53.0" y2="246.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="240.0" y="280.0" font-size="16" fill="#0f172a" font-weight="bold">รอบ 1: x = 1</text><text x="240.0" y="304.0" font-size="15" fill="#475569">ไม่ลบ</text><line x1="390.0" y1="273.0" x2="460.0" y2="273.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/><rect x="480.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="503.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="526.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="549.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="572.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="595.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="618.0" y="250.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="641.0" y="281.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="30.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="53.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="76.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="99.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="122.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="168.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="191.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><line x1="99.0" y1="296.0" x2="99.0" y2="324.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="240.0" y="358.0" font-size="16" fill="#0f172a" font-weight="bold">รอบ 2: x = 2</text><text x="240.0" y="382.0" font-size="15" fill="#dc2626">ลบจากต้นฉบับ</text><line x1="390.0" y1="351.0" x2="460.0" y2="351.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/><rect x="480.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="503.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="526.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="549.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="572.0" y="328.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="595.0" y="359.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="30.0" y="406.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="53.0" y="437.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="76.0" y="406.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="99.0" y="437.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="122.0" y="406.0" width="46.0" height="46.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="145.0" y="437.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="168.0" y="406.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="191.0" y="437.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><line x1="145.0" y1="374.0" x2="145.0" y2="402.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="240.0" y="436.0" font-size="16" fill="#0f172a" font-weight="bold">รอบ 3: x = 2</text><text x="240.0" y="460.0" font-size="15" fill="#dc2626">ลบจากต้นฉบับ</text><line x1="390.0" y1="429.0" x2="460.0" y2="429.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/><rect x="480.0" y="406.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="503.0" y="437.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="526.0" y="406.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="549.0" y="437.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="30.0" y="484.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="53.0" y="515.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="76.0" y="484.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="99.0" y="515.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="122.0" y="484.0" width="46.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="515.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">2</text><rect x="168.0" y="484.0" width="46.0" height="46.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="191.0" y="515.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><line x1="191.0" y1="452.0" x2="191.0" y2="480.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="240.0" y="514.0" font-size="16" fill="#0f172a" font-weight="bold">รอบ 4: x = 3</text><text x="240.0" y="538.0" font-size="15" fill="#475569">ไม่ลบ</text><line x1="390.0" y1="507.0" x2="460.0" y2="507.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/><rect x="480.0" y="484.0" width="46.0" height="46.0" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="503.0" y="515.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text><rect x="526.0" y="484.0" width="46.0" height="46.0" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="549.0" y="515.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text><rect x="592.0" y="482.0" width="168.0" height="50.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="676.0" y="514.0" font-size="20" fill="#059669" text-anchor="middle" font-weight="bold">[1, 3] ✓</text><text x="36.0" y="560.0" font-size="15" fill="#475569">ครบ 4 รอบ เพราะความยาวของสำเนาเป็น 4 ตลอด — ลบได้ครบทั้งสองตัว</text><rect x="20.0" y="592.0" width="370.0" height="240.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="622.0" r="14.0" fill="#7c3aed"/><text x="42.0" y="627.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="64.0" y="628.0" font-size="17" fill="#7c3aed" font-weight="bold">จดไว้ก่อน แล้วค่อยลบ</text><text x="40.0" y="662.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">mask = []</text><text x="40.0" y="688.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for b in bullets:</text><text x="40.0" y="714.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if hit(b): mask.append(b)</text><text x="40.0" y="740.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for b in mask:</text><text x="40.0" y="766.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if b in bullets:</text><text x="40.0" y="792.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">        bullets.remove(b)</text><text x="40.0" y="822.0" font-size="15" fill="#475569">เช็ก in กันลบซ้ำ (โดนหลายตัว)</text><rect x="410.0" y="592.0" width="370.0" height="240.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="432.0" cy="622.0" r="14.0" fill="#059669"/><text x="432.0" y="627.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="454.0" y="628.0" font-size="17" fill="#059669" font-weight="bold">สร้างลิสต์ใหม่รอบเดียว</text><text x="430.0" y="666.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">xs = [x for x in xs</text><text x="430.0" y="690.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">      if x != 2]</text><text x="430.0" y="724.0" font-size="16" xml:space="preserve"><tspan fill="#0f172a">→ </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1, 3]</tspan></text><text x="430.0" y="760.0" font-size="15" fill="#475569">ไม่ต้องค้นหาทีละตัวเหมือน remove</text><text x="430.0" y="786.0" font-size="15" fill="#475569">(remove ใช้เวลา O(B) ต่อครั้ง)</text><text x="430.0" y="812.0" font-size="15" fill="#475569">เหมาะเมื่อลบหลายตัวต่อเฟรม</text><rect x="20.0" y="848.0" width="760.0" height="290.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="878.0" r="14.0" fill="#d97706"/><text x="42.0" y="883.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="64.0" y="884.0" font-size="17" fill="#d97706" font-weight="bold">ในเกม: ลบกระสุนที่ออกนอกจอ 800×600 (วาดตามสเกล 1 : 4)</text><rect x="60.0" y="930.0" width="200.0" height="150.0" rx="4" fill="#0f172a"/><text x="160.0" y="1011.0" font-size="15" fill="#94a3b8" text-anchor="middle">จอ 800 × 600</text><circle cx="72.5" cy="942.5" r="6.0" fill="#059669" stroke="#ffffff" stroke-width="1.5"/><circle cx="285.0" cy="955.0" r="6.0" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/><circle cx="135.0" cy="928.8" r="6.0" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/><circle cx="160.0" cy="1030.0" r="6.0" fill="#059669" stroke="#ffffff" stroke-width="1.5"/><text x="295.0" y="960.0" font-size="15" fill="#dc2626" font-weight="bold">(900, 100)</text><text x="145.0" y="918.8" font-size="15" fill="#dc2626" font-weight="bold">(300, −5)</text><text x="82.5" y="947.5" font-size="15" fill="#059669" font-weight="bold">(50, 50)</text><text x="170.0" y="1035.0" font-size="15" fill="#059669" font-weight="bold">(400, 400)</text><text x="60.0" y="1110.0" font-size="15" fill="#475569">x &lt; 0 หรือ x &gt; 800 หรือ y &lt; 0 หรือ y &gt; 600 → นอกจอ</text><text x="400.0" y="940.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">mask = </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[(900, 100), (300, −5)]</tspan></text><text x="400.0" y="966.0" font-size="15" fill="#475569">x = 900 &gt; 800 และ y = −5 &lt; 0</text><text x="400.0" y="1004.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">bullets เหลือ </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[(50, 50), (400, 400)]</tspan></text><text x="400.0" y="1046.0" font-size="15" fill="#0f172a" font-weight="bold">Pygame: self.kill() ลบสไปรต์จากทุกกลุ่ม</text><text x="400.0" y="1072.0" font-size="15" fill="#475569">อย่างปลอดภัย (Group.update() วนบนสำเนาให้แล้ว)</text><rect x="20.0" y="1156.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="1186.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: คิดว่า = คือการสำเนา</text><text x="36.0" y="1210.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">copy = xs   # ชี้ลิสต์เดียวกัน</text><text x="36.0" y="1234.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for x in copy: xs.remove(x)</text><text x="36.0" y="1258.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ยังข้ามเหมือนเดิม → </tspan><tspan fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1, 2, 3]</tspan></text><rect x="408.0" y="1156.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="1186.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: สร้างลิสต์ใหม่จริง ๆ</text><text x="424.0" y="1210.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">xs[:]   หรือ   xs.copy()</text><text x="424.0" y="1234.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for x in xs[:]: xs.remove(x)</text><text x="424.0" y="1258.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ลบครบ → </tspan><tspan fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1, 3]</tspan></text></svg>