<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 886" width="800" height="886" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ทำไมต้อง normalize: ใกล้หรือไกล ความเร็วต้องเท่ากัน</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: เมาส์อยู่ห่างต่างกัน 3 ระยะ กระสุนได้ความเร็วเท่าใด และยิงถี่แค่ไหน</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><circle cx="147.4" cy="111.0" r="6.0" fill="#2563eb"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">เมาส์ใกล้ (ห่าง 50)</text><circle cx="333.8" cy="111.0" r="6.0" fill="#7c3aed"/><text x="354.8" y="116.0" font-size="15" fill="#0f172a">เมาส์กลาง (100)</text><circle cx="505.0" cy="111.0" r="6.0" fill="#059669"/><text x="526.0" y="116.0" font-size="15" fill="#0f172a">เมาส์ไกล (200)</text><rect x="20.0" y="146.0" width="350.0" height="380.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="44.0" cy="176.0" r="14.0" fill="#0f172a"/><text x="44.0" y="181.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="66.0" y="182.0" font-size="17" fill="#0f172a" font-weight="bold">เมาส์ 3 ตำแหน่ง แนวเดียวกัน</text><line x1="64.0" y1="222.0" x2="253.0" y2="474.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="64.0" cy="222.0" r="8.0" fill="#0f172a"/><text x="78.0" y="218.0" font-size="15" fill="#0f172a" font-weight="bold">ยาน (400, 300)</text><circle cx="109.0" cy="282.0" r="8.0" fill="#2563eb"/><text x="123.0" y="282.0" font-size="15" fill="#2563eb" font-weight="bold">(430, 340)</text><text x="123.0" y="302.0" font-size="15" fill="#2563eb">ห่าง 50</text><circle cx="154.0" cy="342.0" r="8.0" fill="#7c3aed"/><text x="168.0" y="342.0" font-size="15" fill="#7c3aed" font-weight="bold">(460, 380)</text><text x="168.0" y="362.0" font-size="15" fill="#7c3aed">ห่าง 100</text><circle cx="244.0" cy="462.0" r="8.0" fill="#059669"/><text x="258.0" y="462.0" font-size="15" fill="#059669" font-weight="bold">(520, 460)</text><text x="258.0" y="482.0" font-size="15" fill="#059669">ห่าง 200</text><text x="36.0" y="508.0" font-size="15" fill="#dc2626">ถ้าไม่ normalize: เร็ว 50 / 100 / 200 px/เฟรม</text><rect x="390.0" y="146.0" width="390.0" height="380.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="414.0" cy="176.0" r="14.0" fill="#7c3aed"/><text x="414.0" y="181.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="436.0" y="182.0" font-size="17" fill="#7c3aed" font-weight="bold">ไล่ค่าทั้ง 3 จุด</text><text x="406.0" y="218.0" font-size="15" fill="#2563eb" font-weight="bold">d</text><text x="518.0" y="218.0" font-size="15" fill="#2563eb" font-weight="bold">|d|</text><text x="580.0" y="218.0" font-size="15" fill="#2563eb" font-weight="bold">d / |d|</text><text x="690.0" y="218.0" font-size="15" fill="#2563eb" font-weight="bold">× 10</text><text x="406.0" y="256.0" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">(30, 40)</text><text x="518.0" y="256.0" font-size="16" fill="#2563eb" font-weight="bold">50</text><text x="580.0" y="256.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(0.6, 0.8)</text><text x="690.0" y="256.0" font-size="16" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(6, 8)</text><text x="406.0" y="296.0" font-size="16" fill="#7c3aed" font-family="Consolas, 'Courier New', monospace">(60, 80)</text><text x="518.0" y="296.0" font-size="16" fill="#7c3aed" font-weight="bold">100</text><text x="580.0" y="296.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(0.6, 0.8)</text><text x="690.0" y="296.0" font-size="16" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(6, 8)</text><text x="406.0" y="336.0" font-size="16" fill="#059669" font-family="Consolas, 'Courier New', monospace">(120, 160)</text><text x="518.0" y="336.0" font-size="16" fill="#059669" font-weight="bold">200</text><text x="580.0" y="336.0" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">(0.6, 0.8)</text><text x="690.0" y="336.0" font-size="16" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace">(6, 8)</text><rect x="572.0" y="230.0" width="200.0" height="120.0" rx="8" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/><circle cx="414.0" cy="392.0" r="14.0" fill="#d97706"/><text x="414.0" y="397.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="436.0" y="398.0" font-size="16" fill="#d97706" font-weight="bold">ทุกแถวได้ทิศ (0.6, 0.8) เท่ากัน</text><text x="436.0" y="426.0" font-size="15" fill="#475569">เพราะ 0.6² + 0.8² = 0.36 + 0.64 = 1</text><rect x="406.0" y="444.0" width="358.0" height="62.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="585.0" y="482.4" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">ทุกนัดเร็ว 10 px/เฟรม</text><rect x="20.0" y="546.0" width="760.0" height="200.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="576.0" r="14.0" fill="#2563eb"/><text x="42.0" y="581.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="64.0" y="582.0" font-size="17" fill="#2563eb" font-weight="bold">ยิงทุก 10 เฟรมด้วย time_steps % 10 == 0  (60 FPS)</text><line x1="60.0" y1="640.0" x2="740.0" y2="640.0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/><line x1="60.0" y1="634.0" x2="60.0" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="116.7" y1="634.0" x2="116.7" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="173.3" y1="634.0" x2="173.3" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="230.0" y1="634.0" x2="230.0" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="286.7" y1="634.0" x2="286.7" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="343.3" y1="634.0" x2="343.3" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="400.0" y1="634.0" x2="400.0" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="456.7" y1="634.0" x2="456.7" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="513.3" y1="634.0" x2="513.3" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="570.0" y1="634.0" x2="570.0" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="626.7" y1="634.0" x2="626.7" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="683.3" y1="634.0" x2="683.3" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><line x1="740.0" y1="634.0" x2="740.0" y2="646.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/><circle cx="60.0" cy="640.0" r="9.0" fill="#d97706"/><text x="60.0" y="670.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">0</text><circle cx="173.3" cy="640.0" r="9.0" fill="#d97706"/><text x="173.3" y="670.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">10</text><circle cx="286.7" cy="640.0" r="9.0" fill="#d97706"/><text x="286.7" y="670.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">20</text><circle cx="400.0" cy="640.0" r="9.0" fill="#d97706"/><text x="400.0" y="670.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">30</text><circle cx="513.3" cy="640.0" r="9.0" fill="#d97706"/><text x="513.3" y="670.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">40</text><circle cx="626.7" cy="640.0" r="9.0" fill="#d97706"/><text x="626.7" y="670.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">50</text><text x="740.0" y="670.0" font-size="15" fill="#475569" text-anchor="middle">60</text><text x="740.0" y="624.0" font-size="15" fill="#475569" text-anchor="middle">1 วินาที</text><text x="60.0" y="704.0" font-size="16" fill="#0f172a" font-weight="bold">เฟรม 0, 10, 20, 30, 40, 50 → 60 / 10 = 6 นัดต่อวินาที</text><text x="60.0" y="730.0" font-size="15" fill="#475569">% 15 → 60 / 15 = 4 นัด,  % 20 → 3 นัด (ตัวหารยิ่งมาก ยิ่งยิงห่าง)</text><rect x="20.0" y="766.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="796.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: เมาส์ทับกลางยานพอดี</text><text x="36.0" y="820.0" font-size="15" fill="#0f172a">d = (0, 0) ขนาด 0</text><text x="36.0" y="844.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">Vector2(0, 0).normalize()  # ValueError</text><rect x="408.0" y="766.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="796.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: ตรวจขนาดก่อนหาร</text><text x="424.0" y="820.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">if direction.length() &gt; 0:</text><text x="424.0" y="844.0" font-size="15" fill="#0f172a">ค่อย normalize และสร้างกระสุน</text></svg>