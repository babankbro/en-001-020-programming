<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 928" width="800" height="928" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ตรวจทุกคู่ vs กริด: นับจำนวนการเปรียบเทียบต่อเฟรม</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: กระสุน 40 ลูก ศัตรู 2,000 ตัว ต้องเปรียบเทียบกี่ครั้ง และกริดช่วยลดได้เท่าใด</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#dc262633" stroke="#dc2626" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ตรวจทุกคู่</text><rect x="258.1" y="101.0" width="26.0" height="18.0" rx="4" fill="#2563eb33" stroke="#2563eb" stroke-width="1.5"/><text x="292.1" y="116.0" font-size="15" fill="#0f172a">กริดช่องเดียว</text><rect x="403.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#d9770633" stroke="#d97706" stroke-width="1.5"/><text x="437.4" y="116.0" font-size="15" fill="#0f172a">กริด + ช่องข้างเคียง</text><rect x="20.0" y="146.0" width="760.0" height="330.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">แท่งยาวตามสเกลจริง (สเกลเชิงเส้น 0 – 80,000)</text><line x1="260.0" y1="196.0" x2="260.0" y2="420.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="260.0" y="444.0" font-size="15" fill="#475569" text-anchor="middle">0</text><line x1="380.0" y1="196.0" x2="380.0" y2="420.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="380.0" y="444.0" font-size="15" fill="#475569" text-anchor="middle">20,000</text><line x1="500.0" y1="196.0" x2="500.0" y2="420.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="500.0" y="444.0" font-size="15" fill="#475569" text-anchor="middle">40,000</text><line x1="620.0" y1="196.0" x2="620.0" y2="420.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="620.0" y="444.0" font-size="15" fill="#475569" text-anchor="middle">60,000</text><line x1="740.0" y1="196.0" x2="740.0" y2="420.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="740.0" y="444.0" font-size="15" fill="#475569" text-anchor="middle">80,000</text><circle cx="46.0" cy="230.0" r="14.0" fill="#dc2626"/><text x="46.0" y="235.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="68.0" y="236.0" font-size="16" fill="#dc2626" font-weight="bold">ตรวจทุกคู่</text><rect x="260.0" y="210.0" width="480.0" height="40.0" rx="4" fill="#dc2626" fill-opacity="0.85"/><text x="730.0" y="237.0" font-size="17" fill="#ffffff" text-anchor="end" font-weight="bold">80,000</text><circle cx="46.0" cy="300.0" r="14.0" fill="#2563eb"/><text x="46.0" y="305.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="68.0" y="306.0" font-size="16" fill="#2563eb" font-weight="bold">กริดช่องเดียว</text><rect x="260.0" y="280.0" width="9.9" height="40.0" rx="4" fill="#2563eb" fill-opacity="0.85"/><text x="279.9" y="307.0" font-size="17" fill="#2563eb" font-weight="bold">1,649</text><circle cx="46.0" cy="370.0" r="14.0" fill="#d97706"/><text x="46.0" y="375.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="68.0" y="376.0" font-size="16" fill="#d97706" font-weight="bold">กริด + ข้างเคียง</text><rect x="260.0" y="350.0" width="34.1" height="40.0" rx="4" fill="#d97706" fill-opacity="0.85"/><text x="304.1" y="377.0" font-size="17" fill="#d97706" font-weight="bold">5,688</text><rect x="20.0" y="492.0" width="760.0" height="214.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="50.0" cy="521.0" r="14.0" fill="#dc2626"/><text x="50.0" y="526.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="72.0" y="526.0" font-size="16" fill="#dc2626" font-weight="bold">ทุกคู่ = กระสุน × ศัตรู</text><text x="72.0" y="550.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">40 × 2,000 = </tspan><tspan fill="#dc2626" font-weight="bold">80,000</tspan><tspan fill="#475569"> ครั้ง/เฟรม → ×60 FPS = 4.8 ล้านครั้ง/วินาที</tspan></text><circle cx="50.0" cy="573.0" r="14.0" fill="#2563eb"/><text x="50.0" y="578.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="72.0" y="578.0" font-size="16" fill="#2563eb" font-weight="bold">กริด 48 ช่อง: ตรวจเฉพาะคู่ในช่องเดียวกัน</text><text x="72.0" y="602.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ต่อช่อง: กระสุน 40/48 ≈ 0.83 × ศัตรู 2000/48 ≈ 41.7 → ×48 ช่อง ≈ </tspan><tspan fill="#2563eb" font-weight="bold">1,667</tspan></text><text x="72.0" y="626.0" font-size="15" fill="#475569">วัดจริง 1,649 ครั้ง ≈ น้อยลง 48 เท่า (= จำนวนช่อง)</text><circle cx="50.0" cy="649.0" r="14.0" fill="#d97706"/><text x="50.0" y="654.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="72.0" y="654.0" font-size="16" fill="#d97706" font-weight="bold">รวมช่องข้างเคียง (กันพลาดวัตถุคร่อมเส้น)</text><text x="72.0" y="678.0" font-size="15" xml:space="preserve"><tspan fill="#d97706" font-weight="bold">5,688 ครั้ง</tspan><tspan fill="#0f172a"> ≈ 3.4 เท่าของช่องเดียว แต่ยังน้อยกว่าทุกคู่ ≈ 14 เท่า</tspan></text><rect x="20.0" y="722.0" width="760.0" height="62.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="400.0" y="760.4" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">80,000 → 1,649 ครั้ง/เฟรม (กริดลดงานได้ ~48 เท่า)</text><rect x="20.0" y="804.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="834.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: คิดว่ากริดเร็วเสมอ</text><text x="36.0" y="858.0" font-size="15" fill="#0f172a">ถ้าศัตรู 2,000 ตัวรุมอยู่ช่องเดียวกับกระสุน</text><text x="36.0" y="882.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ต้องเปรียบเทียบ </tspan><tspan fill="#dc2626" font-weight="bold">80,000</tspan><tspan fill="#0f172a"> ครั้งเท่าเดิม</tspan></text><rect x="408.0" y="804.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="834.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: ตัวเลข ÷48 สมมติว่ากระจายเท่ากัน</text><text x="424.0" y="858.0" font-size="15" fill="#0f172a">กรณีแย่สุดยังเป็น B × E</text><text x="424.0" y="882.0" font-size="15" fill="#0f172a">จึงต้องวัดผลจริงด้วย clock.get_fps()</text></svg>