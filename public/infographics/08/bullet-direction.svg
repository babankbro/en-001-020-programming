<text x="400" y="38" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">ทิศกระสุน: (เมาส์ − ยาน) → normalize → × bullet_speed</text>
<text x="400" y="62" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal">ยาน (400, 300) เมาส์ (460, 380) bullet_speed = 10 · พิกัดจอ y ชี้ลง</text>
