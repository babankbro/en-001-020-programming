<text x="140" y="126" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">ยาน (400, 300)</text>
<text x="310" y="368" font-size="14" fill="#7c3aed" text-anchor="end" font-weight="bold">เมาส์ (460, 380)</text>
<text x="218" y="264" font-size="14" fill="#7c3aed" text-anchor="end" font-weight="normal">เมาส์ใกล้ (430, 340)</text>
<text x="174" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal"></text>
<text x="208" y="216" font-size="14" fill="#d97706" text-anchor="start" font-weight="normal">เฟรม 1, 2, 3</text>
<text x="80" y="434" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">สเกล 1 หน่วย = 3 px · ลูกศรแดง = ความเร็ว (6, 8)</text>
<text x="80" y="456" font-size="14" fill="#0f172a" text-anchor="start" font-weight="normal">เมาส์ไกลหรือใกล้ ทิศเดียวกัน → ความเร็ว (6, 8) เท่ากัน</text>
<path d="M 640 120 A 120 120 0 0 1 520 240" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="520" y1="120" x2="670" y2="120" stroke="#0f172a" stroke-width="1.2"/>
<line x1="520" y1="120" x2="520" y2="270" stroke="#0f172a" stroke-width="1.2"/>
<text x="674" y="125" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">x</text>
<text x="526" y="274" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">y</text>
<line x1="592" y1="120" x2="592" y2="216" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="520" y1="216" x2="592" y2="216" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="520" y1="120" x2="592" y2="216" stroke="#059669" stroke-width="3" marker-end="url(#a_059669)"/>
<text x="586" y="114" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal">0.6</text>
<text x="514" y="221" font-size="14" fill="#475569" text-anchor="end" font-weight="normal">0.8</text>
<text x="602" y="224" font-size="15" fill="#059669" text-anchor="start" font-weight="bold">หนึ่งหน่วย (0.6, 0.8)</text>
<text x="602" y="246" font-size="14" fill="#059669" text-anchor="start" font-weight="normal">ขนาด = 1</text>
<text x="648" y="180" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">วงกลมรัศมี 1</text>
<text x="510" y="300" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">(1 หน่วย = 120 px)</text>
<rect x="40" y="480" width="220" height="76" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="150" y="510" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="bold">d = (60, 80)</text>
<text x="150" y="536" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="normal">|d| = √10000 = 100</text>
<line x1="263" y1="518" x2="287" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#a_475569)"/>
<rect x="290" y="480" width="220" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="510" font-size="16" fill="#059669" text-anchor="middle" font-weight="bold">d / |d| = d / 100</text>
<text x="400" y="536" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="normal">= (0.6, 0.8)</text>
<line x1="513" y1="518" x2="537" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#a_475569)"/>
<rect x="540" y="480" width="220" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="650" y="510" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">v = (0.6, 0.8) × 10</text>
<text x="650" y="536" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="normal">= (6, 8)  |v| = 10</text>
<text x="400" y="600" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="normal">ตำแหน่งหลัง n เฟรม = (400 + 6n, 300 + 8n): (406, 308) → (412, 316) → (418, 324)</text>
<text x="400" y="626" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="normal">ถ้าไม่ normalize จะใช้ (60, 80) เป็นความเร็ว = 100 px ต่อเฟรม และเมาส์ยิ่งไกลยิ่งเร็ว ✗</text>
</svg>
