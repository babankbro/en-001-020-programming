<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" width="800" height="956" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">Big-O: งานโตอย่างไรเมื่อข้อมูลเพิ่ม และวัดผลจริงด้วย FPS</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: ศัตรูเพิ่ม 2 เท่า งานเพิ่มกี่เท่า และจะรู้ได้อย่างไรว่าเกมช้าเกินไป</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><rect x="134.4" y="101.0" width="26.0" height="18.0" rx="4" fill="#dc262633" stroke="#dc2626" stroke-width="1.5"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">ทุกคู่ 40 × E</text><rect x="279.7" y="101.0" width="26.0" height="18.0" rx="4" fill="#05966933" stroke="#059669" stroke-width="1.5"/><text x="313.7" y="116.0" font-size="15" fill="#0f172a">กริด 40 × E / 48</text><line x1="454.2" y1="111.0" x2="480.2" y2="111.0" stroke="#d97706" stroke-width="3" stroke-linecap="round"/><text x="488.2" y="116.0" font-size="15" fill="#0f172a">งบเวลา 16.7 ms</text><rect x="20.0" y="146.0" width="470.0" height="396.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="176.0" r="14.0" fill="#dc2626"/><text x="42.0" y="181.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="64.0" y="182.0" font-size="16" fill="#dc2626" font-weight="bold">ศัตรู E เพิ่ม → งานเพิ่มเป็นเส้นตรง O(B·E)</text><line x1="90.0" y1="450.0" x2="470.0" y2="450.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="82.0" y="455.0" font-size="15" fill="#475569" text-anchor="end">0</text><line x1="90.0" y1="390.0" x2="470.0" y2="390.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="82.0" y="395.0" font-size="15" fill="#475569" text-anchor="end">20k</text><line x1="90.0" y1="330.0" x2="470.0" y2="330.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="82.0" y="335.0" font-size="15" fill="#475569" text-anchor="end">40k</text><line x1="90.0" y1="270.0" x2="470.0" y2="270.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="82.0" y="275.0" font-size="15" fill="#475569" text-anchor="end">60k</text><line x1="90.0" y1="210.0" x2="470.0" y2="210.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="82.0" y="215.0" font-size="15" fill="#475569" text-anchor="end">80k</text><rect x="110.0" y="390.0" width="34.0" height="60.0" rx="3" fill="#dc2626" fill-opacity="0.85"/><rect x="148.0" y="446.7" width="34.0" height="4.0" rx="2" fill="#059669"/><text x="127.0" y="382.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">20k</text><text x="165.0" y="438.7" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">417</text><text x="146.0" y="472.0" font-size="15" fill="#0f172a" text-anchor="middle">E=500</text><rect x="202.0" y="330.0" width="34.0" height="120.0" rx="3" fill="#dc2626" fill-opacity="0.85"/><rect x="240.0" y="445.5" width="34.0" height="4.5" rx="2" fill="#059669"/><text x="219.0" y="322.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">40k</text><text x="257.0" y="437.5" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">833</text><text x="238.0" y="472.0" font-size="15" fill="#0f172a" text-anchor="middle">E=1,000</text><rect x="294.0" y="270.0" width="34.0" height="180.0" rx="3" fill="#dc2626" fill-opacity="0.85"/><rect x="332.0" y="444.2" width="34.0" height="5.8" rx="2" fill="#059669"/><text x="311.0" y="262.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">60k</text><text x="349.0" y="436.2" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">1,250</text><text x="330.0" y="472.0" font-size="15" fill="#0f172a" text-anchor="middle">E=1,500</text><rect x="386.0" y="210.0" width="34.0" height="240.0" rx="3" fill="#dc2626" fill-opacity="0.85"/><rect x="424.0" y="443.0" width="34.0" height="7.0" rx="2" fill="#059669"/><text x="403.0" y="202.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">80k</text><text x="441.0" y="435.0" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold">1,667</text><text x="422.0" y="472.0" font-size="15" fill="#0f172a" text-anchor="middle">E=2,000</text><text x="40.0" y="502.0" font-size="15" fill="#0f172a">500 → 1,000 ตัว (×2): 20,000 → 40,000 (×2) ทั้งสองวิธีโต ×2</text><text x="40.0" y="526.0" font-size="15" fill="#475569">แต่กริดเล็กกว่า 48 เท่าตลอด (ค่าคงที่ 1/48)</text><rect x="510.0" y="146.0" width="270.0" height="396.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="532.0" cy="176.0" r="14.0" fill="#7c3aed"/><text x="532.0" y="181.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="554.0" y="182.0" font-size="16" fill="#7c3aed" font-weight="bold">O(n) vs O(n²)</text><text x="528.0" y="222.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">line(n)</text><text x="528.0" y="246.0" font-size="15" fill="#475569">งาน = n</text><text x="528.0" y="274.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">n=10: 10</tspan><tspan fill="#475569">  →  </tspan><tspan fill="#7c3aed" font-weight="bold">n=20: 20</tspan></text><text x="528.0" y="300.0" font-size="15" fill="#7c3aed" font-weight="bold">n ×2 → งาน ×2</text><text x="528.0" y="342.0" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">triangle(n)</text><text x="528.0" y="366.0" font-size="15" fill="#475569">งาน = n(n+1)/2</text><text x="528.0" y="394.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">n=10: 55</tspan><tspan fill="#475569">  →  </tspan><tspan fill="#7c3aed" font-weight="bold">n=20: 210</tspan></text><text x="528.0" y="420.0" font-size="15" fill="#7c3aed" font-weight="bold">n ×2 → งาน ×3.8</text><text x="528.0" y="470.0" font-size="15" fill="#475569">n ใหญ่ขึ้น O(n²) จะเข้าใกล้ ×4</text><text x="528.0" y="494.0" font-size="15" fill="#475569">ลูปซ้อน 2 ชั้น = O(n²)</text><rect x="20.0" y="558.0" width="760.0" height="250.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="42.0" cy="588.0" r="14.0" fill="#d97706"/><text x="42.0" y="593.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="64.0" y="594.0" font-size="16" fill="#d97706" font-weight="bold">งบเวลาต่อเฟรม: clock.tick(60) → 1000 / 60 = 16.7 ms</text><line x1="200.0" y1="616.0" x2="200.0" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="200.0" y="748.0" font-size="15" fill="#475569" text-anchor="middle">0</text><line x1="286.7" y1="616.0" x2="286.7" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="286.7" y="748.0" font-size="15" fill="#475569" text-anchor="middle">5</text><line x1="373.3" y1="616.0" x2="373.3" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="373.3" y="748.0" font-size="15" fill="#475569" text-anchor="middle">10</text><line x1="460.0" y1="616.0" x2="460.0" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="460.0" y="748.0" font-size="15" fill="#475569" text-anchor="middle">15</text><line x1="546.7" y1="616.0" x2="546.7" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="546.7" y="748.0" font-size="15" fill="#475569" text-anchor="middle">20</text><line x1="633.3" y1="616.0" x2="633.3" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="633.3" y="748.0" font-size="15" fill="#475569" text-anchor="middle">25</text><line x1="720.0" y1="616.0" x2="720.0" y2="728.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="720.0" y="748.0" font-size="15" fill="#475569" text-anchor="middle">30</text><text x="734.0" y="748.0" font-size="15" fill="#475569">ms</text><line x1="488.9" y1="612.0" x2="488.9" y2="732.0" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="488.9" y="608.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">16.7</text><text x="36.0" y="652.0" font-size="16" fill="#059669" font-weight="bold">60 FPS (ทันงบ)</text><rect x="200.0" y="632.0" width="288.9" height="30.0" rx="4" fill="#059669" fill-opacity="0.8"/><text x="36.0" y="702.0" font-size="16" fill="#dc2626" font-weight="bold">get_fps() = 35.2</text><rect x="200.0" y="682.0" width="492.4" height="30.0" rx="4" fill="#dc2626" fill-opacity="0.8"/><text x="700.4" y="703.0" font-size="16" fill="#dc2626" font-weight="bold">28.4 ms</text><text x="36.0" y="786.0" font-size="15" fill="#0f172a">1000 / 35.2 ≈ 28.4 ms ต่อเฟรม เกินงบ 16.7 ms → เกมช้ากว่าที่ตั้งใจ (ลองเปิดกริดแล้ววัดใหม่)</text><rect x="20.0" y="828.0" width="372.0" height="102.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="858.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: tick(60) รับประกัน 60 FPS</text><text x="36.0" y="882.0" font-size="15" fill="#0f172a">clock.tick(60) เป็นแค่ "เพดาน" ไม่ใช่สัญญา</text><text x="36.0" y="906.0" font-size="15" fill="#0f172a">งานหนักเกิน 16.7 ms ก็ยังช้ากว่า 60 ได้</text><rect x="408.0" y="828.0" width="372.0" height="102.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="858.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: ดูค่าจริงจาก get_fps()</text><text x="424.0" y="882.0" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">f"FPS: {clock.get_fps():.1f}"</text><text x="424.0" y="906.0" font-size="15" fill="#0f172a">แสดงบนจอ เทียบก่อน/หลังใช้กริด</text></svg>