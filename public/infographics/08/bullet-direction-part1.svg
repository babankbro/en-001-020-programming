<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" width="800" height="810" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff"/><text x="400.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">ยิงกระสุนไปที่เมาส์: ลบ → หาขนาด → normalize → คูณอัตราเร็ว</text><text x="400.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle">ภาพนี้ตอบคำถามว่า: ยานที่ (400, 300) ยิงไปเมาส์ที่ (460, 380) กระสุนต้องมีความเร็วเท่าไร</text><rect x="20.0" y="90.0" width="760.0" height="40.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="34.0" y="116.0" font-size="15" fill="#475569" font-weight="bold">คำอธิบายสี:</text><line x1="134.4" y1="111.0" x2="160.4" y2="111.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><text x="168.4" y="116.0" font-size="15" fill="#0f172a">เวกเตอร์ยาน → เมาส์ d</text><line x1="348.8" y1="111.0" x2="374.8" y2="111.0" stroke="#dc2626" stroke-width="3" stroke-linecap="butt" marker-end="url(#ah-red)"/><text x="382.8" y="116.0" font-size="15" fill="#0f172a">ความเร็วกระสุน</text><circle cx="519.0" cy="111.0" r="6.0" fill="#d97706"/><text x="540.0" y="116.0" font-size="15" fill="#0f172a">ตำแหน่งกระสุนเฟรม 1–3</text><rect x="20.0" y="146.0" width="380.0" height="440.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="36.0" y="174.0" font-size="17" fill="#0f172a" font-weight="bold">พิกัดจอจริง (y ชี้ลง) 1 px เกม = 4 px ในภาพ</text><line x1="70.0" y1="214.0" x2="70.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="110.0" y1="214.0" x2="110.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="110.0" y="208.0" font-size="15" fill="#475569" text-anchor="middle">400</text><line x1="150.0" y1="214.0" x2="150.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="190.0" y1="214.0" x2="190.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="190.0" y="208.0" font-size="15" fill="#475569" text-anchor="middle">420</text><line x1="230.0" y1="214.0" x2="230.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="270.0" y1="214.0" x2="270.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="270.0" y="208.0" font-size="15" fill="#475569" text-anchor="middle">440</text><line x1="310.0" y1="214.0" x2="310.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="350.0" y1="214.0" x2="350.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="350.0" y="208.0" font-size="15" fill="#475569" text-anchor="middle">460</text><line x1="390.0" y1="214.0" x2="390.0" y2="574.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="234.0" x2="390.0" y2="234.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="239.0" font-size="15" fill="#475569" text-anchor="end">300</text><line x1="70.0" y1="274.0" x2="390.0" y2="274.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="314.0" x2="390.0" y2="314.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="319.0" font-size="15" fill="#475569" text-anchor="end">320</text><line x1="70.0" y1="354.0" x2="390.0" y2="354.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="394.0" x2="390.0" y2="394.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="399.0" font-size="15" fill="#475569" text-anchor="end">340</text><line x1="70.0" y1="434.0" x2="390.0" y2="434.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="474.0" x2="390.0" y2="474.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="479.0" font-size="15" fill="#475569" text-anchor="end">360</text><line x1="70.0" y1="514.0" x2="390.0" y2="514.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70.0" y1="554.0" x2="390.0" y2="554.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="64.0" y="559.0" font-size="15" fill="#475569" text-anchor="end">380</text><line x1="110.0" y1="234.0" x2="350.0" y2="234.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="350.0" y1="234.0" x2="350.0" y2="554.0" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="278.0" y="256.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">dx = 60</text><text x="358.0" y="394.0" font-size="15" fill="#059669" font-weight="bold">dy</text><text x="358.0" y="414.0" font-size="15" fill="#059669" font-weight="bold">= 80</text><line x1="110.0" y1="234.0" x2="350.0" y2="554.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><text x="206.0" y="442.0" font-size="15" fill="#7c3aed" text-anchor="end" font-weight="bold">|d| = 100</text><circle cx="134.0" cy="266.0" r="5.5" fill="#d97706"/><circle cx="158.0" cy="298.0" r="5.5" fill="#d97706"/><circle cx="182.0" cy="330.0" r="5.5" fill="#d97706"/><line x1="110.0" y1="234.0" x2="134.0" y2="266.0" stroke="#dc2626" stroke-width="4" stroke-linecap="butt" marker-end="url(#ah-red)"/><circle cx="110.0" cy="234.0" r="8.0" fill="#2563eb"/><text x="96.0" y="222.0" font-size="15" fill="#2563eb" font-weight="bold">ยาน (400, 300)</text><circle cx="350.0" cy="554.0" r="9.0" fill="none" stroke="#0f172a" stroke-width="2.5"/><line x1="337.0" y1="554.0" x2="363.0" y2="554.0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/><line x1="350.0" y1="541.0" x2="350.0" y2="567.0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/><text x="338.0" y="584.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">เมาส์ (460, 380)</text><circle cx="318.0" cy="442.0" r="14.0" fill="#7c3aed"/><text x="318.0" y="447.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="304.0" y1="442.0" x2="254.0" y2="426.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="254.0" cy="426.0" r="3.5" fill="#7c3aed"/><circle cx="110.0" cy="437.0" r="14.0" fill="#7c3aed"/><text x="110.0" y="442.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle cx="86.0" cy="322.0" r="14.0" fill="#dc2626"/><text x="86.0" y="327.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><line x1="96.0" y1="312.0" x2="122.0" y2="254.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="122.0" cy="254.0" r="3.5" fill="#dc2626"/><circle cx="238.0" cy="314.0" r="14.0" fill="#d97706"/><text x="238.0" y="319.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><line x1="224.0" y1="314.0" x2="190.0" y2="326.0" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="190.0" cy="326.0" r="3.5" fill="#d97706"/><circle cx="430.0" cy="171.0" r="14.0" fill="#7c3aed"/><text x="430.0" y="176.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="452.0" y="176.0" font-size="16" fill="#7c3aed" font-weight="bold">ทิศ = เมาส์ − ยาน</text><text x="452.0" y="200.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(460 − 400, 380 − 300) = </tspan><tspan fill="#7c3aed" font-weight="bold">(60, 80)</tspan></text><circle cx="430.0" cy="221.0" r="14.0" fill="#7c3aed"/><text x="430.0" y="226.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="452.0" y="226.0" font-size="16" fill="#7c3aed" font-weight="bold">ขนาด (ระยะทาง)</text><text x="452.0" y="250.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">√(60² + 80²) = √10000 = </tspan><tspan fill="#7c3aed" font-weight="bold">100</tspan></text><circle cx="430.0" cy="271.0" r="14.0" fill="#d97706"/><text x="430.0" y="276.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="452.0" y="276.0" font-size="16" fill="#d97706" font-weight="bold">normalize: หารด้วยขนาด</text><text x="452.0" y="300.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(60/100, 80/100) = </tspan><tspan fill="#d97706" font-weight="bold">(0.6, 0.8)</tspan></text><text x="452.0" y="324.0" font-size="15" fill="#475569">ยาว 1 เหลือแต่ทิศ</text><circle cx="430.0" cy="345.0" r="14.0" fill="#dc2626"/><text x="430.0" y="350.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="452.0" y="350.0" font-size="16" fill="#dc2626" font-weight="bold">คูณ bullet_speed = 10</text><text x="452.0" y="374.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(0.6 × 10, 0.8 × 10) = </tspan><tspan fill="#dc2626" font-weight="bold">(6, 8)</tspan></text><rect x="416.0" y="394.0" width="364.0" height="68.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="598.0" y="418.0" font-size="15" fill="#475569" text-anchor="middle">ความเร็วกระสุน (ขนาด √(36 + 64) = 10 พอดี)</text><text x="598.0" y="446.0" font-size="21" fill="#dc2626" text-anchor="middle" font-weight="bold">(6, 8) px/เฟรม</text><circle cx="430.0" cy="475.0" r="14.0" fill="#d97706"/><text x="430.0" y="480.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="452.0" y="480.0" font-size="16" fill="#d97706" font-weight="bold">เดินเฟรมละ (6, 8)</text><text x="452.0" y="504.0" font-size="15" fill="#475569">ตำแหน่ง = (400 + 6n, 300 + 8n)</text><text x="452.0" y="528.0" font-size="15" fill="#475569">n=1 → (406, 308), n=2 → (412, 316)</text><text x="452.0" y="552.0" font-size="15" fill="#475569">n=3 → (418, 324)</text><rect x="20.0" y="606.0" width="760.0" height="46.0" rx="10" fill="#0f172a"/><text x="36.0" y="636.0" font-size="15" xml:space="preserve"><tspan fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">direction = Vector2(dx, dy).normalize(); vel = direction * 10</tspan></text><rect x="20.0" y="670.0" width="372.0" height="126.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="36.0" y="700.0" font-size="17" fill="#dc2626" font-weight="bold">✗ จุดที่มักผิด: ไม่ normalize</text><text x="36.0" y="724.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">ใช้ (dx, dy) ตรง ๆ → </tspan><tspan fill="#dc2626" font-weight="bold">(60, 80)</tspan></text><text x="36.0" y="748.0" font-size="15" fill="#0f172a">วิ่ง 100 px/เฟรม เมาส์ยิ่งไกลยิ่งเร็ว</text><text x="36.0" y="772.0" font-size="15" fill="#0f172a">กระสุนแต่ละนัดเร็วไม่เท่ากัน</text><rect x="408.0" y="670.0" width="372.0" height="126.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="424.0" y="700.0" font-size="17" fill="#059669" font-weight="bold">✓ ที่ถูก: แยกทิศออกก่อน แล้วใส่ความเร็ว</text><text x="424.0" y="724.0" font-size="15" xml:space="preserve"><tspan fill="#0f172a">(0.6, 0.8) × 10 → </tspan><tspan fill="#059669" font-weight="bold">(6, 8)</tspan></text><text x="424.0" y="748.0" font-size="15" fill="#0f172a">ทุกนัดเร็ว 10 px/เฟรมเท่ากัน</text><text x="424.0" y="772.0" font-size="15" fill="#0f172a">ไม่ว่าเมาส์จะอยู่ใกล้หรือไกล</text></svg>