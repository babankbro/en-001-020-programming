<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1062" width="800" height="1062" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">ค่าเฉลี่ยด้วยการวนซ้ำ: total สะสมทีละรอบ</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า for x in ns บวกค่าสะสมอย่างไร จนได้ค่าเฉลี่ย 16.0</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">x ของแต่ละรอบ</text>
<rect x="258.7" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="285.7" y="125" font-size="15" fill="#0f172a" xml:space="preserve">total สะสม</text>
<rect x="382.4" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="409.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">คำตอบ</text>
<circle cx="55" cy="166" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="80" y="172" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">for x in ns: หยิบสมาชิกทีละตัวจากซ้ายไปขวา (ไม่ต้องใช้ดัชนี)</text>
<rect x="40" y="196" width="300" height="143" rx="10" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="56" y="225" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns = [5, 10, 15, 20, 30]</text>
<text x="56" y="249" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">total = 0</text>
<text x="56" y="273" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for x in ns:</text>
<text x="56" y="297" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    total += x</text>
<text x="56" y="321" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(total / len(ns))</text>
<rect x="380" y="230" width="72" height="46" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="416" y="260" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="416" y="218" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">รอบ 1</text>
<rect x="452" y="230" width="72" height="46" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="488" y="260" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10</text>
<text x="488" y="218" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">รอบ 2</text>
<rect x="524" y="230" width="72" height="46" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="560" y="260" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">15</text>
<text x="560" y="218" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">รอบ 3</text>
<rect x="596" y="230" width="72" height="46" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="632" y="260" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<text x="632" y="218" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">รอบ 4</text>
<rect x="668" y="230" width="72" height="46" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="704" y="260" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">30</text>
<text x="704" y="218" font-size="15" fill="#475569" text-anchor="middle" xml:space="preserve">รอบ 5</text>
<text x="380" y="308" font-size="15" fill="#0f172a" xml:space="preserve">แต่ละรอบ x = ค่าในช่อง แล้ว total += x</text>
<circle cx="55" cy="372" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="378" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="80" y="378" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">total += x ทีละรอบ (total หลัง = total ก่อน + x)</text>
<rect x="40" y="398" width="720" height="38" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="90" y="423" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">รอบ</text>
<text x="200" y="423" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">x</text>
<text x="345" y="423" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">total ก่อน</text>
<text x="595" y="423" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">total หลัง</text>
<rect x="40" y="440" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="90" y="468" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<rect x="170" y="446" width="60" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="467.8" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="345" y="468" font-size="17" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text>
<text x="595" y="468" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#059669">0 + </tspan><tspan fill="#2563eb" font-weight="bold">5</tspan> = <tspan fill="#059669" font-weight="bold">5</tspan></text>
<rect x="40" y="488" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="90" y="516" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<rect x="170" y="494" width="60" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="515.8" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10</text>
<text x="345" y="516" font-size="17" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="595" y="516" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#059669">5 + </tspan><tspan fill="#2563eb" font-weight="bold">10</tspan> = <tspan fill="#059669" font-weight="bold">15</tspan></text>
<rect x="40" y="536" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="90" y="564" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<rect x="170" y="542" width="60" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="563.8" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">15</text>
<text x="345" y="564" font-size="17" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">15</text>
<text x="595" y="564" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#059669">15 + </tspan><tspan fill="#2563eb" font-weight="bold">15</tspan> = <tspan fill="#059669" font-weight="bold">30</tspan></text>
<rect x="40" y="584" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="90" y="612" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<rect x="170" y="590" width="60" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="611.8" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<text x="345" y="612" font-size="17" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">30</text>
<text x="595" y="612" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#059669">30 + </tspan><tspan fill="#2563eb" font-weight="bold">20</tspan> = <tspan fill="#059669" font-weight="bold">50</tspan></text>
<rect x="40" y="632" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="90" y="660" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">5</text>
<rect x="170" y="638" width="60" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="659.8" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">30</text>
<text x="345" y="660" font-size="17" fill="#059669" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">50</text>
<text x="595" y="660" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#059669">50 + </tspan><tspan fill="#2563eb" font-weight="bold">30</tspan> = <tspan fill="#059669" font-weight="bold">80</tspan></text>
<text x="40" y="700" font-size="15" fill="#475569" xml:space="preserve">มองเป็นแถบสะสม (1 หน่วย = 8 px):</text>
<rect x="60" y="712" width="40" height="34" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="80" y="735" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+5</text>
<line x1="100" y1="746" x2="100" y2="756" stroke="#059669" stroke-width="1.5"/>
<text x="100" y="774" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">5</text>
<rect x="100" y="712" width="80" height="34" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="140" y="735" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+10</text>
<line x1="180" y1="746" x2="180" y2="756" stroke="#059669" stroke-width="1.5"/>
<text x="180" y="774" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">15</text>
<rect x="180" y="712" width="120" height="34" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="240" y="735" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+15</text>
<line x1="300" y1="746" x2="300" y2="756" stroke="#059669" stroke-width="1.5"/>
<text x="300" y="774" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">30</text>
<rect x="300" y="712" width="160" height="34" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="380" y="735" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+20</text>
<line x1="460" y1="746" x2="460" y2="756" stroke="#059669" stroke-width="1.5"/>
<text x="460" y="774" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">50</text>
<rect x="460" y="712" width="240" height="34" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="580" y="735" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">+30</text>
<line x1="700" y1="746" x2="700" y2="756" stroke="#059669" stroke-width="1.5"/>
<text x="700" y="774" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">80</text>
<text x="60" y="774" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">0</text>
<circle cx="55" cy="806" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="812" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="80" y="812" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">จบลูปแล้วหารด้วยจำนวนสมาชิก</text>
<rect x="40" y="830" width="720" height="54" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="863" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">total / len(ns) = 80 / 5</text>
<text x="742" y="865.4" font-size="24" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">16.0</text>
<text x="40" y="912" font-size="15" fill="#059669" font-weight="bold" xml:space="preserve">ตรวจ: sum(ns) = 80, len(ns) = 5 ตรงกับลูป ✓</text>
<rect x="40" y="934" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="960" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="966" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="966" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">ใช้ // หาค่าเฉลี่ย</text>
<text x="58" y="990" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">sum([1, 2, 3, 4]) // 4  →  2</text>
<text x="58" y="1014" font-size="15" fill="#0f172a" xml:space="preserve">เศษหาย (ใน ns นี้บังเอิญได้ 16 เหมือนกัน)</text>
<rect x="408" y="934" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="960" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="966" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="966" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">ใช้ / เสมอ</text>
<text x="426" y="990" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">sum([1, 2, 3, 4]) / 4  →  2.5</text>
<text x="426" y="1014" font-size="15" fill="#0f172a" xml:space="preserve">ได้ float ค่าถูกต้อง</text>
</svg>
