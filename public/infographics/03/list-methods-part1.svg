<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">เมท็อดของลิสต์ (1): append, insert, pop และดัชนีที่เลื่อน</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า แต่ละคำสั่งเปลี่ยนลิสต์ ns อย่างไร และเมื่อไรดัชนีของสมาชิกเดิมจึงเปลี่ยน</text>
