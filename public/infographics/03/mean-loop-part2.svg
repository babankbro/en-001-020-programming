<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1268" width="800" height="1268" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">หาค่ามากสุดด้วยมือ และนับตัวที่มากกว่าค่าเฉลี่ย</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า max() ทำงานอย่างไรเบื้องหลัง และใช้ค่าเฉลี่ยเปรียบเทียบข้อมูลอย่างไร</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">biggest</text>
<rect x="210.4" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="237.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">เปลี่ยนค่า</text>
<rect x="320.3" y="111" width="20" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="347.3" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ไม่เปลี่ยน</text>
<rect x="430.2" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="457.2" y="125" font-size="15" fill="#0f172a" xml:space="preserve">คำตอบ</text>
<circle cx="55" cy="166" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="80" y="172" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">เริ่มจากตัวแรก: biggest = ns[0] = 12</text>
<rect x="40" y="194" width="320" height="167" rx="10" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="56" y="223" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns = [12, 7, 20, 3, 9]</text>
<text x="56" y="247" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">biggest = ns[0]</text>
<text x="56" y="271" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for x in ns:</text>
<text x="56" y="295" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    if x &gt; biggest:</text>
<text x="56" y="319" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">        biggest = x</text>
<text x="56" y="343" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(biggest)</text>
<rect x="390" y="204" width="370" height="80" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<rect x="390" y="204" width="6" height="80" rx="3" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="406" y="227" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">ทำไมไม่เริ่มที่ 0?</text>
<text x="406" y="249" font-size="15" fill="#0f172a" xml:space="preserve">ถ้าข้อมูลติดลบทั้งหมด เช่น [-3, -7]</text>
<text x="406" y="271" font-size="15" fill="#0f172a" xml:space="preserve">เริ่มที่ 0 จะตอบ 0 ซึ่งไม่อยู่ในลิสต์</text>
<circle cx="55" cy="392" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="398" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="80" y="398" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">เทียบทีละตัว: ถ้า x &gt; biggest จึงเปลี่ยน</text>
<rect x="40" y="418" width="720" height="38" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="85" y="443" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">รอบ</text>
<text x="175" y="443" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">x</text>
<text x="350" y="443" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">x &gt; biggest ?</text>
<text x="620" y="443" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">biggest หลังรอบ</text>
<rect x="40" y="460" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="85" y="488" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="175" y="488" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">12</text>
<rect x="260" y="466" width="180" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="487.4" font-size="15" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">12 &gt; 12  เท็จ</text>
<rect x="580" y="466" width="80" height="32" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="620" y="487.8" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">12</text>
<rect x="40" y="508" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="85" y="536" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="175" y="536" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">7</text>
<rect x="260" y="514" width="180" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="535.4" font-size="15" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">7 &gt; 12  เท็จ</text>
<rect x="580" y="514" width="80" height="32" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="620" y="535.8" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">12</text>
<rect x="40" y="556" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="85" y="584" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="175" y="584" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<rect x="260" y="562" width="180" height="32" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="350" y="583.4" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">20 &gt; 12  จริง</text>
<rect x="580" y="562" width="80" height="32" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="620" y="583.8" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<rect x="40" y="604" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="85" y="632" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<text x="175" y="632" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<rect x="260" y="610" width="180" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="631.4" font-size="15" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">3 &gt; 20  เท็จ</text>
<rect x="580" y="610" width="80" height="32" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="620" y="631.8" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<rect x="40" y="652" width="720" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="85" y="680" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">5</text>
<text x="175" y="680" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">9</text>
<rect x="260" y="658" width="180" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="679.4" font-size="15" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">9 &gt; 20  เท็จ</text>
<rect x="580" y="658" width="80" height="32" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="620" y="679.8" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<rect x="40" y="710" width="720" height="52" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="742" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">print(biggest)  (เท่ากับ max(ns))</text>
<text x="742" y="744.4" font-size="24" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<circle cx="55" cy="786" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="792" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="80" y="792" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">สมาชิกกี่ตัวมากกว่าค่าเฉลี่ย?  ค่าเฉลี่ย = 51 / 5 = 10.2</text>
<line x1="100" y1="1044" x2="740" y2="1044" stroke="#0f172a" stroke-width="1.5"/>
<text x="92" y="1049" font-size="15" fill="#64748b" text-anchor="end" xml:space="preserve">0</text>
<text x="92" y="999" font-size="15" fill="#64748b" text-anchor="end" xml:space="preserve">5</text>
<line x1="100" y1="994" x2="740" y2="994" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="949" font-size="15" fill="#64748b" text-anchor="end" xml:space="preserve">10</text>
<line x1="100" y1="944" x2="740" y2="944" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="899" font-size="15" fill="#64748b" text-anchor="end" xml:space="preserve">15</text>
<line x1="100" y1="894" x2="740" y2="894" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="849" font-size="15" fill="#64748b" text-anchor="end" xml:space="preserve">20</text>
<line x1="100" y1="844" x2="740" y2="844" stroke="#e2e8f0" stroke-width="1"/>
<rect x="120" y="924" width="70" height="120" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="155" y="916" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">12</text>
<rect x="226" y="974" width="70" height="70" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="261" y="995" font-size="16" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">7</text>
<rect x="332" y="844" width="70" height="200" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="367" y="836" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve">20</text>
<rect x="438" y="1014" width="70" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="473" y="1035" font-size="16" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<rect x="544" y="954" width="70" height="90" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="579" y="975" font-size="16" fill="#475569" font-weight="bold" text-anchor="middle" xml:space="preserve">9</text>
<line x1="100" y1="942" x2="740" y2="942" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5"/>
<rect x="600" y="912" width="140" height="24" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="740" y="930" font-size="15" fill="#d97706" font-weight="bold" text-anchor="end" xml:space="preserve">ค่าเฉลี่ย 10.2</text>
<rect x="40" y="1068" width="720" height="52" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="1100" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">มากกว่า 10.2 คือ 12 และ 20</text>
<text x="742" y="1101.7" font-size="22" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2 ตัว</text>
<rect x="40" y="1140" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="1166" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="1172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="1172" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">เริ่ม biggest = 0</text>
<text x="58" y="1196" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns = [-3, -7] → ได้ 0</text>
<text x="58" y="1220" font-size="15" fill="#0f172a" xml:space="preserve">0 ไม่ได้อยู่ในลิสต์เลย</text>
<rect x="408" y="1140" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="1166" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="1172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="1172" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">เริ่ม biggest = ns[0]</text>
<text x="426" y="1196" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns = [-3, -7] → ได้ -3</text>
<text x="426" y="1220" font-size="15" fill="#0f172a" xml:space="preserve">ถูกต้องเสมอ ไม่ว่าค่าบวกหรือลบ</text>
</svg>
