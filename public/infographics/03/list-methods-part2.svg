<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">เมท็อดของลิสต์ (2): แก้ค่า, remove และสองชื่อหนึ่งลิสต์</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า แก้ค่ากับลบค่าต่างกันอย่างไร และทำไม b = a ไม่ใช่การสำเนา</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
