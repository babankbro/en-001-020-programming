<text x="340" y="390" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<rect x="370" y="398" width="60" height="44" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="400" y="427" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<text x="400" y="390" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<rect x="430" y="398" width="60" height="44" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="460" y="427" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">30</text>
<text x="460" y="390" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<line x1="494" y1="420" x2="516" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-red)"/>
<rect x="520" y="398" width="60" height="44" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="550" y="427" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="550" y="388" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle" xml:space="preserve">ตัวแรก</text>
<text x="88" y="474" font-size="15" fill="#0f172a" xml:space="preserve">ลบ “ค่า” 5 ตัวแรกที่พบ (ดัชนี 0) ส่วน 5 อีกตัวยังอยู่</text>
<circle cx="55" cy="514" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="520" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">7</text>
<text x="80" y="520" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">pop(i) ลบตาม “ตำแหน่ง” · remove(x) ลบตาม “ค่า”   (ns = [5, 15, 20, 30])</text>
<rect x="40" y="540" width="350" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="56" y="570" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns.pop(1)</text>
<text x="56" y="600" font-size="16" fill="#059669" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ คืน 15 → [5, 20, 30]</text>
<text x="56" y="626" font-size="15" fill="#475569" xml:space="preserve">ตำแหน่ง 1 คือ 15</text>
<rect x="410" y="540" width="350" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="426" y="570" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns.remove(1)</text>
<text x="426" y="600" font-size="16" fill="#dc2626" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">→ ValueError</text>
<text x="426" y="626" font-size="15" fill="#475569" xml:space="preserve">ไม่มีสมาชิกที่มีค่า 1</text>
<circle cx="55" cy="668" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="674" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">8</text>
<text x="80" y="674" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">b = a ไม่ได้สำเนา: สองชื่อชี้ไปลิสต์เดียวกัน</text>
<rect x="40" y="698" width="720" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="64" y="722" width="56" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="92" y="748" font-size="18" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">a</text>
<line x1="122" y1="741" x2="236" y2="764" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
<rect x="64" y="778" width="56" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="92" y="804" font-size="18" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">b</text>
<line x1="122" y1="797" x2="236" y2="764" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
<rect x="240" y="742" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="265" y="771" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<rect x="290" y="742" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="315" y="771" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text>
<rect x="340" y="742" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365" y="771" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<rect x="390" y="742" width="50" height="44" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="415" y="771" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text>
<text x="460" y="750" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">b.append(4) ทำให้ a เห็น 4 ด้วย</text>
<text x="460" y="774" font-size="15" fill="#0f172a" xml:space="preserve">print(a) → <tspan fill="#d97706" font-weight="bold" font-family="Consolas, 'Courier New', monospace">[1, 2, 3, 4]</tspan></text>
<rect x="64" y="834" width="56" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="92" y="860" font-size="18" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">c</text>
<line x1="122" y1="853" x2="236" y2="853" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar-purple)"/>
<rect x="240" y="831" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="265" y="860" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text>
<rect x="290" y="831" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="315" y="860" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text>
<rect x="340" y="831" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365" y="860" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text>
<rect x="390" y="831" width="50" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="415" y="860" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text>
<rect x="440" y="831" width="50" height="44" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="465" y="860" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="510" y="844" font-size="15" fill="#0f172a" font-weight="bold" xml:space="preserve">c = a.copy() ได้ลิสต์ใหม่</text>
<text x="510" y="868" font-size="15" fill="#0f172a" xml:space="preserve">c.append(5) → a ไม่เปลี่ยน</text>
<rect x="40" y="914" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="940" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="946" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="946" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">เขียน ns = ns.append(40)</text>
<text x="58" y="970" font-size="15" fill="#0f172a" xml:space="preserve">append() คืนค่า None</text>
<text x="58" y="994" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns กลายเป็น None</text>
<rect x="408" y="914" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="940" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="946" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="946" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">เรียก ns.append(40) เฉย ๆ</text>
<text x="426" y="970" font-size="15" fill="#0f172a" xml:space="preserve">แก้ลิสต์เดิม: ns จากขั้น ⑥ กลายเป็น</text>
<text x="426" y="994" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">[5, 15, 20, 30, 40]</text>
</svg>
