<text x="460" y="303" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<text x="460" y="266" font-size="15" fill="#64748b" text-anchor="middle" xml:space="preserve">3</text>
<rect x="490" y="274" width="60" height="44" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="520" y="303" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">30</text>
<text x="520" y="266" font-size="15" fill="#64748b" text-anchor="middle" xml:space="preserve">4</text>
<text x="88" y="350" font-size="15" fill="#0f172a" xml:space="preserve">แทนค่าในช่องเดิม (10 → 5) ไม่มีใครเลื่อน ความยาวยัง 5</text>
<rect x="40" y="376" width="720" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="64" cy="408" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="64" y="414" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">6</text>
<text x="88" y="414" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ns.remove(5)</text>
<rect x="250" y="398" width="60" height="44" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="280" y="427" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="280" y="390" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve">0</text>
