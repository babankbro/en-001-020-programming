<text x="40.0" y="356.0" font-size="16" fill="#7c3aed" font-weight="bold">นับรวมทั้งรูป (n = 4)</text>
<text x="40.0" y="386.0" font-size="16" fill="#0f172a"><tspan>จำนวน # = 1 + 2 + 3 + 4 = </tspan><tspan fill="#2563eb" font-weight="bold">10</tspan><tspan fill="#475569">  =  n(n+1)/2 = 4·5/2</tspan></text>
<text x="40.0" y="416.0" font-size="16" fill="#0f172a"><tspan>ช่องว่าง = 3 + 2 + 1 + 0 = </tspan><tspan fill="#475569" font-weight="bold">6</tspan><tspan fill="#475569">  =  n(n−1)/2 = 4·3/2</tspan></text>
<text x="500.0" y="386.0" font-size="15" fill="#0f172a">แถว i: ว่าง n−i−1 + # i+1</text>
<text x="500.0" y="416.0" font-size="15" fill="#0f172a">รวม = n ทุกแถว → ชิดขวาพอดี</text>
