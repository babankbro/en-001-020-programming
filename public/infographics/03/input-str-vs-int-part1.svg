<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="800" height="850" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">input() คืนค่าเป็น str เสมอ: "15" + "5" ไม่ใช่ 20</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า ทำไมบวกตัวเลขที่รับจากผู้ใช้แล้วได้ 155 และต้องแก้อย่างไร</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">str (สายอักขระ)</text>
<rect x="272.5" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="299.5" y="125" font-size="15" fill="#0f172a" xml:space="preserve">int (จำนวนเต็ม)</text>
<rect x="431" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="458" y="125" font-size="15" fill="#0f172a" xml:space="preserve">คำตอบ</text>
<circle cx="55" cy="166" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="80" y="172" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">ผู้ใช้กดแป้น 1, 5, Enter → input() ส่งกลับ “ตัวอักษร” ไม่ใช่ตัวเลข</text>
<rect x="40" y="196" width="330" height="74" rx="10" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="56" y="226" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">n1 = input("Enter n1:")</text>
<text x="56" y="252" font-size="16" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">n2 = input("Enter n2:")</text>
<text x="400" y="218" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">n1 =</text>
<rect x="456" y="198" width="44" height="40" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="478" y="225" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"1</text>
<rect x="500" y="198" width="44" height="40" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="522" y="225" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5"</text>
<text x="560" y="222" font-size="15" fill="#475569" xml:space="preserve">ตัวอักษร 2 ตัว</text>
<text x="400" y="268" font-size="16" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">n2 =</text>
<rect x="456" y="248" width="56" height="40" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="484" y="275" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"5"</text>
<text x="528" y="272" font-size="15" fill="#475569" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">type(n2) → &lt;class 'str'&gt;</text>
<circle cx="55" cy="302" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="308" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="80" y="308" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">นำมา + กัน: ผลขึ้นกับชนิดของทั้งสองฝั่ง</text>
<rect x="40" y="330" width="350" height="300" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="58" y="362" font-size="18" fill="#dc2626" font-weight="bold" xml:space="preserve">✗ ลืมแปลงชนิด</text>
<rect x="56" y="376" width="318" height="36" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="68" y="400" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(n1 + n2)</text>
<rect x="70" y="430" width="44" height="40" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="92" y="457" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"1</text>
<rect x="114" y="430" width="44" height="40" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="136" y="457" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5"</text>
<text x="172" y="457" font-size="22" fill="#0f172a" font-weight="bold" xml:space="preserve">+</text>
<rect x="198" y="430" width="56" height="40" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="226" y="457" font-size="18" fill="#dc2626" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"5"</text>
<text x="58" y="500" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">str + str → “ต่อ” สายอักขระ</text>
<line x1="215" y1="510" x2="215" y2="534" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-red)"/>
<rect x="149" y="538" width="44" height="40" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="171" y="565" font-size="18" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"1</text>
<rect x="193" y="538" width="44" height="40" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="215" y="565" font-size="18" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<rect x="237" y="538" width="44" height="40" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="259" y="565" font-size="18" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5"</text>
<text x="58" y="612" font-size="15" fill="#0f172a" xml:space="preserve">แสดง 155 — ดูเหมือนตัวเลข แต่ผิด</text>
<rect x="410" y="330" width="350" height="300" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="428" y="362" font-size="18" fill="#059669" font-weight="bold" xml:space="preserve">✓ แปลงด้วย int() ก่อน</text>
<rect x="426" y="376" width="318" height="36" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="438" y="400" font-size="15" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(int(n1) + int(n2))</text>
<rect x="440" y="430" width="147.2" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="513.6" y="455.8" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">int("15") = 15</text>
<text x="620" y="457" font-size="22" fill="#0f172a" font-weight="bold" xml:space="preserve">+</text>
<rect x="646" y="430" width="60" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="676" y="455.8" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text>
<text x="428" y="500" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">int + int → “บวก” เลข</text>
<line x1="585" y1="510" x2="585" y2="534" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>
<rect x="545" y="538" width="80" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="585" y="565.2" font-size="20" fill="#d97706" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20</text>
<text x="428" y="612" font-size="15" fill="#0f172a" xml:space="preserve">แสดง 20 — ถูกต้อง</text>
<rect x="40" y="650" width="720" height="52" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="58" y="682" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">ผู้ใช้ป้อน 15 และ 5</text>
<text x="742" y="683.7" font-size="22" fill="#d97706" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">"155"  vs  20</text>
<rect x="40" y="722" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="748" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="754" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="754" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">เชื่อสิ่งที่ print แสดง</text>
<text x="58" y="778" font-size="15" fill="#0f172a" xml:space="preserve">print ไม่แสดงเครื่องหมายคำพูด</text>
<text x="58" y="802" font-size="15" fill="#0f172a" xml:space="preserve">"155" กับ 155 จึงดูเหมือนกันบนจอ</text>
<rect x="408" y="722" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="748" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="754" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="754" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">สงสัยเมื่อไร ใช้ type() ตรวจ</text>
<text x="426" y="778" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">type(n1) → &lt;class 'str'&gt;</text>
<text x="426" y="802" font-size="15" fill="#0f172a" xml:space="preserve">แล้วแปลงก่อนคำนวณเสมอ</text>
</svg>
