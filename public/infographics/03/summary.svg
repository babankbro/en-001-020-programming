<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1220" width="800" height="1220" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">สรุปบทที่ 3: จากข้อมูลผู้ใช้ สู่ลิสต์ ค่าเฉลี่ย และแผนภูมิ</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า บทนี้มี 5 เรื่องอะไร แต่ละเรื่องต้องจำอะไร และต่อยอดกันอย่างไร</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">แนวคิดหลักของหัวข้อ</text>
<rect x="289.9" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="316.9" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ตัวอย่างตัวเลขที่ต้องจำ</text>
<line x1="486.8" y1="120" x2="506.8" y2="120" stroke="#64748b" stroke-width="3"/>
<text x="513.8" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ต่อยอดไปหัวข้อถัดไป</text>
<rect x="40" y="156" width="720" height="144" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="68" cy="184" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="68" y="190" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="94" y="190" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">input() และการแปลงชนิดข้อมูล</text>
<text x="70" y="218" font-size="15" fill="#0f172a" xml:space="preserve">• input() คืน str เสมอ → แปลงด้วย int() / float() ก่อนคำนวณ</text>
<text x="70" y="242" font-size="15" fill="#0f172a" xml:space="preserve">• int("3.5") เกิด ValueError ต้องใช้ float("3.5")</text>
<rect x="64" y="254" width="680" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="78" y="277" font-size="15" fill="#0f172a" xml:space="preserve"><tspan fill="#d97706" font-weight="bold">ตัวอย่าง: </tspan><tspan font-family="Consolas, 'Courier New', monospace">"15" + "5" = "155"  แต่  int("15") + int("5") = 20</tspan></text>
<line x1="68" y1="302" x2="68" y2="334" stroke="#64748b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="90" y="324" font-size="15" fill="#475569" xml:space="preserve">ค่าที่แปลงแล้วเก็บรวมกันในลิสต์</text>
<rect x="40" y="338" width="720" height="144" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="68" cy="366" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="68" y="372" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="94" y="372" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">ลิสต์และเมท็อดพื้นฐาน</text>
<text x="70" y="400" font-size="15" fill="#0f172a" xml:space="preserve">• ดัชนีเริ่ม 0 · insert/pop กลางลิสต์ทำให้ดัชนีของตัวที่ตามมาเลื่อน</text>
<text x="70" y="424" font-size="15" fill="#0f172a" xml:space="preserve">• pop(i) ลบตามตำแหน่ง · remove(x) ลบตามค่า · b = a ไม่ใช่สำเนา</text>
<rect x="64" y="436" width="680" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="78" y="459" font-size="15" fill="#0f172a" xml:space="preserve"><tspan fill="#d97706" font-weight="bold">ตัวอย่าง: </tspan><tspan font-family="Consolas, 'Courier New', monospace">[5, 10, 15, 20, 30] → insert(1, 7) → ns[2] = 10</tspan></text>
<line x1="68" y1="484" x2="68" y2="516" stroke="#64748b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="90" y="506" font-size="15" fill="#475569" xml:space="preserve">มีลิสต์แล้ว วนซ้ำหาผลรวม/ค่าเฉลี่ย</text>
<rect x="40" y="520" width="720" height="144" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="68" cy="548" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="68" y="554" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="94" y="554" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">ค่าเฉลี่ย ผลรวม และการวนซ้ำบนลิสต์</text>
<text x="70" y="582" font-size="15" fill="#0f172a" xml:space="preserve">• avg = sum(ns) / len(ns) ใช้ได้กับข้อมูลกี่ตัวก็ได้</text>
<text x="70" y="606" font-size="15" fill="#0f172a" xml:space="preserve">• ห้ามใช้ // หาค่าเฉลี่ย · หาค่ามากสุดให้เริ่มจาก ns[0]</text>
<rect x="64" y="618" width="680" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="78" y="641" font-size="15" fill="#0f172a" xml:space="preserve"><tspan fill="#d97706" font-weight="bold">ตัวอย่าง: </tspan><tspan font-family="Consolas, 'Courier New', monospace">total: 0 → 5 → 15 → 30 → 50 → 80,  80 / 5 = 16.0</tspan></text>
<line x1="68" y1="666" x2="68" y2="698" stroke="#64748b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="90" y="688" font-size="15" fill="#475569" xml:space="preserve">ใช้ลิสต์เก็บข้อมูลสุ่มจำนวนมากแล้ววาด</text>
<rect x="40" y="702" width="720" height="144" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="68" cy="730" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="68" y="736" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">4</text>
<text x="94" y="736" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">การสุ่ม การแจกแจง และแผนภูมิด้วย Matplotlib/pandas</text>
<text x="70" y="764" font-size="15" fill="#0f172a" xml:space="preserve">• uniform อยู่ในช่วงแน่นอน · normal กระจุกรอบ μ และไม่มีขอบเขต</text>
<text x="70" y="788" font-size="15" fill="#0f172a" xml:space="preserve">• ข้อมูลสุ่มใช้ scatter · แกนย่อยใช้ ax.set_title / ax.set_xlim</text>
<rect x="64" y="800" width="680" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="78" y="823" font-size="15" fill="#0f172a" xml:space="preserve"><tspan fill="#d97706" font-weight="bold">ตัวอย่าง: </tspan><tspan font-family="Consolas, 'Courier New', monospace">normal(50, 15): μ ± 2σ = 20–80 ≈ 95 จาก 100 จุด</tspan></text>
<line x1="68" y1="848" x2="68" y2="880" stroke="#64748b" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="90" y="870" font-size="15" fill="#475569" xml:space="preserve">ใช้ลูป + ฟังก์ชันประกอบรูปแบบ</text>
<rect x="40" y="884" width="720" height="144" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="68" cy="912" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="68" y="918" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">5</text>
<text x="94" y="918" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">สามเหลี่ยมชิดขวาด้วย linespace และ Top-Down Design</text>
<text x="70" y="946" font-size="15" fill="#0f172a" xml:space="preserve">• แถว i: ช่องว่าง n − i − 1 ตัว + # i + 1 ตัว = n เสมอ</text>
<text x="70" y="970" font-size="15" fill="#0f172a" xml:space="preserve">• สร้างรูปใหญ่จากฟังก์ชันพื้นฐานเดียว แก้ที่เดียวเปลี่ยนทุกรูป</text>
<rect x="64" y="982" width="680" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="78" y="1005" font-size="15" fill="#0f172a" xml:space="preserve"><tspan fill="#d97706" font-weight="bold">ตัวอย่าง: </tspan><tspan font-family="Consolas, 'Courier New', monospace">triangle(4): # 10 ตัว, ช่องว่าง 6 ช่อง</tspan></text>
<rect x="40" y="1044" width="720" height="52" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="58" y="1076" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">ใช้ต่อในเกมบทที่ 5–8</text>
<text x="742" y="1076.3" font-size="18" fill="#059669" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ลิสต์ลูกบอล/ศัตรูสุ่ม ✓</text>
<rect x="40" y="1116" width="352" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="1142" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="1148" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="1148" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">ลืมแปลงชนิดหลัง input()</text>
<text x="58" y="1172" font-size="15" fill="#0f172a" xml:space="preserve">"15" + "5" ได้ "155" โดยไม่มี error</text>
<rect x="408" y="1116" width="352" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="1142" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="1148" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="1148" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">แปลงตั้งแต่ตอนรับค่า</text>
<text x="426" y="1172" font-size="15" fill="#0f172a" xml:space="preserve">n1 = int(input("Enter n1:"))</text>
</svg>
