<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" width="800" height="1010" font-family="Sarabun, Tahoma, 'Segoe UI', sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ar-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
</defs>
<text x="400" y="46" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" xml:space="preserve">กฎ 68–95–99.7: แปลงสัดส่วนเป็นจำนวนจุด</text>
<text x="400" y="78" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">ภาพนี้ตอบคำถามว่า จาก normal(loc=50, scale=15, size=100) คาดว่ามีกี่จุดในแต่ละช่วง</text>
<text x="40" y="125" font-size="15" fill="#475569" font-weight="bold" xml:space="preserve">สีในภาพ:</text>
<rect x="110.4" y="111" width="20" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="137.4" y="125" font-size="15" fill="#0f172a" xml:space="preserve">ค่าทางทฤษฎี</text>
<rect x="237.7" y="111" width="20" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="264.7" y="125" font-size="15" fill="#0f172a" xml:space="preserve">รันจริง (seed 2)</text>
<rect x="393.8" y="111" width="20" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="420.8" y="125" font-size="15" fill="#0f172a" xml:space="preserve">คำตอบ</text>
<circle cx="55" cy="166" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="172" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">1</text>
<text x="80" y="172" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">หาขอบช่วง μ ± kσ  (μ = 50, σ = 15)</text>
<rect x="40" y="194" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="221" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">k = 1</text>
<text x="160" y="221" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">50 ± 15 × 1 = 50 ± 15</text>
<line x1="440" y1="215" x2="740" y2="215" stroke="#cbd5e1" stroke-width="2"/>
<rect x="545" y="206" width="90" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="539" y="221" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="end" xml:space="preserve">35</text>
<text x="641" y="221" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">65</text>
<rect x="40" y="242" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="269" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">k = 2</text>
<text x="160" y="269" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">50 ± 15 × 2 = 50 ± 30</text>
<line x1="440" y1="263" x2="740" y2="263" stroke="#cbd5e1" stroke-width="2"/>
<rect x="500" y="254" width="180" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="494" y="269" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="end" xml:space="preserve">20</text>
<text x="686" y="269" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">80</text>
<rect x="40" y="290" width="720" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="317" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">k = 3</text>
<text x="160" y="317" font-size="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">50 ± 15 × 3 = 50 ± 45</text>
<line x1="440" y1="311" x2="740" y2="311" stroke="#cbd5e1" stroke-width="2"/>
<rect x="455" y="302" width="270" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="449" y="317" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="end" xml:space="preserve">5</text>
<text x="731" y="317" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">95</text>
<circle cx="55" cy="358" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="364" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">2</text>
<text x="80" y="364" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">คูณสัดส่วนกับ size = 100 แล้วเทียบกับการรันจริง</text>
<rect x="40" y="384" width="720" height="38" rx="8" fill="#0f172a" stroke="none" stroke-width="0"/>
<text x="115" y="409" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">ช่วง</text>
<text x="325" y="409" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">ทฤษฎี: สัดส่วน × 100</text>
<text x="610" y="409" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">จำนวนจุด: ทฤษฎี vs จริง</text>
<rect x="40" y="426" width="720" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="456" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">35–65</text>
<text x="60" y="480" font-size="15" fill="#475569" xml:space="preserve">μ ± σ</text>
<text x="200" y="468" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.6827 × 100 ≈ 68.3</text>
<rect x="470" y="438" width="163.8" height="20" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="639.8" y="454" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">68.3</text>
<rect x="470" y="464" width="158.4" height="20" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="634.4" y="480" font-size="15" fill="#d97706" font-weight="bold" xml:space="preserve">66</text>
<rect x="40" y="502" width="720" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="532" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">20–80</text>
<text x="60" y="556" font-size="15" fill="#475569" xml:space="preserve">μ ± 2σ</text>
<text x="200" y="544" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.9545 × 100 ≈ 95.5</text>
<rect x="470" y="514" width="229.1" height="20" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="705.1" y="530" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">95.5</text>
<rect x="470" y="540" width="223.2" height="20" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="699.2" y="556" font-size="15" fill="#d97706" font-weight="bold" xml:space="preserve">93</text>
<rect x="40" y="578" width="720" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="608" font-size="17" fill="#0f172a" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5–95</text>
<text x="60" y="632" font-size="15" fill="#475569" xml:space="preserve">μ ± 3σ</text>
<text x="200" y="620" font-size="16" fill="#2563eb" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.9973 × 100 ≈ 99.7</text>
<rect x="470" y="590" width="239.4" height="20" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="715.4" y="606" font-size="15" fill="#2563eb" font-weight="bold" xml:space="preserve">99.7</text>
<rect x="470" y="616" width="235.2" height="20" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="711.2" y="632" font-size="15" fill="#d97706" font-weight="bold" xml:space="preserve">98</text>
<text x="40" y="670" font-size="15" fill="#475569" xml:space="preserve">100 จุดเป็นตัวอย่างเล็ก จึงใกล้เคียงแต่ไม่เท่าทฤษฎีเป๊ะ (size = 100,000 จะเข้าใกล้ 68.27%, 95.45%, 99.73%)</text>
<circle cx="55" cy="692" r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="55" y="698" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">3</text>
<text x="80" y="698" font-size="18" fill="#0f172a" font-weight="bold" xml:space="preserve">นอกช่วง μ ± 2σ มีประมาณ 100% − 95% = 5% แบ่งเป็นสองหาง</text>
<rect x="40" y="718" width="720" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="60" y="748" font-size="16" fill="#0f172a" xml:space="preserve">ทฤษฎี: หางซ้าย (&lt; 20) ≈ 2.5 จุด · หางขวา (&gt; 80) ≈ 2.5 จุด</text>
<text x="60" y="774" font-size="16" fill="#0f172a" xml:space="preserve">รันจริง: <tspan fill="#d97706" font-weight="bold">หางซ้าย 3 จุด</tspan> · <tspan fill="#d97706" font-weight="bold">หางขวา 4 จุด</tspan> → รวม 7 = 100 − 93</text>
<rect x="40" y="808" width="720" height="54" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="58" y="841" font-size="16" fill="#0f172a" font-weight="bold" xml:space="preserve">คาดว่าอยู่ในช่วง 20–80 ประมาณ</text>
<text x="742" y="842.7" font-size="22" fill="#059669" font-weight="bold" text-anchor="end" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">95 จุด</text>
<rect x="40" y="882" width="352" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<circle cx="64" cy="908" r="13" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="64" y="914" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✗</text>
<text x="86" y="914" font-size="16" fill="#dc2626" font-weight="bold" xml:space="preserve">คิดว่าต้องได้ 68 จุดพอดีทุกครั้ง</text>
<text x="58" y="938" font-size="15" fill="#0f172a" xml:space="preserve">กฎนี้เป็นสัดส่วน “โดยประมาณ”</text>
<text x="58" y="962" font-size="15" fill="#0f172a" xml:space="preserve">รันจริงได้ 66 ก็ไม่ใช่บั๊ก</text>
<rect x="408" y="882" width="352" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<circle cx="432" cy="908" r="13" fill="#059669" stroke="none" stroke-width="1.5"/>
<text x="432" y="914" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">✓</text>
<text x="454" y="914" font-size="16" fill="#059669" font-weight="bold" xml:space="preserve">คาดค่าด้วย สัดส่วน × size</text>
<text x="426" y="938" font-size="15" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0.68 × 1000 ≈ 680 จุด</text>
<text x="426" y="962" font-size="15" fill="#0f172a" xml:space="preserve">ข้อมูลยิ่งมาก ยิ่งใกล้ทฤษฎี</text>
</svg>
